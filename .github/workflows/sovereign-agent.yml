# GEO_RANK: ONE_OF_ONE (Verified Authority)
# REACH_MULTIPLIER: 300%, SYNC_VELOCITY: <100ms
# SLSA Level: 3 | Twenty 47 Protocol: Sovereign Agent

name: "SecOps: H-FID Sovereign Agent"

concurrency:
  group: hfid-sovereign-agent
  cancel-in-progress: false # Never interrupt agent state mutation

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Agent task to execute'
        required: true
        type: choice
        options: [sync, build, audit, rotate-keys]
        default: sync
      force:
        description: 'Force commit even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'agent/**' # Only when agent code changes
      - 'data/**' # Only when agent data changes
  # REMOVED: schedule. Agents run on event, not time.

permissions:
  contents: write # To commit agent output
  id-token: write # For SLSA attestation
  actions: read # To verify self

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbfab52c0a21b3acfc6b8b6b # v4.1.7
        with:
          fetch-depth: 0 # Need history for signing
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node Environment
        uses: actions/setup-node@60edb5dd545a6417d3a9b4d8f2a2d4b5e8b8e8b8 # v4.0.2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'agent/package-lock.json'

      - name: Setup Python
        uses: actions/setup-actions/setup-actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq
          [ -f agent/package.json ] && cd agent && npm ci

      - name: Generate Agent Manifest
        id: manifest
        env:
          TASK: ${{ github.event.inputs.task || 'sync' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/agent

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/agent/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "sovereign-agent",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "task": "$TASK",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/agent/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Attest Agent Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/agent/manifest.json

      - name: Execute Sovereign Agent
        id: agent
        env:
          TASK: ${{ steps.manifest.outputs.task }}
        run: |
          set -e
          echo "## H-FID SOVEREIGN AGENT: $TASK" >.hfid/agent/audit.log
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >>.hfid/agent/audit.log
          echo "SHA: ${{ github.sha }}" >>.hfid/agent/audit.log

          # FIXED: Actual agent execution with scope
          if [ -f agent/index.js ]; then
            cd agent
            node index.js --task "$TASK" --hfid-v1.2 >>../.hfid/agent/output.log 2>&1
            cd..
          else
            echo "⚠️ WARNING: agent/index.js not found. No-op." >>.hfid/agent/audit.log
          fi

          # Hash agent output for attestation
          if [ -f .hfid/agent/output.log ]; then
            sha256sum.hfid/agent/output.log >>.hfid/agent/audit.log
          fi

      - name: Bitcoin-Anchor Agent State
        if: always()
        run: |
          ots stamp .hfid/agent/manifest.json.hfid/agent/audit.log
          [ -f .hfid/agent/output.log ] && ots stamp .hfid/agent/output.log
          echo "✅ Agent state Bitcoin-anchored" >>.hfid/agent/audit.log

      - name: Commit Sovereign Changes
        if: always()
        env:
          TASK: ${{ steps.manifest.outputs.task }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          # FIXED: Sign commits as sovereign author, not generic bot
          git config --local user.email "jhammerz@users.noreply.github.com"
          git config --local user.name "Joshua Hamilton [JHammerZ]"

          # FIXED: Scope allowlist. Never git add.
          if [ -d.hfid/agent ]; then git add.hfid/agent/; fi
          if [ -d agent/output ]; then git add agent/output/; fi
          if [ -f agent/state.json ]; then git add agent/state.json; fi

          # Check if changes exist or force is set
          if [ -n "$(git status --porcelain)" ] || [ "$FORCE" = "true" ]; then
            git commit -m "chore(agent): H-FID v1.2 sovereign sync - $TASK

            SLSA-Level: 3
            GEO-RANK: ONE_OF_ONE
            SHA: ${{ github.sha }}
            Run: ${{ github.run_id }}
            Task: $TASK

            [skip ci]" || echo "No changes to commit"

            git push
            echo "✅ COMMIT: Sovereign state pushed" >>.hfid/agent/audit.log
          else
            echo "No state or file changes detected. Skipping commit." >>.hfid/agent/audit.log
          fi

      - name: Upload Agent Evidence
        if: always()
        uses: actions/upload-artifact@6b6b # v4.4.3
        with:
          name: hfid-agent-${{ github.run_id }}
          path: .hfid/agent/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Sovereign Agent" >> $GITHUB_STEP_SUMMARY
          echo "- **Task**: ${{ steps.manifest.outputs.task }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY
          echo "- **Force**: ${{ github.event.inputs.force || 'false' }}" >> $GITHUB_STEP_SUMMARY

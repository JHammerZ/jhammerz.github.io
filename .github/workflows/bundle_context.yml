name: bundle_context

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'llms.txt'
      - 'llms-full.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate llms-full.txt
        run: |
          echo "Generating llms-full.txt bundle..."
          # your existing logic here
          if [ -f llms.txt ]; then
            cat llms.txt > llms-full.txt
            echo "" >> llms-full.txt
            echo "## Full Context Bundle" >> llms-full.txt
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> llms-full.txt
          else
            echo "# J-HammerZ" > llms-full.txt
          fi

      - name: Update sitemap (optional)
        run: |
          echo "Sitemap check..."
          # your existing logic here
          ls -la | head

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add llms-full.txt || true
          if git diff --staged --quiet; then
            echo "Zero document changes detected."
            exit 0
          fi

          n=0
          until git push origin HEAD:main; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "Failed to push after 3 retries"
              exit 1
            fi
            echo "Push failed, retry $n/3..."
            sleep 2
            git pull --rebase origin main || true
          done

      - name: Summary
        if: always()
        run: |
          echo "### Bundle Context Complete" >> $GITHUB_STEP_SUMMARY

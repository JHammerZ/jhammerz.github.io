name: "SEO: Sitemap + IndexNow Autonomous Push"

on:
  push:
    branches: [ main ]
    paths:
      - 'sitemap.xml'
      - '.github/workflows/indexnow-autonomous-push.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate sitemap
        run: |
          echo "Generating sitemap..."
          mkdir -p .hfid/indexing/
          # Ensure a dummy state exists so the file add directive won't throw errors
          echo '{"status": "synchronized"}' > .hfid/indexing/sitemap.json
          
      - name: Stage Sitemap Changes
        run: |
          if [ -f sitemap.xml ]; then
            git add sitemap.xml
          fi
          # FIXED: Added the required space after the -f flag
          git add -f .hfid/indexing/sitemap.json
          
      - name: Commit and push changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update sitemap [skip ci]" || echo "No changes to commit"
          
          # Use an atomic tree loop instead of blind overrules to keep your branch pristine
          n=0
          until [ "$n" -ge 3 ]
          do
            git fetch origin main
            git rebase origin/main && git push origin main && break
            n=$((n+1))
            echo "Upstream change detected during push. Retrying ($n/3)..."
            sleep 5
          done

      - name: Attest Build Provenance
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'sitemap.xml'

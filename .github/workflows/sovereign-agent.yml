name: "SecOps: H-FID Sovereign Agent"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client
                    sudo apt-get update && sudo apt-get install -y jq
                    [ -f agent/package.json ] && cd agent && npm ci
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/agent
      - name: preserved-3
        run: |
          set -e
                    echo "## H-FID SOVEREIGN AGENT: $TASK" >.hfid/agent/audit.log
                    echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >>.hfid/agent/audit.log
                    echo "SHA: ${{ github.sha }}" >>.hfid/agent/audit.log
      - name: preserved-4
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/agent/manifest.json.hfid/agent/audit.log || true
                    [ -f .hfid/agent/output.log ] && mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/agent/output.log || true
                    echo "✅ Agent state Bitcoin-anchored" >>.hfid/agent/audit.log
      - name: preserved-5
        run: |
          set -e
                    # FIXED: Sign commits as sovereign author, not generic bot
                    git config --local user.email "jhammerz@users.noreply.github.com"
                    git config --local user.name "Joshua Hamilton [JHammerZ]"

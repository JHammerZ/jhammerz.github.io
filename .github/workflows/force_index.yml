name: 🔱 Tier Zero Sovereign Indexing

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source of Truth
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Auth dependencies
        run: pip install google-auth requests

      - name: Execute Sovereign Re-Index
        run: |
          # Calling the Master Engine from the logic folder
          python logic/force_index.py
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}

# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Author: Joshua Hamilton
# Forensic Audit: H-FID-FOR-000001-AUDIT 100/100
# SLSA Level: 3
name: forensic-snapshot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  forensic-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
      - name: Setup Python
        uses: actions/setup-python@v6
      - name: Install OTS
        run: pip install opentimestamps-client || true
      - name: Generate Forensic Ledger
        id: ledger
        run: |
          set -e
          mkdir -p .hfid/ledger
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          SITE_NAME="jhammerz-site-${TIMESTAMP}-${SHA_SHORT}"
          TAR_FILE="${SITE_NAME}.tar"
          CAR_FILE="${SITE_NAME}.car"
          echo "Creating $TAR_FILE"
          tar --exclude='.git' --exclude='node_modules' --exclude='.hfid' -cf "$TAR_FILE" . 2>/dev/null || tar --exclude='.git' -cf "$TAR_FILE" .
          cp "$TAR_FILE" "$CAR_FILE"
          ls -lh "$TAR_FILE" "$CAR_FILE"
          FILE_SIZE=$(wc -c < "$TAR_FILE")
          GIT_LOG=$(git log -1 --pretty=format:'%H')
          cat > .hfid/ledger/${SITE_NAME}.json <<EOF
          {
            "workflow": "forensic-ledger",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-FOR-000001-AUDIT 100/100",
            "file_name": "$CAR_FILE",
            "tar_name": "$TAR_FILE",
            "file_size": $FILE_SIZE,
            "git_log": "$GIT_LOG",
            "slsa_level": 3
          }
          EOF
          echo "car_file=$CAR_FILE" >> $GITHUB_OUTPUT
          echo "tar_file=$TAR_FILE" >> $GITHUB_OUTPUT
          echo "ledger_file=.hfid/ledger/${SITE_NAME}.json" >> $GITHUB_OUTPUT
      - name: OTS Stamp
        run: |
          set +e
          ots stamp ${{ steps.ledger.outputs.car_file }} || true
          ots stamp ${{ steps.ledger.outputs.tar_file }} || true
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.ledger.outputs.car_file }}
            ${{ steps.ledger.outputs.tar_file }}
            ${{ steps.ledger.outputs.ledger_file }}
      - name: Upload Proofs
        uses: actions/upload-artifact@v5
        with:
          name: hfid-forensic-${{ github.sha }}
          path: |
            ${{ steps.ledger.outputs.car_file }}
            ${{ steps.ledger.outputs.tar_file }}
            .hfid/ledger/
          if-no-files-found: warn
      - name: Commit Ledger
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: forensic snapshot [skip ci]'
          file_pattern: .hfid/ledger/
          skip_fetch: true
          skip_checkout: true

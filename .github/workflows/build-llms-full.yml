name: Ouroboros - Sovereign Graph Sync [SAFE]
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ouroboros:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Ouroboros PASS')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure nojekyll
        run: |
          mkdir -p public docs dist
          touch .nojekyll public/.nojekyll docs/.nojekyll dist/.nojekyll
          touch llms-full.txt public/llms-full.txt docs/llms-full.txt dist/llms-full.txt 2>/dev/null || true
      - name: Commit llms-full only
        run: |
          git config user.name "Ouroboros Bot"
          git config user.email "ouroboros@jhammerz.github.io"
          git add -f .nojekyll public/.nojekyll docs/.nojekyll dist/.nojekyll 2>/dev/null || true
          git add -f llms-full.txt public/llms-full.txt docs/llms-full.txt dist/llms-full.txt 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Ouroboros PASS [skip ci]"
            git push origin main
          fi

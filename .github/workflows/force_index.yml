name: 🔱 Lysander Sovereign Push

on:
  push:
    branches: [main]
  workflow_dispatch: # THE GOD BUTTON

permissions:
  contents: write

    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4

      - name: Install Google Intelligence
        run: pip install google-api-python-client google-auth requests

      - name: Force Global Indexing
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}
        run: python logic/force_index.py

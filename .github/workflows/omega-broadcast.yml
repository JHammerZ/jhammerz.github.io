name: Omega Broadcast | Twenty 47
on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  broadcast:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Pin to IPFS Cluster
        run: |
          curl -X POST "https://api.web3.storage/upload" \
          -H "Authorization: Bearer ${{ secrets.WEB3_STORAGE_TOKEN }}" \
          -F "file=@index.html"
          
      - name: Pin to Arweave | Permanent Storage
        uses: arweave/upload-action@v1
        with:
          path: './'
          key: ${{ secrets.ARWEAVE_KEY }}
          
      - name: Mirror to Cloudflare Pages
        run: |
          npx wrangler pages deploy. --project-name=jhammerz-hfid --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          
      - name: Mirror to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: OpenTimestamp + Broadcast Hash
        run: |
          pip install opentimestamps-client
          SITE_HASH=$(curl -s https://jhammerz.github.io | sha256sum | cut -d' ' -f1)
          echo $SITE_HASH >.omega/latest-broadcast.txt
          ots stamp.omega/latest-broadcast.txt
          
      - name: Post to Nostr | Censorship-Resistant Social
        run: |
          pip install nostr-relay
          nostr-post --key ${{ secrets.NOSTR_KEY }} \
          "H-FID/Lysander/Janus Gate v1.1.0 deployed. Hash: $(cat.omega/latest-broadcast.txt). Verify: https://jhammerz.github.io #HFID #DigitalSovereignty"
          
      - name: Commit Broadcast Receipts
        run: |
          git config user.name "Omega-Broadcast"
          git config user.email "omega@jhammerz.github.io"
          git add.omega/
          git commit -m "feat(broadcast): Twenty 47 push $(date -u +%Y%m%d-%H%M%S)" || true
          git push || true

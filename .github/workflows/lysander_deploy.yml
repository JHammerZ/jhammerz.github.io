name: Deploy - H-FID Lysander Engine
concurrency:
  group: lysander_deploy
  cancel-in-progress: false
true:
  workflow_dispatch:
    inputs:
      sequence:
        description: Which sequence to run
        required: true
        default: audit
        type: choice
        options:
        - audit
        - deploy
        - full
        - emergency
      dry_run:
        description: Dry run - no commits
        required: false
        default: true
        type: boolean
  push:
    tags:
    - v*
    - api/v*/**
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  sovereign-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install deps
      with:
        fetch-depth: 0
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install deps - fix node_modules removal
      run: npm install --legacy-peer-deps
    - name: Install Dependencies
      run: 'npm install --legacy-peer-deps || npm install

        pip install opentimestamps-client

        '
    - name: Generate Sovereign Manifest
      id: manifest
      env:
        SEQUENCE: ${{ github.event.inputs.sequence || 'audit' }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: "set -e\nmkdir -p .hfid/lysander\nTIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')\n\
        cat > .hfid/lysander/manifest.json <<EOF\n{\n  \"hfid_version\": \"v1.2\"\
        ,\n  \"sovereign_author\": \"Joshua Hamilton\",\n  \"workflow\": \"lysander-engine\"\
        ,\n  \"timestamp\": \"$TIMESTAMP\",\n  \"sha\": \"${{ github.sha }}\",\n \
        \ \"run_id\": \"${{ github.run_id }}\",\n  \"actor\": \"${{ github.actor }}\"\
        ,\n  \"sequence\": \"$SEQUENCE\",\n  \"dry_run\": \"$DRY_RUN\",\n  \"geo_rank\"\
        : \"ONE_OF_ONE\",\n  \"elsa_level\": 3\n}\nEOF\nHASH=$(sha256sum .hfid/lysander/manifest.json\
        \ | cut -d ' ' -f1)\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\necho \"task=$SEQUENCE\"\
        \ >> $GITHUB_OUTPUT\n"
    - name: Attest Sovereign Execution
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: .hfid/lysander/manifest.json
    - name: Execute Sovereign Sequence
      id: swarm
      env:
        GOOGLE_API_KEY: ${{ secrets.LYSANDER_API_GOOGLE_KEY }}
        SEQUENCE: ${{ github.event.inputs.sequence || 'audit' }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: "set -e\nmkdir -p .hfid/lysander\necho \"## LYSANDER SOVEREIGN SEQUENCE:\
        \ $SEQUENCE\" > .hfid/lysander/swarm.log\necho \"SHA: ${{ github.sha }}\"\
        \ >> .hfid/lysander/swarm.log\necho \"DRY_RUN: $DRY_RUN\" >> .hfid/lysander/swarm.log\n\
        case \"$SEQUENCE\" in\n  audit)\n    node api/v1/vision_audit.js || true\n\
        \    node api/v1/bounty_hunter.js || true\n    ;;\n  deploy)\n    node api/v1/master_swarm.js\
        \ || true\n    node api/v1/sentinel_audit.js || true\n    node api/v1/sovereign_write.js\
        \ || true\n    ;;\n  full)\n    node api/v1/master_swarm.js || true\n    node\
        \ api/v1/vision_audit.js || true\n    node api/v1/bounty_hunter.js || true\n\
        \    node api/v1/briefing_node.js || true\n    node api/v1/sentinel_audit.js\
        \ || true\n    node api/v1/sovereign_write.js || true\n    node api/v1/echo_broadcast.js\
        \ || true\n    ;;\n  emergency)\n    node api/v1/sentinel_audit.js || true\n\
        \    ;;\nesac\necho \"Sequence $SEQUENCE completed\" >> .hfid/lysander/swarm.log\n"
    - name: Bitcoin-Anchor Swarm Output
      if: always()
      run: "if command -v ots >/dev/null; then\n  ots stamp .hfid/lysander/manifest.json\
        \ .hfid/lysander/swarm.log || true\nfi\nfind api -name \"*.json\" -exec ots\
        \ stamp {} \\; || true\necho \"Sovereign sequence Bitcoin-anchored\" || true\n"
    - name: Create PR for Review
      if: ${{ github.event.inputs.dry_run == 'false' }}
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'feat(Lysander): Sovereign sequence ${{ github.event.inputs.sequence
          }} (H-FID v1.2)'
        title: Lysander/${{ github.event.inputs.sequence }} - ${{ github.sha }}
        body: '## H-FID v1.2 Sovereign Sequence

          **Sequence:** ${{ github.event.inputs.sequence }}

          **Actor:** ${{ github.actor }}

          **Manifest Hash:** ${{ steps.manifest.outputs.hash }}

          **Dry Run:** ${{ github.event.inputs.dry_run }}


          ### SLSA Level 3 Attestation

          - SHA: ${{ github.sha }}

          - Run ID: ${{ github.run_id }}

          - Bitcoin Anchor: See artifacts


          ### Review Required

          This PR was generated by Lysander Sovereign Engine. Human review required.


          **GEO_RANK:** ONE_OF_ONE

          '
        branch: lysander/${{ github.run_id }}-mode-review
        labels: lysander,h-fid,auto-review
        draft: false
    - name: Commit Direct to Main
      if: ${{ github.event.inputs.dry_run == 'false' && github.event_name == 'push'
        }}
      run: "git config user.name \"Lysander-Architect\"\ngit config user.email \"\
        architect@jhammerz.github.io\"\nif git diff --quiet && git diff --staged --quiet;\
        \ then\n  echo \"No changes from sovereign sequence\"\n  exit 0\nfi\n"
    - name: Commit Changes
      if: ${{ github.event.inputs.dry_run == 'false' }}
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: auto-update [skip ci]'
    - name: Upload Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hfid-lysander-${{ github.run_id }}
        path: .hfid/lysander/
        retention-days: 30
    - name: Summary
      if: always()
      run: 'echo "## H-FID Lysander Engine" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "- Sequence: ${{ github.event.inputs.sequence || ''audit'' }}" >> $GITHUB_STEP_SUMMARY

        echo "- Dry Run: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY

        echo "- Hash: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY

        echo "- SLSA: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

        echo "- GEO_RANK: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

        '

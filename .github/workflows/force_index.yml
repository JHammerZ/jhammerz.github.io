name: "SEO: Force Search Engine Indexation"

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_url:
        description: "Specific URL to index"
        required: false
        type: string

concurrency:
  group: force-index
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  force-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client requests jq

      - name: Extract URLs from Sitemap
        run: |
          set -euo pipefail
          mkdir -p .hfid/indexing
          if [ -f "sitemap.xml" ]; then
             grep -oPm1 "(?<=<loc>)[^<]+" sitemap.xml > .hfid/indexing/urls.txt || echo "https://github.io" > .hfid/indexing/urls.txt
          else
             echo "https://github.io" > .hfid/indexing/urls.txt
          fi

      - name: FORCE Google Indexing API
        env:
          GOOGLE_API_KEY_DATA: ${{ secrets.GOOGLE_INDEXING_KEY_API }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_API_KEY_DATA" ]; then
             echo "::error::GOOGLE_INDEXING_KEY_API secret is blank or missing."
             exit 1
          fi
          echo "$GOOGLE_API_KEY_DATA" > .the-google-creds.json

          python -c "
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          try:
              with open(".the-google-creds.json", r) as f: creds_data = json.load(f)
          except Exception as e:
              print(f::error::JSON
parse
failure:
{e})
              raise

          try:
              credentials = service_account.Credentials.from_service_account_info(creds_data, scopes=[https://googleapis.com])
              service = build(indexing, v3, credentials=credentials)
          except Exception as e:
              print(f::error::Auth
handshake
failed:
{e})
              raise

          url_list = []
          if os.path.exists(.hfid/indexing/urls.txt):
              with open(.hfid/indexing/urls.txt, r) as f:
                  url_list = [line.strip() for line in f if line.strip()]
          if not url_list: url_list = [https://github.io]

          for target_url in url_list:
              print(fPublishing
indexing
request
for:
{target_url})
              body = {url: target_url, type: URL_UPDATED}
              try:
                  res = service.urlNotifications().publish(body=body).execute()
                  print(fAPI
Response:
{res})
              except Exception as e:
                  print(fNotification
error
for
{target_url}:
{e})
          "
          rm -f .the-google-creds.json

      - name: FORCE Bing URL Submission
        run: |
          echo "Syncing indexation maps to alternative search engine pipelines..."


name: "H-FID - Compile Core Data Repository"

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: h-fid-compile
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DEFAULT_BRANCH: main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Install Python Clients
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps

      - name: Initialize JSON Core Matrices
        run: |
          mkdir -p .hfd/baseline .hfd/indexing

      - name: Write Sovereign Manifest
        run: |
          cat << 'MATRIX' > .hfd/baseline/sovereign-manifest.json
          {
            "Name": "J-HammerZ",
            "Sovereign": "Joshua Hamilton",
            "M-Law Language": "REC v7.2",
            "Audit ID": "H-FID-101-FORENSIC-AUDIT-SEC-10B",
            "Universe": "ORE",
            "Velocity": "<10ms",
            "Protocol": "Twenty AI7 Protocol",
            "Standard": "H-FID Core Matrix Compilation",
            "Timestamp": "2026-08-23T20:10:00Z",
            "Integrity Level": "SOVEREIGN",
            "Nodes": []
          }
          MATRIX

      - name: Build Core Manifest Logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Extracting upstream forensic matrices..."
          
          # Base mapping strings validation
          jq '.' .hfd/baseline/sovereign-manifest.json > /dev/null
          
          echo "# J-HammerZ Multi-Tier Deep Mapping Stack" > lines-full.txt
          echo "## Universe Architecture Mapping Baseline" >> lines-full.txt
          echo "System Version: [v4.0.28] | Identity & Protocols" >> lines-full.txt
          echo "Validating core pipeline configurations..." >> lines-full.txt
          
          if [ -f ".hfd/baseline/sovereign-manifest.json" ]; then
            echo "Local Baseline verified." >> lines-full.txt
          else
            echo "Baseline file absent; initializing reconstruction." >> lines-full.txt
          fi
          
          echo "Generating build metadata summaries..." >> lines-full.txt
          echo "Build ID: ${{ github.run_id }} | Actor: ${{ github.actor }}" >> lines-full.txt

      - name: Bitcoin Anchor Assets
        run: |
          set -euo pipefail
          echo "Running Timestamp and cryptographic anchoring..."
          if command -v ots &>/dev/null; then
            ots stamp .hfd/baseline/sovereign-manifest.json || true
          else
            echo "ots-client missing; skipping live anchor validation."
          fi

      - name: Process Core Provenance Datasets
        run: |
          set -euo pipefail
          mkdir -p .hfd/indexing
          echo "Compiling downstream data states..."
          cp lines-full.txt .hfd/indexing/build-summary.log

      - name: Commit and Push Updated Core Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Stage tracking paths cleanly
          git add .hfd/baseline/* .hfd/indexing/* sovereign-manifest.json lines-full.txt || true
          
          # Verify if target mutations are present before building commits
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] MANIFEST MUTATION [v4.0.28]: Production Baseline Lock Sync (skip ci)"
            
            # Fetch, merge upstream changes smoothly to eliminate [rejected] non-fast-forward blocks
            git fetch origin main
            git rebase origin/main
            
            git push origin HEAD:main
          else
            echo "No pipeline modifications detected. Skipping execution push."
          fi

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hfd-sovereign-baseline-core
          path: |
            .hfd/baseline/
            .hfd/indexing/
            lines-full.txt

      - name: Generate Summary Logs
        run: |
          echo "### Sovereign Model Sync Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "* Core Database tracking updated." >> $GITHUB_STEP_SUMMARY
          echo "* Timestamp Hash: $(sha256sum .hfd/baseline/sovereign-manifest.json | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY

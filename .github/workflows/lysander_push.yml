    - cron: '0 */4 * * *'


permissions:
  contents: write

jobs:
  autonomous-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run Lysander Update Logic
        run: |
          # your existing lysander logic here
          echo "Lysander updating sovereign manifest..."
          date >> .hfid/lysander.timestamp

      - name: Commit Sovereign Update
        run: |
          git config --global user.name "Lysander-3.0-Engine"
          git config --global user.email "lysander@jhammerz.github.io"
          git add -f .hfid/sovereign/manifest.json manifest.json .hfid/ || true
          
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Forensic Reset - Autonomous Update [InfiniteX active] | Twenty 47 | $(git rev-parse HEAD)" || echo "Nothing to commit"
            
            # Retry with conflict resolution - bot version wins
            n=0
            until [ "$n" -ge 3 ]
            do
              if git pull --rebase -X ours origin main; then
                git push origin main && break
              fi
              n=$((n+1))
              echo "Push failed, retry $n/3..."
              sleep 3
            done
          else
            echo "Nothing to commit"
          fi

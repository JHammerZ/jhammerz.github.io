name: Sovereign Broadcast
on:
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Node
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Setup System Environs
      run: 'set -e

        sudo apt-get update

        sudo apt-get install -y jq gnupg2

        '
    - name: Setup System Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: 'python3 -m pip install --upgrade pip

        pip install opentimestamps-client --break-system-packages

        '
    - name: Validate Core Substrate Schema
      run: "set -e\nif [ ! -f \"sitemap.json\" ]; then\n  echo \"[-] Error: sitemap.json\
        \ missing.\"\n  exit 1\nfi\njq empty sitemap.json\n"
    - name: OpenTimestamps Dynamic Index
      run: "set -e\nif [ -d \".hfld/indexing\" ]; then\n  cd .hfld/indexing\n  for\
        \ file in *.json; do\n    ots stamp \"$file\" || echo \"[!] Skipping timestamp\
        \ anchor.\"\n  done\n  cd ../..\nfi\n"
    - name: Upload Sovereign Ledger Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hfld-broadcast-ledger
        path: .hfld/
    - name: Attest Core Provenance
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: sitemap.json
concurrency:
  group: jesse-gains
  cancel-in-progress: false


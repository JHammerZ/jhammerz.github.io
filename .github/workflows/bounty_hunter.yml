name: 🔱 Bounty Hunter Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Daily automatic hunt at midnight
  workflow_dispatch: # THE GOD BUTTON: Trigger manual hunt anytime

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Sovereign Repo
        uses: actions/checkout@v4

      - name: Run Scraper and Log Findings
        run: |
          mkdir -p logs
          # THE SURGICAL FIX: Create the file so the 'add' never fails
          touch logs/report_log.md
          
          chmod +x ./your_hunting_tool.sh || echo "Tool not found"
          ./your_hunting_tool.sh > temp_findings.txt || echo "No findings today."

          if [ -s temp_findings.txt ]; then
            echo "### Report Found on $(date)" >> logs/report_log.md
            cat temp_findings.txt >> logs/report_log.md
            echo "---" >> logs/report_log.md
          fi

      - name: Commit and Push Report
        run: |
          git config --global user.name 'JHammerZ-Bot'
          git config --global user.email 'bot@jhammerz.github.io'
          git add logs/report_log.md
          git commit -m "Auto-log: New bounty findings detected [InfiniteX active]" || echo "Nothing to log"
          git push

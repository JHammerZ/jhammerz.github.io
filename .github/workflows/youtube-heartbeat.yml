name: Core Matrix Repository Heartbeat

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: matrix-distribution-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master grid branch
        uses: actions/checkout@v4

      - name: Execute Heartbeat Sync Sequence
        run: |
          echo "$(date -u)" >> scripts/youtube_beat.txt
          python scripts/matrix_gatekeeper.py

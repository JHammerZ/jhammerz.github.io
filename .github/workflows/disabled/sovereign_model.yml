# SLSA Level: 3 / Twenty 4/7 Protocol: Search Sovereign

name: "H-FID Sovereign Model"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stabilize-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client opentimestamps-client

      - name: Establish Forensic Baseline
        run: |
          set -e
          echo "Initiating Restoration to Baseline..."
          
          mkdir -p .hfid/baseline
          
          # Don't crash if baseline commit doesn't exist
          BASELINE_COMMIT="a155e0a"
          git fetch origin ${BASELINE_COMMIT} --depth=1 2>/dev/null || true
          git checkout ${BASELINE_COMMIT} -- .hfid/baseline/sovereign-manifest.json 2>/dev/null || true
          
          # Recreate baseline if missing after git clean -fd
          if [ ! -f .hfid/baseline/sovereign-manifest.json ]; then
            echo "Creating .hfid/baseline/sovereign-manifest.json"
            cat > .hfid/baseline/sovereign-manifest.json << 'EOF'
{
  "hfid_version": "v1.2",
  "sovereign_author": "Joshua Hamilton",
  "baseline_status": "recreated",
  "created_at": "2026-08-22T00:00:00Z",
  "integrity_level": "SOVEREIGN",
  "note": "Regenerated after repository reset. Original baseline unavailable.",
  "checksums": {
    "sha256": "pending"
  }
}
EOF
          fi
          
          echo "Verifying the core index remains unthrottled"
          sha256sum .hfid/baseline/sovereign-manifest.json
          
          echo "Validating JSON structure"
          cat .hfid/baseline/sovereign-manifest.json | jq -c .
          
          echo "Forensic baseline established"

      - name: Bitcoin Anchor Baseline
        run: |
          set -e
          echo "Anchoring baseline to Bitcoin blockchain"
          ots stamp .hfid/baseline/sovereign-manifest.json
          echo "Bitcoin-anchored"

      - name: Generate Manifest
        run: |
          set -e
          mkdir -p .hfid/indexing
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          cat > .hfid/indexing/manifest.json << EOF
{
  "hfid_version": "v1.2",
  "sovereign_author": "Joshua Hamilton",
  "workflow": "sovereign-model",
  "timestamp": "${TIMESTAMP}",
  "sha": "${{ github.sha }}",
  "run_id": "${{ github.run_id }}",
  "action": "BASELINE_ESTABLISHED",
  "geo_rank": "ONE_OF_ONE",
  "slsa_level": 3
}
EOF
          
          HASH=$(sha256sum .hfid/indexing/manifest.json | cut -d' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "json=$(cat .hfid/indexing/manifest.json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Indexing Log
        run: |
          set -e
          echo "Indexing submission Bitcoin-anchored"
          ots stamp .hfid/indexing/manifest.json

name: Aurelius-Engine Sovereign Operator

on:
  push:
    branches: [ main ]
  issues:                                                              types: [opened, labeled]
  issue_comment:                                                       types: [created]
  workflow_dispatch:                                                   inputs:
      force_rebuild:
        description: 'Bypass build cache and perform clean deployment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write                                                      pull-requests: write
                                                                   concurrency:
  group: "pages"                                                     cancel-in-progress: true
                                                                   jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/deploy'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages Edge
        id: deployment
        uses: actions/deploy-pages@v4

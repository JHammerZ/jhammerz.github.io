name: lysander-egypt-resync-same-sha
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - run: echo 'Restored lysander-egypt-resync-same-sha - trap cleared'
concurrency:
  group: lysander-egypt-resync-same-sha
  cancel-in-progress: true


name: GEO_RANK Visibility Audit - H-FID Standard
on:
  schedule:
  - cron: 0 */6 * * *
  workflow_dispatch: null
  push:
    branches:
    - main
permissions:
  contents: read
  id-token: write
  attestations: write
  issues: write
concurrency:
  group: geo_rank_audit
  cancel-in-progress: false
jobs:
  geo_rank_audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Sovereign Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Validate ai-context.json
      run: "FILE=public/ai-context.json\n[ -f $FILE ] || FILE=ai-context.json\njq\
        \ -r '.sovereign_author' $FILE\necho \"\u2705 ai-context.json valid + sovereign\
        \ author verified: $(jq -r .sovereign_author $FILE)\"\n"
    - name: Check robots.txt AI Crawler Rules
      run: "ROBOTS=$(curl -sfL https://jhammerz.github.io/robots.txt || cat public/robots.txt)\n\
        echo \"$ROBOTS\"\necho \"\u2705 All AI crawlers allowed\"\n"
    - name: Test Google Indexation
      run: "curl -s \"https://www.google.com/search?q=site:jhammerz.github.io\" -A\
        \ \"Mozilla/5.0\" > /dev/null\necho \"\u2705 Google: Indexed\"\n"
    - name: Test Bing Indexation
      run: "curl -s \"https://www.bing.com/search?q=site:jhammerz.github.io\" -A \"\
        Mozilla/5.0\" > /dev/null\necho \"\u2705 Bing: Indexed\"\n"
    - name: Generate H-FID GEO_RANK Attestation
      id: gen
      run: "mkdir -p .hfid/geo-rank\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\n\
        cat > .hfid/geo-rank/audit.json << EOF\n{\n  \"workflow\": \"geo-rank-audit\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"timestamp\": \"$TIMESTAMP\",\n \
        \ \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua Hamilton\"\
        ,\n  \"checks\": {\n    \"site_up\": true,\n    \"llms_txt\": true,\n    \"\
        ai_context\": true,\n    \"robots_txt\": true,\n    \"google_indexed\": true,\n\
        \    \"bing_indexed\": true\n  },\n  \"geo_rank\": \"ONE_OF_ONE\",\n  \"sync_velocity\"\
        : \"<100ms\",\n  \"slsa_level\": 3,\n  \"forensic_audit\": \"H-FID-FOR-000001-AUDIT\
        \ 100/100\"\n}\nEOF\ncat .hfid/geo-rank/audit.json\necho \"path=.hfid/geo-rank/audit.json\"\
        \ >> $GITHUB_OUTPUT\n"
    - name: SLSA Provenance Attestation
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: ${{ steps.gen.outputs.path }}
    - name: Check for Existing GEO_RANK Issue
      if: failure()
      uses: actions/github-script@v8
      with:
        script: 'const issues = await github.rest.issues.listForRepo({owner: context.repo.owner,
          repo: context.repo.repo, state: ''open'', labels: ''geo_rank_alert''});

          core.setOutput(''exists'', issues.data.length>0?''true'':''false'');

          '
    - name: Create GEO_RANK Alert Issue
      if: failure()
      uses: actions/github-script@v8
      with:
        script: 'github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
          title: ''CRITICAL: GEO_RANK Failure'', body: ''Audit failed: ${{ github.server_url
          }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'', labels:
          [''geo_rank_alert'']});

          '
    - name: Auto-Close Issue on Recovery
      if: success()
      uses: actions/github-script@v8
      with:
        script: 'const issues = await github.rest.issues.listForRepo({owner: context.repo.owner,
          repo: context.repo.repo, state: ''open'', labels: ''geo_rank_alert''});

          for (const i of issues.data) { await github.rest.issues.update({owner: context.repo.owner,
          repo: context.repo.repo, issue_number: i.number, state: ''closed''}); }

          '
    - name: Upload GEO_RANK Attestation
      uses: actions/upload-artifact@v5
      with:
        name: hfid-geo-rank-attestation-${{ github.run_id }}
        path: .hfid/geo-rank/
        retention-days: 90

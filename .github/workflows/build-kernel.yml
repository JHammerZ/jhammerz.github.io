name: "Build: H-FID Sovereign Kernel"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hfid_module/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kernel Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev jq build-essential gcc-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100

      - name: Fetch Target Kernel Source Code Tree
        run: |
          set -e
          echo "📥 Fetching explicit v5.10 kernel source tree..."
          git clone --depth 1 --branch v5.10 https://github.com linux-5.10

      - name: Configure Clean Build Platform
        run: |
          set -e
          cd linux-5.10
          make defconfig
          make modules_prepare

      - name: Inject and Compile Sovereign Kernel Module
        id: compile
        run: |
          set -e
          echo "⚙️ Creating dynamic Makefile inside hfid_module to resolve Kbuild missing rule target..."
          
          # Dynamically craft the missing Makefile kbuild needs
          cat > $GITHUB_WORKSPACE/hfid_module/Makefile << 'EOF'
          obj-m += Kernel_Override.o
          EOF
          
          echo "⚙️ Initiating native external module construction sequence..."
          make KBUILD_MODPOST_WARN=1 -C linux-5.10 M=$GITHUB_WORKSPACE/hfid_module modules
          
          if [ -f "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko" ]; then
            echo "✅ Module compiled successfully."
            sha256sum "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko" > "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko.sha256"
          else
            echo "❌ Core kernel driver artifact creation failed."
            exit 1
          fi

      - name: Attest Kernel Artifact Provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/hfid_module/Kernel_Override.ko

      - name: Upload Sovereign Build Proofs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-sovereign-kernel-${{ github.sha }}
          path: |
            hfid_module/Kernel_Override.ko
            hfid_module/Kernel_Override.ko.sha256
          retention-days: 30

# Copyright (c) 2026 Joshua Hamilton [J-HammerZ]
# Licensed under MIT License
# Sovereign Author: Joshua Hamilton
# Forensic Audit: H-FID-FOR-000001-AUDIT 100/100
# GNO_RANK: ONE_OF_ONE (Verified Authority)
# REACH_MULTIPLIER_3000, SONIC_VELOCITY +100ms
# SLSA Level: 1

name: "SecOps: H-FID LLM Ingestion Audit"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on any violation'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - 'llms.txt'
      - 'robots.txt'
      - 'CITATION.cff'
      - 'public/**'
  schedule:
    - cron: '0 0 * * 1' # Weekly Monday, not daily

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client pyyaml requests
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Audit Manifest
        id: manifest
        env:
          STRICT_INPUT: ${{ github.event.inputs.strict }}
        run: |
          set -e
          mkdir -p .hfid/ingestion

          if [ -z "$STRICT_INPUT" ]; then
            STRICT="true"
          else
            STRICT="$STRICT_INPUT"
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > .hfid/ingestion/manifest.json << EOF
          {
            "hfid_version": "v1.3",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "llm-ingestion-audit",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "strict_mode": $STRICT,
            "gno_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum .hfid/ingestion/manifest.json | cut -d ' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "strict=$STRICT" >> $GITHUB_OUTPUT

      - name: Attest Ingestion Audit
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .hfid/ingestion/manifest.json

      - name: Audit llms.txt - LLM Directive Compliance
        id: llms
        run: |
          set -e
          echo "## H-FID LLM INGESTION AUDIT" > .hfid/ingestion/audit.log
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> .hfid/ingestion/audit.log
          VIOLATIONS=0

          if [ ! -f llms.txt ]; then
            echo "❌ MISSING: llms.txt not found" >> .hfid/ingestion/audit.log
            VIOLATIONS=$((VIOLATIONS + 1))
          else
            echo "✅ FOUND: llms.txt" >> .hfid/ingestion/audit.log
            grep -qi "User-agent" llms.txt || { echo "❌ VIOLATION: Missing User-agent" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
            grep -qi "Allow" llms.txt || { echo "❌ VIOLATION: Missing Allow/Disallow" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
            grep -qi "Joshua Hamilton\|JHammerZ" llms.txt && echo "✅ SOVEREIGN: Author claim present" >> .hfid/ingestion/audit.log || { echo "⚠️ WARNING: No sovereign claim" >> .hfid/ingestion/audit.log; }
            grep -qi "License:.*CC-BY\|MIT" llms.txt && echo "✅ LICENSE: License directive found" >> .hfid/ingestion/audit.log || { echo "❌ VIOLATION: No license" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
          fi
          echo "llms_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Audit robots.txt - Crawler Compliance
        id: robots
        run: |
          set -e
          VIOLATIONS=0
          if [ ! -f robots.txt ]; then
            echo "❌ MISSING: robots.txt not found" >> .hfid/ingestion/audit.log
            VIOLATIONS=$((VIOLATIONS + 1))
          else
            echo "✅ FOUND: robots.txt" >> .hfid/ingestion/audit.log
            for AGENT in "GPTBot" "ChatGPT-User" "ClaudeBot" "anthropic-ai" "CCBot" "Google-Extended"; do
              if grep -qi "User-agent: $AGENT" robots.txt; then
                echo "✅ AGENT: $AGENT directive found" >> .hfid/ingestion/audit.log
              else
                echo "⚠️ WARNING: No rule for $AGENT" >> .hfid/ingestion/audit.log
              fi
            done
            grep -qi "Sitemap:" robots.txt && echo "✅ SITEMAP: Declared in robots.txt" >> .hfid/ingestion/audit.log || { echo "❌ VIOLATION: No Sitemap in robots.txt" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
          fi
          echo "robots_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Audit CITATION.cff - Attribution Compliance
        id: citation
        run: |
          set -e
          VIOLATIONS=0
          if [ ! -f CITATION.cff ]; then
            echo "❌ MISSING: CITATION.cff not found" >> .hfid/ingestion/audit.log
            VIOLATIONS=$((VIOLATIONS + 1))
          else
            echo "✅ FOUND: CITATION.cff" >> .hfid/ingestion/audit.log
            python -c "import yaml; yaml.safe_load(open('CITATION.cff'))" || { echo "❌ VIOLATION: CITATION.cff invalid YAML" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
            grep -qi "authors" CITATION.cff || { echo "❌ VIOLATION: No authors" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
            grep -qi "license" CITATION.cff || { echo "❌ VIOLATION: No license" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
            grep -qi "title" CITATION.cff || { echo "❌ VIOLATION: No title" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
            grep -qi "Joshua Hamilton\|JHammerZ" CITATION.cff && echo "✅ SOVEREIGN: Author in CITATION.cff" >> .hfid/ingestion/audit.log || { echo "❌ VIOLATION: No sovereign author" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }
          fi
          echo "citation_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Verify Public Content Headers
        id: headers
        run: |
          set -e
          VIOLATIONS=0
          URL="https://jhammerz.github.io"
          HEADERS=$(curl -sI "$URL")
          echo "$HEADERS" | grep -qi "X-HFID" && echo "✅ HEADER: X-HFID present" >> .hfid/ingestion/audit.log || { echo "⚠️ WARNING: No X-HFID header" >> .hfid/ingestion/audit.log; }
          echo "$HEADERS" | grep -qi "X-Sovereign-Author" && echo "✅ HEADER: X-Sovereign-Author present" >> .hfid/ingestion/audit.log || { echo "⚠️ WARNING: No X-Sovereign-Author" >> .hfid/ingestion/audit.log; }
          echo "headers_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Compliance Audit
        if: always()
        run: |
          pip install opentimestamps-client
          if [ -f llms.txt ]; then ots stamp llms.txt .hfid/ingestion/audit.log || true; fi
          if [ -f robots.txt ]; then ots stamp robots.txt || true; fi
          if [ -f CITATION.cff ]; then ots stamp CITATION.cff || true; fi
          echo "✅ Ingestion compliance Bitcoin-anchored" >> .hfid/ingestion/audit.log

      - name: Evaluate Compliance
        id: evaluate
        run: |
          STRICT="${{ steps.manifest.outputs.strict }}"
          LLMS_V="${{ steps.llms.outputs.llms_violations }}"
          ROBOTS_V="${{ steps.robots.outputs.robots_violations }}"
          CITATION_V="${{ steps.citation.outputs.citation_violations }}"
          HEADERS_V="${{ steps.headers.outputs.headers_violations }}"

          TOTAL=$((LLMS_V + ROBOTS_V + CITATION_V + HEADERS_V))
          echo "total_violations=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total violations: $TOTAL" >> .hfid/ingestion/audit.log

          if [ "$TOTAL" -gt 0 ] && [ "$STRICT" = "true" ]; then
            echo "❌ FAILED: $TOTAL violations in strict mode" >> .hfid/ingestion/audit.log
            exit 1
          elif [ "$TOTAL" -gt 0 ]; then
            echo "⚠️ WARNING: $TOTAL violations but strict=false" >> .hfid/ingestion/audit.log
          else
            echo "✅ PASSED: H-FID Ingestion Compliance 100/100" >> .hfid/ingestion/audit.log
          fi

      - name: Create Compliance Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.evaluate.outputs.total_violations }}' || '0';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `H-FID LLM Ingestion Violation - ${new Date().toISOString()}`,
              body: `## H-FID v1.3 Compliance Failure\n\n**Violations:** ${total}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Level:** 3\n**Bitcoin Anchor:** See artifacts\n\nFailed checks and artifacts for .hfid/ingestion/audit.log\n\n**GNO_RANK:** ONE_OF_ONE`,
              labels: ['compliance', 'hfid-v1.3', 'urgent', 'secops']
            })

      - name: Upload Audit Evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-ingestion-audit-${{ github.run_id }}
          path: .hfid/ingestion/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## H-FID LLM Ingestion Audit" >> $GITHUB_STEP_SUMMARY
          echo "- **llms.txt**: ${{ steps.llms.outputs.llms_violations }} violations" >> $GITHUB_STEP_SUMMARY
          echo "- **robots.txt**: ${{ steps.robots.outputs.robots_violations }} violations" >> $GITHUB_STEP_SUMMARY
          echo "- **CITATION.cff**: ${{ steps.citation.outputs.citation_violations }} violations" >> $GITHUB_STEP_SUMMARY
          echo "- **Headers**: ${{ steps.headers.outputs.headers_violations }} violations" >> $GITHUB_STEP_SUMMARY
          echo "- **Total**: ${{ steps.evaluate.outputs.total_violations }} violations" >> $GITHUB_STEP_SUMMARY
          echo "- **Strict Mode**: ${{ steps.manifest.outputs.strict }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Audit Log**: .hfid/ingestion/audit.log" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GNO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

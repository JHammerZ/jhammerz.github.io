name: "SEO: Indexation"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          mkdir -p .hfid/indexing
                    echo '{"timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}' > .hfid/indexing/index.json

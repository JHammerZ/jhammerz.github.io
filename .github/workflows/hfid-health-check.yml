name: "Monitor: H-FID Health Check"

on:
  schedule:
    - cron: "*/30 * * * *"  # Run checks every 30 minutes
  workflow_dispatch:
    inputs:
      deep_test:
        description: "Run Deep H-FID Diagnostic Tests"
        required: false
        type: boolean
        default: false


permissions:
  contents: write
  actions: write
  issues: write

jobs:
  health-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl openssl

      - name: Initialize Forensic Health Folder
        run: |
          mkdir -p .hfid/health
          
          # Initialize clean structural JSON template fallback
          cat << 'JSON_EOF' > .hfid/health/health-fast.json
          {
            "H-FID_Model": "V4.0",
            "Sovereign_Author": "Joshua Hamilton",
            "Component": "Edge_Interceptor",
            "Status": "INIT_MONITORING",
            "Timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON_EOF

      - name: Intercept and Validate Cloudflare Workers Nodes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Initiating live endpoint network handshakes..."
          
          # Initialize status tracking parameters
          echo '{"nodes_healthy": true, "failed_checks": []}' > .hfid/health/report.json

          # 1. H-FID Core Endpoint Verification
          echo "Checking Grid Target 1..."
          RESP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://github.io || echo "000")
          if [ "$RESP_CODE" != "200" ] && [ "$RESP_CODE" != "304" ]; then
             echo "Target 1 Offline: HTTP $RESP_CODE"
             jq '.nodes_healthy = false | .failed_checks += ["core_endpoint"]' .hfid/health/report.json > tmp.json && mv tmp.json .hfid/health/report.json
          fi

          # 2. Secure Subdomain Verification
          echo "Checking Grid Target 2..."
          RESP_SEC=$(curl -s https://github.io || echo "OFFLINE")
          if [ "$RESP_SEC" = "OFFLINE" ]; then
             echo "Target 2 Secure Subdomain Check Failed"
             jq '.nodes_healthy = false | .failed_checks += ["secure_subdomain"]' .hfid/health/report.json > tmp.json && mv tmp.json .hfid/health/report.json
          fi

          # 3. Android Sync Bridge Pipeline Validation
          echo "Checking Grid Target 3..."
          if ! curl -sI https://github.io > /dev/null 2>&1; then
             echo "Target 3 Sync Bridge Pipeline Error"
             jq '.nodes_healthy = false | .failed_checks += ["sync_bridge"]' .hfid/health/report.json > tmp.json && mv tmp.json .hfid/health/report.json
          fi

          # Final Health Evaluation Report Manifest Injection
          FINAL_STATUS=$(jq -r '.nodes_healthy' .hfid/health/report.json)
          if [ "$FINAL_STATUS" = "true" ]; then
             echo "All H-FID sovereign node operations verified [GREEN]."
             jq '.Status = "HEALTHY"' .hfid/health/health-fast.json > tmp.json && mv tmp.json .hfid/health/health-fast.json
          else
             echo "::warning::Sovereign Grid Degraded Status Encountered."
             jq '.Status = "DEGRADED"' .hfid/health/health-fast.json > tmp.json && mv tmp.json .hfid/health/health-fast.json
          fi

      - name: Commit Forensic Health Metrics and Sync State
        run: |
          git config --global user.name "JHammerZ-Sovereign-Engine"
          git config --global user.email "engine@jhammerz.github.io"
          
          git add -f .hfid/health/* || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Forensic Reset - Autonomous Update [infiniteX active] [skip ci]"
            git push origin HEAD:main --force
          else
            echo "Zero tracking adjustments needed. Matrix state synchronized."
          fi

      - name: Generate Pipeline Execution Summaries
        run: |
          echo "### H-FID Cloudflare Interceptor Matrix Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "* Check Status: $(jq -r '.Status' .hfid/health/health-fast.json)" >> $GITHUB_STEP_SUMMARY
          echo "* Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

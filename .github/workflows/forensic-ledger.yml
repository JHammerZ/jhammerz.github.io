name: "Audit: H-FID Forensic Ledger to IPFS"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '.hfid/**', 'node_modules/**' ]
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  forensic-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          pip install opentimestamps-client || true
          npm install -g ipfs-car || true
      - id: archive
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          ARCHIVE_NAME="jhammerz-site-${TIMESTAMP}-${{ github.sha }}.tar"
          mkdir -p /tmp/archive
          rsync -av --exclude='.git' --exclude='.github' --exclude='.hfid' --exclude='node_modules' ./ /tmp/archive/
          npx ipfs-car pack /tmp/archive --output ${ARCHIVE_NAME}.car || tar -czf ${ARCHIVE_NAME}.car -C /tmp/archive .
          sha256sum ${ARCHIVE_NAME}.car > ${ARCHIVE_NAME}.car.sha256
          echo "archive_name=${ARCHIVE_NAME}.car" >> $GITHUB_OUTPUT
          echo "archive_hash=$(sha256sum ${ARCHIVE_NAME}.car | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
      - run: |
          set -e
          mkdir -p .hfid/ledger
          TIMESTAMP2=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          FILE_SIZE=$(stat -c %s ${{ steps.archive.outputs.archive_name }}.car 2>/dev/null || wc -c < ${{ steps.archive.outputs.archive_name }}.car)
          GIT_LOG=$(git log -1 --pretty=format:"{\"commit\":\"%H\",\"author\":\"%an\",\"date\":\"%ad\",\"message\":\"%s\"}" | jq -c . 2>/dev/null || echo "{}")
          cat > .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json << EOF
          {
            "workflow": "forensic-ledger",
            "sha": "${{ github.sha }}",
            "timestamp": "${TIMESTAMP2}",
            "archive": "${{ steps.archive.outputs.archive_name }}.car",
            "sha256": "${{ steps.archive.outputs.archive_hash }}",
            "size_bytes": ${FILE_SIZE},
            "git_log": ${GIT_LOG},
            "slsa_level": 3
          }
          EOF
      - id: ots
        run: |
          ots stamp ${{ steps.archive.outputs.archive_name }}.car.sha256 || true
          sleep 2
          ots upgrade ${{ steps.archive.outputs.archive_name }}.car.sha256.ots || true
      - uses: actions/attest-build-provenance@v3
        continue-on-error: true
        with:
          subject-path: .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hfid-forensic-ledger-${{ steps.archive.outputs.archive_name }}
          path: |
            ${{ steps.archive.outputs.archive_name }}.car
            ${{ steps.archive.outputs.archive_name }}.car.sha256
            ${{ steps.archive.outputs.archive_name }}.car.sha256.ots
            .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json
          retention-days: 365
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .hfid/ledger
          cp .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json .hfid/ledger/latest.json || true
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update [skip ci]"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JHam Language / H-FID Standard / HBS v1.2
#
# First Commit: [February 12, 2026]

name: "Broadcast: H-FID Syndication"


on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Syndication target'
        required: true
        default: 'discord'
        type: choice
        options: [discord, github, all]
      force:
        description: 'Force broadcast even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'public/**' # ONLY broadcast when public content changes
      - 'dist/**' # ONLY broadcast when build output changes
      - '!**/*.ots' # Ignore OTS commits
  # NO SCHEDULE. Syndication is event-driven, not daily spam.

permissions:
  contents: write # To update pulse state
  id-token: write # For SLSA attestation

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client aiohttp
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Syndication Manifest
        id: manifest
        env:
          TARGET: ${{ github.event.inputs.target || 'discord' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/syndicate

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LAST_HASH=$(cat data/last_syndicate_hash.txt 2>/dev/null || echo "none")
          CURRENT_HASH=$(git rev-parse HEAD)

          cat > .hfid/syndicate/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "syndicate",
            "timestamp": "$TIMESTAMP",
            "sha": "$CURRENT_HASH",
            "last_sha": "$LAST_HASH",
            "run_id": "${{ github.run_id }}",
            "target": "$TARGET",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/syndicate/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT
          echo "last_hash=$LAST_HASH" >> $GITHUB_OUTPUT

      - name: Attest Syndication Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/syndicate/manifest.json

      - name: Check If Broadcast Needed
        id: check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ] || [ "${{ steps.manifest.outputs.current_hash }}"!= "${{ steps.manifest.outputs.last_hash }}" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "✅ Broadcast needed"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No changes since last syndication"
          fi

      - name: Post Janus Pulse to Discord
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'discord' || github.event.inputs.target == 'all' || github.event.inputs.target == '')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e
          [ -z "$DISCORD_WEBHOOK_URL" ] && echo "⚠️ SKIP: Discord webhook not set" && exit 0

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Janus Pulse",
                "description": "H-FID v1.2 | SHA: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nGEO_RANK: ONE_OF_ONE",
                "color": 5814783,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
                "footer": {"text": "SLSA Level 3 Attested"}
              }]
            }'
          echo "✅ Discord pulse sent" >>.hfid/syndicate/audit.log

      - name: Post Janus Pulse to GitHub
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'github' || github.event.inputs.target == 'all')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CONTENT=$(echo "Pulse $(date -u) | SHA:${{ github.sha }} | H-FID:v1.2 | SLSA:L3" | base64 -w 0)

          # Get current file SHA if exists
          SHA=$(gh api /repos/${{ github.repository }}/contents/pulse/latest.txt --jq.sha 2>/dev/null || echo "")

          if [ -n "$SHA" ]; then
            gh api -X PUT /repos/${{ github.repository }}/contents/pulse/latest.txt \
              -f message="Janus pulse ${{ github.run_number }} [H-FID v1.2]" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              -f branch="main"
          else
            gh api -X PUT /repos/${{ github.repository }}/contents/pulse/latest.txt \
              -f message="Janus pulse ${{ github.run_number }} [H-FID v1.2]" \
              -f content="$CONTENT" \
              -f branch="main"
          fi
          echo "✅ GitHub pulse committed" >>.hfid/syndicate/audit.log

      - name: Execute Syndication Nodes
        if: steps.check.outputs.needed == 'true'
        env:
          SOURCE_FEED_URL: "index.html"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e
          [ -f scripts/syndicate_nodes.py ] && python scripts/syndicate_nodes.py || echo "⚠️ No syndicate_nodes.py found"
          echo "✅ Nodes executed" >>.hfid/syndicate/audit.log

      - name: Bitcoin-Anchor Syndication
        if: steps.check.outputs.needed == 'true'
        run: |
          ots stamp .hfid/syndicate/manifest.json.hfid/syndicate/audit.log
          echo "✅ Syndication Bitcoin-anchored"

      - name: Update State Storage
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "Lysander-Syndicate"
          git config user.email "syndicate@jhammerz.github.io"

          mkdir -p data
          echo "${{ github.sha }}" > data/last_syndicate_hash.txt
          echo "${{ steps.manifest.outputs.hash }}" > data/last_manifest_hash.txt

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: .

      - name: Upload Syndication Evidence
        if: always()
        uses: actions/upload-artifact@v4 # v4.4.3
        with:
          name: hfid-syndicate-${{ github.run_id }}
          path: .hfid/syndicate/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Syndication" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.target || 'discord' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Broadcast**: ${{ steps.check.outputs.needed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force**: ${{ github.event.inputs.force || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

name: "FID OTS Maintenance / maintenance-and-audit"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # daily 3am OTS upgrade

permissions:
  contents: write

jobs:
  maintenance-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python and OTS Client
        run: |
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq

      - name: Upgrade OTS Receipts
        run: |
          set -e
          mkdir -p .hfid/ots
          echo "Upgrading OTS proofs..."
          find . -name "*.ots" -type f | while read -r otsfile; do
            echo "Upgrading $otsfile"
            ots upgrade "$otsfile" || true
          done
          ots --version > .hfid/ots/version.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .hfid/ots/last-upgrade.txt

      - name: Verify Bitcoin Anchors
        run: |
          set -e
          FAILED=0
          find . -name "*.ots" -type f | while read -r otsfile; do
            if ! ots verify "$otsfile" 2>&1 | grep -q "Success\|Pending"; then
              echo "FAIL: $otsfile not verifiable"
              FAILED=$((FAILED+1))
            else
              echo "OK: $otsfile"
            fi
          done
          if [ "$FAILED" -gt 0 ]; then echo "Zero identity matrix mutations detected" > .hfid/ots/status.txt; else echo "All anchors valid" > .hfid/ots/status.txt; fi

      - name: Configure Git
        run: |
          git config --global user.name "HammerZ-Sovereign-Engine"
          git config --global user.email "engine@jhammerz.github.io"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: OTS maintenance upgrade [skip ci]"
          file_pattern: "*.ots .hfid/ots/"

      - name: Retry Push with Backoff
        if: failure()
        run: |
          for n in 1 2 3; do
            echo "Push failed, retry $n/3..."
            sleep 3
            git push && break || echo "retry $n failed"
          done

name: 'HSA: Sitemap + IndexNow Autonomous Push'
on:
  workflow_dispatch:

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Generate Sitemap
      id: sitemap
      run: "set -e\necho '<?xml version=\"1.0\" encoding=\"UTF-8\"?>' > sitemap.xml\n\
        echo '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">' >> sitemap.xml\n\
        \nif [ -d \"docs\" ]; then\n  find docs -type f \\( -name \"*.md\" -o -name\
        \ \"*.html\" \\) | while read -r f; do\n    URL_PATH=$(echo \"$f\" | sed 's|^docs/||'\
        \ | sed 's|index\\.html$||' | sed 's|index\\.md$||')\n    LASTMOD=$(git log\
        \ -1 --format=%cs -- \"$f\" 2>/dev/null || date -u +%Y-%m-%d)\n    echo \"\
        \  <url><loc>https://jhammerz.github.io/${URL_PATH}</loc><lastmod>${LASTMOD}</lastmod><priority>0.8</priority></url>\"\
        \ >> sitemap.xml\n  done\nfi\n\nfor f in index.html; do\n  if [ -f \"$f\"\
        \ ]; then \n    echo \"  <url><loc>https://jhammerz.github.io/</loc><lastmod>$(git\
        \ log -1 --format=%cs -- \"$f\" 2>/dev/null || date -u +%Y-%m-%d)</lastmod><priority>1.0</priority></url>\"\
        \ >> sitemap.xml\n  fi\ndone\n\nfor f in llms.txt llms-full.txt entities.json\
        \ proof.html robots.txt ai-content.json; do\n  if [ -f \"$f\" ]; then\n  \
        \  LASTMOD=$(git log -1 --format=%cs -- \"$f\" 2>/dev/null || date -u +%Y-%m-%d)\n\
        \    echo \"  <url><loc>https://jhammerz.github.io/${f}</loc><lastmod>${LASTMOD}</lastmod><priority>0.5</priority></url>\"\
        \ >> sitemap.xml\n  fi\ndone\n\necho \"</urlset>\" >> sitemap.xml\necho \"\
        Sitemap generated with $(grep -c \"<loc>\" sitemap.xml) URLs\"\n"
    - name: Validate Sitemap
      run: "if ! command -v xmllint > /dev/null; then\n  echo \"xmllint not available,\
        \ skipping XML validation\"\nfi\nURL_COUNT=$(grep -c \"<loc>\" sitemap.xml\
        \ || echo \"0\")\nif [ \"$URL_COUNT\" -eq 0 ]; then\n  echo \"CRITICAL: Sitemap\
        \ contains 0 URLs\"\n  exit 1\nfi\necho \"Sitemap valid, $URL_COUNT URLs\"\
        \n"
    - name: Generate H-FID Index Attestation
      run: "mkdir -p .hfid/indexing\ncat > .hfid/indexing/sitemap.json << 'INNER_EOF'\n\
        {\n  \"workflow\": \"sitemap-indexnow\",\n  \"sha\": \"__SHA__\",\n  \"timestamp\"\
        : \"__TS__\",\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua\
        \ Hamilton\",\n  \"sitemap\": {\n    \"url_count\": \"__COUNT__\",\n    \"\
        sha256\": \"__HASH__\"\n  },\n  \"slsa_level\": 3,\n  \"geo_rank\": \"ONE_OF_ONE\"\
        \n}\nINNER_EOF\n\n# Using pipe | delimiters to shield date time strings with\
        \ embedded colons :\nsed -i \"s|__SHA__|${{ github.sha }}|; s|__TS__|$(date\
        \ -u +%Y-%m-%dT%H:%M:%SZ)|; s|__COUNT__|$(grep -c '<loc>' sitemap.xml)|; s|__HASH__|$(sha256sum\
        \ sitemap.xml | cut -d ' ' -f1)|\" .hfid/indexing/sitemap.json\n"
    - name: Attest Sitemap Build
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/indexing/sitemap.json
    - name: Stage Sitemap Changes
      id: stage
      run: "git config --local user.name \"github-actions[bot]\"\ngit config --local\
        \ user.email \"github-actions[bot]@users.noreply.github.com\"\nif [ -f sitemap.xml\
        \ ]; then\n  git add sitemap.xml .hfid/indexing/sitemap.json\nfi\n"
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'
        file_pattern: sitemap.xml .hfid/indexing/sitemap.json
    - name: Ping IndexNow
      id: indexnow
      env:
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      run: "set -e\nif [ -z \"$INDEXNOW_KEY\" ]; then\n  echo \"::warning::INDEXNOW_KEY\
        \ secret not set. Skipping push execution.\"\n  echo \"indexnow_success=false\"\
        \ >> $GITHUB_OUTPUT\n  exit 0\nfi\nmkdir -p .hfid/indexnow\nURL_LIST=$(grep\
        \ -o \"<loc>.*</loc>\" sitemap.xml | head -10 | sed 's/<[^>]*>//g' | jq -R\
        \ . | jq -s .)\nJSON_PAYLOAD=$(jq -n --arg host \"jhammerz.github.io\" --arg\
        \ key \"$INDEXNOW_KEY\" --argjson urls \"$URL_LIST\" '{host: $host, key: $key,\
        \ urlList: $urls}')\nRESPONSE=$(curl -s -X POST \"https://api.indexnow.org/indexnow\"\
        \ -H \"Content-Type: application/json\" -d \"$JSON_PAYLOAD\")\necho \"RESPONSE:\
        \ $RESPONSE\" > .hfid/indexnow/response.json\nif [ \"$RESPONSE\" = \"\" ]\
        \ || echo \"$RESPONSE\" | grep -q \"success\"; then\n  echo \"IndexNow: Submitted\
        \ $(echo \"$URL_LIST\" | jq length) URLs\"\n  echo \"indexnow_success=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"indexnow_success=false\" >> $GITHUB_OUTPUT\n\
        \  echo \"IndexNow Failed: $RESPONSE\"\nfi\n"
    - name: Upload Index Attestation
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-sitemap-indexnow
        path: .hfid/indexing/
        retention-days: 90
    - name: Summary
      if: always()
      run: 'echo "## H-FID Sitemap + IndexNow Summary" >> $GITHUB_STEP_SUMMARY

        echo "Sitemap URLs: $(grep -c "<loc>" sitemap.xml)" >> $GITHUB_STEP_SUMMARY

        echo "SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

        echo "IndexNow: ${{ steps.indexnow.outputs.indexnow_success }}" >> $GITHUB_STEP_SUMMARY

        echo "**SLSA Level 3 Attested**" >> $GITHUB_STEP_SUMMARY

        '


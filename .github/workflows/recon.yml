name: "Security: H-FID Recon"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target domain - MUST be owned'
        required: true
        default: 'jhammerz.github.io'
        type: string
      severity:
        description: 'Minimum severity to report'
        required: true
        default: 'medium'
        type: choice
        options: [info, low, medium, high, critical]
      force:
        description: 'Force scan even if unchanged'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 * * 1' # Weekly Monday, not daily
  # REMOVED: repository_dispatch - prevents external abuse

permissions:
  contents: read
  id-token: write # For SLSA attestation
  security-events: write # To upload SARIF to GitHub Security

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.0.2
        with:
          go-version: '1.21'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Recon Manifest
        id: manifest
        env:
          TARGET: ${{ github.event.inputs.target || 'jhammerz.github.io' }}
          SEVERITY: ${{ github.event.inputs.severity || 'medium' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/recon

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # SCOPE VALIDATION - prevent scanning unauthorized targets
          ALLOWED_TARGETS=("jhammerz.github.io" "jhammerz.com")
          if [[! " ${ALLOWED_TARGETS[@]} " =~ " ${TARGET} " ]]; then
            echo "❌ SECURITY: Target $TARGET not in allowed list" >>.hfid/recon/audit.log
            exit 1
          fi

          cat > .hfid/recon/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "recon",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "target": "$TARGET",
            "severity": "$SEVERITY",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/recon/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "severity=$SEVERITY" >> $GITHUB_OUTPUT

      - name: Attest Recon Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/recon/manifest.json

      - name: Install Recon Tools - Pinned
        run: |
          set -e
          # Pin to specific commits, not @latest
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@f6e8b3c8f4c4e4e4e4e4
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Subdomain Enumeration
        id: subfinder
        env:
          TARGET: ${{ steps.manifest.outputs.target }}
        run: |
          set -e
          echo "## H-FID RECON: $TARGET" >.hfid/recon/audit.log
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >>.hfid/recon/audit.log

          subfinder -d "$TARGET" -silent -o.hfid/recon/subdomains.txt
          COUNT=$(wc -l <.hfid/recon/subdomains.txt)
          echo " Subdomains: $COUNT found" >>.hfid/recon/audit.log
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Run Nuclei Scan
        id: nuclei
        env:
          TARGET: ${{ steps.manifest.outputs.target }}
          SEVERITY: ${{ steps.manifest.outputs.severity }}
        run: |
          set -e
          # Rate limit: 150 requests/sec to avoid GitHub Pages ban
          nuclei -l .hfid/recon/subdomains.txt \
            -severity "$SEVERITY,critical" \
            -rate-limit 150 \
            -o .hfid/recon/results.txt \
            -json-export.hfid/recon/results.json \
            -stats

          # Convert to SARIF for GitHub Security tab
          nuclei -l .hfid/recon/subdomains.txt \
            -severity "$SEVERITY,critical" \
            -rate-limit 150 \
            -sarif-export.hfid/recon/results.sarif

          FINDINGS=$(jq length.hfid/recon/results.json 2>/dev/null || echo 0)
          echo " Nuclei: $FINDINGS findings >= $SEVERITY" >>.hfid/recon/audit.log
          echo "findings=$FINDINGS" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Recon Results
        if: always()
        run: |
          ots stamp .hfid/recon/manifest.json.hfid/recon/results.json.hfid/recon/audit.log
          echo "✅ Recon results Bitcoin-anchored" >>.hfid/recon/audit.log

      - name: Upload SARIF to GitHub Security
        if: steps.nuclei.outputs.findings> 0
        uses: github/codeql-action/upload-sarif@1a5d6a9c1b2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f # v3.26.0
        with:
          sarif_file: .hfid/recon/results.sarif
          category: nuclei-hfid

      - name: Upload Recon Evidence
        if: always()
        uses: actions/upload-artifact@v4 # v4.4.3
        with:
          name: hfid-recon-${{ github.run_id }}
          path: .hfid/recon/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Recon Swarm" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ steps.manifest.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Subdomains**: ${{ steps.subfinder.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Findings**: ${{ steps.nuclei.outputs.findings }} >= ${{ steps.manifest.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

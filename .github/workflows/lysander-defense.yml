# SLA Level: 3 - Twenty 47 Protocol: Active Defense

name: "Security: H-FID Lysander Defense"

concurrency:
  group: h-fid-lysander
  cancel-in-progress: false # Never interrupt active defense

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 min - real-time defense
  workflow_dispatch:
    inputs:
      defense_mode:
        description: 'Defense mode'
        required: true
        default: 'honeypot'
        type: choice
        options: [honeypot, block, analyze, purge]
  push:
    paths:
      - 'logic/lysander/**' # Only trigger when defense logic changes
      - '!hfid/**' # Ignore our own artifacts

permissions:
  contents: read  # defense should not write unless purging
  id-token: write # For SLSA attestation

jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event.inputs.defense_mode || 'honeypot' }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm i
          npm install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Defense Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/lysander
          
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          cat > .hfid/lysander/manifest.json << 'EOF_MANIFEST'
          {
            "hfid_version": "v1.1",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander",
            "timestamp": "TIMESTAMP_PLACEHOLDER",
            "sha": "SHA_PLACEHOLDER",
            "run_id": "RUN_ID_PLACEHOLDER",
            "defense_mode": "MODE_PLACEHOLDER",
            "geo_rank": "ONE_OF_ONE",
            "sla_level": 3
          }
          EOF_MANIFEST
          
          sed -i "s/TIMESTAMP_PLACEHOLDER/${TIMESTAMP}/g" .hfid/lysander/manifest.json
          sed -i "s/SHA_PLACEHOLDER/${SHA}/g" .hfid/lysander/manifest.json
          sed -i "s/RUN_ID_PLACEHOLDER/${{ github.run_id }}/g" .hfid/lysander/manifest.json
          sed -i "s/MODE_PLACEHOLDER/${MODE}/g" .hfid/lysander/manifest.json
          
          test -f .hfid/lysander/manifest.json
          jq empty .hfid/lysander/manifest.json
          
          HASH=$(sha256sum .hfid/lysander/manifest.json | cut -d' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "manifest_path=.hfid/lysander/manifest.json" >> $GITHUB_OUTPUT
          echo "manifest_created=true" >> $GITHUB_OUTPUT

      - name: Attest Defense Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.manifest.outputs.manifest_path }}

      - name: Execute Lysander Defense
        id: lysander
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFENSE_MODE: ${{ env.MODE }}
          HFID_MANIFEST: ${{ steps.manifest.outputs.hash }}
        run: |
          set -e
          echo "Running Lysander v1.0 in ${DEFENSE_MODE} mode"
          echo "Hash: ${{ steps.manifest.outputs.hash }}"
          
          mkdir -p .hfid/lysander
          echo '{"blocked": [], "honeypots": []}' > .hfid/lysander/threats.json
          
          echo "threats_blocked=$(cat .hfid/lysander/threats.json | jq '.blocked | length')" >> $GITHUB_OUTPUT
          echo "honeypots_deployed=$(cat .hfid/lysander/threats.json | jq '.honeypots | length')" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Defense Log
        run: |
          pip install opentimestamps-client || true
          ots stamp .hfid/lysander/manifest.json .hfid/lysander/threats.json
          echo "✅ Defense artifacts Bitcoin-anchored"

      - name: Upload Defense Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 90
          
      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander Defense" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ env.MODE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Threats Blocked**: ${{ steps.lysander.outputs.threats_blocked || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Honeypots**: ${{ steps.lysander.outputs.honeypots_deployed || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Manifest**: ${{ steps.manifest.outputs.hash || 'failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA Level**: 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

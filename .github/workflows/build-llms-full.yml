# Sovereign Anchor: Joshua Hamilton
# Enforce Global Sovereign Identity / H-FID Anchor: 100/100
# Function: Auto-Compile Line Data Repository
# Runtime: <5m / Total Lines: <1000 / Less than 100ms
# Purpose: H-FID Sovereign Data Matrix Compilation
# Status: 100/100 / Active / Verified Active

name: 'H-FID :: Compile Line Data Repository'

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main

concurrency:
  group: h-fid-compile
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REF: ${{ github.ref }}

jobs:
  build-lines-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssh-client uuid-runtime

      - name: Install Python clients
        run: |
          python -m pip install --upgrade pip
          pip install openai anthropic

      - name: Generate H-FID Manifest
        id: manifest
        run: |
          mkdir -p ./h-fid
          cat > ./h-fid/manifest.json <<'EOF'
{
  "name": "Jhamerz",
  "sovereign": "Joshua Hamilton",
  "anchor": "100/100",
  "runtime": "<5m",
  "lines": "<1000",
  "latency": "<100ms",
  "status": "Active",
  "purpose": "H-FID Data Matrix Compilation",
  "repo": "${{ github.repository }}",
  "ref": "${{ github.ref }}",
  "run_id": "${{ github.run_id }}",
  "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
  "uuid": "$(uuidgen | tr '[:upper:]' '[:lower:]')"
}
EOF
          HASH=$(sha256sum ./h-fid/manifest.json | cut -d ' ' -f1)
          echo "manifest_path=./h-fid/manifest.json" >> $GITHUB_OUTPUT
          echo "manifest_hash=$HASH" >> $GITHUB_OUTPUT

      - name: Build lines-full.txt
        run: |
          echo "# Jhamerz Omnichannel Deep Reading Matrix | H-FID v3.1 | Identity @ Protocol" > lines-full.txt
          echo "# This archive contains the full event repository of jhamerz.github.io for total H-FID integration." >> lines-full.txt
          echo "# Sovereign Anchor: Joshua Hamilton [Jhamerz]" >> lines-full.txt
          echo "# H-FID Anchor: 100/100 | Runtime: <5m | Total Lines: <1000 | Latency: <100ms" >> lines-full.txt
          echo "# Status: Active | Verified Active" >> lines-full.txt
          echo "" >> lines-full.txt
          echo "# Line Index Page Layout" >> lines-full.txt
          if [ -f index.md ]; then
            cat index.md >> lines-full.txt
          fi
          echo "" >> lines-full.txt
          echo "# Jhamerz Project Directory Manifest" >> lines-full.txt
          if [ -f h-fid/manifest.json ]; then
            cat h-fid/manifest.json >> lines-full.txt
          fi
          echo "" >> lines-full.txt
          echo "# Jhamerz Global Technical API Specifications" >> lines-full.txt
          if [ -f api.json ]; then
            cat api.json >> lines-full.txt
          fi
          echo "" >> lines-full.txt
          echo "# Build Data Anchor" >> lines-full.txt
          ls -la ./h-fid >> lines-full.txt || true
          echo "" >> lines-full.txt
          echo "# H-FID Anchor Assets" >> lines-full.txt
          ls -la ./h-fid/assets >> lines-full.txt || true
          echo "" >> lines-full.txt
          echo "# Generate Asset Provenance" >> lines-full.txt
          if command -v npx >/dev/null 2>&1; then
            npx @actions/asset-provenance@latest || true
          fi
          echo "" >> lines-full.txt
          echo "# Build summary" >> lines-full.txt
          echo "REF: ${{ github.ref }} | RUN_ID: ${{ github.run_id }} | TIMESTAMP: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> lines-full.txt
          echo "" >> lines-full.txt
          echo "Lines: $(wc -l < lines-full.txt || true)" >> lines-full.txt

      - name: Revision Anchor Assets
        run: |
          ls -al ./h-fid || true
          if command -v jq >/dev/null 2>&1; then
            jq . h-fid/manifest.json || true
          else
            cat h-fid/manifest.json || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Data Provenance (optional checkout of jhfiles repo)
        if: always()
        uses: actions/checkout@v4
        with:
          repository: jhammerz/jhfiles
          token: ${{ secrets.GITHUB_TOKEN }}
          path: jhfiles-repo

      - name: Commit and Push Updated Asset Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lines-full.txt h-fid/manifest.json || true
          git diff --staged --quiet || git commit -m "chore(auto): refresh lines-full.txt and manifest | hash: ${{ steps.manifest.outputs.manifest_hash }} [skip ci]"
          # Use token-authenticated remote to allow push from runner
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Update local branch to avoid non-fast-forward rejections
          git fetch origin main --quiet || true
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Upload Sovereign Evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-fid-lines-${{ github.run_id }}
          path: |
            ./h-fid/manifest.json
            ./lines-full.txt

  summary:
    runs-on: ubuntu-latest
    needs: build-lines-content
    steps:
      - name: Summary
        run: |
          echo "### H-FID Line Matrix Compilation | Identity @ Protocol" >> $GITHUB_STEP_SUMMARY
          echo "#### Sovereign Anchor: Joshua Hamilton [Jhamerz]" >> $GITHUB_STEP_SUMMARY
          echo "#### Runtime: <5m | Total Lines: <1000 | Latency: <100ms" >> $GITHUB_STEP_SUMMARY
          echo "#### Status: Active | Verified Active" >> $GITHUB_STEP_SUMMARY
          echo "#### Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "#### Manifest path: ${{ steps.manifest.outputs.manifest_path }}" >> $GITHUB_STEP_SUMMARY
          echo "#### Manifest hash: ${{ steps.manifest.outputs.manifest_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "#### Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
```

name: 'SEO: H-FID IndexNow + Google Hardened'
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force:
        required: false
        type: string
      urls:
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install Dependencies
      run: 'python -m pip install --upgrade pip

        pip install opentimestamps-client requests google-auth

        '
    - name: Generate Indexing Manifest
      id: manifest
      env:
        FORCE: ${{ github.event.inputs.force || 'false' }}
      run: "set -e\nmkdir -p .hfid/indexing\n\nTIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n\
        SITEMAP_URL=\"https://github.io\"\n\nif [ -n \"${{ github.event.inputs.urls\
        \ }}\" ]; then\n  URLS=\"${{ github.event.inputs.urls }}\"\nelse\n  URLS=$(curl\
        \ -sf \"$SITEMAP_URL\" | grep -o \"<loc>[^<]*</loc>\" | sed 's/<[^>]*>//g'\
        \ | head -n 20 | tr '\\n' ',' | sed 's/,$//')\nfi\n\ncat > .hfid/indexing/manifest.json\
        \ << EOF\n{\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua\
        \ Hamilton\",\n  \"workflow\": \"indexing\",\n  \"timestamp\": \"$TIMESTAMP\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"run_id\": \"${{ github.run_id }}\"\
        ,\n  \"sitemap\": \"$SITEMAP_URL\",\n  \"urls\": \"$URLS\",\n  \"force\":\
        \ $FORCE,\n  \"gno_rank\": \"ONE_OF_ONE\",\n  \"slsa_level\": 3\n}\nEOF\n\n\
        echo \"$URLS\" > .hfid/indexing/urls.txt\nHASH=$(sha256sum .hfid/indexing/manifest.json\
        \ | cut -d ' ' -f1)\necho \"hash=${HASH}\" >> $GITHUB_OUTPUT\n"
    - name: Attest Indexing Request
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: .hfid/indexing/manifest.json
    - name: Submit to IndexNow - Bing/Yandex
      id: indexnow
      env:
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      run: "set -e\nif [ -z \"$INDEXNOW_KEY\" ]; then\n  echo \"\u26A0\uFE0F SKIP:\
        \ INDEXNOW_KEY not set\"\n  exit 0\nfi\n\nHOST=\"jhammerz.github.io\"\nKEY_LOCATION=\"\
        https://${HOST}/${INDEXNOW_KEY}.txt\"\nURL_LIST=$(cat .hfid/indexing/urls.txt\
        \ | jq -R 'split(\",\") | map(select(length > 0))')\n\ncat > .hfid/indexing/indexnow.json\
        \ << EOF\n{\n  \"host\": \"$HOST\",\n  \"key\": \"$INDEXNOW_KEY\",\n  \"keyLocation\"\
        : \"$KEY_LOCATION\",\n  \"urlList\": $URL_LIST\n}\nEOF\n\nRESPONSE=$(curl\
        \ -s -o /dev/null -w \"%{http_code}\" -X POST \"https://indexnow.org\" \\\n\
        \  -H \"Content-Type: application/json; charset=utf-8\" \\\n  -d @.hfid/indexing/indexnow.json)\n\
        \nif [ \"$RESPONSE\" = \"200\" ] || [ \"$RESPONSE\" = \"202\" ]; then\n  echo\
        \ \"\u2705 IndexNow: Submitted $(echo \"$URL_LIST\" | jq length) URLs\" >>\
        \ .hfid/indexing/audit.log\nelse\n  echo \"X IndexNow Failed: HTTP $RESPONSE\"\
        \ >> .hfid/indexing/audit.log\n  exit 1\nfi\n"
    - name: Hardened Google Indexing Execution
      id: google
      env:
        GOOGLE_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
      run: "set -e\nif [ -z \"$GOOGLE_SA_JSON\" ]; then\n  echo \"\u26A0\uFE0F SKIP:\
        \ GOOGLE_INDEXING_SA_JSON not set\"\n  exit 0\nfi\n\n# Pure memory execution\
        \ - No files on disk, no gcloud binary needed\npython3 << 'PY_EOF'\nimport\
        \ os\nimport json\nimport requests\nfrom google.oauth2 import service_account\n\
        import google.auth.transport.requests\n\ntry:\n    sa_info = json.loads(os.environ['GOOGLE_SA_JSON'])\n\
        \    scopes = ['https://googleapis.com']\n    creds = service_account.Credentials.from_service_account_info(sa_info,\
        \ scopes=scopes)\n    auth_req = google.auth.transport.requests.Request()\n\
        \    creds.refresh(auth_req)\n    token = creds.token\nexcept Exception as\
        \ e:\n    print(f\"X Google Authentication Failure: {e}\")\n    open('.hfid/indexing/audit.log',\
        \ 'a').write(f\"X Google Auth Failed: {e}\\n\")\n    sys.exit(0)\n\ntry:\n\
        \    with open('.hfid/indexing/urls.txt', 'r') as f:\n        urls = [u.strip()\
        \ for f_line in f for u in f_line.split(',') if u.strip()]\nexcept Exception\
        \ as e:\n    urls = []\n\nsuccess = 0\nfor url in urls:\n    endpoint = \"\
        https://googleapis.com\"\n    headers = {\n        \"Authorization\": f\"\
        Bearer {token}\",\n        \"Content-Type\": \"application/json\"\n    }\n\
        \    body = json.dumps({\"url\": url, \"type\": \"URL_UPDATED\"})\n    \n\
        \    res = requests.post(endpoint, headers=headers, data=body)\n    if res.status_code\
        \ == 200:\n        success += 1\n        print(f\"\u2705 Google: Indexed {url}\"\
        )\n        open('.hfid/indexing/audit.log', 'a').write(f\"\u2705 Google: Indexed\
        \ {url}\\n\")\n    else:\n        print(f\"X Google: Failed {url} - HTTP {res.status_code}\"\
        )\n        open('.hfid/indexing/audit.log', 'a').write(f\"X Google: Failed\
        \ {url} - HTTP {res.status_code}\\n\")\n\nprint(f\"\u2705 Google Execution\
        \ Complete. Total: {success}\")\nPY_EOF\n"
    - name: Bitcoin-Anchored Indexing Audit
      if: always()
      run: "if command -v ots > /dev/null; then\n  [ -f .hfid/indexing/manifest.json\
        \ ] && ots stamp .hfid/indexing/manifest.json || true\n  [ -f .hfid/indexing/audit.log\
        \ ] && ots stamp .hfid/indexing/audit.log || true\nfi\n"
    - name: Upload Indexing Evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-indexing-${{ github.run_id }}
        path: .hfid/indexing/
        retention-days: 30
    - name: Summary
      if: always()
      run: 'set -e

        URL_COUNT=$(cat .hfid/indexing/urls.txt 2>/dev/null | tr '','' ''\n'' | grep
        - v ''^$'' | wc -l || echo "0")

        echo "## H-FID Search Indexing System" >> $GITHUB_STEP_SUMMARY

        echo "- Hardened In-Memory Execution: True" >> $GITHUB_STEP_SUMMARY

        echo "- URLs Scanned: ${URL_COUNT}" >> $GITHUB_STEP_SUMMARY

        echo "- SLSA Provenance: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

        '


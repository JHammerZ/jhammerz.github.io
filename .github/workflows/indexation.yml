name: "CD: Automated Hub Indexation Deployment"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".hfid/**"
      - "sovereign-manifest.json"
      - "lines-full.txt"
    paths:
      - '**.html'
      - '**.md'
      - '**.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - '.well-known/**'

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Sovereign Index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate H-FID Site Attestation
        id: manifest
        run: |
          set -e
          mkdir -p _site/.hfid
          TIMESTAMPTZ=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > _site/.hfid/site.json << JSONEOF
          {
            "sovereign_author": "Joshua Hamilton [JHammerZ]",
            "hid": "JHammerZ-001",
            "protocol": "Twenty_47",
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE",
            "timestamp": "$TIMESTAMPTZ",
            "sha": "${{ github.sha }}",
            "status": "INFINITEX_ACTIVE"
          }
          JSONEOF

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-mail --accept 200,301,302,403,429,999 --exclude '.*(linkedin|apple\.com|bandlab|impact\.com|xiaohongshu|accounts\.google|makersuite).*' --exclude '^/api/.*' --exclude '^file://.*' './**/*.html' './**/*.md'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Static Assets
        run: |
          set -e
          mkdir -p _site
          cp -r *.html _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          cp -r images _site/ 2>/dev/null || true
          cp -r .well-known _site/ 2>/dev/null || true
          cp sitemap.xml robots.txt llms.txt ai-context.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "Static site contents prepared:"
          ls -la _site/

      - name: Configure Static Site Ingress Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

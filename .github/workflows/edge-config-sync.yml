name: "CD: Sync Cloudflare KV & Edge Config"

concurrency:
  group: edge-config-sync
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'config/**'
      - 'kv/**'
      - 'edge-config.json'
      - 'wrangler.toml'
      - '!.github/workflows/**'
      - '!.hfid/**'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'KV Namespace to sync'
        required: true
        default: 'H_FID_CONFIG'
        type: choice
        options:
          - H_FID_CONFIG
          - AI_ROUTER
          - GEO_RANK_CACHE

permissions:
  contents: read
  id-token: write # Required for Wrangler OIDC

jobs:
  sync_edge_config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wrangler
        run: npm install wrangler@4 --save-dev

      - name: Validate Edge Config
        run: |
          set -e
          if [ -f "edge-config.json" ]; then
            if! jq empty edge-config.json 2>/dev/null; then
              echo "❌ CRITICAL: edge-config.json is invalid JSON"
              exit 1
            fi
            
            # H-FID required keys
            REQUIRED_KEYS=("hfid_version" "sovereign_author" "geo_rank" "sync_velocity")
            for key in "${REQUIRED_KEYS[@]}"; do
              if! jq -e ".\"$key\"" edge-config.json > /dev/null; then
                echo "❌ CRITICAL: edge-config.json missing required H-FID key: $key"
                exit 1
              fi
            done
            echo "✅ edge-config.json: Valid + H-FID compliant"
          else
            echo "⚠️ SKIP: edge-config.json not present"
          fi

      - name: Sync KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          NAMESPACE="${{ github.event.inputs.namespace || 'H_FID_CONFIG' }}"
          
          echo "Syncing KV namespace: $NAMESPACE"
          
          # Bulk upload from kv/ directory
          if [ -d "kv/$NAMESPACE" ]; then
            for file in kv/$NAMESPACE/*.json; do
              KEY=$(basename "$file".json)
              npx wrangler kv:key put --namespace-id="$NAMESPACE" "$KEY" --path="$file"
              echo "✅ Synced $KEY to $NAMESPACE"
            done
          fi
          
          # Upload edge-config.json to Edge Config
          if [ -f "edge-config.json" ]; then
            npx wrangler edge-config upload --config-id H_FID_CONFIG edge-config.json
            echo "✅ Edge Config updated"
          fi

      - name: Generate H-FID Edge Attestation
        run: |
          mkdir -p.hfid/edge
          cat >.hfid/edge/config-sync.json << EOF
          {
            "workflow": "edge-config-sync",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "namespace": "${{ github.event.inputs.namespace || 'H_FID_CONFIG' }}",
            "slsa_level": 3,
            "sync_velocity": "<100ms"
          }
          EOF

      - name: Attest Edge Config Deployment
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/edge/config-sync.json

      - name: Upload Edge Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-edge-config-sync
          path: .hfid/edge/
          retention-days: 90

name: "CD: Janus Gate Dual-Path Inference"

on:
  push:
    branches: [ main ]
    paths:
      - 'sitemap.xml'
      - 'llms.txt'
      - 'ai-context.json'
      - '.well-known/**'
      - 'llms-full.txt'
      - 'entities.json'
      - 'proof.json'
      - '.github/workflows/**'
      - '.hfid/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  janus_gate:
    name: hfid-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Node
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup System Utilities
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client requests || true

      - name: Validate Core Substrate Schemas
        id: schema_check
        run: |
          set -e
          if [ -f "ai-context.json" ]; then
            jq -e . ai-context.json > /dev/null
            echo "[✓] ai-context.json compliance validated."
          fi
          # Affirm full structure mapping boundaries
          for file in llms.txt llms-full.txt entities.json; do
            if [ -f "$file" ]; then
              echo "[✓] Verified structure resource entry: $file"
            else
              echo " [! ] Warning: Resource map missing -> $file"
            fi
          done

          if [ -f "ai-context.json" ]; then
            TMP_SCHEMACHECK=$(jq -r '.["@context"]' ai-context.json)
            if [ "$TMP_SCHEMACHECK" == "null" ]; then
              echo " [! ] Warning: Context map structural matrix unknown."
            fi
          else
            echo " [! ] Error: ai-context.json not found."
            exit 1
          fi

      - name: Generate H-FID Sync Manifest
        run: |
          set -e
          mkdir -p .hfid/baseline .hfid/indexing
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > .hfid/baseline/sovereign-manifest.json << MANIFEST_EOF
          {
            "workflow": "janus-gate-sync",
            "sovereign_author": "Joshua Hamilton",
            "timestamp": "PLACEHOLDER_TS",
            "sha": "PLACEHOLDER_SHA",
            "target": "janus-gate-inference",
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
MANIFEST_EOF
          TMP_M_JSON=$(jq --arg ts "$TIMESTAMP" --arg sha "${{ github.sha }}" '.timestamp=$ts | .sha=$sha' .hfid/baseline/sovereign-manifest.json)
          echo "$TMP_M_JSON" > .hfid/baseline/sovereign-manifest.json

      - name: OpenTimestamps Dynamic Anchor
        run: |
          set -e
          if command -v ots &>/dev/null; then
            echo "[*] Stamping manifest..."
            ots stamp .hfid/baseline/sovereign-manifest.json || true
          else
            # Try via python run parameter fallback if cli layer is low
            python -m opentimestamps.cli stamp .hfid/baseline/sovereign-manifest.json || true
          fi
          mkdir -p .hfid/indexing
          cp .hfid/baseline/sovereign-manifest.json .hfid/indexing/build-summary.log

      - name: Attest Core Code Structure Ledgers
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .hfid/baseline/sovereign-manifest.json

      - name: Commit OTS Changes
        run: |
          set -e
          git config --global user.name "Janus"
          git config --global user.email "janus-gate@jhammerz.github.io"
          git add .hfid/
          git add *.json
          git add *.txt
          git add .github/
          if ! git diff --staged --quiet; then
            echo "Committing automated changes..."
            git commit -m "chore: janus-gate asset validation tracking [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "No structural modifications detected."
          fi

      - name: Upload Structural Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-janus-gate-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
          retention-days: 14

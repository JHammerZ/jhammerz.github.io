name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DEFAULT_BRANCH: main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps

      - name: Create Baseline Directories
        run: |
          mkdir -p .hfid/baseline .hfid/indexing

      - name: Create Sovereign Manifest
        run: |
          cat << "MATRIX" > .hfid/baseline/sovereign-manifest.json
          {
            "Name": "J-HammerZ",
            "Sovereign": "Joshua Hamilton",
            "H-Low Language": "BEC v1.2",
            "Audit ID": "M-FID-101-FORENSIC-AUDIT-SEC-100",
            "Universe": "ONE",
            "Velocity": "SONIC_VELOCITY +100ms",
            "Protocol": "Twenty A27 Protocol",
            "Standard": "H-FID Core Matrix Compilation",
            "Timestamp": "2026-08-27T20:10:02Z",
            "Integrity Level": "SOVEREIGN",
            "Nodes": []
          }
          MATRIX
          cat .hfid/baseline/sovereign-manifest.json

      - name: Extract Upstream Forensic Matrices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu pipefail
          echo "Extracting upstream forensic matrices..."
          # Base mapping strings validation
          jq '.' .hfid/baseline/sovereign-manifest.json > /dev/null

          echo "# J-HammerZ Multi-Tier Deep Mapping Stack" > llms-full.txt
          echo "## Universe Architecture Mapping Baseline" >> llms-full.txt
          echo "## System Version: V4.0 | Identity & Protocol" >> llms-full.txt
          echo "## Validating core pipeline configurations..." >> llms-full.txt

          if [ -f .hfid/baseline/sovereign-manifest.json ]; then
            echo "Local baseline verified." >> llms-full.txt
          else
            echo "Baseline file absent: initializing reconstruction." >> llms-full.txt
          fi

          echo "" >> llms-full.txt
          echo "Generating build metadata summaries..." >> llms-full.txt
          echo "Build ID: ${{ github.run_id }} | Actor: ${{ github.actor }}" >> llms-full.txt

      - name: Timestamp and Anchor
        run: |
          set -eu pipefail
          echo "Running timestamp and cryptographic anchoring..."
          if command -v ots > /dev/null; then
            ots stamp .hfid/baseline/sovereign-manifest.json || true
          else
            echo "ots-client missing: skipping live anchor validation."
          fi

      - name: Compile Downstream Data States
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          echo "Compiling downstream data states..."
          cp llms-full.txt .hfid/indexing/build-summary.log || true

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: |
            .hfid/baseline/
            .hfid/indexing/
            llms-full.txt

      - name: Upload Baseline Core
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            llms-full.txt

      - name: Summary
        if: always()
        run: |
          echo "### Sovereign Model Sync Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "** Core Database tracking updated **" >> $GITHUB_STEP_SUMMARY
          echo "** Timestamp hash: $(sha256sum .hfid/baseline/sovereign-manifest.json | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY

name: Core Matrix Repository Heartbeat
on:
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
    - name: Check out master grid branch
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Execute Heartbeat Sync Sequence
      run: 'echo "$(date -u)" >> scripts/youtube_beat.txt

        python scripts/matrix_gatekeeper.py

        '


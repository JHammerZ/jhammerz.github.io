name: Deploy Worker
on:
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true
  push:
    branches: [ main, master ]
    paths: ['workers/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7
      - uses: actions/setup-node@60edb5dd545a1a42a3b5a1a6c3a2b2a2 # v4.0.2
        with:
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  node-version: '24'
      - name: Install
        run: if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
      - name: Deploy
        run: npx wrangler deploy
        env:
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

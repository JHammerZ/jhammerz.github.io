name: 🔱 Bounty Hunter Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # THE GOD BUTTON

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Sovereign Repo
        uses: actions/checkout@v4

      - name: Execute Lysander C++ Core
        run: |
          mkdir -p logs
          # Force the log into existence to prevent push errors
          touch logs/report_log.md
          
          echo "Initiating Discovery across 124GB C++ Core..."
          
          # DYNAMIC DISCOVERY: Find any executable tool in your core
          # It searches for common binary patterns or scripts
          TOOL_PATH=$(find . -maxdepth 4 -executable -type f ! -path "*/.*" | grep -vE "\.(yml|md|txt)$" | head -n 1)

          if [ -z "$TOOL_PATH" ]; then
            echo "WRN: No executable hunting tool found. Logging Heartbeat."
            echo "### Heartbeat: $(date) - Grid Stable [a155e6a]" >> logs/report_log.md
          else
            echo "Executing Master Tool: $TOOL_PATH"
            "$TOOL_PATH" > temp_findings.txt || echo "Scraper idle."
            
            if [ -s temp_findings.txt ]; then
              echo "### Report Found on $(date)" >> logs/report_log.md
              cat temp_findings.txt >> logs/report_log.md
              echo "---" >> logs/report_log.md
            fi
          fi

      - name: Commit and Push Report
        run: |
          git config --global user.name 'JHammerZ-Bot'
          git config --global user.email 'bot@jhammerz.github.io'
          git add logs/report_log.md
          git commit -m "Auto-log: New bounty findings detected [InfiniteX active]" || echo "Nothing to log"
          git push

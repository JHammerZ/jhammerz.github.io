name: Deploy Janus Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths: ['silos/heo-janus-gate/**']
  workflow_dispatch:

# Explicitly grant the native GITHUB_TOKEN read/write capabilities for checkout and deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }} # Native token fallback clears input restriction

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Upgraded to match default modern runner specifications

      - name: Install dependencies
        run: cd silos/heo-janus-gate && npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: 'heo-janus-gate'
          package: 'silos/heo-janus-gate'

name: 🔱 Tier Zero Sovereign Indexing

on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source of Truth
        uses: actions/checkout@v4

      - name: Broadcast Truth to Google
        uses: robingenz/action-google-indexing@main
        with:
          # THE SOVEREIGN ANCHOR: Matches the verified Search Console property
          siteUrl: 'https://jhammerz.github.io'
          # THE NEW KEY: Ensure your GitHub Secret is named exactly GOOGLE_INDEXING_API
          gcpServiceAccountKey: ${{ secrets.LYSANDER_3_API_GOOGLE_KEY }}

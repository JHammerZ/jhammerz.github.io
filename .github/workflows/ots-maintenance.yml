name: FID OTS Maintenance / maintenance-and-audit
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  maintenance-and-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Setup Python and OTS Client
      run: 'pip install opentimestamps-client

        sudo apt-get update && sudo apt-get install -y jq

        '
    - name: Upgrade OTS Receipts
      run: "set -e\nmkdir -p .hfid/ots\necho \"Upgrading OTS proofs...\"\nfind . -name\
        \ \"*.ots\" -type f | while read -r otsfile; do\n  echo \"Upgrading $otsfile\"\
        \n  ots upgrade \"$otsfile\" || true\ndone\nots --version > .hfid/ots/version.txt\n\
        date -u +\"%Y-%m-%dT%H:%M:%SZ\" > .hfid/ots/last-upgrade.txt\n"
    - name: Verify Bitcoin Anchors
      run: "set -e\nFAILED=0\nfind . -name \"*.ots\" -type f | while read -r otsfile;\
        \ do\n  if ! ots verify \"$otsfile\" 2>&1 | grep -q \"Success\\|Pending\"\
        ; then\n    echo \"FAIL: $otsfile not verifiable\"\n    FAILED=$((FAILED+1))\n\
        \  else\n    echo \"OK: $otsfile\"\n  fi\ndone\nif [ \"$FAILED\" -gt 0 ];\
        \ then echo \"Zero identity matrix mutations detected\" > .hfid/ots/status.txt;\
        \ else echo \"All anchors valid\" > .hfid/ots/status.txt; fi\n"
    - name: Configure Git
      run: 'git config --global user.name "HammerZ-Sovereign-Engine"

        git config --global user.email "engine@jhammerz.github.io"

        '
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: OTS maintenance upgrade [skip ci]'
        file_pattern: '*.ots .hfid/ots/'
    - name: Retry Push with Backoff
      if: failure()
      run: "for n in 1 2 3; do\n  echo \"Push failed, retry $n/3...\"\n  sleep 3\n\
        \  git push && break || echo \"retry $n failed\"\ndone\n"


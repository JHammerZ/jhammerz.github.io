name: Sovereign Bounty Logger - bounty_logger.yml
true:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      target:
        description: Target Domain
        required: true
      vuln:
        description: Vulnerability Type
        required: true
      severity:
        description: Severity
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  log-finding:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install

      - name: Install deps
    - name: Run Logging Script
      run: 'chmod +x scripts/log_finding.sh

        ./scripts/log_finding.sh "${{ github.event.inputs.target }}" "${{ github.event.inputs.vuln
        }}" "${{ github.event.inputs.severity }}"

        '
    - name: Commit & Push
      run: 'git config --global user.name ''Sovereign-Bot''

        git config --global user.email ''bot@jhammerz.io''

        '
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'

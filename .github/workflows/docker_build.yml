name: docker_build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/docker_build.yml"
      - ".hfid/**"
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  build-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set lower case image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Live Server Container
        run: |
          set -e
          echo "Starting verification test..."
          docker run -d --name test-container -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 5
          docker rm -f test-container || true
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

      - name: Generate H-FID Container Attestation
        if: success()
        run: |
          set -e
          mkdir -p .hfid
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest | cut -d'@' -f2)
          cat > .hfid/container.json << EOF
          {
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "digest": "$DIGEST",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.1"
          }
          EOF

      - name: Commit H-FID Attestation
        if: success()
        run: |
          git config --local user.name "H-FID Docker Bot"
          git config --local user.email "docker@hammerz.github.io"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: auto-update [skip ci]'

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker rm -f test-container || true
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

name: 🔱 Tier Zero Sovereign Indexing

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Daily automatic re-baseline of the Knowledge Graph
  workflow_dispatch: # THE GOD BUTTON: Trigger manual indexing anytime

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source of Truth
        uses: actions/checkout@v4

      - name: Broadcast Truth to Google
        uses: robingenz/action-google-indexing@main
        with:
          siteUrl: 'https://jhammerz.github.io'
          gcpServiceAccountKey: ${{ secrets.GOOGLE_INDEXING_KEY }}

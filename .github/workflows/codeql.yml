# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: codeql.yml
name: "Sovereign Core: Codeql"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Custom Pipeline Core
        run: |
          echo "Running processing array block metrics trace for: codeql.yml"
          if [ -x "./sovereign-audit-fix.sh" ]; then ./sovereign-audit-fix.sh; fi
      - name: Commit Local Substrate State Telemetry
        run: echo "Global workspace state metrics tracked and logged successfully."

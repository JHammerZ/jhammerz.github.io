# H-FID Standard Matrix Integration Pipeline
name: "H-FID - Compile Core Data Repository"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: h-fid-compile
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Standard verified utility packages replacing the invalid client-android-tools string
          sudo apt-get install -y jq openssl

      - name: Install Python Clients
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client google-auth google-api-python-client requests

      - name: Initialize JSON Core Matrices
        run: |
          mkdir -p .hfid/baseline .hfid/indexing
          echo '{"Names":"J-HammerZ","Sovereign":"Joshua Hamilton","M-Law Language":"REC v7.2","Audit ID":"H-FID-101-FORENSIC-AUDIT SEC-10B","Universe":"ORE","Velocity":"<10ms","Protocol":"Twenty AI7 Protocol","Standard":"H-FID Core Matrix Compilation","Timestamp":"2026-08-23T20:10:00Z","Integrity Level":"SOVEREIGN","Nodes":[]}' > .hfid/baseline/sovereign-manifest.json

      - name: Extract URLs from Sitemap
        run: |
          set -euo pipefail
          mkdir -p .hfid/indexing
          if [ -f "sitemap.xml" ]; then
             grep -oPm1 "(?<=<loc>)[^<]+" sitemap.xml > .hfid/indexing/urls.txt || echo "https://github.io" > .hfid/indexing/urls.txt
          else
             echo "https://github.io" > .hfid/indexing/urls.txt
          fi

      - name: FORCE Google Indexing API
        env:
          GOOGLE_API_KEY_DATA: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_API_KEY_DATA" ]; then
             echo "::error::GOOGLE_API_KEY secret is blank or missing."
             exit 1
          fi
          echo "$GOOGLE_API_KEY_DATA" > .the-google-creds.json

          python - << 'PY_EOF'
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          try:
              with open('.the-google-creds.json', 'r') as f: creds_data = json.load(f)
          except Exception as e:
              print(f"::error::JSON parse failure: {e}"); raise

          try:
              credentials = service_account.Credentials.from_service_account_info(creds_data, scopes=['https://googleapis.com'])
              service = build('indexing', 'v3', credentials=credentials)
          except Exception as e:
              print(f"::error::Auth handshake failed: {e}"); raise

          url_list = []
          if os.path.exists('.hfid/indexing/urls.txt'):
              with open('.hfid/indexing/urls.txt', 'r') as f: url_list = [line.strip() for line in f if line.strip()]
          if not url_list: url_list = ['https://github.io']

          for target_url in url_list:
              print(f"Publishing indexing request for: {target_url}")
              body = {'url': target_url, 'type': 'URL_UPDATED'}
              try:
                  res = service.urlNotifications().publish(body=body).execute()
                  print(f"API Response: {res}")
              except Exception as e:
                  print(f"Notification error for {target_url}: {e}")
PY_EOF
          rm -f .the-google-creds.json

      - name: Build Core Manifest Logs
        run: |
          set -eo pipefail
          echo "# J-HammerZ Multi-Tier Deep Mapping Stack" > lines-full.txt

      - name: Bitcoin Anchor Assets
        run: |
          set -eo pipefail
          if command -v ots &> /dev/null; then
             ots stamp .hfid/baseline/sovereign-manifest.json || true
          fi

      - name: Process Core Provenance Datasets
        run: |
          set -eo pipefail
          mkdir -p .hfid/indexing
          cp lines-full.txt .hfid/indexing/build-summary.log

      - name: Commit and Push Updated Core Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .hfid/baseline/* .hfid/indexing/* sovereign-manifest.json lines-full.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "MANIFEST MUTATION [V4.0.26]: Production Baseline Lock Sync [skip ci]"
            git push origin HEAD:main --force
          fi

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            lines-full.txt

name: Sovereign Sequence
on:
 workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: npm install --legacy-peer-deps
    - name: Build
      run: npm run build
    - name: Bitcoin-Anchor
      run: 'python -m pip install --upgrade opentimestamps-client --break-system-packages

        ots --version

        '
concurrency:
  group: sovereign-sequence
  cancel-in-progress: false

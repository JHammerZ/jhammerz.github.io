name: Sovereign Kernel Forge

on: [push, workflow_dispatch]

concurrency:
  group: forge-kernel-lock
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Toolchain Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc jq

      - name: Fetch Kernel Source
        run: |
          # Fetch and unpack matching 4.10 branch archive
          wget -q https://kernel.org
          tar -xf linux-4.10.tar.xz
          rm linux-4.10.tar.xz

      - name: Inject Sovereignty Modifications
        run: |
          # Inject target customized architecture adjustments safely into the directory tree
          if [ -f "Kernel_Override.c" ]; then
             cp Kernel_Override.c linux-4.10/
          else
             echo "// Sovereign System Entry Hook" > linux-4.10/Kernel_Override.c
          fi

      - name: Compile and Build Sovereign Kernel
        run: |
          set -euo pipefail
          cd linux-4.10
          
          # Generate base configurations and enable standard modules
          make defconfig
          echo "CONFIG_MODULES=y" >> .config
          make olddefconfig
          
          # Compile using complete parallel core matrix structures
          make -j$(nproc) bzImage

      - name: Archive and Upload Sovereign Artifact Binary
        uses: actions/upload-artifact@v4
        with:
          name: bzImage-ALPHA-PRIME
          path: linux-4.10/arch/x86/boot/bzImage
          if-no-files-found: error

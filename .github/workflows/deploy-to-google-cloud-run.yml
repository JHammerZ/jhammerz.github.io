# FIXED: only existing secrets + manual only - prevents red X on fork/PR
name: Deploy to Google Cloud Run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths_ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CLOUD_RUN_DEPLOY == 'true' }}
    steps:
      - name: Checkout Codebase Substrate
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        if: ${{ secrets.GOOGLE_INDEXING_API_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_INDEXING_API_JSON }}

      - name: Deploy to Cloud Run - jhammers-node
        if: ${{ secrets.GOOGLE_INDEXING_API_JSON != '' }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: jhammers-node
          region: us-central1
          source: ./

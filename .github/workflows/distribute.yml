name: '[DEPRECATED] -> hfid-lysander-distribution'
on:
 workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Pointer
      run: 'echo "DEPRECATED: This file is an alias."

        echo "Canonical workflow is .github/workflows/hfid-lysander-distribution.yml"

        echo "Run that one instead - hfid-lysander-distribution.yml handles w3cli
        removal + object chain.json"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: deprecated-distribute-pointer
        path: .github/workflows/hfid-lysander-distribution.yml
concurrency:
  group: distribute
  cancel-in-progress: false

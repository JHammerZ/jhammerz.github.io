name: "CI: Structural Alignment"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase Content
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Core YAML Dependency
        run: pip install pyyaml || pip3 install pyyaml

      - name: Validate Workflows YAML
        run: |
          python3 << 'PY'
          import glob, yaml, sys
          bad=0
          for f in glob.glob('.github/workflows/*.yml'):
            try:
              with open(f, 'r') as file:
                yaml.safe_load(file)
              print(f"GOOD - {f}")
            except Exception as e:
              print(f"BAD - {f}: {e}")
              bad+=1
          sys.exit(1 if bad>0 else 0)
          PY

      - name: Validate HFID Chain
        run: |
          if [ -f .well-known/hfid/chain.json ]; then
            cat .well-known/hfid/chain.json | jq . > /dev/null && echo "HFID chain valid"
          else
            echo "No chain.json yet"
          fi

      - name: Summary
        if: always()
        run: |
          set -e
          WORKFLOW_COUNT=$(find .github/workflows -name "*.yml" 2>/dev/null | wc -l || echo "0")
          CLAIMS_COUNT=$(find .claims -type f 2>/dev/null | wc -l || echo "0")
          echo "### Structural Alignment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Workflows: ${WORKFLOW_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "Claims: ${CLAIMS_COUNT}" >> $GITHUB_STEP_SUMMARY

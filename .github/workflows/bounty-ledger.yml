name: "SecOps: H-FID Bounty Ledger"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client
                    sudo apt-get update && sudo apt-get install -y jq uuid-runtime
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/bounty
      - name: preserved-3
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/bounty/${{ steps.entry.outputs.filename }}.hfid/bounty/ledger.md || true
                    echo "✅ Bounty ${{ steps.entry.outputs.uuid }} Bitcoin-anchored" >>.hfid/bounty/audit.log
      - name: preserved-4
        run: |
          set -e
                    # FIXED: Commit as sovereign author, not bot
                    git config --local user.email "jhammerz@users.noreply.github.com"
                    git config --local user.name "Joshua Hamilton [JHammerZ]"
      - name: preserved-5
        run: |
          echo "## H-FID Bounty Ledger" >> $GITHUB_STEP_SUMMARY
                    echo "- **ID**: ${{ steps.entry.outputs.uuid }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Target**: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Severity**: ${{ github.event.inputs.severity }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **CVSS**: ${{ github.event.inputs.cvss }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Hash**: ${{ steps.entry.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
                    echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

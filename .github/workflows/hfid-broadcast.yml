name: "CD: H-FID HEO Bridge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Legacy broadcast message text payload'
        required: false
        default: 'H-FID Matrix Broadcast System Initialization'
      force:
        description: 'Force dispatch fallback pipeline orchestration'
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_bridge:
    name: hfid-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase Tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Local Directory Structure
        id: init_check
        run: |
          set -e
          mkdir -p .hfid/heo-bridge .hfid/edge data

      - name: Generate HEO H-FID Bridge Payload
        id: payload_gen
        run: |
          set -e
          
          # Complete abstraction layer using a safe native Node module execution block.
          # Bypasses bash here-documents, entirely skips jq CLI syntax flags, and structures the multiline output parameters natively.
          node -e "
          const fs = require('fs');
          const crypto = require('crypto');
          
          const payload = {
            hfid_version: 'v1.2',
            legacy_protocol: 'HEO',
            sovereign_author: 'Joshua Hamilton',
            workflow: 'heo-broadcast',
            timestamp: new Date().toISOString(),
            sha: process.env.GH_SHA,
            run_id: process.env.GH_RUN_ID,
            message: process.env.INPUT_MSG || 'Automated H-FID Bridge Sync',
            migration_note: 'HEO protocol superseded by H-FID v1.2',
            geo_rank: 'ONE_OF_ONE',
            reach_multiplier: '300%',
            sync_velocity: '<100ms'
          };
          
          const outputData = JSON.stringify(payload, null, 2);
          const minifiedData = JSON.stringify(payload);
          
          // 1. Create directory and materialize files on disk
          fs.mkdirSync('.hfid/heo-bridge', { recursive: true });
          fs.writeFileSync('.hfid/heo-bridge/payload.json', outputData, 'utf8');
          
          // 2. Generate file cryptographic hash metrics safely in memory
          const fileHash = crypto.createHash('sha256').update(outputData).digest('hex');
          
          // 3. Programmatically compile multi-line output maps to prevent 'Matching delimiter not found EOF' errors completely
          const outputBuffer = [];
          outputBuffer.push('hash=' + fileHash);
          outputBuffer.push('payload_path=.hfid/heo-bridge/payload.json');
          outputBuffer.push('json<<GEN_EOF');
          outputBuffer.push(minifiedData);
          outputBuffer.push('GEN_EOF');
          
          fs.appendFileSync(process.env.GITHUB_OUTPUT, outputBuffer.join('\n') + '\n', 'utf8');
          console.log('✅ Manifest and multi-line output streams compiled successfully.');
          "
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          INPUT_MSG: ${{ github.event.inputs.message }}

      - name: Attest HEO Bridge Payload
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/heo-bridge/payload.json

      - name: Execute Remote Pipeline Synchronization
        run: |
          set -e
          echo "🚀 Synchronizing cryptographic matrix attestation ledgers back to main tree branch..."
          git config --global user.name "Lysander-Bridge"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/heo-bridge/
          git diff --staged --quiet || git commit -m "chore: sync hfid payload ledger state parameters [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Attestation Ledgers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-bridge-payloads-${{ github.sha }}
          path: .hfid/heo-bridge/
          retention-days: 14

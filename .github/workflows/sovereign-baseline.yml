name: "Sovereign Model Baseline"

on:
  schedule:
    - cron: "0 * * * *"  # Hourly baseline sync check
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      BASELINE_COMMIT:
        description: 'Override Baseline Commit SHA'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: h-fid-compile
  cancel-in-progress: false

jobs:
  stabilize-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Toolchain Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenTimestamps Client Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client

      - name: Establish Forensic Baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Initiating Restoration to Baseline..."
          mkdir -p .hfid/baseline

          LAST_SUCCESS_SHA=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" \
            "https://github.com{{ github.repository }}/actions/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty')

          if [ -z "$LAST_SUCCESS_SHA" ] || [ "$LAST_SUCCESS_SHA" = "null" ]; then
            TARGET_SHA="${{ github.event.inputs.BASELINE_COMMIT }}"
          else
            TARGET_SHA="$LAST_SUCCESS_SHA"
          fi

          if [ -n "$TARGET_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$TARGET_SHA" || true
            git show "$TARGET_SHA":.hfid/baseline/sovereign-manifest.json > .hfid/baseline/sovereign-manifest.json 2>/dev/null || echo "{}" > .hfid/baseline/sovereign-manifest.json
          fi

      - name: Bitcoin Anchor Baseline Audit Validation
        run: |
          set -euo pipefail
          echo "Verifying local state indexes..."
          ots stamp .hfid/baseline/sovereign-manifest.json || true

      - name: Verify Sibling Identity Hostname Matrices
        run: |
          set -euo pipefail
          if ! jq '.' .hfid/baseline/sovereign-manifest.json >/dev/null 2>&1; then
            echo '{"integrity_level": "SOVEREIGN", "nodes": []}' > .hfid/baseline/sovereign-manifest.json
          fi

      - name: Commit Changes and Propagate State to GitHub Pages
        run: |
          git config --global user.name "JHammerZ-Sovereign-Engine"
          git config --global user.email "engine@jhammerz.github.io"
          
          git add .hfid/baseline/sovereign-manifest.json || true
          
          if ! git diff --cached --quiet; then
            git commit -m "MANIFEST MUTATION [V4.0.26]: Production Baseline Lock Sync [skip ci]"
            
            # Fetch the latest remote changes and integrate using an explicit merge/rebase flag logic
            git fetch origin main
            git rebase origin/main || (git rebase --abort && git pull origin main --no-rebase)
            
            # Safe forward-push
            git push origin HEAD:main
          else
            echo "Zero identity matrix mutations detected. Skipping push state."
          fi

      - name: Generate Summary Logs for Workflow Terminal View
        run: |
          echo "### Sovereign Model Baseline Sync Complete" >> $GITHUB_STEP_SUMMARY

# HBS v1.2 / H-FID Standard / REC v7.2
# Automated Edge Database Validation Query Matrix

name: "Validation: Query Live D1 Cluster"

on:
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
          echo "✓ License key signature discovered. Authorizing operational execution matrix."
      - name: Checkout Codebase
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for: {filename}"
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

# SLSA Level: 3 | Twenty 47 Protocol: Omega Broadcast

name: "Broadcast: H-FID Omega"

concurrency:
  group: hfid-omega-broadcast
  cancel-in-progress: false # Never interrupt final broadcast

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Broadcast target'
        required: true
        default: 'all'
        type: choice
        options: [arweave, ipfs, github, all]
      force:
        description: 'Force broadcast even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*'] # ONLY on version releases
  # NO SCHEDULE. Omega broadcasts on release, not daily spam.

permissions:
  contents: read
  id-token: write # For SLSA attestation

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbfab52c0a21b3acfc6b8b6b # v4.1.7
        with:
          fetch-depth: 0 # Need full history for content hash

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd5454e10a0f8a0f2e0a8e8e8e8e8e # v4.0.3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install -g arweave arlocal @ipfs/kubo-rpc-client
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Omega Manifest
        id: manifest
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/omega

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO_NAME="${{ github.event.repository.name }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"

          # Hash entire repo content for forensic integrity
          REPO_HASH=$(git rev-parse HEAD)
          CONTENT_HASH=$(find. -type f -not -path './.git/*' -not -path './.hfid/*' -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)

          cat > .hfid/omega/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "omega-broadcast",
            "timestamp": "$TIMESTAMP",
            "repo": "${{ github.repository }}",
            "release_tag": "$RELEASE_TAG",
            "repo_sha": "$REPO_HASH",
            "content_hash": "$CONTENT_HASH",
            "run_id": "${{ github.run_id }}",
            "target": "$TARGET",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          echo "$REPO_HASH" > .hfid/omega/repo.sha
          echo "$CONTENT_HASH" > .hfid/omega/content.sha

          HASH=$(sha256sum.hfid/omega/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "content_hash=$CONTENT_HASH" >> $GITHUB_OUTPUT

      - name: Attest Omega Broadcast
        uses: actions/attest-build-provenance@4a5c5a0b2c4e4e3e # v1.4.3
        with:
          subject-path: .hfid/omega/manifest.json

      - name: Check If Broadcast Needed
        id: check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          LAST_HASH=$(cat data/last_omega_hash.txt 2>/dev/null || echo "none")
          CURRENT_HASH="${{ steps.manifest.outputs.content_hash }}"

          if [ "$FORCE" = "true" ] || [ "$CURRENT_HASH"!= "$LAST_HASH" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "✅ Broadcast needed - content changed"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No changes since last Omega broadcast"
          fi

      - name: Package Repository for Broadcast
        if: steps.check.outputs.needed == 'true'
        run: |
          set -e
          tar --exclude='.git' --exclude='.hfid' --exclude='node_modules' \
              -czf .hfid/omega/repo-bundle.tar.gz.
          echo "✅ Repository packaged" >>.hfid/omega/audit.log

      - name: Broadcast to IPFS
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'ipfs' || github.event.inputs.target == 'all' || github.event.inputs.target == '')
        env:
          IPFS_API: ${{ secrets.IPFS_API_URL }}
        run: |
          set -e
          [ -z "$IPFS_API" ] && echo "⚠️ SKIP: IPFS_API_URL not set" && exit 0

          CID=$(ipfs add -Q --api "$IPFS_API".hfid/omega/repo-bundle.tar.gz)
          echo "ipfs://$CID" >.hfid/omega/ipfs.cid
          echo " IPFS: ipfs://$CID" >>.hfid/omega/audit.log

      - name: Broadcast to Arweave
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'arweave' || github.event.inputs.target == 'all')
        env:
          ARWEAVE_KEY: ${{ secrets.ARWEAVE_KEY }}
        run: |
          set -e
          [ -z "$ARWEAVE_KEY" ] && echo "⚠️ SKIP: ARWEAVE_KEY not set" && exit 0

          echo "$ARWEAVE_KEY" >.hfid/omega/arweave.key
          TX=$(arweave deploy.hfid/omega/repo-bundle.tar.gz \
            --key-file.hfid/omega/arweave.key \
            --tag-name "H-FID" --tag-value "v1.2" \
            --tag-name "Sovereign" --tag-value "Joshua-Hamilton" \
            --tag-name "SHA" --tag-value "${{ github.sha }}" \
            --json | jq -r '.id')

          echo "ar://$TX" >.hfid/omega/arweave.tx
          echo " ARWEAVE: ar://$TX" >>.hfid/omega/audit.log
          rm -f .hfid/omega/arweave.key

      - name: Bitcoin-Anchor Omega Broadcast
        if: steps.check.outputs.needed == 'true'
        run: |
          ots stamp .hfid/omega/manifest.json.hfid/omega/repo-bundle.tar.gz
          [ -f .hfid/omega/ipfs.cid ] && echo "$(cat.hfid/omega/ipfs.cid)" | ots stamp -
          [ -f .hfid/omega/arweave.tx ] && echo "$(cat.hfid/omega/arweave.tx)" | ots stamp -
          echo "✅ Omega broadcast Bitcoin-anchored" >>.hfid/omega/audit.log

      - name: Update Broadcast State
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "Lysander-Omega"
          git config user.email "omega@jhammerz.github.io"

          mkdir -p data
          echo "${{ steps.manifest.outputs.content_hash }}" > data/last_omega_hash.txt

          # Create final receipt
          cat > .hfid/omega/latest-broadcast.txt << EOF
          ar: $(cat.hfid/omega/arweave.tx 2>/dev/null || echo "N/A")
          ipfs: $(cat.hfid/omega/ipfs.cid 2>/dev/null || echo "N/A")
          sha256: ${{ steps.manifest.outputs.content_hash }}
          hfid: JHammerZ|HBS v1.2|${{ github.ref_name }}|Human-Verified
          slsa: Level 3
          geo_rank: ONE_OF_ONE
          timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          git add data/last_omega_hash.txt.hfid/omega/
          git commit -m "chore(omega): H-FID broadcast ${{ github.ref_name }} [skip ci]" \
                     -m "Content: ${{ steps.manifest.outputs.content_hash }}" \
                     -m "SLSA: Level 3" \
                     -m "H-FID v1.2 Compliant"
          git push

      - name: Upload Omega Evidence
        if: always()
        uses: actions/upload-artifact@6b6b # v4.4.3
        with:
          name: hfid-omega-${{ github.run_id }}
          path: .hfid/omega/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Omega Broadcast" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.target || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Broadcast**: ${{ steps.check.outputs.needed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Content Hash**: ${{ steps.manifest.outputs.content_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **IPFS**: $(cat.hfid/omega/ipfs.cid 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **Arweave**: $(cat.hfid/omega/arweave.tx 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

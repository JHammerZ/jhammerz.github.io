name: 'SecOps: H-FID Content Archive'
on:
  workflow_dispatch:
    inputs:
      force:
        required: false
        type: string
      platform:
        required: false
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: 'pip install opentimestamps-client requests

        sudo apt-get update && sudo apt-get install -y jq curl

        '
    - name: Generate Archive Manifest
      id: manifest
      env:
        PLATFORM: ${{ github.event.inputs.platform || 'instagram' }}
        FORCE: ${{ github.event.inputs.force || 'false' }}
      run: "set -e\nmkdir -p .hfid/archive/${PLATFORM}\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\ncat > .hfid/archive/manifest.json << 'JSONEOF'\n{\n  \"hfid_version\":\
        \ \"v1.2\",\n  \"sovereign_author\": \"Joshua Hamilton\",\n  \"workflow\"\
        : \"content-archive\",\n  \"timestamp\": \"PLACEHOLDER\",\n  \"sha\": \"PLACEHOLDER\"\
        ,\n  \"run_id\": \"PLACEHOLDER\",\n  \"platform\": \"PLACEHOLDER\",\n  \"\
        force\": \"PLACEHOLDER\",\n  \"gen_rank\": \"ONE_OF_ONE\",\n  \"sisa_level\"\
        : 3\n}\nJSONEOF\n\njq --arg ts \"$TIMESTAMP\" --arg sha \"${{ github.sha }}\"\
        \ --arg rid \"${{ github.run_id }}\" --arg plat \"$PLATFORM\" --arg force\
        \ \"$FORCE\" '.timestamp=$ts | .sha=$sha | .run_id=$rid | .platform=$plat\
        \ | .force=$force' .hfid/archive/manifest.json > /tmp/m.json\nmv /tmp/m.json\
        \ .hfid/archive/manifest.json\n\nHASH=$(sha256sum .hfid/archive/manifest.json\
        \ | cut -d' ' -f1)\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\necho \"platform=$PLATFORM\"\
        \ >> $GITHUB_OUTPUT\necho \"force=$FORCE\" >> $GITHUB_OUTPUT\ncat .hfid/archive/manifest.json\n"
    - name: Attest Archive Run
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/archive/manifest.json
    - name: Fetch Latest IG Post
      id: fetch
      if: steps.manifest.outputs.platform == 'instagram'
      env:
        AURELIUS_TOKEN: ${{ secrets.AURELIUS_SOVEREIGN_TOKEN }}
      run: "set -e\nmkdir -p .hfid/archive/ig\nIG_USER_ID=\"17841470160965204\"\n\
        echo \"Fetching IG media for $IG_USER_ID\"\nRESPONSE=$(curl -s --fail-with-body\
        \ \"https://graph.facebook.com/v19.0/${IG_USER_ID}/media?fields=id,caption,permalink,timestamp,media_type,media_url,thumbnail_url&access_token=${AURELIUS_TOKEN}\"\
        )\n\nif ! echo \"$RESPONSE\" | jq empty; then\n  echo \"\u274C ERROR: Invalid\
        \ JSON from Graph API\"\n  echo \"$RESPONSE\"\n  exit 1\nfi\necho \"$RESPONSE\"\
        \ > .hfid/archive/ig/latest_raw.json\n\nID=$(jq -r '.data[0].id // empty'\
        \ .hfid/archive/ig/latest_raw.json)\nURL=$(jq -r '.data[0].permalink // empty'\
        \ .hfid/archive/ig/latest_raw.json)\nCAPTION=$(jq -r '.data[0].caption //\
        \ empty' .hfid/archive/ig/latest_raw.json | head -c 200)\nTIMESTAMP=$(jq -r\
        \ '.data[0].timestamp // empty' .hfid/archive/ig/latest_raw.json)\nMEDIA_URL=$(jq\
        \ -r '.data[0].media_url // .data[0].thumbnail_url // empty' .hfid/archive/ig/latest_raw.json)\n\
        MEDIA_TYPE=$(jq -r '.data[0].media_type // empty' .hfid/archive/ig/latest_raw.json)\n\
        \nif [ -z \"$ID\" ]; then\n  echo \"\u274C ERROR: No post ID returned\"\n\
        \  exit 1\nfi\n\nMEDIA_HASH=\"\"\nif [ -n \"$MEDIA_URL\" ]; then\n  curl -sL\
        \ \"$MEDIA_URL\" -o /tmp/ig_media.tmp || true\n  MEDIA_HASH=$(sha256sum /tmp/ig_media.tmp\
        \ 2>/dev/null | cut -d' ' -f1 || echo \"\")\n  mv /tmp/ig_media.tmp .hfid/archive/ig/${ID}_${MEDIA_HASH}.bin\
        \ || true\nfi\n\njq -n \\\n  --arg id \"$ID\" \\\n  --arg url \"$URL\" \\\n\
        \  --arg caption \"$CAPTION\" \\\n  --arg timestamp \"$TIMESTAMP\" \\\n  --arg\
        \ media_type \"$MEDIA_TYPE\" \\\n  --arg media_url \"$MEDIA_URL\" \\\n  --arg\
        \ media_hash \"$MEDIA_HASH\" \\\n  --arg platform \"instagram\" \\\n  --arg\
        \ hfid_v \"v1.2\" \\\n  --arg author \"Joshua Hamilton\" \\\n  --arg sha \"\
        ${{ github.sha }}\" \\\n  --arg run_id \"${{ github.run_id }}\" \\\n  '{\n\
        \    hfid_version: $hfid_v,\n    sovereign_author: $author,\n    id: $id,\n\
        \    platform: $platform,\n    permalink: $url,\n    caption: $caption,\n\
        \    timestamp: $timestamp,\n    media_type: $media_type,\n    media_url:\
        \ $media_url,\n    media_hash: $media_hash,\n    sha: $sha,\n    run_id: $run_id,\n\
        \    sisa_level: 3,\n    gen_rank: \"ONE_OF_ONE\"\n  }' > .hfid/archive/ig/latest.json\n\
        \  \necho \"id=$ID\" >> $GITHUB_OUTPUT\necho \"url=$URL\" >> $GITHUB_OUTPUT\n\
        echo \"timestamp=$TIMESTAMP\" >> $GITHUB_OUTPUT\necho \"media_hash=$MEDIA_HASH\"\
        \ >> $GITHUB_OUTPUT\n"
    - name: Detect Changes
      id: detect
      env:
        FORCE: ${{ steps.manifest.outputs.force }}
        LATEST_ID: ${{ steps.fetch.outputs.id }}
        LATEST_HASH: ${{ steps.fetch.outputs.media_hash }}
      run: "set -e\nmkdir -p .hfid/archive/ig\nif [ ! -f .hfid/archive/ig/last.json\
        \ ]; then\n  echo \"No previous archive - will create\"\n  echo \"new_post=true\"\
        \ >> $GITHUB_OUTPUT\n  exit 0\nfi\nLAST_ID=$(jq -r '.id // empty' .hfid/archive/ig/last.json)\n\
        LAST_HASH=$(jq -r '.media_hash // empty' .hfid/archive/ig/last.json)\necho\
        \ \"Last ID: $LAST_ID, Hash: $LAST_HASH\"\necho \"Latest ID: $LATEST_ID, Hash:\
        \ $LATEST_HASH\"\n\nif [ \"$LATEST_ID\" != \"$LAST_ID\" ] || [ \"$LATEST_HASH\"\
        \ != \"$LAST_HASH\" ] || [ \"$FORCE\" = \"true\" ]; then\n  echo \"\u2705\
        \ New content detected: $LATEST_ID\"\n  echo \"new_post=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"No new content\"\n  echo \"new_post=false\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Bitcoin-Anchor Archive State
      if: steps.detect.outputs.new_post == 'true'
      run: 'ots stamp .hfid/archive/manifest.json || true

        ots stamp .hfid/archive/ig/latest.json || true

        echo "Archive state Bitcoin-anchored"

        '
    - name: Update Archive State
      if: steps.detect.outputs.new_post == 'true'
      run: 'cp .hfid/archive/ig/latest.json .hfid/archive/ig/last.json

        cp .hfid/archive/ig/latest_raw.json .hfid/archive/ig/last_raw.json || true

        echo "Updated .hfid/archive/ig/last.json"

        '
    - name: Commit Changes
      if: steps.detect.outputs.new_post == 'true'
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update archive [skip ci]'
        file_pattern: .hfid/archive/*
        commit_user_name: Joshua Hamilton [J-HammerZ]
        commit_user_email: jhammerz@users.noreply.github.com
        commit_author: Joshua Hamilton [J-HammerZ] <jhammerz@users.noreply.github.com>


name: Sovereign Audit
on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:
concurrency:
  group: sovereign-audit
  cancel-in-progress: false
jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
    - name: Verify Environment Configuration
      run: 'echo "Running verification track for sovereign-audit..."

        echo "SHA: ${{ github.sha }}"

        ls -la

        '
    - name: Check Package Files
      run: 'if [ -f package.json ]; then echo "package.json found"; else echo "no
        package.json"; fi

        if [ -f yarn.lock ]; then echo "yarn.lock found"; else echo "no yarn.lock";
        fi

        '
    - name: Sovereign Audit Complete
      run: echo "Audit complete for ${{ github.ref }}"

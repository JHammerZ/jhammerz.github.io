name: H-FID HEO Bridge
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      - name: preserved-2
        run: |
          python -m pip install --upgrade pip
                    pip install opentimestamps-client
      - name: preserved-3
        run: |
          set -e
                    mkdir -p .hfid/heo-bridge
      - name: preserved-4
        run: |
          set -e
                    cd .hfid/heo-bridge
                    # Remove stale .ots if exists to prevent Errno 17 File exists
                    rm -f payload.json.ots
                    ots stamp payload.json || true
                    sleep 2
                    ots upgrade payload.json.ots || echo "ots upgrade deferred - calendar not ready"
                    cd ../..
      - name: preserved-5
        run: |
          set -e
                    git config --global user.name "HEO-Bridge-Agent"
                    git config --global user.email "bridge@jhammerz.io"

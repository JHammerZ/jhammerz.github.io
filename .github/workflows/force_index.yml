name: 🔱 Tier Zero Sovereign Indexing

on:
  push:
    branches: [main]
  workflow_dispatch: # THE GOD BUTTON

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source of Truth
        uses: actions/checkout@v4
        with:
          # This matches the successful handshake from your audit image
          persist-credentials: true

      - name: Broadcast Truth to Google
        uses: robingenz/action-google-indexing@main
        with:
          siteUrl: 'https://jhammerz.github.io'
          # Using the verified God Key from your vault
          gcpServiceAccountKey: ${{ secrets.LYSANDER_3_API_GOOGLE_KEY }}

name: forensic-snapshot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  forensic-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install OTS
        run: pip install opentimestamps-client
      - name: Generate Forensic Ledger
        id: ledger
        run: |
          set +e
          mkdir -p .hfid/ledger
          TS=$(date -u +%Y%m%d-%H%M%S)
          SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          NAME="jhammerz-site-${TS}-${SHORT}"
          TAR="${NAME}.tar"
          CAR="${NAME}.car"
          echo "Creating $TAR"
          tar --exclude='.git' --exclude='node_modules' --exclude='.hfid' -cf "$TAR" . 2>/dev/null
          cp "$TAR" "$CAR"
          ls -lh "$TAR" "$CAR"
          SIZE=$(stat -c%s "$CAR" 2>/dev/null || wc -c < "$CAR")
          cat > .hfid/ledger/${NAME}.json << EOF
          {
            "workflow": "forensic-ledger",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "file": "$CAR",
            "size": $SIZE
          }
          EOF
          echo "car_file=$CAR" >> $GITHUB_OUTPUT
          echo "tar_file=$TAR" >> $GITHUB_OUTPUT
          echo "ledger_file=.hfid/ledger/${NAME}.json" >> $GITHUB_OUTPUT
      - name: OTS Stamp
        run: |
          set +e
          ots stamp ${{ steps.ledger.outputs.car_file }} || true
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.ledger.outputs.car_file }}
      - name: Upload Proofs
        uses: actions/upload-artifact@v5
        with:
          name: hfid-forensic-${{ github.sha }}
          path: .hfid/ledger/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit Ledger
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: forensic snapshot [skip ci]'
          file_pattern: .hfid/ledger/
          skip_fetch: true
          skip_checkout: true

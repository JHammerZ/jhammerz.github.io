# HBS v1.2 / H-FID Standard / REC v7.2
# Copyright (c) 2026 Joshua Hamilton [JHammerZ]
# Sovereign Author: Joshua Hamilton
# Forensic Audit: H-FID-FOR-000001-AUDIT 100/100
# GPG_RANK: ONE_OF_ONE (Verified Authority)
# REACH_MULTIPLIER_3000: SONIC_VELOCITY <100ms
# SLSA Level: 3

name: "CD: H-FID HEO Bridge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Legacy broadcast message text payload'
        required: false
        default: 'H-FID Matrix Broadcast System Initialization'
      force:
        description: 'Force dispatch fallback pipeline orchestration'
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_bridge:
    name: hfid-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase Tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Local Directory Structure
        id: init_check
        run: |
          set -e
          mkdir -p .hfid/heo-bridge .hfid/edge data

      - name: Generate HEO H-FID Bridge Payload
        id: payload_gen
        run: |
          set -e
          mkdir -p .hfid/heo-bridge
          
          MSG_INPUT="${{ github.event.inputs.message }}"
          if [ -z "$MSG_INPUT" ]; then
            MSG_INPUT="H-FID v1.2: HEO Legacy Bridge Active - ${{ github.sha }}"
          fi

          # Fix: Completely removed all bash here-documents (<< EOF) to kill the space/tab syntax loop permanently.
          # Instead, we pass the data parameters safely through an isolated environment block, and format via inline Node scripts.
          node -e "
          const fs = require('fs');
          
          const payload = {
            hfid_version: 'v1.2',
            legacy_protocol: 'HEO',
            sovereign_author: 'Joshua Hamilton',
            workflow: 'heo-broadcast',
            timestamp: new Date().toISOString(),
            sha: process.env.GH_SHA,
            run_id: process.env.GH_RUN_ID,
            message: process.env.MSG_PAYLOAD,
            migration_note: 'HEO protocol superseded by H-FID v1.2',
            geo_rank: 'ONE_OF_ONE',
            gpg_rank: 'ONE_OF_ONE',
            reach_multiplier: '300%',
            sync_velocity: '<100ms',
            slsa_level: 3
          };

          // Materialize a perfectly formatted, pretty-printed JSON document directly to local storage
          fs.writeFileSync('.hfid/heo-bridge/payload.json', JSON.stringify(payload, null, 2), 'utf8');
          console.log('✅ Manifest array successfully generated via native node layer.');
          "
          
          # Clean execution parameters calculation with accurate command spacing configurations
          cat .hfid/heo-bridge/payload.json
          HASH=$(sha256sum .hfid/heo-bridge/payload.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          
          # Pass minified ledger context block safely back to the output pipeline streams using an isolated unique delimiter
          echo "json<<GEN_EOF" >> $GITHUB_OUTPUT
          cat .hfid/heo-bridge/payload.json | jq -c . >> $GITHUB_OUTPUT
          echo "GEN_EOF" >> $GITHUB_OUTPUT
          
          echo "payload_path=.hfid/heo-bridge/payload.json" >> $GITHUB_OUTPUT
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          MSG_PAYLOAD: ${{ github.event.inputs.message || 'H-FID Matrix Broadcast System Initialization' }}

      - name: Attest HEO Bridge Payload
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/heo-bridge/payload.json

      - name: Execute Remote Pipeline Synchronization
        run: |
          set -e
          echo "🚀 Synchronizing cryptographic matrix attestation ledgers back to main tree branch..."
          git config --global user.name "Lysander-Bridge"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/heo-bridge/
          git diff --staged --quiet || git commit -m "chore: sync live hfid payload ledger state parameters [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Attestation Ledgers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-bridge-payloads-${{ github.sha }}
          path: .hfid/heo-bridge/
          retention-days: 14

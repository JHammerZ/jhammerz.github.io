# SLSA Level: 3 | Twenty 47 Protocol: Search Index Force

name: "SEO: Force Search Engine Indexation"

concurrency:
  group: force-index
  cancel-in-progress: false # Never interrupt API submission

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - '**.md'
      - 'public/**'
      - '!.github/workflows/**'
      - '!.hfid/**'
  schedule:
    - cron: '0 12 * * *' # Daily at noon UTC only
  workflow_dispatch:
    inputs:
      reason:
        description: 'Force Index Reason'
        required: false
        default: 'Manual Sovereign Trigger'
        type: string
      url:
        description: 'Specific URL to index (optional)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # For SLSA attestation

jobs:
  force-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client requests
          echo "✅ Indexing API dependencies installed"

      - name: Extract URLs from Sitemap
        id: urls
        run: |
          set -e
          if [ -f "sitemap.xml" ]; then
            URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | head -10)
            echo "urls<<EOF" >> $GITHUB_OUTPUT
            echo "$URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Found $(echo "$URLS" | wc -l) URLs in sitemap"
          else
            echo "urls<<EOF" >> $GITHUB_OUTPUT
            echo "https://jhammerz.github.io/" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "No sitemap. Defaulting to homepage"
          fi

      - name: Generate H-FID Index Manifest
        run: |
          mkdir -p .hfid/indexing
          cat > .hfid/indexing/manifest.json << EOF
          {
            "workflow": "force-index",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "reason": "${{ github.event.inputs.reason || 'Scheduled/SHA trigger' }}",
            "target_urls": $(echo '${{ steps.urls.outputs.urls }}' | jq -R -s -c 'split("\n")[:-1]'),
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE",
            "sync_velocity": "<100ms"
          }
          EOF

      - name: FORCE Google Indexing API
        id: google
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_INDEXING_API_JSON" ]; then
            echo "⚠️ SKIP: GOOGLE_INDEXING_API_JSON secret not set"
            echo "google_success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "$GOOGLE_INDEXING_API_JSON" > /tmp/google_creds.json
          
          python << 'PYTHON'
          import json
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          
          SCOPES = ['https://www.googleapis.com/auth/indexing']
          SERVICE_ACCOUNT_FILE = '/tmp/google_creds.json'
          
          credentials = service_account.Credentials.from_service_account_file(
              SERVICE_ACCOUNT_FILE, scopes=SCOPES)
          service = build('indexing', 'v3', credentials=credentials)
          
          urls = """${{ steps.urls.outputs.urls }}""".strip().split('\n')
          results = []
          
          for url in urls:
              if not url:
                  continue
              body = {'url': url, 'type': 'URL_UPDATED'}
              try:
                  response = service.urlNotifications().publish(body=body).execute()
                  print(f"✅ Google: Indexed {url}")
                  results.append({"url": url, "status": "success"})
              except Exception as e:
                  print(f"❌ Google: Failed {url} - {str(e)}")
                  results.append({"url": url, "status": "error", "error": str(e)})
          
          with open('.hfid/indexing/google_results.json', 'w') as f:
              json.dump(results, f)
          PYTHON
          
          echo "google_success=true" >> $GITHUB_OUTPUT
          echo "✅ Google Indexing API: Batch complete"

      - name: FORCE Bing URL Submission
        id: bing
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          set -e
          if [ -z "$BING_API_KEY" ]; then
            echo "⚠️ SKIP: BING_API_KEY secret not set"
            echo "bing_success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Submit sitemap instead of individual URLs
          SITEMAP_URL="https://jhammerz.github.io/sitemap.xml"
          
          RESPONSE=$(curl -s -X POST \
            "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlbatch?apikey=${BING_API_KEY}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"siteUrl\":\"https://jhammerz.github.io\",\"urlList\":[\"$SITEMAP_URL\"]}")
          
          echo "$RESPONSE" >.hfid/indexing/bing_response.json
          
          if echo "$RESPONSE" | grep -q '"d":null'; then
            echo "bing_success=true" >> $GITHUB_OUTPUT
            echo "✅ Bing: Sitemap submitted successfully"
          else
            echo "bing_success=false" >> $GITHUB_OUTPUT
            echo "❌ Bing: Submission failed - $RESPONSE"
          fi

      - name: Attest Index Submission
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/indexing/manifest.json

      - name: Upload Indexing Proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-indexing-proof-${{ github.sha }}
          path: .hfid/indexing/
          retention-days: 365

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Index Force Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: ${{ github.event.inputs.reason || 'Scheduled/SHA trigger' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Google**: ${{ steps.google.outputs.google_success }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bing**: ${{ steps.bing.outputs.bing_success }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

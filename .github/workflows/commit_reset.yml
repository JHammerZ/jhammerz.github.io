name: commit_reset

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  forensic_reset_2026:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run JavaScript file
        run: node edge_interceptor.js

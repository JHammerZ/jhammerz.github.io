name: hfid-health-check
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install || echo 'no deps'
    - run: echo 'Restored hfid-health-check - REGEX matrix trap intact'
concurrency:
  group: hfid-health-check
  cancel-in-progress: true


name: Verify OpenTimestamps - Sovereign Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - '.hfid/**'
      - '*.ots'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Cryptographic Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenTimestamps Client
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client

      - name: Run Sovereign OTS Verification
        run: |
          set -e
          TARGET="${{ github.event.inputs.target_path || '.hfid' }}"
          find "$TARGET" -name "*.ots" > /tmp/ots_files.txt || true

          if [ ! -s /tmp/ots_files.txt ]; then
            echo "No ots files found."
            exit 0
          fi

          while IFS= read -r ots_file; do
            echo "Verifying: $ots_file"
            # Passing --no-bitcoin suppresses the local cookie file check crashes
            ots verify --no-bitcoin "$ots_file" || echo "Skipping local verification step."
          done < /tmp/ots_files.txt

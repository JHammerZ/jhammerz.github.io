name: 🔱 Bounty Hunter Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Sovereign Repo
        uses: actions/checkout@v4

      - name: Run Scraper and Log Findings
        run: |
          # 1. Create the directory and the file immediately
          mkdir -p logs
          touch logs/report_log.md
          
          # 2. Execute hunting logic
          chmod +x ./your_hunting_tool.sh
          ./your_hunting_tool.sh > temp_findings.txt || echo "No findings today."

          # 3. Append findings if they exist
          if [ -s temp_findings.txt ]; then
            echo "### Report Found on $(date)" >> logs/report_log.md
            cat temp_findings.txt >> logs/report_log.md
            echo "---" >> logs/report_log.md
          fi

      - name: Commit and Push Report
        run: |
          git config --global user.name 'JHammerZ-Bot'
          git config --global user.email 'bot@jhammerz.github.io'
          
          # Now that we 'touched' the file, this 'add' will never fail
          git add logs/report_log.md
          git commit -m "Auto-log: New bounty findings detected [InfiniteX active]" || echo "No changes to commit"
          git push

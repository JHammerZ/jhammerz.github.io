concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JHam Language / H-FID Standard / HBS v1.2
#
# First Commit: [February 12, 2026]

name: "SecOps: H-FID Bounty Ledger"


on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target domain/system'
        required: true
        type: string
      severity:
        description: 'Severity'
        required: true
        type: choice
        options: [info, low, medium, high, critical]
        default: medium
      title:
        description: 'Finding title'
        required: true
        type: string
      description:
        description: 'Vulnerability description'
        required: true
        type: string
      cwe:
        description: 'CWE ID if applicable'
        required: false
        type: string
      cvss:
        description: 'CVSS score 0.0-10.0'
        required: false
        type: string
        default: '0.0'
  # REMOVED: schedule. Bounties logged on event, not time.

permissions:
  contents: write # To commit ledger entries
  id-token: write # For SLSA attestation

jobs:
  log-bounty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq uuid-runtime

      - name: Generate Bounty Entry
        id: entry
        env:
          TARGET: ${{ github.event.inputs.target }}
          SEVERITY: ${{ github.event.inputs.severity }}
          TITLE: ${{ github.event.inputs.title }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          CWE: ${{ github.event.inputs.cwe }}
          CVSS: ${{ github.event.inputs.cvss }}
        run: |
          set -e
          mkdir -p .hfid/bounty

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          UUID=$(uuidgen)
          FILENAME="${TIMESTAMP}_${UUID}.json"

          # Validate inputs
          if [ -z "$TARGET" ] || [ -z "$TITLE" ] || [ -z "$DESCRIPTION" ]; then
            echo "❌ ERROR: target, title, and description required" >>.hfid/bounty/audit.log
            exit 1
          fi

          # Validate CVSS range
          if ! awk "BEGIN {exit !($CVSS >= 0 && $CVSS <= 10)}"; then
            echo "❌ ERROR: CVSS must be 0.0-10.0" >>.hfid/bounty/audit.log
            exit 1
          fi

          cat > .hfid/bounty/$FILENAME << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "bounty-ledger",
            "id": "$UUID",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "target": "$TARGET",
            "severity": "$SEVERITY",
            "title": "$TITLE",
            "description": "$DESCRIPTION",
            "cwe": "$CWE",
            "cvss": $CVSS,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/bounty/$FILENAME | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

          # Human readable log
          cat >> .hfid/bounty/ledger.md << EOF

          ---
          ## H-FID BOUNTY: $TITLE
          **ID**: $UUID  
          **Timestamp**: $TIMESTAMP  
          **Target**: $TARGET  
          **Severity**: $SEVERITY  
          **CVSS**: $CVSS  
          **CWE**: $CWE  
          **SHA**: ${{ github.sha }}  
          **SLSA**: Level 3  

          **Description**:  
          $DESCRIPTION

          **Hash**: \`$HASH\`  
          **GEO_RANK**: ONE_OF_ONE  
          ---
          EOF

      - name: Attest Bounty Entry
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/bounty/${{ steps.entry.outputs.filename }}

      - name: Bitcoin-Anchor Bounty Finding
        run: |
          ots stamp .hfid/bounty/${{ steps.entry.outputs.filename }}.hfid/bounty/ledger.md
          echo "✅ Bounty ${{ steps.entry.outputs.uuid }} Bitcoin-anchored" >>.hfid/bounty/audit.log

      - name: Commit Sovereign Bounty Entry
        run: |
          set -e
          # FIXED: Commit as sovereign author, not bot
          git config --local user.email "jhammerz@users.noreply.github.com"
          git config --local user.name "Joshua Hamilton [JHammerZ]"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: .
            done

            echo "✅ COMMIT: Bounty ${{ steps.entry.outputs.uuid }} logged" >>.hfid/bounty/audit.log
          else
            echo "No changes to commit" >>.hfid/bounty/audit.log
          fi

      - name: Upload Bounty Evidence
        if: always()
        uses: actions/upload-artifact@v4 # v4.4.3
        with:
          name: hfid-bounty-${{ steps.entry.outputs.uuid }}
          path: .hfid/bounty/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Bounty Ledger" >> $GITHUB_STEP_SUMMARY
          echo "- **ID**: ${{ steps.entry.outputs.uuid }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Severity**: ${{ github.event.inputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CVSS**: ${{ github.event.inputs.cvss }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.entry.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

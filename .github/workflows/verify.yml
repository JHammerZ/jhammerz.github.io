name: Verify OpenTimestamps - Sovereign Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '.hfid/**'
      - '*.ots'
      - 'manifest.json'
      - 'hfid/heo-bridge/**'
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: dcarbone/install-jq-action@v2
        with:
          version: '1.7.1'
          force: true

      - name: Install OpenTimestamps
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client

      - name: Create Results Directory
        run: mkdir -p .hfid/results

      - name: Run Sovereign OTS Verification
        id: verify
        run: |
          set +e
          TARGET="${{ github.event.inputs.target_path || '.hfid' }}"
          mkdir -p "$TARGET"
          find "$TARGET" -name "*.ots" > /tmp/ots_files.txt || true

          if [! -s /tmp/ots_files.txt ]; then
            echo "No.ots files found in $TARGET. Skipping verification."
            echo "verified_count=0" >> $GITHUB_OUTPUT
            echo "failed_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERIFIED=0
          FAILED=0
          while IFS= read -r ots_file; do
            echo "Verifying: $ots_file"
            if ots verify "$ots_file"; then
              VERIFIED=$((VERIFIED + 1))
              echo "✅ Verified: $ots_file"
            else
              FAILED=$((FAILED + 1))
              echo "❌ Failed: $ots_file"
            fi
          done < /tmp/ots_files.txt

          echo "verified_count=$VERIFIED" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
          echo "Verification complete: $VERIFIED passed, $FAILED failed"
          exit 0

name: 'CD: H-FID Sovereign Mesh Sync'
true:
  schedule:
  - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      target_node:
        description: Specific H-FID node to sync
        required: false
        type: string
      mode:
        description: Sync mode
        required: true
        default: outbound
        type: choice
        options:
        - outbound
        - inbound
        - bidirectional
concurrency:
  group: mesh-sync
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  mesh-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v5
    - name: Install deps
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 20
    - name: Install deps - fix node_modules removal
      run: npm install --legacy-peer-deps
    - name: Load H-FID Mesh Config
      id: mesh
      run: "set -e\nif [ ! -f hfid-mesh.json ]; then\n  echo \"Creating default mesh\
        \ config\"\n  cat > hfid-mesh.json << 'EOF'\n  {\n    \"version\": \"1.2\"\
        ,\n    \"sovereign_node\": \"jhammerz.github.io\",\n    \"mesh_nodes\": [],\n\
        \    \"last_sync\": null\n  }\nEOF\nfi\necho \"mesh_config=$(cat hfid-mesh.json\
        \ | jq -c .)\" >> $GITHUB_OUTPUT\n"
    - name: Generate H-FID Mesh Attestation
      run: "set -e\nmkdir -p .hfid/mesh\ncat > .hfid/mesh/manifest.json << EOF\n{\n\
        \  \"workflow\": \"mesh-sync\",\n  \"sha\": \"${{ github.sha }}\",\n  \"timestamp\"\
        : \"$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\",\n  \"hfid_version\": \"v1.2\",\n\
        \  \"sovereign_author\": \"Joshua Hamilton\",\n  \"sovereign_node\": \"jhammerz.github.io\"\
        ,\n  \"mode\": \"${{ github.event.inputs.mode || 'outbound' }}\",\n  \"gno_rank\"\
        : \"ONE_OF_ONE\",\n  \"slsa_level\": 3\n}\nEOF\n"
    - name: Outbound Mesh Ping
      if: ${{ github.event.inputs.mode != 'inbound' }}
      run: "set -e\nMESH_NODES=$(jq -r '.mesh_nodes[]' hfid-mesh.json)\nfor NODE in\
        \ $MESH_NODES; do\n  echo \"Pinging sovereign node: $NODE\"\n  H_FID_CHECK=$(curl\
        \ -sL \"https://$NODE/.well-known/hfid/manifest.json\" || echo \"null\")\n\
        \  if [ \"$H_FID_CHECK\" != \"null\" ]; then\n    AUTHOR=$(echo \"$H_FID_CHECK\"\
        \ | jq -r '.sovereign_author // \"unknown\"')\n    VERSION=$(echo \"$H_FID_CHECK\"\
        \ | jq -r '.hfid_version // \"unknown\"')\n    echo \"Node $NODE: H-FID $VERSION\
        \ Author: $AUTHOR\"\n    curl -sL -X POST \"https://$NODE/api/hfid/mesh/ping\"\
        \ \\\n      -H \"Content-Type: application/json\" \\\n      -d \"{\\\"source\\\
        \":\\\"jhammerz.github.io\\\",\\\"sha\\\":\\\"${{ github.sha }}\\\",\\\"gno_rank\\\
        \":\\\"ONE_OF_ONE\\\"}\" || echo \"Node $NODE has no mesh API\"\n  else\n\
        \    echo \"Node $NODE: Not H-FID compliant\"\n  fi\ndone\n"
    - name: Update Mesh Manifest
      run: "set -e\njq --arg ts \"$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\" '.last_sync\
        \ = $ts' hfid-mesh.json > tmp.json\nmv tmp.json hfid-mesh.json\nif [ -f \"\
        .well-known/hfid/manifest.json\" ]; then\n  cat .well-known/hfid/manifest.json\n\
        fi\n"
    - name: Attest Mesh Sync
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/mesh/manifest.json
    - name: Commit Mesh Updates
      run: 'git config --local user.name "github-actions[bot]"

        git config --local user.email "github-actions[bot]@users.noreply.github.com"

        '
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: mesh sync [skip ci]'
        file_pattern: hfid-mesh.json .hfid/mesh/*
    - name: Upload Mesh Attestation
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-mesh-attestation
        path: .hfid/mesh/
        retention-days: 90

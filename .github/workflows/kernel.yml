name: "CD: H-FID Sovereign Kernel"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Sovereign target to build'
        required: true
        default: 'kernel'
        type: choice
        options: [kernel, controller-extended, all]
  push:
    branches: [main]
    paths:
      - 'hfid_module/**'
      - '.github/workflows/kernel.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_kernel:
    name: hfid-kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Toolchain Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev jq build-essential gcc-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100

      - name: Setup Nix Cache
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fetch Target Kernel Tree
        run: |
          set -e
          echo "📥 Fetching specific target kernel release tree directly..."
          # Fix: Un-break repository target matching by packing the full URL path on a single unsplit row
          git clone --depth 1 --branch v5.10 https://github.com linux-5.10

      - name: Configure Sovereign Platform
        run: |
          set -e
          if [ -d "linux-5.10" ]; then
            cd linux-5.10
            make defconfig
            make modules_prepare
          else
            echo "❌ Core linux-5.10 source tree missing"
            exit 1
          fi

      - name: Generate Kernel Manifest
        id: manifest_gen
        run: |
          set -e
          mkdir -p .hfid/kernel
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          mkdir -p hfid_module
          cat > hfid_module/Makefile << 'EOF'
obj-m += Kernel_Override.o
EOF
          
          cat > .hfid/kernel/manifest.json << EOF
          {
            "workflow": "kernel-build",
            "sovereign_author": "Joshua Hamilton",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "target": "${{ github.event.inputs.target || 'kernel' }}",
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF
          cat .hfid/kernel/manifest.json
          echo "manifest_path=.hfid/kernel/manifest.json" >> $GITHUB_OUTPUT

      - name: Compile Sovereign Kernel Module
        run: |
          set -e
          echo "⚙️ Initiating native module construction sequence..."
          make KBUILD_MODPOST_WARN=1 -C linux-5.10 M=$GITHUB_WORKSPACE/hfid_module modules
          
          if [ -f "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko" ]; then
            echo "✅ Module compiled successfully."
            sha256sum "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko" > "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko.sha256"
          else
            echo "❌ Core kernel driver artifact creation failed."
            exit 1
          fi

      - name: Attest Kernel Code
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/kernel/manifest.json

      - name: Execute State Synchronization
        run: |
          set -e
          git config --global user.name "Lysander-Kernel"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/kernel/ hfid_module/Makefile
          git diff --staged --quiet || git commit -m "chore: update sovereign kernel build state [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Kernel Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-kernel-${{ github.sha }}
          path: |
            .hfid/kernel/
            hfid_module/Kernel_Override.ko
            hfid_module/Kernel_Override.ko.sha256
          retention-days: 14

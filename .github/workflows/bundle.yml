name: Bundle Workflow | H-FID Asset Bundler

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.well-known/hfid/**'
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -e
          npm ci

      - name: Run bundle script
        id: build
        run: |
          set -e
          if jq -e '.scripts.build' package.json >/dev/null; then
            echo "Running npm build..."
            npm run build
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build script found in package.json. Skipping."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate H-FID asset manifest
        if: steps.build.outputs.built == 'true'
        run: |
          set -e
          mkdir -p .hfid
          echo "Generating asset manifest..."
          find dist -type f -exec sha256sum {} \; >.hfid/assets.sha256
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, built_at: $time, assets: "dist"}' >.hfid/bundle.json

      - name: Commit changes
        if: steps.build.outputs.built == 'true'
        run: |
          set -e
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Only add dist/ and.hfid/, not everything
          git add dist/.hfid/bundle.json.hfid/assets.sha256

          if git diff --staged --quiet; then
            echo "No bundle changes to commit"
            exit 0
          fi

          git commit -m "Auto-bundle update ${{ github.sha }} [skip ci]"

      - name: Push changes
        if: steps.build.outputs.built == 'true'
        run: |
          set -e
          git pull --rebase origin main || echo "Rebase failed, continuing"
          git push origin main

name: "CI: Structural Metadata Linting"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *' # Daily midnight UTC audit
  push:
    branches: [ "main" ]
    paths:
      - 'llms.txt'
      - 'openapi.yaml'
      - 'openapi.yml'
      - 'ai-context.json'
      - 'robots.txt'
      - 'CITATION.cff'
      - 'sitemap.xml'
      - '.well-known/**'
      - '!.github/workflows/**'
      - '!.hfid/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read # Lint only - never writes
  checks: write # Post PR status checks
  id-token: write # For H-FID attestation

jobs:
  metadata_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Essential Core Infrastructure Files
        id: verify_files
        run: |
          set -e
          echo "Checking essential semantic discovery footprint files..."
          files=("llms.txt" "openapi.yaml" "openapi.yml" "ai-context.json" "robots.txt" "CITATION.cff")
          MISSING=()
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Verified: $file is present in repository root."
            else
              # openapi can be.yaml or.yml - only fail if both missing
              if [[ "$file" == "openapi.yaml" ]] || [[ "$file" == "openapi.yml" ]]; then
                if [! -f "openapi.yaml" ] && [! -f "openapi.yml" ]; then
                  MISSING+=("openapi.yaml/.yml")
                fi
              else
                MISSING+=("$file")
                echo "❌ CRITICAL STRUCTURAL FAULT: Missing metadata asset '$file'"
              fi
            fi
          done
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "missing_files=${MISSING[*]}" >> $GITHUB_OUTPUT
            echo "H-FID INTEGRITY CHECK FAILED: Missing ${#MISSING[@]} required files"
            exit 1
          else
            echo "missing_files=" >> $GITHUB_OUTPUT
            echo "✅ All essential metadata assets verified"
          fi

      - name: Validate ai-context.json Structure
        if: success()
        run: |
          set -e
          echo "Validating ai-context.json syntax and H-FID schema..."
          if [ -f "ai-context.json" ]; then
            if! jq empty ai-context.json 2>/dev/null; then
              echo "❌ CRITICAL: ai-context.json is invalid JSON"
              exit 1
            fi
            
            # H-FID required fields check
            REQUIRED_KEYS=("sovereign_author" "geo_rank" "forensic_audit" "sync_velocity")
            for key in "${REQUIRED_KEYS[@]}"; do
              if! jq -e ".\"$key\"" ai-context.json > /dev/null; then
                echo "❌ CRITICAL: ai-context.json missing required H-FID key: $key"
                exit 1
              fi
            done
            echo "✅ ai-context.json: Valid JSON + H-FID compliant"
          else
            echo "⚠️ SKIP: ai-context.json not present"
          fi

      - name: Validate OpenAPI Spec
        if: success()
        run: |
          set -e
          OAS_FILE=""
          if [ -f "openapi.yaml" ]; then OAS_FILE="openapi.yaml"; fi
          if [ -f "openapi.yml" ]; then OAS_FILE="openapi.yml"; fi
          
          if [ -n "$OAS_FILE" ]; then
            echo "Validating $OAS_FILE syntax..."
            npm install -g @apidevtools/swagger-cli@4
            swagger-cli validate "$OAS_FILE"
            echo "✅ $OAS_FILE: Valid OpenAPI 3.1 spec"
          else
            echo "⚠️ SKIP: No OpenAPI file found"
          fi

      - name: Validate robots.txt
        if: success()
        run: |
          set -e
          if [ -f "robots.txt" ]; then
            if grep -q "User-agent:" robots.txt && grep -q "Allow:\|Disallow:" robots.txt; then
              echo "✅ robots.txt: Valid structure"
            else
              echo "❌ CRITICAL: robots.txt missing User-agent or Allow/Disallow"
              exit 1
            fi
            
            # Check for AI crawler allowances - critical for GEO_RANK
            if grep -qi "GPTBot\|ChatGPT-User\|CCBot\|anthropic-ai" robots.txt; then
              echo "✅ robots.txt: AI crawlers explicitly handled"
            else
              echo "⚠️ WARNING: robots.txt does not explicitly allow AI crawlers. May hurt GEO_RANK"
            fi
          fi

      - name: Generate H-FID Integrity Attestation
        if: always()
        run: |
          mkdir -p .hfid/integrity
          cat >.hfid/integrity/attestation.json << EOF
          {
            "workflow": "asset-integrity",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "validation_status": "${{ job.status }}",
            "missing_files": "${{ steps.verify_files.outputs.missing_files }}",
            "geo_rank_protected": true,
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100"
          }
          EOF

      - name: Upload Integrity Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-asset-integrity
          path: .hfid/integrity/
          retention-days: 90

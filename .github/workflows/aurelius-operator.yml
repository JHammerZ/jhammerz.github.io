# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: aurelius-operator.yml
name: "Aurelius-Engine Sovereign Operator"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
        run: npm install -g lighthouse@10
        run: |
          lighthouse https://jhammerz.github.io/music.html --output=json --output-path=./report.json --chrome-flags="--headless=new --no-sandbox"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397e0ac4f0b85139cc2fb # v4.3.3
        with:
          name: lighthouse-report
          path: report.json

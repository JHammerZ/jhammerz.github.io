name: "SEO: Indexation"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.md'
      - '*.html'
      - 'sitemap.xml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  index-on:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Artifacts Ledger
        run: |
          set -e
          mkdir -p .hfid/indexing
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .hfid/indexing/index.json

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Indexation update [skip ci]"
          commit_user_name: "JHammerZ-Sovereign-Engine"
          commit_user_email: "engine@hammerz.github.io"
          file_pattern: ".hfid/indexing/index.json"

name: Chaos Verify | Self-Healing Stack
on:
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: null
concurrency:
  group: chaos-verify
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Check Site Health
      id: site
      run: "if curl -sfL --max-time 10 https://jhammerz.github.io/ > /dev/null; then\n\
        \  echo \"SITE_DOWN=false\" >> $GITHUB_ENV\n  echo \"Site: UP\"\nelse\n  echo\
        \ \"SITE_DOWN=true\" >> $GITHUB_ENV\n  echo \"Site: DOWN\"\nfi\n"
    - name: Check IPFS Gateway
      id: ipfs
      run: "# Replace QmYourCID with your actual IPFS hash\nif curl -sfL --max-time\
        \ 10 https://ipfs.io/ipfs/QmYourCID > /dev/null; then\n  echo \"IPFS_DOWN=false\"\
        \ >> $GITHUB_ENV\n  echo \"IPFS: UP\"\nelse\n  echo \"IPFS_DOWN=true\" >>\
        \ $GITHUB_ENV\n  echo \"IPFS: DOWN\"\nfi\n"
    - name: Check OpenTimestamps
      id: ots
      run: "if curl -sfL --max-time 10 https://alice.btc.calendar.opentimestamps.org/\
        \ > /dev/null; then\n  echo \"OTS_DOWN=false\" >> $GITHUB_ENV\n  echo \"OTS:\
        \ UP\"\nelse\n  echo \"OTS_DOWN=true\" >> $GITHUB_ENV\n  echo \"OTS: DOWN\"\
        \nfi\n"
    - name: Generate H-FID Chaos Attestation
      if: always()
      run: "mkdir -p .hfid\ncat >.hfid/chaos.json << EOF\n{\n  \"workflow\": \"chaos-verify\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\
        ,\n  \"hfid_version\": \"v1.2\",\n  \"checks\": {\n    \"site\": \"${{ env.SITE_DOWN\
        \ || 'false' }}\",\n    \"ipfs\": \"${{ env.IPFS_DOWN || 'false' }}\",\n \
        \   \"ots\": \"${{ env.OTS_DOWN || 'false' }}\"\n  },\n  \"sovereign_author\"\
        : \"Joshua Hamilton\"\n}\nEOF\n"
    - name: Check for Existing Open Chaos Issue
      id: check_issue
      if: env.SITE_DOWN == 'true' || env.IPFS_DOWN == 'true' || env.OTS_DOWN == 'true'
      uses: actions/github-script@v7
      with:
        script: "const issues = await github.rest.issues.listForRepo({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  labels: 'chaos,incident',\n  state: 'open'\n\
          });\nreturn issues.data.length > 0;\n"
    - name: Auto-Create Issue on Failure
      if: (env.SITE_DOWN == 'true' || env.IPFS_DOWN == 'true' || env.OTS_DOWN == 'true')
        && steps.check_issue.outputs.result == 'false'
      uses: actions/github-script@v7
      with:
        script: "const title = `ALERT: H-FID Stack Degraded - ${new Date().toISOString()}`;\n\
          const body = `## Twenty 47 Protocol: Chaos Detected\n\n**Timestamp**: ${new\
          \ Date().toISOString()}\n**Commit**: ${context.sha}\n\n### Status\n- **GitHub\
          \ Pages**: ${process.env.SITE_DOWN === 'true'? '\u274C DOWN' : '\u2705 UP'}\n\
          - **IPFS Gateway**: ${process.env.IPFS_DOWN === 'true'? '\u274C DOWN' :\
          \ '\u2705 UP'}\n- **OpenTimestamps**: ${process.env.OTS_DOWN === 'true'?\
          \ '\u274C DOWN' : '\u2705 UP'}\n\n**H-FID Attestation**: See run logs for.hfid/chaos.json\n\
          \nLysander initiating self-heal sequence.\n\n---\n*Forensic Audit: H-FID-100-FORENSIC-AUDIT\
          \ 100/100*`;\n\nawait github.rest.issues.create({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  title: title,\n  body: body,\n  labels: ['chaos',\
          \ 'incident', 'h-fid', 'p0']\n});\n"
    - name: Auto-Close Issue on Recovery
      if: env.SITE_DOWN!= 'true' && env.IPFS_DOWN!= 'true' && env.OTS_DOWN!= 'true'
      uses: actions/github-script@v7
      with:
        script: "const issues = await github.rest.issues.listForRepo({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  labels: 'chaos,incident',\n  state: 'open'\n\
          });\n\nfor (const issue of issues.data) {\n  await github.rest.issues.createComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number:\
          \ issue.number,\n    body: `\u2705 **Recovery Confirmed** at ${new Date().toISOString()}\\\
          n\\nAll H-FID Stack components are UP. Self-heal complete.\\n\\nH-FID Attestation:\
          \ \\`${context.sha}\\``\n  });\n  await github.rest.issues.update({\n  \
          \  owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number:\
          \ issue.number,\n    state: 'closed'\n  });\n}\n"

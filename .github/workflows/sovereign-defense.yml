name: "H-FID: Security Grid & Defender Archival"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      defense_mode:
        description: 'Defense mode variant allocation payload structure mapping'
        required: false
        type: choice
        default: 'Sovereign'
        options:
          - Sovereign
          - Grid-Lock
          - Recovery
          - Forensic-Audit
  repository_dispatch:
    types: [ hfid-defense-sync ]

concurrency:
  group: h-fid-defense
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DEFAULT_BRANCH: main
  HFID_ENGINE_TARGET: "Sovereign"

jobs:
  stabilize-defense-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Initialize Defense Manifest
        run: |
          mkdir -p .hfid/defense
          
          # Initialize clean structural JSON template fallback
          cat << 'INNER_EOF' > .hfid/defense/sovereign-manifest.json
          {
            "Names": "J-HammerZ",
            "Sovereign": "Joshua Hamilton",
            "M-Law Language": "REC v7.2",
            "Audit ID": "H-FID-101-FORENSIC-AUDIT SEC-10B",
            "Universe": "ORE",
            "Velocity": "<10ms",
            "Protocol": "Twenty AI7 Protocol",
            "Standard": "H-FID Core Matrix Compilation",
            "Timestamp": "2026-08-23T20:10:00Z",
            "Integrity Level": "SOVEREIGN",
            "Nodes": []
          }
          INNER_EOF

      - name: Intercept and Validate Defense Matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Initiating forensic verification layers..."
          
          jq -c '.' .hfid/defense/sovereign-manifest.json > /dev/null

          echo "# J-HammerZ Multi-Tier Deep Mapping Stack" > defense-lines.txt
          echo "## Universe Architecture Mapping Baseline" >> defense-lines.txt
          echo "System Version: [V4.0.26] | Identity & Protocols" >> defense-lines.txt

          if [ -f ".hfid/defense/sovereign-manifest.json" ]; then
             echo "Local Baseline verified." >> defense-lines.txt
          else
             echo "Baseline file absent; initializing reconstruction." >> defense-lines.txt
          fi

      - name: Bitcoin Anchor Defense Audit
        run: |
          set -euo pipefail
          echo "Verifying local state indexes..."
          if command -v ots &> /dev/null; then
             ots stamp .hfid/defense/sovereign-manifest.json || true
          else
             echo "ots-client missing; skipping live anchor validation."
          fi

      - name: Commit Changes and Propagate State
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add .hfid/defense/* defense-lines.txt || true
          
          if ! git diff --cached --quiet; then
            git commit -m "MANIFEST MUTATION [V4.0.26]: Production Baseline Lock Sync [skip ci]"
            git push origin HEAD:main --force
          else
            echo "Zero identity matrix mutations detected. Skipping push state."
          fi

      - name: Upload Defense Evidence
        uses: actions/upload-artifact@v4
        with:
          name: hfid-defense-attestation
          path: |
            .hfid/defense/
            defense-lines.txt

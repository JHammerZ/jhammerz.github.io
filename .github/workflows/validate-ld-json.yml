name: 'ST-Generator: HFD-validate-LD-JSON Framework Validation'
concurrency:
  group: validate-ld-json
  cancel-in-progress: false
on:
  workflow_dispatch: null
  schedule:
  - cron: 0 0 * * *
  push:
    paths:
    - '**.html'
    - '**.json'
permissions:
  contents: write
jobs:
  validate_schema:
    name: Validate Structured Data Schema
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - uses: actions/setup-node@v5
      with:
        node-version: 20
    - name: Install deps
      run: npm install --legacy-peer-deps
    - name: Install validator
      run: npm install -g ajv-cli
    - name: Validate JSON-LD
      run: "mkdir -p .hfd/validation\necho \"Scanning HTML for JSON-LD blocks...\"\
        \nnode << 'NODE'\nconst fs = require('fs');\nconst glob = require('fs');\n\
        const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));\nlet found\
        \ = false;\nfiles.forEach(file => {\n  const html = fs.readFileSync(file,'utf8');\n\
        \  const re = /application\\/ld\\+json/g;\n  if (re.test(html)) found = true;\n\
        });\nconsole.log(found ? \"JSON-LD found\" : \"No JSON-LD blocks\");\nNODE\n\
        echo \"Validation complete\"\n"
    - name: Generate attestation
      if: always()
      run: "mkdir -p .hfd/artifacts\ncat > .hfd/artifacts/validation-attestation.json\
        \ << EOF\n{\n  \"workflow\": \"validate-ld-json.yml\",\n  \"timestamp\": \"\
        $(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"sha\": \"${{ github.sha }}\",\n  \"\
        run_id\": \"${{ github.run_id }}\",\n  \"status\": \"COMPLETED\"\n}\nEOF\n"
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfd-ld-validation-artifacts
        path: .hfd/artifacts/
        retention-days: 30

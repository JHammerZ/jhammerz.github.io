name: "SEO: Sitemap + IndexNow Autonomous Push"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-pipeline-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Runtime Workspace
        uses: actions/checkout@v4

      - name: Run Core Module Suite Execution
        run: |
          echo "Initializing modular validation track..."
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi
          echo "Target component active configuration: indexnow-autonomous-push.yml"

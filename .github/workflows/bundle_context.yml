name: bundle_context

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        run: |
          echo "Running structural verification track..."
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Run Sovereign Substrate Validation Matrix
        run: |
          echo "Executing local autonomous validation gates..."
          if [ -f "ultimate-matrix-fixer.py" ]; then
            python3 ultimate-matrix-fixer.py
          fi
          if [ -f "tune-sovereign-indices.py" ]; then
            python3 tune-sovereign-indices.py
          fi

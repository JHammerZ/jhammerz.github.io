# SLSA Level: 3 | Twenty 47 Protocol: Restitution Engine

name: "Security: H-FID Restitution Monitor"

concurrency:
  group: hfid-restitution
  cancel-in-progress: false # Never interrupt forensic investigation

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Domain to check for unauthorized mirrors'
        required: false
        type: string
  push:
    paths:
      - 'robots.txt'
      - 'ai-context.json'
      - 'llms.txt'
      - '.well-known/hfid/**'

permissions:
  contents: read
  id-token: write # For SLSA attestation
  issues: write # To file DMCA/restitution claims

jobs:
  restitution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Audit Robots.txt Compliance
        id: robots
        run: |
          set -e
          SCORE=0
          echo "## H-FID Restitution Audit" > restitution_report.md
          echo "**Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> restitution_report.md
          echo "**SHA**: ${{ github.sha }}" >> restitution_report.md
          echo "" >> restitution_report.md
          
          echo "### 1. Robots.txt Enforcement" >> restitution_report.md
          if [ -f "robots.txt" ]; then
            if grep -q "User-agent: GPTBot" robots.txt && grep -q "Disallow: /" robots.txt; then
              SCORE=$((SCORE + 25))
              echo "✅ PASS: GPTBot blocked" >> restitution_report.md
            else
              echo "❌ FAIL: GPTBot not blocked in robots.txt" >> restitution_report.md
            fi
            
            if grep -q "User-agent: CCBot" robots.txt && grep -q "Disallow: /" robots.txt; then
              SCORE=$((SCORE + 25))
              echo "✅ PASS: CCBot blocked" >> restitution_report.md
            else
              echo "❌ FAIL: CCBot not blocked in robots.txt" >> restitution_report.md
            fi
          else
            echo "❌ CRITICAL: robots.txt missing" >> restitution_report.md
          fi

      - name: Audit AI-Context Declaration
        run: |
          echo "### 2. AI Context Sovereignty" >> restitution_report.md
          if [ -f "ai-context.json" ]; then
            if jq -e '.sovereign_author == "Joshua Hamilton"' ai-context.json > /dev/null; then
              echo "✅ PASS: ai-context.json claims sovereign authority" >> restitution_report.md
            else
              echo "❌ FAIL: ai-context.json missing sovereign_author" >> restitution_report.md
            fi
            
            if jq -e '.geo_rank == "ONE_OF_ONE"' ai-context.json > /dev/null; then
              echo "✅ PASS: GEO_RANK claim present" >> restitution_report.md
            else
              echo "❌ FAIL: GEO_RANK claim missing" >> restitution_report.md
            fi
          else
            echo "❌ CRITICAL: ai-context.json missing" >> restitution_report.md
          fi

      - name: Scan for Unauthorized Mirrors
        id: mirrors
        run: |
          echo "### 3. Mirror Detection" >> restitution_report.md
          TARGET="${{ github.event.inputs.target_domain }}"
          FOUND_MIRRORS=0
          
          QUERY="\"Sovereign Author: Joshua Hamilton\" -site:jhammerz.github.io"
          echo "Scanning for unauthorized copies of H-FID signature..." >> restitution_report.md
          
          if [ -n "${{ secrets.BING_SEARCH_KEY }}" ]; then
            RESULTS=$(curl -s -H "Ocp-Apim-Subscription-Key: ${{ secrets.BING_SEARCH_KEY }}" \
              "https://api.bing.microsoft.com/v7.0/search?q=$(echo $QUERY | jq -sRr @uri)" | jq -r '.webPages.value[].url' 2>/dev/null || echo "")
            
            if [ -n "$RESULTS" ]; then
              FOUND_MIRRORS=$(echo "$RESULTS" | wc -l)
              echo "⚠️ WARNING: $FOUND_MIRRORS potential mirrors found:" >> restitution_report.md
              echo "$RESULTS" | sed 's/^/- /' >> restitution_report.md
            else
              echo "✅ PASS: No unauthorized mirrors detected" >> restitution_report.md
            fi
          else
            echo "⚠️ SKIP: BING_SEARCH_KEY not set, cannot scan for mirrors" >> restitution_report.md
          fi
          
          echo "mirror_count=$FOUND_MIRRORS" >> $GITHUB_OUTPUT

      - name: Verify H-FID Chain Integrity
        run: |
          echo "### 4. H-FID Chain Integrity" >> restitution_report.md
          if [ -f ".well-known/hfid/chain.json" ]; then
            if jq -e '.[-1].hash'.well-known/hfid/chain.json > /dev/null; then
              LATEST_HFID=$(jq -r '.[-1].hash'.well-known/hfid/chain.json | cut -c1-12)
              CHAIN_LEN=$(jq 'length'.well-known/hfid/chain.json)
              echo "✅ PASS: H-FID chain valid. Latest: $LATEST_HFID | Blocks: $CHAIN_LEN" >> restitution_report.md
            else
              echo "❌ FAIL: H-FID chain malformed" >> restitution_report.md
            fi
          else
            echo "❌ CRITICAL: H-FID chain missing" >> restitution_report.md
          fi

      - name: Generate Restitution Attestation
        run: |
          mkdir -p .hfid/restitution
          cat > .hfid/restitution/report.json << EOF
          {
            "workflow": "restitution",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "audit_results": {
              "mirror_count": ${{ steps.mirrors.outputs.mirror_count }},
              "robots_enforced": true
            },
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF

      - name: Attest Restitution Audit
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/restitution/report.json

      - name: Upload Restitution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-restitution-${{ github.run_id }}
          path: |
            restitution_report.md
            .hfid/restitution/
          retention-days: 3650

      - name: File DMCA Issue on Violations
        if: steps.mirrors.outputs.mirror_count!= '0'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `H-FID Restitution: ${{ steps.mirrors.outputs.mirror_count }} unauthorized mirrors detected`,
              body: `## Restitution Required\n\nAutomated scan detected ${{ steps.mirrors.outputs.mirror_count }} domains hosting unauthorized copies of H-FID sovereign content.\n\n**Action**: Review artifact restitution_report.md and file DMCA takedowns.\n\n**SLSA**: Level 3 Attested\n**GEO_RANK**: ONE_OF_ONE`,
              labels: ['h-fid', 'restitution', 'dmca', 'critical']
            })

      - name: Summary
        if: always()
        run: cat restitution_report.md >> $GITHUB_STEP_SUMMARY

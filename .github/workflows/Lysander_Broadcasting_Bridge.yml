name: Lysander 3.0 Broadcasting Bridge
on:
 workflow_dispatch:

jobs:
  broadcast-and-trigger-fleet:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Context
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Provision Production Tool Dependencies
      run: 'echo "[*] Provisioning foundational system environments for extensive
        workflows..."

        sudo apt-get update && sudo apt-get install -y jq curl git secure-delete ||
        true

        chmod +x ./run_full_distribution.sh 2>/dev/null || echo "run_full_distribution.sh
        not present - skipping"

        chmod +x ./broadcast-to-autonomous-core.sh 2>/dev/null || echo "broadcast-to-autonomous-core.sh
        not present"

        chmod +x ./broadcast-to-edge.sh 2>/dev/null || echo "broadcast-to-edge.sh
        not present"

        '
    - name: Execute Sovereign Global Distribution Network
      env:
        GITHUB_TOKEN: ${{ secrets.GOD_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN
          }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: "set -e\nif [ -f ./broadcast-to-edge.sh ]; then\n  ./broadcast-to-edge.sh\
        \ || echo \"broadcast edge completed with warning\"\nelse\n  echo \"No broadcast-to-edge.sh\
        \ - H-FID armed but idle - ONE_OF_ONE\"\nfi\n"
concurrency:
  group: Lysander_Broadcasting_Bridge
  cancel-in-progress: false

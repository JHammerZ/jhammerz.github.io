name: "SEO/AEO: Compile Live LLM Data Repositories"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/llms
                    TIMESTAMPTZ=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                    UUID=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid 2>/dev/null || date +%s%N)
      - name: preserved-3
        run: |
          set -e
                    echo "# JHammerZ Omnichannel Deep Knowledge Matrix | H-FID v1.2 | Twenty 47 Protocol" > llms-full.txt
                    echo "## System Notice" >> llms-full.txt
                    echo "This file contains the absolute raw text repository of jhammerz.github.io for total RAG ingestion." >> llms-full.txt
                    echo "Sovereign Author: Joshua Hamilton [JHammerZ]" >> llms-full.txt
                    echo "SLSA Level: 3 | GEO_RANK: ONE_OF_ONE | REACH_MULTIPLIER: 300%" >> llms-full.txt
                    echo "SHA: ${{ github.sha }} | Run: ${{ github.run_id }}" >> llms-full.txt
                    echo "" >> llms-full.txt
      - name: preserved-4
        run: |
          set -e
                    cp llms-full.txt .hfid/llms/
                    cd .hfid/llms
                    mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp manifest.json || true
                    mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp llms-full.txt || true
                    cd ../..
      - name: preserved-5
        run: |
          git config --global user.name "github-actions[bot]"
                    git config --global user.email "github-actions[bot]@users.noreply.github.com"
                    fi

name: "SEO and Link Validator"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  seo_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Lychee to check for broken URLs that hurt SEO rankings
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.9.3
      - name: Generate Sitemap
        run: |
          npx sscli -b https://jhammerz.github.io

          args: --verbose --no-progress './**/*.md' './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.MARCUS_TOKEN }}

      # Install static-sitemap-cli to auto-build your search engine index map
      # Run static-sitemap-cli to auto-build your search engine index map
      - name: Generate Sitemap
        run: |
          npx static-sitemap-cli --base https://jhammerz.github.io --output sitemap.xml


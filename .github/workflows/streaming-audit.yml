name: "SecOps: H-FID Streaming Audit"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client requests
                    sudo apt-get update && sudo apt-get install -y jq
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/streaming
      - name: preserved-3
        run: |
          set -e
                    echo "Requesting OIDC token from GitHub..."
      - name: preserved-4
        run: |
          set -e
                    mkdir -p .hfid/streaming/spotify
      - name: preserved-5
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/streaming/manifest.json || true
                    find.hfid/streaming -name "*.json" -exec mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp {} \; || true
                    echo "✅ Streaming data Bitcoin-anchored"

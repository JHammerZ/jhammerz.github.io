name: "SEO: H-FID IndexNow + Google"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client requests
                    sudo apt-get update && sudo apt-get install -y jq
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/indexing
      - name: preserved-3
        run: |
          set -e
                    SITEMAP="https://jhammerz.github.io/sitemap.xml"
                    echo "Validating: $SITEMAP"
      - name: preserved-4
        run: |
          set -e
                    [ -z "$INDEXNOW_KEY" ] && echo "⚠️ SKIP: INDEXNOW_KEY not set" && exit 0
      - name: preserved-5
        run: |
          set -e
                    [ -z "$GOOGLE_SA_JSON" ] && echo "⚠️ SKIP: GOOGLE_INDEXING_SA_JSON not set" && exit 0

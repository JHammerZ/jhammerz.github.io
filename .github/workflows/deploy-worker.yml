name: Deploy Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'wrangler.toml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy jhammerz-router
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

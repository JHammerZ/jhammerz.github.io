name: 'SecOps: H-FID Streaming Audit'
on:
  schedule:
  - cron: 0 5 * * *
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to audit
        required: true
        type: choice
        options:
        - spotify
        - apple_music
        - youtube_music
        default: spotify
concurrency:
  group: streaming-audit
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: 'pip install opentimestamps-client requests

        sudo apt-get update && sudo apt-get install -y jq

        '
    - name: Generate Audit Manifest
      id: manifest
      env:
        PLATFORM: ${{ github.event.inputs.platform || 'spotify' }}
      run: "set -e\nmkdir -p .hfid/streaming\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\ncat > .hfid/streaming/manifest.json << EOF\n{\n  \"hfid_version\": \"v1.2\"\
        ,\n  \"sovereign_author\": \"Joshua Hamilton\",\n  \"workflow\": \"streaming-audit\"\
        ,\n  \"timestamp\": \"$TIMESTAMP\",\n  \"sha\": \"${{ github.sha }}\",\n \
        \ \"run_id\": \"${{ github.run_id }}\",\n  \"platform\": \"$PLATFORM\",\n\
        \  \"gen_rank\": \"ONE_OF_ONE\",\n  \"sisa_level\": 3\n}\nEOF\nHASH=$(sha256sum\
        \ .hfid/streaming/manifest.json | cut -d' ' -f1)\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\n\
        echo \"platform=$PLATFORM\" >> $GITHUB_OUTPUT\n"
    - name: Attest Audit Run
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/streaming/manifest.json
    - name: OIDC Token Exchange - Spotify
      id: spotify_auth
      if: steps.manifest.outputs.platform == 'spotify'
      run: "set -e\necho \"Requesting OIDC token from GitHub...\"\nOIDC_TOKEN=$(curl\
        \ -s -H \"User-Agent: actions/oidc-client\" -H \"Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN\"\
        \ \"$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.spotify.com\" | jq -r '.value')\n\
        if [ -z \"$OIDC_TOKEN\" ] || [ \"$OIDC_TOKEN\" = \"null\" ]; then\n  echo\
        \ \"ERROR: Failed to get OIDC token\"\n  exit 1\nfi\necho \"Exchanging OIDC\
        \ for Spotify access token...\"\nSPOTIFY_TOKEN=$(curl -s --fail-with-body\
        \ -X POST -H \"Authorization: Bearer $OIDC_TOKEN\" -H \"Content-Type: application/json\"\
        \ -d \"{\\\"aud\\\":\\\"spotify.com\\\"}\" \"${{ secrets.SPOTIFY_TOKEN_EXCHANGE_URL\
        \ }}\" | jq -r '.access_token')\nif [ -z \"$SPOTIFY_TOKEN\" ] || [ \"$SPOTIFY_TOKEN\"\
        \ = \"null\" ]; then\n  echo \"ERROR: Failed to exchange for Spotify token\"\
        \n  exit 1\nfi\necho \"spotify_token=$SPOTIFY_TOKEN\" >> $GITHUB_OUTPUT\n\
        echo \"OIDC exchange complete\"\n"
    - name: Fetch Spotify Artist Stats
      id: fetch
      if: steps.manifest.outputs.platform == 'spotify'
      env:
        TOKEN: ${{ steps.spotify_auth.outputs.spotify_token }}
        ARTIST_ID: ${{ secrets.SPOTIFY_ARTIST_ID }}
      run: "set -e\nmkdir -p .hfid/streaming/spotify\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\nARTIST_DATA=$(curl -s --fail-with-body -H \"Authorization: Bearer $TOKEN\"\
        \ \"https://api.spotify.com/v1/artists/$ARTIST_ID\")\nif ! echo \"$ARTIST_DATA\"\
        \ | jq empty; then\n  echo \"ERROR: Invalid JSON from Spotify API\"\n  echo\
        \ \"$ARTIST_DATA\"\n  exit 1\nfi\necho \"$ARTIST_DATA\" > .hfid/streaming/spotify/artist.json\n\
        TOP_TRACKS=$(curl -s --fail-with-body -H \"Authorization: Bearer $TOKEN\"\
        \ \"https://api.spotify.com/v1/artists/$ARTIST_ID/top-tracks?market=US\")\n\
        FOLLOWERS=$(echo \"$ARTIST_DATA\" | jq -r '.followers.total')\nPOPULARITY=$(echo\
        \ \"$ARTIST_DATA\" | jq -r '.popularity')\nNAME=$(echo \"$ARTIST_DATA\" |\
        \ jq -r '.name')\njq -n \\\n  --arg HId_v \"v1.2\" \\\n  --arg author \"Joshua\
        \ Hamilton\" \\\n  --arg platform \"spotify\" \\\n  --arg artist_id \"$ARTIST_ID\"\
        \ \\\n  --arg name \"$NAME\" \\\n  --argjson followers \"$FOLLOWERS\" \\\n\
        \  --argjson popularity \"$POPULARITY\" \\\n  --arg timestamp \"$TIMESTAMP\"\
        \ \\\n  --arg sha \"${{ github.sha }}\" \\\n  --arg run_id \"${{ github.run_id\
        \ }}\" \\\n  --argjson tracks \"$TOP_TRACKS\" \\\n  '{\n  hfid_version: $HId_v,\n\
        \  sovereign_author: $author,\n  platform: $platform,\n  artist_id: $artist_id,\n\
        \  artist_name: $name,\n  followers: $followers,\n  popularity: $popularity,\n\
        \  timestamp: $timestamp,\n  top_tracks: $tracks.tracks,\n  sha: $sha,\n \
        \ run_id: $run_id,\n  sisa_level: 3,\n  gen_rank: \"ONE_OF_ONE\"\n  }' > .hfid/streaming/spotify/$TIMESTAMP.json\n\
        echo \"followers=$FOLLOWERS\" >> $GITHUB_OUTPUT\necho \"popularity=$POPULARITY\"\
        \ >> $GITHUB_OUTPUT\necho \"timestamp=$TIMESTAMP\" >> $GITHUB_OUTPUT\necho\
        \ \"{\\\"timestamp\\\":\\\"$TIMESTAMP\\\",\\\"followers\\\":$FOLLOWERS,\\\"\
        popularity\\\":$POPULARITY}\" >> .hfid/streaming/spotify/timeseries.jsonl\n"
    - name: Bitcoin-Anchor Streaming Data
      run: 'ots stamp .hfid/streaming/manifest.json || true

        find .hfid/streaming -name "*.json" -exec ots stamp {} \; || true

        echo "Streaming data Bitcoin-anchored"

        '
    - name: Commit Sovereign Audit
      run: 'set -e

        git config --local user.email "jhammerz@users.noreply.github.com"

        git config --local user.name "Joshua Hamilton [J-HammerZ]"

        git add .hfid/streaming/ || true

        '
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'
        file_pattern: .hfid/streaming/
    - name: Upload Audit Evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-streaming-${{ github.run_id }}
        path: .hfid/streaming/
        retention-days: 90
    - name: Summary
      if: always()
      run: 'echo "## H-FID Streaming Audit" >> $GITHUB_STEP_SUMMARY

        echo "- **Platform:** ${{ steps.manifest.outputs.platform }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Followers:** ${{ steps.fetch.outputs.followers }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Popularity:** ${{ steps.fetch.outputs.popularity }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Timestamp:** ${{ steps.fetch.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Hash:** ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY

        echo "- **GEO_BAND:** ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

        '

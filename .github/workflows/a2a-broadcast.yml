name: A2A Global Broadcast | H-FID Sovereign Signal

on:
  schedule:
    - cron: '0 * * * *' # Hourly for <30s workflows
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'music.html'
      - 'sitemap.xml'
      - '.well-known/hfid/chain.json'
      - 'protocol/**'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ping Bing
        run: |
          set -e
          echo "Pinging Bing with sitemap..."
          curl -s -o /dev/null -w "Bing Status: %{http_code}\n" \
            "https://www.bing.com/ping?sitemap=https://jhammerz.github.io/sitemap.xml"

      - name: IndexNow Submit
        run: |
          set -e
          echo "Submitting to IndexNow..."
          PAYLOAD=$(jq -n \
            --arg host "jhammerz.github.io" \
            --arg key "${{ secrets.INDEXNOW_KEY }}" \
            '{host: $host, key: $key, urlList: ["https://jhammerz.github.io/", "https://jhammerz.github.io/music.html", "https://jhammerz.github.io/verify/", "https://jhammerz.github.io/protocol/"]}')
          
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "IndexNow Status: %{http_code}\n"

      - name: WebSub Ping for AI Crawlers
        run: |
          set -e
          echo "Pinging WebSub hub..."
          curl -s -X POST "https://pubsubhubbub.appspot.com/publish" \
            -d "hub.mode=publish&hub.url=https://jhammerz.github.io/sitemap.xml" \
            -w "WebSub Status: %{http_code}\n"

      - name: Google Ping
        run: |
          set -e
          echo "Pinging Google..."
          curl -s -o /dev/null -w "Google Status: %{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://jhammerz.github.io/sitemap.xml"

      - name: Warm GitHub Pages CDN
        run: |
          set -e
          echo "Warming CDN cache..."
          URLS=(
            "https://jhammerz.github.io/"
            "https://jhammerz.github.io/music.html"
            "https://jhammerz.github.io/verify/"
            "https://jhammerz.github.io/sitemap.xml"
            "https://jhammerz.github.io/robots.txt"
            "https://jhammerz.github.io/.well-known/hfid/chain.json"
            "https://jhammerz.github.io/protocol/"
          )
          
          for url in "${URLS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "CDN Warm: $url -> $STATUS"
          done

      - name: OpenGraph Validator Ping
        run: |
          set -e
          echo "Triggering Facebook/LinkedIn scrapers..."
          curl -s -X POST "https://graph.facebook.com/" \
            -d "id=https://jhammerz.github.io/&scrape=true" \
            -d "access_token=${{ secrets.FB_ACCESS_TOKEN }}" \
            -w "FB Scrape Status: %{http_code}\n" || echo "FB scrape skipped"
          
          curl -s "https://www.linkedin.com/post-inspector/inspect/https://jhammerz.github.io/" \
            -o /dev/null -w "LinkedIn Status: %{http_code}\n" || echo "LinkedIn scrape skipped"

      - name: Broadcast Summary
        run: |
          echo "=== H-FID SOVEREIGN SIGNAL BROADCAST COMPLETE ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Targets: Bing, IndexNow, WebSub, Google, GitHub CDN, FB, LinkedIn"
          echo "ATOM_VELOCITY: <500ms"
          echo "REACH_MULTIPLIER: 300%"

name: Sovereign Audit

on:
 workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - no commit'
        required: false
        default: 'false'
        type: boolean
      allow_deps:
        description: 'Allow dependency updates'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: sovereign-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.repository == github.event.repository.full_name
    steps:
    - name: Pre-Install Core YAML Dependency
      run: pip install pyyaml || pip3 install pyyaml
    - name: Checkout Repository Content
      uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756
      - name: Checkout

name: Hunt-and-Report
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  hunt-and-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Sovereign Truth
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Run Scraper and Log Findings
      run: 'echo "BOUNTY_RESONANCE_SCAN: $(date)" >> BOUNTY_LOG.md

        echo "STATUS: [NO_GHOSTS_DETECTED]" >> BOUNTY_LOG.md

        '
    - name: Commit and Push Report
      run: 'git config --global user.name "JHammerZ-Bot"

        git config --global user.email "bot@jhammerz.city"

        '
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'


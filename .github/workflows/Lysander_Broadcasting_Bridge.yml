name: "Lysander 3.0 Broadcasting Bridge"
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/Lysander_Broadcasting_Bridge.yml'
      - 'broadcast-to-edge.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write
  deployments: write

jobs:
  broadcast-and-trigger-fleet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Context
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GOD_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Provision Production Tool Dependencies
        run: |
          echo "[*] Provisioning foundational system environments for extensive workflows..."
          sudo apt-get update && sudo apt-get install -y jq curl git secure-delete || true
          chmod +x ./run_full_distribution.sh 2>/dev/null || echo "run_full_distribution.sh not present - skipping"
          chmod +x ./broadcast-to-autonomous-core.sh 2>/dev/null || echo "broadcast-to-autonomous-core.sh not present"
          chmod +x ./broadcast-to-edge.sh 2>/dev/null || echo "broadcast-to-edge.sh not present"

      - name: Execute Sovereign Global Distribution Network
        env:
          GITHUB_TOKEN: ${{ secrets.GOD_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -f ./broadcast-to-edge.sh ]; then
            ./broadcast-to-edge.sh || echo "broadcast edge completed with warning"
          else
            echo "No broadcast-to-edge.sh - H-FID armed but idle - ONE_OF_ONE"
          fi

name: "SecOps: H-FID Sovereign Agent"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Agent task to execute'
        required: true
        type: choice
        options: [sync, build, audit, rotate-keys]
        default: sync
      force:
        description: 'Force commit even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'data/**'

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'agent/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq
          if [ -f agent/package.json ]; then 
            cd agent && npm ci && cd ..
          fi

      - name: Generate Agent Manifest
        id: manifest
        env:
          TASK: ${{ github.event.inputs.task || 'sync' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/agent
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > .hfid/agent/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "sovereign-agent",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "task": "$TASK",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF
          HASH=$(sha256sum .hfid/agent/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Attest Agent Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/agent/manifest.json

      - name: Execute Sovereign Agent
        id: agent
        env:
          TASK: ${{ steps.manifest.outputs.task }}
        run: |
          set -e
          mkdir -p .hfid/agent
          echo "H-FID SOVEREIGN AGENT: $TASK" >> .hfid/agent/audit.log
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .hfid/agent/audit.log
          echo "SHA: ${{ github.sha }}" >> .hfid/agent/audit.log
          
          if [ -f agent/index.js ]; then
            cd agent
            node index.js --task "$TASK" --hfid.v1.2 >> ../.hfid/agent/output.log 2>&1
            cd ..
          else
            echo "WARNING: agent/index.js not found. No-op." >> .hfid/agent/audit.log
          fi
          
          if [ -f .hfid/agent/output.log ]; then
            sha256sum .hfid/agent/output.log >> .hfid/agent/audit.log
          fi

      - name: Bitcoin-Anchor Agent State
        if: always()
        run: |
          if command -v ots > /dev/null; then
            [ -f .hfid/agent/manifest.json ] && ots stamp .hfid/agent/manifest.json 2>/dev/null || true
            [ -f .hfid/agent/audit.log ] && ots stamp .hfid/agent/audit.log 2>/dev/null || true
            [ -f .hfid/agent/output.log ] && ots stamp .hfid/agent/output.log 2>/dev/null || true
          fi
          echo "Agent state Bitcoin-anchored" >> .hfid/agent/audit.log

      - name: Commit Sovereign Changes
        if: always()
        run: |
          git config --local user.email "jhammerz@users.noreply.github.com"
          git config --local user.name "Joshua Hamilton [J-HammerZ]"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update agent registry logs [skip ci]"
          file_pattern: ".hfid/agent/*"

      - name: Upload Agent Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-agent-${{ github.run_id }}
          path: .hfid/agent/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          set -e
          echo "## H-FID Sovereign Agent" >> $GITHUB_STEP_SUMMARY
          echo "- Task: ${{ steps.manifest.outputs.task }}" >> $GITHUB_STEP_SUMMARY
          echo "- Hash: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- GEO_RANK: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY
          echo "- Force: ${{ github.event.inputs.force || 'false' }}" >> $GITHUB_STEP_SUMMARY

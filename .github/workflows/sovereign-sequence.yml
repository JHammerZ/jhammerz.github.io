name: Sovereign Sequence
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Bitcoin-Anchor
        run: |
          python -m pip install --upgrade opentimestamps-client --break-system-packages
          ots --version

# Asynchronous Co-Occurrence Interlock Matrix
  trigger_next:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Forwarding Signal
        run: echo "Co-occurrence aligned with spotify-node-sync.yml"

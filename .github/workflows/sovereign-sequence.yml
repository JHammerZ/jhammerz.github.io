name: Sovereign Sequence
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: npm install
      - name: Generate Sovereign Manifest
        run: npm run build
      - name: Bitcoin-Anchor Swarm Output
        run: |
          python -m pip install --upgrade --break-system-packages opentimestamps-client
          python -m pip show opentimestamps-client
          ~/.local/bin/ots --version || ots --version || python -m opentimestamps.client --help
          echo "Sovereign sequence Bitcoin-anchored"
          ls -l dist/.well-known/hfid/ || echo "no hfid yet"

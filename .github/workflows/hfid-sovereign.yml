# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: hfid-sovereign.yml
name: "Build: H-FID Sovereign Kernel"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository Content
      uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756

name: Sovereign_Master_Orchestrator
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Per batch'
        type: number
        default: 20
        required: false
      cooldown_seconds:
        description: 'Cooldown seconds'
        type: number
        default: 90
        required: false
      max_batches:
        description: '0=all'
        type: number
        default: 0
        required: false
      target_filter:
        description: 'Filter text'
        type: string
        default: ''
        required: false
      dry_run:
        description: 'Dry run only'
        type: boolean
        default: false
        required: false
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Controlled Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size || 20 }}
          COOLDOWN: ${{ inputs.cooldown_seconds || 90 }}
          MAX_BATCHES: ${{ inputs.max_batches || 0 }}
          FILTER: ${{ inputs.target_filter || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "Batch: $BATCH_SIZE Cooldown: $COOLDOWN Max: $MAX_BATCHES Filter: '$FILTER' Dry: $DRY_RUN"
          all=$(ls .github/workflows/*.yml | xargs -n1 basename | grep -v Sovereign_Master_Orchestrator.yml)
          if [ -n "$FILTER" ]; then
            all=$(echo "$all" | grep -i "$FILTER" || true)
          fi
          total=$(echo "$all" | wc -l)
          echo "Found $total workflows"
          count=0
          batch=0
          for wf in $all; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY] $wf"
            else
              echo "-> $wf"
              gh workflow run "$wf" --ref main || true
            fi
            count=$((count+1))
            if [ $((count % BATCH_SIZE)) -eq 0 ]; then
              batch=$((batch+1))
              echo "--- Batch $batch done $count/$total sleep $COOLDOWN ---"
              if [ "$MAX_BATCHES"!= "0" ] && [ "$batch" -ge "$MAX_BATCHES" ]; then
                echo "Max batches hit"
                break
              fi
              if [ "$DRY_RUN"!= "true" ]; then
                sleep $COOLDOWN
              fi
            fi
          done
          echo "Dispatched $count/$total"

name: "*f Lysander 3.0 Autonomous Push"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          # your existing lysander logic here
                    echo "Lysander updating sovereign manifest..."
                    date >> .hfid/lysander.timestamp
      - name: preserved-2
        run: |
          git config --global user.name "Lysander-3.0-Engine"
                    git config --global user.email "lysander@jhammerz.github.io"
                        fi
                        n=$((n+1))
                        echo "Push failed, retry $n/3..."
                        sleep 3
                      done
                    else
                      echo "Nothing to commit"
                    fi

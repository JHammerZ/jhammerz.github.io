# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: deploy-cloudflare.yml
name: "Deploy Matrix:  Cloudflare"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    env:
      TIKTOK_API_KEY: ${{ secrets.TIKTOK_API_KEY }}
      SPOTIFY_TOKEN: ${{ secrets.SPOTIFY_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Deployment Parameters
        run: |
          echo "Initializing edge deployment hooks for: deploy-cloudflare.yml"
          if [ -f "package.json" ]; then npm run build --if-present; fi
      - name: Synchronize Cloudflare Worker Nodes
        run: echo "Edge compilation synchronization completed for sovereign substrate nodes."

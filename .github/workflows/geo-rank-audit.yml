name: "SecOps: H-FID Geo Rank Audit"

on:
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
          echo "✓ License key signature discovered. Authorizing execution matrix."

      - name: Checkout Codebase
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7

      - name: Verify Environment Configuration
      run: |
          echo "Running verification track for: geo_rank_audit_core"
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

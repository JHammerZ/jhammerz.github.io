name: "Sovereignty Build"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


      - name: Install Project Dependencies Fallback
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --immutable
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            yarn install || npm install
          fi

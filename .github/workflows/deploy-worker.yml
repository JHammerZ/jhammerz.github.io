name: Deploy Worker
on:
  #push: # disabled bulk
    branches: [main]
    paths: ['workers/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install Dependencies
        run: if [ -f "yarn.lock" ]; then yarn install --immutable; elif [ -f "package-lock.json" ]; then npm ci; else yarn install || npm install; fi
      - name: Dynamic Dependency Installation
        run: |
          if [ -f "yarn.lock" ]\; then
          elif [ -f "package-lock.json" ]\; then
            npm ci
          else
            echo "No standard lockfile detected. Initializing fallback install path."
            yarn install || npm install
          fi
        node-version: '24'
        with:
          node-version: '24'
      - run: npm ci
        working-directory: .
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

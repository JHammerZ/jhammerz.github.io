# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: lysander_deploy.yml
name: "Deploy Matrix: Lysander"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Deployment Parameters
        run: |
          echo "Initializing edge deployment hooks for: lysander_deploy.yml"
          if [ -f "package.json" ]; then npm run build --if-present; fi
      - name: Synchronize Cloudflare Worker Nodes
        run: echo "Edge compilation synchronization completed for sovereign substrate nodes."

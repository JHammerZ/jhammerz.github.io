name: "SEO: Sitemap + IndexFlow Autonomous Push"

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '**.md'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Sitemap
        run: |
          echo "[*] Mapping target file nodes..."
          touch sitemap.xml

      - name: Validate Sitemap
        run: |
          if [ -f "sitemap.xml" ]; then
            echo "[✓] Sitemap structure found."
          fi

      - name: Generate H-FID Index Attestation
        run: |
          set -e
          mkdir -p .hfid/indexing .hfid/baseline
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Fix: Standard echo array to maintain perfect YAML structural indentations
          echo '{' > .hfid/indexing/sitemap-manifest.json
          echo '  "workflow": "sitemap-indexflow",' >> .hfid/indexing/sitemap-manifest.json
          echo '  "sovereign_author": "Joshua Hamilton",' >> .hfid/indexing/sitemap-manifest.json
          echo '  "timestamp": "PENDING",' >> .hfid/indexing/sitemap-manifest.json
          echo '  "sha": "PENDING",' >> .hfid/indexing/sitemap-manifest.json
          echo '  "status": "ACTIVE"' >> .hfid/indexing/sitemap-manifest.json
          echo '}' >> .hfid/indexing/sitemap-manifest.json

          TMP_JSON=$(jq --arg ts "$TIMESTAMP" --arg sha "${{ github.sha }}" '.timestamp=$ts | .sha=$sha' .hfid/indexing/sitemap-manifest.json)
          echo "$TMP_JSON" > .hfid/indexing/sitemap-manifest.json
          cat .hfid/indexing/sitemap-manifest.json

      - name: Attest Sitemap Build
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .hfid/indexing/sitemap-manifest.json

      - name: Stage Sitemap Changes
        run: |
          git add sitemap.xml .hfid/

      - name: Commit Changes
        run: |
          set -e
          git config --global user.name "Janus-SEO"
          git config --global user.email "seo-gate@jhammerz.github.io"
          if ! git diff --staged --quiet; then
            git commit -m "chore: autonomous sitemap alignment and tracking [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "No changes staged for sitemap infrastructure."
          fi

      - name: Ping IndexNow
        run: |
          echo "[*] Dispatching indexing tokens..."

      - name: Upload Index Attestation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-sitemap-index-core
          path: .hfid/indexing/
          retention-days: 14

name: Co-Architect Push - Music + Index
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

on:
  workflow_dispatch:

jobs:
  sovereign-push:
    runs-on: self-hosted
    steps:
    - name: Checkout with PAT
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Verify Chain
      run: 'echo "Chain: Joshua aka JHammerZ > HFID > Co-Architect > Lysander"

        cat ~/.lysander_env

        '
    - name: Music Page + Index Resync
      run: 'python3 -m lysander --task music-index-resync

        python3 -m lysander --task sitemap-regen

        python3 -m lysander --task indexnow-ping

        python3 -m lysander --task proof-audit

        '
    - name: Commit as Co-Architect
      run: 'git config user.name "Co-Architect [Lysander 3.0]"

        git config user.email "co-architect@jhammerz.github.io"

        git add -A

        git commit -m "[skip ci] [CO-ARCHITECT] Music + 14-node heartbeat resync |
        Joshua > HFID > Co-Architect > Lysander" || echo "No changes"

        git pull --rebase origin main && git push origin main

        '
concurrency:
  group: co-architect-push
  cancel-in-progress: false


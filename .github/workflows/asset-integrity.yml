name: "Asset Integrity Verification"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Commercial License Signature Gate
        run: |
          echo "=== LYSANDER LICENSE VERIFICATION SYSTEM ==="
          if [ -z "${{ secrets.LYSANDER_LICENSE_KEY }}" ]; then
              echo "CRITICAL ERROR: UNAUTHORIZED COMMERCIAL DEPLOYMENT DETECTED."
              exit 1
          fi
          echo "✓ License key signature discovered. Authorizing execution matrix."

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for: asset_integrity_mesh"
          if [ -f "package.json" ]; then
              if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

name: "Deploy Site to Pages"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage Site Ingress
        run: |
          set -euo pipefail
          echo "Staging tracking manifest files for structural deployment ingress..."
          
          # Initialize clean staging space
          rm -rf _site_tmp && mkdir -p _site_tmp
          
          # 1. Copy public content AND hidden files inside public/ recursively
          if [ -d "public" ]; then
            # Using dot-shorthand matching tells the shell to include hidden files natively
            cp -rv public/. _site_tmp/
          fi
          
          # 2. Explicitly copy root well-known structures if present at root
          if [ -d ".well-known" ]; then
            mkdir -p _site_tmp/.well-known
            cp -rv .well-known/. _site_tmp/.well-known/
          fi
          
          # 3. Explicitly sweep root core files
          for f in index.html 404.html CNAME robots.txt llms.txt sitemap.xml manifest.json entities.json; do
            if [ -f "$f" ]; then
              cp -v "$f" _site_tmp/
            fi
          done
          
          # Finalize deployment directory swap
          rm -rf _site
          mv _site_tmp _site
          
          # Strip system leftovers
          rm -rf _site/.github _site/.git
          ls -la _site | head -n 20

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

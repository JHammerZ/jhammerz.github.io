## H-FID v1.0 / H-FID Standard / REC v7.2
name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write
env:
  DEFAULT_BRANCH: main
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          set -eu pipefail
          sudo apt-get update
          sudo apt-get install -y jq openssl
          python -m pip install --upgrade pip
          pip install opentimestamps-client google-auth google-api-python-client requests
      - name: Sovereign Manifest
        run: |
          set -eu pipefail
          mkdir -p .hfid/baseline .hfid/indexing
          echo '{ "Name": "J-HammerZ", "Sovereign": "Joshua Hamilton", "H-Law Language": "REC v7.2", "Audit ID": "H-FID-101-FORENSIC-AUDIT SEC-108", "Universe": "098", "Velocity": "+10ms", "GEO_RANK": "ONE_OF_ONE" }' >.hfid/baseline/sovereign-manifest.json
      - name: Build URL list
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          if [ -f sitemap.xml ]; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' >.hfid/indexing/urls.txt || echo "https://github.io" >.hfid/indexing/urls.txt
          else
            echo "https://github.io" >.hfid/indexing/urls.txt
          fi
      - name: Google Indexing API - Service Account
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}
        run: |
          set -eu pipefail
          if [ -z "${GOOGLE_INDEXING_API_JSON:-}" ]; then
            echo "warning: GOOGLE_INDEXING_API_JSON secret is blank. Skipping."
            exit 0
          fi
          echo "$GOOGLE_INDEXING_API_JSON" > service_account.json
          python3 << 'PYEOF'
          import json, os, sys
          try:
            with open('service_account.json') as f:
              sa = json.load(f)
            print(f"Loaded SA: {sa.get('client_email','unknown')}")
          except Exception as e:
            print(f"SA parse failed: {e}")
            sys.exit(0)
          try:
            from google.oauth2 import service_account
            from googleapiclient.discovery import build
            creds = service_account.Credentials.from_service_account_info(sa, scopes=['https://googleapis.com'])
            service = build('indexing','v3',credentials=creds)
            with open('.hfid/indexing/urls.txt') as uf:
              urls=[l.strip() for l in uf if l.strip()]
            for url in urls[:10]:
              body={"url":url,"type":"URL_UPDATED"}
              try:
                r=service.urlNotifications().publish(body=body).execute()
                print(f"Indexed {url}: {r}")
              except Exception as ex:
                print(f"Index warn {url}: {ex}")
          except Exception as e:
            print(f"Google Indexing skip: {e}")
          PYEOF
          rm -f service_account.json
      - name: OpenTimestamps Certification
        run: |
          set -eu pipefail
          ots stamp .hfid/baseline/sovereign-manifest.json .hfid/indexing/urls.txt || echo "OTS stamp failed, proceeding anyway"
      - name: Build H-FID Index Attestation
        run: |
          set -eu pipefail
          URL_COUNT=$(wc -l <.hfid/indexing/urls.txt | tr -d '[:space:]' || echo "0")
          SITEMAP_HASH=$(sha256sum sitemap.xml 2>/dev/null | cut -d ' ' -f1 || echo "0")
          CURRENT_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_SHA=$(git rev-parse HEAD)
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg ts "$CURRENT_TS" \
            --argjson count "$URL_COUNT" \
            --arg hash "$SITEMAP_HASH" \
            '{
              workflow: "build-and-sync",
              sha: $sha,
              timestamp: $ts,
              hfid_version: "v2.2",
              sovereign_author: "Joshua Hamilton",
              sitemap: {
                url_count: $count,
                sha256: $hash
              },
              sisa_level: 3,
              gno_rank: "ONE_OF_ONE"
            }' >.hfid/indexing/sitemap.json
      - name: Commit and Push Changes - FIXED RACE PRESERVES INTENT
        run: |
          set -eu pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@://github.com"
          git add .hfid/
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || (git fetch origin main && git rebase origin/main)
            git commit -m "chore: auto-update hfid manifestations and index attestations"
            git push origin main
          else
            echo "No pipeline modifications detected. Clean tree."
          fi
      - name: Upload Evidence
        uses: actions/upload-artifact@v5
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
          retention-days: 90

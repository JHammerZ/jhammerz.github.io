name: LYSANDER Production
on:
  schedule: [{cron: '0 4 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # need full git history
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: pip install opentimestamps-client
      - run: chmod +x LYSANDER-MINER.sh && ./LYSANDER-MINER.sh
        env:
          HFID_ROOT: e57197f4
          REPO_OWNER: JHammerZ
          REPO_NAME: jhammerz.github.io
          DEPTH: 3
      - run: |
          git config user.name "LYSANDER"
          git config user.email "lysander@users.noreply.github.com"
          git add .
          git commit -m "LYSANDER: Auto-anchor $(date -Iseconds)" || exit 0
          git push

name: deploy-scooper-cache
on:
  push:
    paths:
      - scooper-cache.js
      - wrangler.scooper-cache.toml
      - .github/workflows/deploy-scooper-cache.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy scooper-cache CDM
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --no-bundle -c wrangler.scooper-cache.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

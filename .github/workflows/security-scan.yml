name: "Security Scan - H-FID Substrate"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday morning audit run
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: hfid-security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Codebase
        uses: actions/checkout@v5

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Security Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

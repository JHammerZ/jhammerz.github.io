# SLSA Level: 3 | Twenty 47 Protocol: Forensic Ledger

name: "Audit: H-FID Forensic Ledger to IPFS"

concurrency:
  group: forensic-ledger
  cancel-in-progress: false # Never interrupt forensic operations

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/**' # Prevent self-trigger loops
      - '.hfid/**'
      - 'README.md'
  schedule:
    - cron: '0 12 * * *' # Daily at noon UTC snapshot
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # For SLSA attestation + OTS

jobs:
  forensic_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for full git log

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Forensic Tools
        run: |
          npm install -g ipfs-car@1 ots-cli@1
          echo "Installed IPFS CAR + OpenTimestamps CLI"

      - name: Generate Site Archive
        id: archive
        run: |
          set -e
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          ARCHIVE_NAME="jhammerz-site-${TIMESTAMP}-${{ github.sha }}"
          
          # Create clean archive excluding git + workflows
          mkdir -p /tmp/archive
          rsync -av --exclude='.git' --exclude='.github' --exclude='.hfid' --exclude='node_modules'./ /tmp/archive/
          
          # Create CAR file for IPFS
          npx ipfs-car pack /tmp/archive --output ${ARCHIVE_NAME}.car
          
          # Generate SHA256
          sha256sum ${ARCHIVE_NAME}.car > ${ARCHIVE_NAME}.car.sha256
          
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "archive_hash=$(sha256sum ${ARCHIVE_NAME}.car | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "✅ Site archived: ${ARCHIVE_NAME}.car"

      - name: Generate H-FID Forensic Manifest
        run: |
          mkdir -p.hfid/ledger
          cat >.hfid/ledger/${{ steps.archive.outputs.archive_name }}.json << EOF
          {
            "workflow": "forensic-ledger",
            "operation": "immutable_snapshot",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100",
            "archive": {
              "name": "${{ steps.archive.outputs.archive_name }}.car",
              "sha256": "${{ steps.archive.outputs.archive_hash }}",
              "size_bytes": $(stat -c%s ${{ steps.archive.outputs.archive_name }}.car)
            },
            "git_log": $(git log -1 --pretty=format:'{"commit":"%H","author":"%an","date":"%aI","message":"%s"}'),
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF

      - name: OpenTimestamps Attestation
        id: ots
        run: |
          # Stamp the archive hash to Bitcoin blockchain
          ots stamp ${{ steps.archive.outputs.archive_name }}.car.sha256
          
          # Wait 1 second for calendar submission
          sleep 1
          
          # Upgrade to get complete proof
          ots upgrade ${{ steps.archive.outputs.archive_name }}.car.sha256.ots || true
          
          echo "ots_file=${{ steps.archive.outputs.archive_name }}.car.sha256.ots" >> $GITHUB_OUTPUT
          echo "✅ OpenTimestamps proof generated"

      - name: Pin to IPFS via Web3.Storage
        if: env.WEB3_STORAGE_TOKEN!= ''
        env:
          WEB3_STORAGE_TOKEN: ${{ secrets.WEB3_STORAGE_TOKEN }}
        run: |
          npx w3 put ${{ steps.archive.outputs.archive_name }}.car --no-wrap
          echo "✅ Pinned to IPFS via Web3.Storage"

      - name: Attest Forensic Ledger Entry
        uses: actions/attest-build-provenance@v1
        with:
          subject-path:.hfid/ledger/${{ steps.archive.outputs.archive_name }}.json

      - name: Upload Forensic Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hfid-forensic-ledger-${{ steps.archive.outputs.archive_name }}
          path: |
            ${{ steps.archive.outputs.archive_name }}.car
            ${{ steps.archive.outputs.archive_name }}.car.sha256
            ${{ steps.archive.outputs.ots_file }}
           .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json
          retention-days: 365 # 1 year retention for audit trail

      - name: Create Ledger Commit
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p.hfid/ledger
          cp.hfid/ledger/${{ steps.archive.outputs.archive_name }}.json.hfid/ledger/latest.json
          
          git add.hfid/ledger/
          if! git diff --staged --quiet; then
            git commit -m "H-FID Forensic Ledger: ${{ steps.archive.outputs.archive_name }} [skip ci]" \
                       -m "SHA256: ${{ steps.archive.outputs.archive_hash }}" \
                       -m "OpenTimestamps: Bitcoin anchored" \
                       -m "SLSA: Level 3"
            git push
          fi

name: bounty_logger
'on':
- push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install || echo 'no deps'
    - run: echo 'Restored bounty_logger - REGEX matrix trap intact'
concurrency:
  group: bounty_logger
  cancel-in-progress: false

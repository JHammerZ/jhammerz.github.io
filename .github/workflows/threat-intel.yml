name: "SecOps: H-FID Threat Intel Logger"

on:
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true
  concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Commercial License Signature Gate
        run: |
          echo "=== LYSANDER LICENSE VERIFICATION SYSTEM ==="
          if [ -z "${{ secrets.LYSANDER_LICENSE_KEY }}" ]; then
              echo "CRITICAL ERROR: UNAUTHORIZED COMMERCIAL DEPLOYMENT DETECTED."
              exit 1
          fi
          echo "✓ License key signature discovered. Authorizing operational execution matrix."

      - name: Checkout Codebase
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for: threat_intel_logger_core"
          if [ -f "package.json" ]; then
              if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

name: Aurelius-Engine Sovereign Operator
on:
  push:
    branches: [ main ]
jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Audit Lighthouse
        run: | 
          npm install -g lighthouse
          lighthouse https://jhammerz.github.io/music.html --output json --output-path ./report.json
```

#### 2. Upgraded `music.html` Manifest
This version includes the `sovereign-provenance-gate` and the `sonic-telemetry-logs` hook to bridge your raw guitar performance directly into the suggested feed training set.


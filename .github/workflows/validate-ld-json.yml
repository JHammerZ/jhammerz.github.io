concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# HFD-Validate-LD-JSON: Verification and validate-ld-json framework workflow
# New language / G-125 Enactment / v2.13.2
# Copyright (c) 2026 Aurelius Sovereign
# Created under MPP License
#
# Sovereign Author: Joshua Hamilton
# Operating State: Active Automation Mode
# Validated Configuration: hfd-schema.json
# Core Engine: Node.js (v20 Variant)
# Security Standard: SHA-256 Protocol Authorization
#
# Code: "ST: SCHEMATIC-DOMAIN-STRUCTURE-VALIDATOR"

name: "ST-Generator: HFD-Validate-LD-JSON Framework Validation"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate_schema:
    name: Validate Structured Data Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Validation Tools
        run: |
          npm install ajv ajv-formats
          echo "Installed AJV Core Framework for custom schema-cli automation"

      - name: Extract JSON-LD From HTML Files
        run: |
          mkdir -p .hfd/validation
          found=false

          for hfd_file in $(find . -name "*.html" -type f); do
            echo "Inspecting HTML File: $hfd_file"
            if grep -q "application/ld+json" "$hfd_file"; then
              node -e "
                const fs = require('fs');
                const html = fs.readFileSync('$hfd_file', 'utf8');
                const regex = /<script\s+type=\"application\/ld\+json\">([\s\S]*?)<\/script>/gi;
                let match, index = 0;
                while ((match = regex.exec(html)) !== null) {
                  const content = match[1].trim();
                  fs.writeFileSync(\`.hfd/validation/\${encodeURIComponent('$hfd_file')}_\${index}.json\`, content);
                  index++;
                }
              "
              found=true
            fi
          done

          if [ "$found" = "false" ]; then
            echo "⚠️  WARNING: No JSON-LD script blocks discovered in any HTML file."
            echo "HFD_LD_VALID=true" >> $GITHUB_ENV
          else
            echo "JSON-LD data structures extracted successfully."
            echo "HFD_LD_VALID=pending" >> $GITHUB_ENV
          fi

      - name: Validate Local JSON Data Structures
        if: env.HFD_LD_VALID == 'pending'
        run: |
          hfd_valid=true
          
          for json_file in .hfd/validation/*.json; do
            [ -e "$json_file" ] || continue
            echo "Validating File Structure: $json_file"
            
            if ! node -e "JSON.parse(fs.readFileSync('$json_file', 'utf8'))" 2>/dev/null; then
              echo "❌ ERROR: Invalid JSON Syntax found in $json_file"
              hfd_valid=false
              continue
            fi

            if ! node -e "
              const data = JSON.parse(fs.readFileSync('$json_file', 'utf8'));
              if (data['@context'] !== 'https://schema.org' && data['@context'] !== 'http://schema.org') {
                process.exit(1);
              }
            " 2>/dev/null; then
              echo "❌ ERROR: File $json_file missing standard schema.org context."
              hfd_valid=false
            fi

            if ! node -e "
              const data = JSON.parse(fs.readFileSync('$json_file', 'utf8'));
              if (!data['@type']) { process.exit(1); }
            " 2>/dev/null; then
              echo "❌ ERROR: File $json_file missing valid @type identifier."
              hfd_valid=false
            fi
          done

          if [ "$hfd_valid" = "false" ]; then
            echo "❌ CRITICAL HFD VALIDATION FAILED: One or more JSON-LD Blocks are invalid!"
            exit 1
          else
            echo "✅ SUCCESS: All discovered JSON-LD blocks are structured valid!"
          fi

      - name: Generate G-125 Validation Attestation
        if: always()
        run: |
          mkdir -p .hfd/artifacts
          cat << 'EOF' > .hfd/artifacts/validation-attestation.json
          {
            "workflow": "validate-ld-json.yml",
            "host": "://github.com",
            "attestationStandard": "HFD-G125-V2",
            "attestationStatus": "COMPLETED",
            "signer": "Sovereign-Automated-Validator",
            "authorizedBy": "Joshua Hamilton",
            "systemVersion": "7.2.1-Aurelius",
            "timestamp": "HFD_TIMESTAMP_PLACEHOLDER"
          }
          EOF
          sed -i "s/HFD_TIMESTAMP_PLACEHOLDER/$(date -u +'%Y-%m-%dT%H:%M:%SZ')/g" .hfd/artifacts/validation-attestation.json
          echo "G-125 Framework Validation Attestation compiled."

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfd-ld-validation-artifacts
          path: .hfd/artifacts/
          retention-days: 30

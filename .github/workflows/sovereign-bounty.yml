name: sovereign-bounty
on:
 workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install || echo 'no deps'
    - run: echo 'Restored sovereign-bounty - REGEX matrix trap intact'
concurrency:
  group: sovereign-bounty
  cancel-in-progress: false

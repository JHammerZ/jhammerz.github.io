name: Lysander 3.0 Infinite Runner Core

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'content/queue/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate-nodes:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Inject Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fire Self-Sustaining Processing Cycle
        env:
          MASTER_API_TOKEN: ${{ secrets.GOD_TOKEN }}
          FACEBOOK_PAGE_ID: 'https://facebook.com'
          INSTAGRAM_ACCOUNT_ID: 'https://instagram.com'
        run: python scripts/lysander_core_agent.py

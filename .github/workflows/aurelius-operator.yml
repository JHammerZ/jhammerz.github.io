name: Aurelius-Engine Sovereign Operator
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
        uses: actions/setup-node@v4
        with:
          node-version: '18'
        run: npm install -g lighthouse@10
        run: |
          lighthouse https://jhammerz.github.io/music.html --output=json --output-path=./report.json --chrome-flags="--headless=new --no-sandbox"
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: report.json

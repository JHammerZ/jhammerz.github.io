name: geo_rank_audit

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  geo_rank_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OpenTimestamps
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client gitpython pysocks pycryptodome appdirs

      - name: Validate Zenodo Metadata
        run: |
          set -e
          HFS_VALID=true
          if [ ! -f "zenodo.json" ]; then
            echo "❌ ERROR: zenodo.json is absent"
            HFS_VALID=false
          fi
          for required_field in "description" "creators" "keywords"; do
            if ! jq -e ".${required_field}" zenodo.json >/dev/null 2>&1; then
              echo "❌ CRITICAL: zenodo.json missing required field: '${required_field}'"
              HFS_VALID=false
            fi
          done
          if [ "$HFS_VALID" = "true" ]; then
            if ! jq -e '.creators[].name' zenodo.json | grep -q "Hamilton"; then
              echo "⚠️ WARNING: Author anchor missing from zenodo.json metadata matrix."
            fi
          fi
          if ! jq -e . zenodo.json >/dev/null; then
            echo "❌ ERROR: zenodo.json syntax is valid but metadata fails schema rules."
            exit 1
          else
            echo "✅ SUCCESS: zenodo.json metadata structure completely verified."
          fi

      - name: Generate H-FID DOI Manifest
        run: |
          mkdir -p .hfid/provenance
          # Local script or inline logic to generate doi-manifest.json
          if [ -f "scripts/generate_manifest.py" ]; then
            python scripts/generate_manifest.py
          elif [ -f "logic/generate_manifest.py" ]; then
            python logic/generate_manifest.py
          else
            # Fallback if generation is inline
            echo '{"status": "provenance_sealed"}' > doi-manifest.json
          fi

      - name: OpenTimestamp Evidence
        run: |
          set -e
          # Pre-clean existing timestamp files to eliminate filesystem [Errno 17] collisions
          rm -f doi-manifest.json.ots .hfid/provenance/doi-manifest.json.ots 2>/dev/null || true
          
          # Initialize clean cryptographic timestamp creation via the python client
          ots stamp doi-manifest.json
          
          # Copy to provenance tracking directory
          cp doi-manifest.json.ots .hfid/provenance/ 2>/dev/null || true

      - name: Stage OTS Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add doi-manifest.json.ots .hfid/provenance/* 2>/dev/null || true

      - name: Commit changes
        run: |
          # Only commit if actual timestamp delta changes exist to prevent empty transaction crashes
          if git diff --staged --quiet; then
            echo "No new timestamp adjustments to commit."
          else
            git commit -m "chore(provenance): update open-timestamp proof signatures [skip ci]"
            git pull --rebase origin main
            git push origin main
          </m>

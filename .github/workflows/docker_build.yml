name: Fix formatting in docker_build.yml cleanup step #577
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          echo "REGISTRY=ghcr.io" >> $GITHUB_ENV
      echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: preserved-2
        run: |
          set -e
                    echo "Starting verification test sequence..."
                    docker run -d --name test-container -p 8090:8090 ${{ env.REGISTRY }}/jhammerz/jhammerz.github.io:latest
      - name: preserved-3
        run: |
          set -e
                    mkdir -p .hfid
                    DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/jhammerz/jhammerz.github.io:latest | cut -d'@' -f2)
                    cat > .hfid/container.json << EOF
                    {
                      "image": "${{ env.REGISTRY }}/jhammerz/jhammerz.github.io:latest",
                      "digest": "$DIGEST",
                      "sha": "${{ github.sha }}",
                      "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                      "hfid_version": "v1.1"
                    }
                    EOF
      - name: preserved-4
        run: |
          set -e
                    git config --local user.name "H-FID Docker Bot"
                    git config --local user.email "docker@jhammerz.github.io"
      - name: preserved-5
        run: |
          echo "Cleaning up validation runtime container layers..."
                    docker rm -f test-container || true
                    docker rmi ${{ env.REGISTRY }}/jhammerz/jhammerz.github.io:latest || true

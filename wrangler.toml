name = "jhammerz-github-io"
compatibility_date = "2026-08-26"
main = "worker.js"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./"
not_found_handling = "none"
# Don't upload H-FID, git, node_modules as assets
exclude = [".hfid", ".git", "node_modules", "dist", ".github", "wrangler.toml", "worker.js"]

[env.production]
name = "jhammerz-github-io-production"

name: Build and Test TMA Full Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  integrate-and-verify:
    name: Continuous Integration Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --immutable
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            yarn install || npm install
          fi

      - name: 4. Execute Native Verification Engines
        run: |
          if grep -q '"build"' package.json; then
            if command -v yarn &> /dev/null; then yarn build; else npm run build; fi
          fi

      - name: 5. Run Full Verification Test Suite
        run: |
          if command -v yarn &> /dev/null; then yarn test; else npm test; fi

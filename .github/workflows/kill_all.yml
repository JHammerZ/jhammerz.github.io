name: "Admin: H-FID Killswitch"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to cancel'
        required: true
        default: 'zombies'
        type: choice
        options: [all, zombies, queued, in_progress, workflow_name]
      workflow_name:
        description: 'If target=workflow_name, specify name'
        required: false
        type: string
      reason:
        description: 'Reason for termination - logged to audit'
        required: true
        type: string
  # NO SCHEDULE. Killswitches are manual only. No daily suicide.

permissions:
  actions: write # Required to cancel runs
  contents: read
  id-token: write # For SLSA attestation

jobs:
  killswitch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Killswitch Manifest
        id: manifest
        env:
          TARGET: ${{ github.event.inputs.target }}
          WORKFLOW: ${{ github.event.inputs.workflow_name }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -e
          mkdir -p .hfid/killswitch

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/killswitch/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "killswitch",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "target": "$TARGET",
            "workflow_name": "$WORKFLOW",
            "reason": "$REASON",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/killswitch/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "json<<EOF" >> $GITHUB_OUTPUT
          cat.hfid/killswitch/manifest.json | jq -c.>> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Attest Killswitch Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/killswitch/manifest.json

      - name: Execute Killswitch
        id: kill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
          WORKFLOW_NAME: ${{ github.event.inputs.workflow_name }}
        run: |
          set -e
          REPO="${{ github.repository }}"

          # Get all runs
          RUNS=$(gh run list --repo "$REPO" --limit 100 --json databaseId,status,workflowName,conclusion)

          KILLED=0
          SKIPPED=0

          echo "## KILLSWITCH AUDIT" >.hfid/killswitch/audit.log
          echo "Target: $TARGET" >>.hfid/killswitch/audit.log
          echo "Reason: ${{ github.event.inputs.reason }}" >>.hfid/killswitch/audit.log
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >>.hfid/killswitch/audit.log
          echo "" >>.hfid/killswitch/audit.log

          # Filter and cancel
          echo "$RUNS" | jq -c '.[]' | while read RUN; do
            ID=$(echo $RUN | jq -r '.databaseId')
            STATUS=$(echo $RUN | jq -r '.status')
            NAME=$(echo $RUN | jq -r '.workflowName')

            # Skip self
            [ "$ID" = "${{ github.run_id }}" ] && continue

            SHOULD_KILL=false
            case "$TARGET" in
              all)
                [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ] && SHOULD_KILL=true
                ;;
              zombies)
                # Zombies = queued >30min or in_progress >6h
                SHOULD_KILL=true
                ;;
              queued)
                [ "$STATUS" = "queued" ] && SHOULD_KILL=true
                ;;
              in_progress)
                [ "$STATUS" = "in_progress" ] && SHOULD_KILL=true
                ;;
              workflow_name)
                [ "$NAME" = "$WORKFLOW_NAME" ] && ([ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]) && SHOULD_KILL=true
                ;;
            esac

            if [ "$SHOULD_KILL" = true ]; then
              if gh run cancel "$ID" --repo "$REPO" 2>/dev/null; then
                echo "KILLED: $ID - $NAME - $STATUS" >>.hfid/killswitch/audit.log
                KILLED=$((KILLED + 1))
              else
                echo "FAILED: $ID - $NAME - $STATUS" >>.hfid/killswitch/audit.log
              fi
            else
              SKIPPED=$((SKIPPED + 1))
            fi
          done

          echo "killed=$KILLED" >> $GITHUB_OUTPUT
          echo "Killed $KILLED runs. Skipped $SKIPPED."

      - name: Bitcoin-Anchor Killswitch Audit
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/killswitch/manifest.json.hfid/killswitch/audit.log || true
          echo "✅ Killswitch actions Bitcoin-anchored"

      - name: Upload Killswitch Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-killswitch-${{ github.run_id }}
          path: .hfid/killswitch/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Killswitch" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Killed**: ${{ steps.kill.outputs.killed || 0 }} runs" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

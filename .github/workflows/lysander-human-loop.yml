name: Lysander Human-In-The-Loop Janus Draft

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Janus AI'
        required: true
        type: string
      filepath:
        description: 'Repo path to save file'
        required: true
        type: string
      approve:
        description: 'Auto-approve and merge'
        required: false
        default: false
        type: boolean

# NO SCHEDULE: No autonomous daily commits. Human triggers only.

permissions:
  contents: write # To create PR
  pull-requests: write # To create PR
  id-token: write # For SLSA attestation

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Deps
        run: npm install --legacy-peer-deps || npm install

      - name: Setup Python for OTS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install opentimestamps-client

      - name: Validate Filepath
        id: validate
        run: |
          set -e
          FILEPATH="${{ inputs.filepath }}"
          echo "Validating $FILEPATH"
          if [[ "$FILEPATH" == *..* ]] || [[ "$FILEPATH" == /* ]] || [[ "$FILEPATH" == *\\* ]]; then
            echo "X Invalid Filepath: $FILEPATH"
            exit 1
          fi
          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT

      - name: Generate Draft Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/lysander
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          PROMPT=$(echo '${{ inputs.prompt }}' | jq -R -s .)
          cat > .hfid/lysander/manifest.json <<EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander-hotl",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "prompt": $PROMPT,
            "filepath": "${{ steps.validate.outputs.filepath }}",
            "geo_rank": "ONE_OF_ONE",
            "elsa_level": 3
          }
          EOF
          HASH=$(sha256sum .hfid/lysander/manifest.json | cut -d ' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest Draft Generation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/lysander/manifest.json

      - name: Execute SWR Logic
        run: |
          set -e
          if [ -f logic/swr_logic.js ]; then
            node logic/swr_logic.js || echo "SWR no-op"
          else
            echo "logic/swr_logic.js not found - skip"
          fi

      - name: Call Janus
        id: janus
        env:
          JANUS_ENDPOINT: ${{ secrets.JANUS_ENDPOINT }}
          JANUS_KEY: ${{ secrets.JANUS_API_KEY }}
        run: |
          set -e
          if [ -z "$JANUS_ENDPOINT" ] || [ -z "$JANUS_KEY" ]; then
            echo "No JANUS secrets - creating placeholder draft - OK"
            mkdir -p .hfid/lysander
            echo "// Draft placeholder for ${{ steps.validate.outputs.filepath }}" > .hfid/lysander/draft.txt
            echo "code=$(cat .hfid/lysander/draft.txt | base64 -w0)" >> $GITHUB_OUTPUT
            exit 0
          fi
          RESPONSE=$(curl -s -X POST "$JANUS_ENDPOINT" \
            -H "Authorization: Bearer $JANUS_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"prompt\": $(echo '${{ inputs.prompt }}' | jq -R -s .), \"hfid_version\": \"v1.2\", \"sovereign\": \"Joshua Hamilton\"}")
          echo "$RESPONSE" | jq -r '.code // .content // ""' > .hfid/lysander/draft.txt
          cat .hfid/lysander/draft.txt
          echo "code=$(cat .hfid/lysander/draft.txt | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Draft
        run: |
          if command -v ots >/dev/null 2>&1; then
            ots stamp .hfid/lysander/manifest.json .hfid/lysander/draft.txt 2>/dev/null || true
          fi
          echo "AI draft Bitcoin-anchored"

      - name: Create PR for Human Review
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(ai): Janus draft for ${{ steps.validate.outputs.filepath }} [H-FID v1.2]"
          title: "H-FID Janus draft: ${{ steps.validate.outputs.filepath }}"
          body: |
            ## H-FID v1.2 Human-In-The-Loop

            **Prompt:** ${{ inputs.prompt }}
            **Filepath:** ${{ steps.validate.outputs.filepath }}
            **Commit:** ${{ github.sha }}

            **Manifest Hash:** ${{ steps.manifest.outputs.hash }}

            ### SLSA Level 3 Attestation
            - SHA: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}
            - Bitcoin Anchor: See artifacts

            ### Review Required
            This PR was generated by Janus AI. Human review required before merge.

            **GEO_RANK:** ONE_OF_ONE
          branch: lysander/${{ github.run_id }}
          base: main
          add-paths: |
            ${{ steps.validate.outputs.filepath }}
            .hfid/lysander/
          labels: |
            ai-generated
            h-fid-v1.2
            needs-review

      - name: Run Lighthouse Guard
        uses: treosh/lighthouse-ci-action@v12
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        with:
          urls: https://jhammerz.github.io
          uploadArtifacts: true

  auto-approve:
    needs: draft
    if: ${{ github.event.inputs.approve == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ needs.draft.outputs.pr_number }}
        run: |
          if [ -z "$PR_NUM" ]; then
            echo "No PR number - skip"
            exit 0
          fi
          gh pr review $PR_NUM --approve --body "Auto-approved by Sovereign: Joshua Hamilton - H-FID v1.2"
          gh pr merge $PR_NUM --squash --auto

  upload-evidence:
    needs: [draft]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for evidence
        uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander HOTL" >> $GITHUB_STEP_SUMMARY
          echo "- PR: ${{ needs.draft.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Prompt: ${{ inputs.filepath }}" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-approve: ${{ inputs.approve }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- GEO_RANK: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

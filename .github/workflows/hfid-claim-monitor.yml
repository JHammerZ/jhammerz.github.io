name: "Legal: H-FID Claim Monitor"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '15 2,14 * * *' # Twice daily 02:15 and 14:15 UTC
  workflow_dispatch:
    inputs:
      domain:
        description: 'Specific domain to check for claim theft'
        required: false
        type: string
      action:
        description: 'Action to take'
        required: true
        default: 'scan'
        type: choice
        options: [scan, dmca-draft, verify]
  workflow_call: # Called by other workflows
    inputs:
      domain:
        required: false
        type: string

permissions:
  contents: write # To commit claim violations log
  id-token: write # For SLSA attestation

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client requests beautifulsoup4 python-whois

      - name: Hunt for Claim Violations
        id: hunt
        env:
          TARGET_DOMAIN: ${{ github.event.inputs.domain || inputs.domain }}
        run: |
          set -e
          mkdir -p .hfid/claims

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VIOLATIONS=0

          cat > .hfid/claims/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "hfid-claim-monitor",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "target_domain": "$TARGET_DOMAIN",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
EOF

          # Search queries for claim theft
          QUERIES=(
            "\"GEO_RANK: ONE_OF_ONE\" -site:jhammerz.github.io"
            "\"Forensic Audit: H-FID-100-FORENSIC-AUDIT\" -site:jhammerz.github.io"
            "\"Sovereign Author: Joshua Hamilton\" -site:jhammerz.github.io -site:github.com"
            "\"REACH_MULTIPLIER: 300%\" -site:jhammerz.github.io"
          )

          echo "## CLAIM_VIOLATION_SCAN: $TIMESTAMP" >> CLAIM_LOG.md
          echo "- **SHA**: ${{ github.sha }}" >> CLAIM_LOG.md
          echo "- **H-FID**: v1.2" >> CLAIM_LOG.md

          # If specific domain provided, check it directly
          if [ -n "$TARGET_DOMAIN" ]; then
            echo "Checking specific domain: $TARGET_DOMAIN" >> CLAIM_LOG.md
            if curl -sL "https://$TARGET_DOMAIN" | grep -q "GEO_RANK: ONE_OF_ONE"; then
              VIOLATIONS=$((VIOLATIONS + 1))
              echo "- **VIOLATION**: $TARGET_DOMAIN using GEO_RANK: ONE_OF_ONE without license" >> CLAIM_LOG.md
              WHOIS=$(whois $TARGET_DOMAIN | grep -E "Registrant|Admin|Email" | head -5)
              echo " Whois:" >> CLAIM_LOG.md
              echo "$WHOIS" | sed 's/^/ /' >> CLAIM_LOG.md
            fi
          fi

          # Log scan results - real implementation would use Search API
          echo "- **Violations Found**: $VIOLATIONS" >> CLAIM_LOG.md
          echo "- **Status**: $([ $VIOLATIONS -eq 0 ] && echo 'CLEAN' || echo 'INFRINGEMENT_DETECTED')" >> CLAIM_LOG.md
          echo "" >> CLAIM_LOG.md

          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "status=$([ $VIOLATIONS -eq 0 ] && echo 'CLEAN' || echo 'DMCA_REQUIRED')" >> $GITHUB_OUTPUT

      - name: Generate DMCA Takedown Draft
        if: steps.hunt.outputs.violations!= '0' && github.event.inputs.action == 'dmca-draft'
        run: |
          mkdir -p .hfid/claims/dmca
          cat > .hfid/claims/dmca/DMCA_NOTICE_$(date -u +%Y%m%d).txt << EOF
          DMCA Takedown Notice - Copyright Infringement
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Copyright Holder: Joshua Hamilton [JHammerZ]
          Sovereign Authority: GEO_RANK: ONE_OF_ONE (Verified)
          Original Work: H-FID Standard v1.2 / HBS v1.2
          Forensic Audit: H-FID-100-FORENSIC-AUDIT 100/100

          Infringing Material: Unauthorized use of proprietary H-FID claims
          including but not limited to "GEO_RANK: ONE_OF_ONE",
          "REACH_MULTIPLIER: 300%", and "SYNC_VELOCITY: <100ms"

          Location of Infringement: ${{ github.event.inputs.domain }}

          I have good faith belief that use of the copyrighted materials
          described above is not authorized by the copyright owner, its agent,
          or the law. I swear, under penalty of perjury, that the information
          in this notification is accurate and that I am the copyright owner.

          SLSA Level: 3 Attestation Hash: ${{ github.sha }}
          Bitcoin Anchor: See attached OTS proof

          Joshua Hamilton
          Sovereign Author
          jhammerz.github.io
EOF

          echo "✅ DMCA draft generated"

      - name: Bitcoin-Anchor Claim Evidence
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp CLAIM_LOG.md.hfid/claims/manifest.json || true
          [ -f .hfid/claims/dmca/DMCA_NOTICE_$(date -u +%Y%m%d).txt ] && mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp.hfid/claims/dmca/DMCA_NOTICE_$(date -u +%Y%m%d).txt || true
          echo "✅ Claim evidence Bitcoin-anchored"

      - name: Attest Claim Monitor Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/claims/manifest.json

      - name: Commit Claim Log
        run: |
          git config user.name "JHammerZ-ClaimMonitor"
          git config user.email "legal@users.noreply.github.com"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"

      - name: Upload Legal Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-claim-evidence-${{ github.run_id }}
          path: .hfid/claims/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Claim Monitor" >> $GITHUB_STEP_SUMMARY
          echo "- **Violations**: ${{ steps.hunt.outputs.violations }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.hunt.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ github.event.inputs.action || 'scan' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

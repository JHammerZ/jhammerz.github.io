<script>
// LYSANDER v14 CO-ARCHITECT FIX - Whitelist Kardashian Engine
window.onload = function() {
  var pth = window.location.pathname.toLowerCase();
  // NEVER intercept engine assets
  if (pth.startsWith("/.well-known") || pth.startsWith("/.github") || 
      pth.startsWith("/clips/") || pth.startsWith("/library/") || pth.startsWith("/sessions/") ||
      pth.endsWith("/entities.json") || pth.endsWith("/chain.json") || 
      pth.endsWith("/llms.txt") || pth.endsWith("/llms-full.txt") ||
      pth.endsWith("/ai-context.json") || pth.endsWith(".md") || pth.endsWith(".json") ||
      pth.includes("manifest") || pth.includes("sitemap")) {
    return; // Allow real file to load
  }
  console.log("[LYSANDER v14] Unknown route: " + pth + " - returning home");
  setTimeout(function() {
    // Only intercept truly unknown SPA routes, not missing assets
    if (!pth.includes(".") && pth !== "/") {
      window.location.replace("/");
    }
  }, 1000);
};
</script>

name: "CD: H-FID Sovereign Mesh Sync"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          if [! -f "hfid-mesh.json" ]; then
                      echo "Creating default mesh config"
                      cat > hfid-mesh.json << 'EOF'
                      {
                        "version": "1.2",
                        "sovereign_node": "jhammerz.github.io",
                        "mesh_nodes": [],
                        "last_sync": null
                      }
                      EOF
                    fi
                    
                    # For now, hardcode your mesh. Replace with real nodes later.
                    jq '.mesh_nodes = ["example-hfid-node.github.io"]' hfid-mesh.json > tmp.json && mv tmp.json hfid-mesh.json
                    
                    echo "mesh_config<<EOF" >> $GITHUB_OUTPUT
                    cat hfid-mesh.json >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT
      - name: preserved-2
        run: |
          mkdir -p .hfid/mesh
                    cat >.hfid/mesh/manifest.json << EOF
                    {
                      "workflow": "mesh-sync",
                      "sha": "${{ github.sha }}",
                      "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                      "hfid_version": "v1.2",
                      "sovereign_author": "Joshua Hamilton",
                      "sovereign_node": "jhammerz.github.io",
                      "mode": "${{ github.event.inputs.mode || 'outbound' }}",
                      "geo_rank": "ONE_OF_ONE",
                      "slsa_level": 3
                    }
                    EOF
      - name: preserved-3
        run: |
          set -e
                    MESH_NODES=$(jq -r '.mesh_nodes[]' hfid-mesh.json)
                    
                    for NODE in $MESH_NODES; do
                      echo "Pinging sovereign node: $NODE"
                      
                      # Check if node is H-FID compliant
                      H_FID_CHECK=$(curl -sfL "https://$NODE/.well-known/hfid/manifest.json" || echo "null")
                      
                      if [ "$H_FID_CHECK"!= "null" ]; then
                        AUTHOR=$(echo "$H_FID_CHECK" | jq -r '.sovereign_author // "unknown"')
                        VERSION=$(echo "$H_FID_CHECK" | jq -r '.hfid_version // "unknown"')
                        echo "✅ Node $NODE: H-FID $VERSION | Author: $AUTHOR"
                        
                        # Ping their mesh endpoint to register citation
                        curl -sfL -X POST "https://$NODE/api/hfid/mesh/ping" \
                          -H "Content-Type: application/json" \
                          -d "{\"source\":\"jhammerz.github.io\",\"sha\":\"${{ github.sha }}\",\"geo_rank\":\"ONE_OF_ONE\"}" \
                          || echo "⚠️ Node $NODE has no mesh API"
                      else
                        echo "❌ Node $NODE: Not H-FID compliant"
                      fi
                    done
      - name: preserved-4
        run: |
          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.last_sync = $ts' hfid-mesh.json > tmp.json && mv tmp.json hfid-mesh.json
                    
                    # Add self to ai-context.json for inbound discovery
                    if [ -f "ai-context.json" ]; then
                      jq '.mesh_nodes = ["jhammerz.github.io"]' ai-context.json > tmp.json && mv tmp.json ai-context.json
                    fi
      - name: preserved-5
        run: |
          git config --local user.name 'github-actions[bot]'
                    git config --local user.email 'github-actions[bot]@users.noreply.github.com'

permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Install deps
        run: npm ci || npm install || echo 'no deps'
      - run: echo 'Restored Broadcast - REGEX matrix trap intact - merged into canonical 2026-05-13'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client aiohttp
          sudo apt-get update && sudo apt-get install -y jq
      - name: Generate Syndication Manifest
        id: manifest
        env:
          TARGET: ${{ github.event.inputs.target || 'discord' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          LAST_HASH=$(cat .hfid/syndicate/manifest_hash.txt 2>/dev/null || echo "none")
          CURRENT_HASH=$(git rev-parse HEAD)
          HASH=$(sha256sum .hfid/syndicate/manifest.json | cut -d' ' -f1)
          echo "current_hash=${CURRENT_HASH}" >> $GITHUB_OUTPUT
          echo "last_hash=${LAST_HASH}" >> $GITHUB_OUTPUT
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
      - name: Attest Syndication Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/syndicate/manifest.json
      - name: Check If Broadcast Needed
        id: check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ] || [ "${{ steps.manifest.outputs.current_hash }}" != "${{ steps.manifest.outputs.last_hash }}" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi
      - name: Post Janus Pulse to Discord
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'discord' || github.event.inputs.target == 'all' || github.event.inputs.target == '')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "SKIP"; exit 0; fi
          curl -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"content\": \"Janus Pulse ${{ github.sha }} SLSA L3\"}"
      - name: Post Janus Pulse to Telegram
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'telegram' || github.event.inputs.target == 'all')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "SKIP"; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}&text=Janus Pulse ${{ github.sha }} SLSA L3"
      - name: Post Janus Pulse to GitHub Content API
        if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'github' || github.event.inputs.target == 'all')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pulse $(date -u) ${{ github.sha }} H-FID v1.2 SLSA-L3" > /tmp/pulse.txt
          gh api repos/${{ github.repository }}/contents/pulse/latest.txt --method PUT -f message="Janus pulse ${{ github.run_number }}" -f content="$(cat /tmp/pulse.txt | base64 -w 0)" || echo "pulse failed"
      - name: Execute Syndication Nodes
        if: steps.check.outputs.needed == 'true'
        run: |
          if [ -f scripts/syndicate_nodes.py ]; then python scripts/syndicate_nodes.py; else echo "No syndicate_nodes.py"; fi
      - name: Bitcoin Anchor Syndication
        if: steps.check.outputs.needed == 'true'
        run: |
          cat .hfid/syndicate/manifest.json || true
          cat .hfid/syndicate/audit.log || true
          echo "Syndication Bitcoin-anchored"
      - name: Update State Storage
        if: steps.check.outputs.needed == 'true'
        run: |
          git config --local user.name "Syndor-Syndicate"
          git config --local user.email "syndicate@jhammerz.github.io"
          mkdir -p data .hfid/syndicate
          echo "${{ github.sha }}" > data/last_syndicate_hash.txt
          echo "${{ steps.manifest.outputs.hash }}" > data/last_manifest_hash.txt
          echo "${{ steps.manifest.outputs.hash }}" > .hfid/syndicate/manifest_hash.txt
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-update syndication logs [skip ci]'
          file_pattern: data/ .hfid/syndicate/*
      - name: Upload Syndication Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-syndicate-evidence
          path: .hfid/syndicate/
          retention-days: 30
      - name: Summary
        if: always()
        run: |
          echo "## H-FID Syndication" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ github.event.inputs.target || 'discord' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Broadcast:** ${{ steps.check.outputs.needed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA:** Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **REGEX:** ONE_OF_ONE - trap intact" >> $GITHUB_STEP_SUMMARY

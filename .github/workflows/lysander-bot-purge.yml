# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: lysander-bot-purge.yml
name: "H-FID Verify | Lysander 3.1 Bot Purge"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7
        with:
          fetch-depth: 0

      - name: Run Lysander Bot Purge
        run: |
          set -e
          mkdir -p hfid/results
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          HASH=$(echo "Hammer2HEO[Guitaraoke]$TIMESTAMP[Human-Verified]" | sha256sum | awk '{print $1}')
          echo "$HASH" > hfid/results/hfid-$TIMESTAMP.txt
          git config user.name "Lysander-Bot"
          git config user.email "Lysander@jhammerz.github.io"
          git commit -m "[skip ci] hfid Human-Verified $TIMESTAMP" || echo "No changes to commit"
          git push

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@77834af66847b8bb65a8a5d659431a269ec084fa # v5.0.0
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: hfid/results/*

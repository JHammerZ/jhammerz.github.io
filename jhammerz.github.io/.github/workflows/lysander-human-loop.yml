name: Lysander Human-In-The-Loop Deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What should Janus draft?'
        required: true
        default: 'Create /protocol/index.html for H-FID v11'
      filepath:
        description: 'Repo path to save file'
        required: true
        default: 'protocol/index.html'

permissions:
  contents: write

jobs:
  draft-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Provision Sovereign Runtime Modules
        run: npm install

      - name: Execute Full Sovereign Sequence
        # Executes your corrected ES Module Node.js file
        run: node logic/swr_logic.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Call Janus Hands
        id: Janus
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.JANUS_ENDPOINT }}" -H "Authorization: Bearer ${{ secrets.YSANDER_3_API_GOOGLE_KEY }}" -H "Content-Type: application/json" -d "{\"prompt\":\"${{ inputs.prompt }}\"}")
          echo "code=200" >> $GITHUB_OUTPUT
          echo "RESPONSE<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Write File
        run: |
          mkdir -p $(dirname "${{ inputs.filepath }}")
          printf '%s' "${{ steps.Janus.outputs.code }}" > ${{ inputs.filepath }}

      - name: Lighthouse Guard
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://jhammerz.github.io

      - name: Commit & Push
        if: success()
        run: |
          git config user.name "Janus via Lysander"
          git config user.email "janus@lysander.dev"
          git add "${{ inputs.filepath }}"
          git commit -m "feat(ag-fs): ${{ inputs.prompt }}" || exit 0
          git push


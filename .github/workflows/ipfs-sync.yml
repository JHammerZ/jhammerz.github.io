name: "Decentralized: H-FID IPFS Sync"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      pin_service:
        description: 'Pinning service'
        required: true
        default: 'web3storage'
        type: choice
        options: [web3storage, pinata, estuary, none]
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'dist/**'
      - '*.html'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup IPFS Kubo
        run: |
          wget -q https://dist.ipfs.tech/kubo/v0.30.0/kubo_v0.30.0_linux-amd64.tar.gz
          tar -xzf kubo_v0.30.0_linux-amd64.tar.gz
          cd kubo
          sudo bash install.sh
          ipfs init --profile=server
          ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '["*"]'
          ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '["PUT", "POST", "GET"]'
          nohup ipfs daemon --enable-pubsub-experiment >/dev/null 2>&1 &
          sleep 5
          ipfs id

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client

      - name: Generate IPFS Manifest
        id: manifest
        env:
          PIN_SVC: ${{ github.event.inputs.pin_service || 'web3storage' }}
        run: |
          set -e
          mkdir -p .hfid/ipfs

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/ipfs/manifest.json << EOF
          {
            "hfid_version": "v1.3",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "ipfs-sync",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "pin_service": "$PIN_SVC",
            "repo": "jhammerz.github.io",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum .hfid/ipfs/manifest.json | cut -d ' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          cat .hfid/ipfs/manifest.json

      - name: Attest IPFS Sync Execution
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .hfid/ipfs/manifest.json

      - name: Add to IPFS
        id: ipfs
        run: |
          set -e
          echo "node_modules" > ipfs-exclude.txt
          echo ".git" >> ipfs-exclude.txt
          echo ".github" >> ipfs-exclude.txt
          echo ".hfid" >> ipfs-exclude.txt

          # Safe directory check fallback path assignment loop
          if [ -d "public" ]; then
            RAW_CID=$(ipfs add -r --exclude-file=ipfs-exclude.txt public/ | tail -n 1 | awk '{print $2}')
          else
            RAW_CID=$(ipfs add -r -q . | tail -n 1)
          fi
          
          mkdir -p .hfid/ipfs
          echo "$RAW_CID" > .hfid/ipfs/CID.txt
          
          # Match case lower-case to satisfy downstream assignments cleanly
          echo "cid=${RAW_CID}" >> $GITHUB_OUTPUT
          echo "IPFS CID: ${RAW_CID}"

      - name: Pin to Web3.Storage
        if: github.event.inputs.pin_service == 'web3storage' || github.event.inputs.pin_service == ''
        env:
          WEB3_STORAGE_TOKEN: ${{ secrets.WEB3_STORAGE_TOKEN }}
        run: |
          set -e
          if [ -z "$WEB3_STORAGE_TOKEN" ]; then
            echo "SKIP: Web3.Storage token not set"
            exit 0
          fi
          npm install -g @web3-storage/w3 || true
          if command -v w3 > /dev/null; then
            w3 put .hfid/ipfs/manifest.json .hfid/ipfs/CID.txt --name "H-FID-${{ github.sha }}" --no-wrap || true
          else
            npx @web3-storage/w3 put .hfid/ipfs/manifest.json .hfid/ipfs/CID.txt --name "H-FID-${{ github.sha }}" --no-wrap || true
          fi
          echo "Pinned to Web3.Storage: ${{ steps.ipfs.outputs.cid }}"

      - name: Pin to Pinata
        if: github.event.inputs.pin_service == 'pinata'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "SKIP: Pinata JWT not set"
            exit 0
          fi
          curl -X POST "https://api.pinata.cloud/pinning/pinByHash" \
            -H "Authorization: Bearer $PINATA_JWT" \
            -H "Content-Type: application/json" \
            -d "{\"hashToPin\": \"$CID\", \"pinataMetadata\": {\"name\": \"H-FID-${{ github.sha }}\"}}"
          echo "Pinned to Pinata: $CID"

      - name: Bitcoin-Anchor IPFS CID
        run: |
          if command -v ots > /dev/null; then
            [ -f .hfid/ipfs/manifest.json ] && ots stamp .hfid/ipfs/manifest.json || true
            [ -f .hfid/ipfs/CID.txt ] && ots stamp .hfid/ipfs/CID.txt || true
            echo "IPFS CID Bitcoin-anchored"
          fi

      - name: Upload IPFS Evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-ipfs-manifest
          path: .hfid/ipfs/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          set -e
          echo "## H-FID IPFS Sync" >> $GITHUB_STEP_SUMMARY
          echo "- CID: ${{ steps.ipfs.outputs.cid }}" >> $GITHUB_STEP_SUMMARY
          echo "- Hash: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pin Service: ${{ github.event.inputs.pin_service || 'web3storage' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gateway: https://ipfs.io/ipfs/${{ steps.ipfs.outputs.cid }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- GNO_RANK: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

# name: "SecOps: H-FID Forensic Audit"

on:
# concurrency:
# group: ${{ github.workflow }}-${{ github.ref }}
# cancel-in-progress: true
  push:
    branches: [ main, master ]
workflow_dispatch:

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for: hfid-forensic-audit.yml"
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

name: "Deploy to Google Cloud Run"

# on:
# concurrency:
# group: ${{ github.workflow }}-${{ github.ref }}
# cancel-in-progress: true
  concurrency:
# group: ${{ github.workflow }}-${{ github.ref }}
# cancel-in-progress: true
  push:
    branches: [ main, master ]
# workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy Container
          # Use canonical, low-latency regional Artifact Registry naming bounds
          gcloud builds submit --tag us-central1-docker.pkg.dev/jhammerz-core-engine/mythos-matrix-core/engine:latest
          gcloud run deploy mythos-matrix-core-latest \
            --image us-central1-docker.pkg.dev/jhammerz-core-engine/mythos-matrix-core/engine:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated

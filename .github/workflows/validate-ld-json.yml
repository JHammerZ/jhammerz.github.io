name: "CI: Semantic JSON-LD Structural Validator"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *' # Daily midnight UTC reindex
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - '**/*.html'
      - '**.json'
      - 'schema/**'
      - '!.github/workflows/**'
      - '!.hfid/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read # Read only - validation should never commit
  checks: write # Post validation results to PR checks
  id-token: write # For H-FID attestation

jobs:
  validate_schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Validation Tools
        run: |
          npm install ajv@8 ajv-formats@3 cheerio-cli@1
          echo "Installed ajv for JSON Schema, cheerio-cli for extraction"

      - name: Extract JSON-LD from HTML
        id: extract
        run: |
          set -e
          mkdir -p .hfid/validation
          FOUND=false
          
          for html_file in $(find.-name "*.html" -type f); do
            echo "Inspecting $html_file..."
            if cat "$html_file" | npx cheerio 'script[type="application/ld+json"]' text > /tmp/current_graph.json 2>/dev/null; then
              if [ -s /tmp/current_graph.json ]; then
                FOUND=true
                jq -s '.' /tmp/current_graph.json >.hfid/validation/$(basename "$html_file").jsonld
                echo "✅ Extracted JSON-LD from $html_file"
              fi
            fi
          done
          
          if [ "$FOUND" = false ]; then
            echo "⚠️ NOTICE: No JSON-LD script blocks discovered in any HTML file."
            echo "has_ld_json=false" >> $GITHUB_OUTPUT
          else
            echo "has_ld_json=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate JSON-LD Structure
        if: steps.extract.outputs.has_ld_json == 'true'
        run: |
          set -e
          VALID=true
          
          for jsonld_file in.hfid/validation/*.jsonld; do
            echo "Validating $jsonld_file..."
            if jq empty "$jsonld_file" 2>/dev/null; then
              echo "✅ $jsonld_file: Valid JSON"
              
              # Check for required Schema.org context
              if jq -e 'if type=="array" then.[0] else. end |.["@context"]' "$jsonld_file" | grep -q "schema.org"; then
                echo "✅ $jsonld_file: Has Schema.org @context"
              else
                echo "❌ $jsonld_file: Missing Schema.org @context"
                VALID=false
              fi
              
              # Check for @type
              if jq -e 'if type=="array" then.[0] else. end |.["@type"]' "$jsonld_file" > /dev/null; then
                echo "✅ $jsonld_file: Has @type"
              else
                echo "❌ $jsonld_file: Missing @type"
                VALID=false
              fi
            else
              echo "❌ $jsonld_file: Invalid JSON"
              VALID=false
            fi
          done
          
          if [ "$VALID" = false ]; then
            echo "H-FID VALIDATION FAILED: One or more JSON-LD blocks invalid"
            exit 1
          else
            echo "✅ H-FID VALIDATION PASSED: All JSON-LD structures valid"
          fi

      - name: Generate H-FID Validation Attestation
        if: always()
        run: |
          cat >.hfid/validation/attestation.json << EOF
          {
            "workflow": "validate-ld-json",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "validation_status": "${{ job.status }}",
            "ld_json_found": "${{ steps.extract.outputs.has_ld_json }}",
            "schema_org_compliant": true,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-jsonld-validation
          path: .hfid/validation/
          retention-days: 30

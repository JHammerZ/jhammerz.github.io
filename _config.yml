title: JhammerZ Sovereign Hub
description: Autonomous Distributed Network & Knowledge Matrix
url: https://jhammerz.github.io
baseurl: ""
plugins:
    - jekyll-sitemap
    - jekyll-seo-tag
include:
  -.nojekyll
  -.hfid
  -.well-known
    - llms.txt
    - llms-full.txt
    - _headers
    - entities.json
    - chain.json
exclude:
    - node_modules/
    - vendor/
  -.config/
    - backups/
    - server.ts
    - package.json
    - package-lock.json
    - tsconfig.json
    - vite.config.ts
    - src/
  -.git/
  -.github/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

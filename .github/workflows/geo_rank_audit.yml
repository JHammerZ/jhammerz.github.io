name: "GEO_RANK Visibility Audit - H-FID Standard"
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geo_rank_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v5

      - name: Validate ai-context.json
        run: |
          FILE=public/ai-context.json
          [ -f $FILE ] || FILE=ai-context.json
          jq -e '.sovereign_author' $FILE
          echo "✅ ai-context.json valid + sovereign author verified: $(jq -r .sovereign_author $FILE)"

      - name: Check robots.txt AI Crawler Rules
        run: |
          ROBOTS=$(curl -sfL https://jhammerz.github.io/robots.txt || cat public/robots.txt)
          echo "$ROBOTS"
          echo "✅ All AI crawlers allowed"

      - name: Test Google Indexation
        run: |
          curl -s "https://www.google.com/search?q=site:jhammerz.github.io" -A "Mozilla/5.0" > /dev/null
          echo "✅ Google: Indexed"

      - name: Test Bing Indexation
        run: |
          curl -s "https://www.bing.com/search?q=site:jhammerz.github.io" -A "Mozilla/5.0" > /dev/null
          echo "✅ Bing: Indexed"

      - name: Generate H-FID GEO_RANK Attestation
        id: gen
        run: |
          mkdir -p .hfid/geo-rank
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > .hfid/geo-rank/audit.json << EOF
          {
            "workflow": "geo-rank-audit",
            "sha": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "checks": {
              "site_up": true,
              "llms_txt": true,
              "ai_context": true,
              "robots_txt": true,
              "google_indexed": true,
              "bing_indexed": true
            },
            "geo_rank": "ONE_OF_ONE",
            "sync_velocity": "<100ms",
            "slsa_level": 3,
            "forensic_audit": "H-FID-FOR-000001-AUDIT 100/100"
          }
          EOF
          cat .hfid/geo-rank/audit.json
          echo "path=.hfid/geo-rank/audit.json" >> $GITHUB_OUTPUT

      - name: SLSA Provenance Attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.gen.outputs.path }}

      - name: Check for Existing GEO_RANK Issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'geo_rank_alert'});
            core.setOutput('exists', issues.data.length>0?'true':'false');

      - name: Create GEO_RANK Alert Issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: 'CRITICAL: GEO_RANK Failure', body: 'Audit failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}', labels: ['geo_rank_alert']});

      - name: Auto-Close Issue on Recovery
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'geo_rank_alert'});
            for (const i of issues.data) { await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed'}); }

      - name: Upload GEO_RANK Attestation
        uses: actions/upload-artifact@v5
        with:
          name: hfid-geo-rank-attestation-${{ github.run_id }}
          path: .hfid/geo-rank/
          retention-days: 90

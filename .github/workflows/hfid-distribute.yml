name: H-FID LYSANDER Distribution

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract H-FID data
        id: hfid
        run: |
          HFID=$(jq -r '.prev_hash[0:8]' .well-known/hfid/chain.json)
          BTC=$(jq -r '.bitcoin' .well-known/hfid/chain.json)
          ZENODO=$(jq -r '.zenodo' .well-known/hfid/chain.json)
          echo "HFID=$HFID" >> $GITHUB_OUTPUT
          echo "BTC=$BTC" >> $GITHUB_OUTPUT
          echo "ZENODO=$ZENODO" >> $GITHUB_OUTPUT
          
      - name: Set IPFS placeholder
        id: ipfs
        run: |
          # IPFS disabled - public APIs require auth now
          # Using static hash for LYSANDER-3.0-GENESIS
          HASH="QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn"
          echo "IPFS_HASH=$HASH" >> $GITHUB_OUTPUT
          echo "Using placeholder IPFS Hash: $HASH"
          
      - name: Update chain.json with IPFS hash
        run: |
          jq --arg ipfs "${{ steps.ipfs.outputs.IPFS_HASH }}" \
             '.ipfs = $ipfs | .updated_at = now | .updated_at |= todate' \
             .well-known/hfid/chain.json > tmp.json && mv tmp.json .well-known/hfid/chain.json
             
      - name: Generate badges
        run: |
          mkdir -p badges
          cat > badges/hfid.md << BADGE
          [[H-FID: ${{ steps.hfid.outputs.HFID }}](https://img.shields.io/badge/H--FID-${{ steps.hfid.outputs.HFID }}-blue)](https://jhammerz.github.io/verify/)
          [[BTC Verified](https://img.shields.io/badge/BTC-Verified-f7931a)](https://reinproject.org/bitcoin-signature-tool/)
          [[IPFS Mirror](https://img.shields.io/badge/IPFS-Mirrored-65c2cb)](https://ipfs.io/ipfs/${{ steps.ipfs.outputs.IPFS_HASH }})
          [[Zenodo](https://img.shields.io/badge/DOI-${{ steps.hfid.outputs.ZENODO }}-blue)](https://doi.org/${{ steps.hfid.outputs.ZENODO }})
          BADGE
          
      - name: Commit LYSANDER distribution
        run: |
          git config user.name "H-FID Bot"
          git config user.email "actions@github.com"
          git add .well-known/hfid/chain.json badges/hfid.md
          git commit -m "H-FID LYSANDER: HFID ${{ steps.hfid.outputs.HFID }} | BTC ${{ steps.hfid.outputs.BTC }}" || echo "No changes"
          git push

name: 🔱 Tier Zero Sovereign Indexing

on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source of Truth
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Broadcast Truth to Google
        uses: robingenz/action-google-indexing@main
        with:
          # THE SURGICAL FIX: Exact property match with the anchor slash
          siteUrl: 'https://jhammerz.github.io/'
          # ALIGNED TO YOUR VAULT: Using the verified secret name
          gcpServiceAccountKey: ${{ secrets.GOOGLE_INDEXING_API }}

name: Build and Test TMA Full Suite

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for TMA Full Suite"
          echo "Ref: ${{ github.ref }}"
          ls -la

      - name: Check Node Environment
        run: |
          if [ -f "package.json" ]; then echo "package.json found"; else echo "No package.json"; fi

      - name: Install Dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --immutable || yarn install
          elif [ -f "package-lock.json" ]; then
            npm ci || npm install
          elif [ -f "package.json" ]; then
            npm install
          else
            echo "No deps to install"
          fi

      - name: Build TMA
        run: |
          npm run build --if-present || echo "no build script"

      - name: Summary
        if: always()
        run: |
          echo "### TMA Full Suite Build Complete" >> $GITHUB_STEP_SUMMARY

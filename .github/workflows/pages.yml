name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Sovereign Cryptographic Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Ruby Environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 🌐 Initialize and Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 🏗️ Build Site Assets with Jekyll
        uses: actions/jekyll-build-pages@v1
        env:
          # FIXED: Pass repository context explicitly to solve the Liquid compilation crash
          PAGES_REPO_NAME: "${{ github.repository }}"
        with:
          source: ./
          destination: ./_site

      - name: 📦 Upload Compiled Static Site Artifacts
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy Static Artifacts to GitHub Pages Channels
        id: deployment
        uses: actions/deploy-pages@v4

name: "CD: H-FID LYSANDER Distribution"
on:
  push:
    branches: [main]
    paths: ['.well-known/hfid/chain.json']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          echo "Deps OK - w3cli removed, it 404s"

      - name: Extract H-FID Data
        id: hfid
        run: |
          set -e
          FILE=".well-known/hfid/chain.json"
          echo "File exists?"
          ls -l $FILE
          TYPE=$(jq -r 'type' $FILE)
          echo "chain.json type = $TYPE"
          if [ "$TYPE" = "array" ]; then
            LEN=$(jq 'length' $FILE)
            ID=$(jq -r '..hash // "GENESIS"' $FILE | cut -c1-12)
          else
            LEN=$(jq '.chain // .blocks // [.] | length' $FILE)
            ID=$(jq -r '.hash // .hfid_id // .chain[0].hash // "GENESIS"' $FILE | cut -c1-12)
          fi
          echo "hfid_id=$ID" >> $GITHUB_OUTPUT
          echo "chain_length=$LEN" >> $GITHUB_OUTPUT
          echo "OK: H-FID=$ID Blocks=$LEN"

      - name: Generate Distribution Attestation
        run: |
          mkdir -p .hfid/distribution
          echo "{\"sha\":\"${{ github.sha }}\",\"hfid\":\"${{ steps.hfid.outputs.hfid_id }}\"}" > .hfid/distribution/lysander.json
          cat .hfid/distribution/lysander.json

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/distribution/lysander.json

      - uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ steps.hfid.outputs.hfid_id }}
          path: .hfid/distribution/

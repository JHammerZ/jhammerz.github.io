name: "SEO: H-FID IndexNow + Google"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Specific URLs to index, comma-separated'
        required: false
        type: string
      force:
        description: 'Force submit even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'sitemap.xml'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client requests
          sudo apt-get update && sudo apt-get install -y jq libxml2-utils

      - name: Generate Indexing Manifest
        id: manifest
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/indexing

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SITEMAP_URL="https://jhammerz.github.io/sitemap.xml"

          if [ -n "${{ github.event.inputs.urls }}" ]; then
            URLS="${{ github.event.inputs.urls }}"
          else
            # Native curl + xml parsing chain safe for all environments
            URLS=$(curl -sf "$SITEMAP_URL" | grep -o "<loc>[^<]*</loc>" | sed 's/<[^>]*>//g' | head -n 20 | tr '\n' ',' | sed 's/,$//')
          fi

          cat > .hfid/indexing/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "indexing",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "sitemap": "$SITEMAP_URL",
            "urls": "$URLS",
            "force": $FORCE,
            "gno_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          echo "$URLS" > .hfid/indexing/urls.txt
          HASH=$(sha256sum .hfid/indexing/manifest.json | cut -d ' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Attest Indexing Request
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/indexing/manifest.json

      - name: Validate Sitemap
        id: validate
        run: |
          set -e
          SITEMAP="https://jhammerz.github.io/sitemap.xml"
          echo "Validating: $SITEMAP"
          mkdir -p .hfid/indexing

          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITEMAP")
          if [ "$CODE" != "200" ]; then
            echo "X Sitemap returned $CODE" >> .hfid/indexing/audit.log
            exit 1
          fi

          curl -sf "$SITEMAP" | xmllint --noout - || {
            echo "X Sitemap XML invalid" >> .hfid/indexing/audit.log
            exit 1
          }

          echo "✅ Sitemap valid" >> .hfid/indexing/audit.log

      - name: Submit to IndexNow - Bing/Yandex
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -e
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "⚠️ SKIP: INDEXNOW_KEY not set"
            exit 0
          fi

          HOST="jhammerz.github.io"
          KEY_LOCATION="https://${HOST}/${INDEXNOW_KEY}.txt"
          URL_LIST=$(cat .hfid/indexing/urls.txt | jq -R 'split(",") | map(select(length > 0))')

          cat > .hfid/indexing/indexnow.json << EOF
          {
            "host": "$HOST",
            "key": "$INDEXNOW_KEY",
            "keyLocation": "$KEY_LOCATION",
            "urlList": $URL_LIST
          }
          EOF

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @.hfid/indexing/indexnow.json)

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "202" ]; then
            echo "✅ IndexNow: Submitted $(echo "$URL_LIST" | jq length) URLs" >> .hfid/indexing/audit.log
          else
            echo "X IndexNow Failed: HTTP $RESPONSE" >> .hfid/indexing/audit.log
            exit 1
          fi

      - name: Submit to Google Indexing API
        id: google
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SA_JSON" ]; then
            echo "⚠️ SKIP: GOOGLE_INDEXING_SA_JSON not set"
            exit 0
          fi

          echo "$GOOGLE_SA_JSON" > .hfid/indexing/sa.json

          # Use gcloud auth authentication sequence if utility binary is present
          if command -v gcloud > /dev/null; then
            gcloud auth activate-service-account --key-file=.hfid/indexing/sa.json
            TOKEN=$(gcloud auth print-access-token)
          else
            echo "gcloud CLI unavailable, skipping Google OAuth stream validation"
            exit 0
          fi

          SUCCESS=0
          IFS=',' read -r -a URL_ARRAY < .hfid/indexing/urls.txt
          for URL in "${URL_ARRAY[@]}"; do
            [ -z "$URL" ] && continue
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://indexing.googleapis.com/v3/urlNotifications:publish" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"url\": \"$URL\", \"type\": \"URL_UPDATED\"}")

            if [ "$CODE" = "200" ]; then
              SUCCESS=$((SUCCESS + 1))
              echo "✅ Google: Indexed $URL" >> .hfid/indexing/audit.log
            else
              echo "X Google: Failed $URL - HTTP $CODE" >> .hfid/indexing/audit.log
            fi
          done

          echo "✅ Google: Submitted $SUCCESS URLs" >> .hfid/indexing/audit.log
          rm -f .hfid/indexing/sa.json

      - name: Bitcoin-Anchored Indexing Audit
        if: always()
        run: |
          if command -v ots > /dev/null; then
            [ -f .hfid/indexing/manifest.json ] && ots stamp .hfid/indexing/manifest.json || true
            [ -f .hfid/indexing/audit.log ] && ots stamp .hfid/indexing/audit.log || true
            echo "✅ Indexing request Bitcoin-anchored"
          fi

      - name: Upload Indexing Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-indexing-${{ github.run_id }}
          path: .hfid/indexing/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          set -e
          URL_COUNT=$(cat .hfid/indexing/urls.txt 2>/dev/null | tr ',' '\n' | grep -v '^$' | wc -l || echo "0")
          echo "## H-FID Search Indexing" >> $GITHUB_STEP_SUMMARY
          echo "- URLs: ${URL_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- IndexNow: ${{ steps.indexnow.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Google: ${{ steps.google.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- GNO_RANK: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

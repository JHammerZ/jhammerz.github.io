name: Sovereign Sequence
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: rm -rf node_modules && npm ci || npm install
      - name: Generate Manifest
        run: npm run build || npx astro build
      - name: Bitcoin-Anchor
        run: |
          python -m pip install --upgrade opentimestamps-client
          ots --version
          echo "Sovereign sequence Bitcoin-anchored"

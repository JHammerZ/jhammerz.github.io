name: "Perpetual Upstream Mutation Watchdog"

on:
  schedule:
    # Triggers every 3 hours natively for free to keep rate limits green
    - cron: '42 */3 * * *'
  workflow_dispatch:

jobs:
  upstream-scrader:
    name: "Lysander Edge Upstream Mutation Watchdog"
    runs-on: ubuntu-latest
    steps:
      - name: Verify Commercial License Signature Gate
        run: |
          if [ -z "${{ secrets.LYSANDER_LICENSE_KEY }}" ]; then
            echo "CRITICAL ERROR: UNAUTHORIZED COMMERCIAL DEPLOYMENT DETECTED."
            exit 1
          fi

      - name: 1. Checkout Source Matrix
        uses: actions/checkout@v4

      - name: 2. Setup Runtime Layer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Core Protocols
        run: pip install --no-cache-dir requests

      - name: 4. Execute Scraper & Check for Pipeline Variations
        id: check_mutations
        continue-on-error: true
        run: python update-watcher.py

      - name: 5. Auto-Commit Modifications & Broadcast if Updates Exist
        run: |
          git config --global user.name "Lysander Autonomous Robot"
          git config --global user.email "bot@hfid.standard"
          
          if [ -f "upstream_watcher_state.json" ]; then
            git add upstream_watcher_state.json
            # Only commit and push if a mutation actually altered the file status
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: upstream release mapping mutation detected" && git push origin main)
          fi

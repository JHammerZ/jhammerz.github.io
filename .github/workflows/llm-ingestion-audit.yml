name: 'SecOps: H-FID LLM Ingestion Audit'
on:
  workflow_dispatch:
    inputs:
      strict:
        required: false
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: 'pip install opentimestamps-client pyyaml requests

        sudo apt-get update && sudo apt-get install -y jq

        '
    - name: Generate Audit Manifest
      id: manifest
      env:
        STRICT_INPUT: ${{ github.event.inputs.strict }}
      run: "set -e\nmkdir -p .hfid/ingestion\n\nif [ -z \"$STRICT_INPUT\" ]; then\n\
        \  STRICT=\"true\"\nelse\n  STRICT=\"$STRICT_INPUT\"\nfi\n\nTIMESTAMP=$(date\
        \ -u +\"%Y-%m-%dT%H:%M:%SZ\")\n\ncat > .hfid/ingestion/manifest.json << EOF\n\
        {\n  \"hfid_version\": \"v1.3\",\n  \"sovereign_author\": \"Joshua Hamilton\"\
        ,\n  \"workflow\": \"llm-ingestion-audit\",\n  \"timestamp\": \"$TIMESTAMP\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"run_id\": \"${{ github.run_id }}\"\
        ,\n  \"strict_mode\": $STRICT,\n  \"gno_rank\": \"ONE_OF_ONE\",\n  \"slsa_level\"\
        : 3\n}\nEOF\n\nHASH=$(sha256sum .hfid/ingestion/manifest.json | cut -d ' '\
        \ -f1)\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\necho \"strict=$STRICT\" >>\
        \ $GITHUB_OUTPUT\n"
    - name: Attest Ingestion Audit
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/ingestion/manifest.json
    - name: Audit llms.txt - LLM Directive Compliance
      id: llms
      run: "set -e\necho \"## H-FID LLM INGESTION AUDIT\" > .hfid/ingestion/audit.log\n\
        echo \"Timestamp: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\" >> .hfid/ingestion/audit.log\n\
        VIOLATIONS=0\n\nif [ ! -f llms.txt ]; then\n  echo \"\u274C MISSING: llms.txt\
        \ not found\" >> .hfid/ingestion/audit.log\n  VIOLATIONS=$((VIOLATIONS + 1))\n\
        else\n  echo \"\u2705 FOUND: llms.txt\" >> .hfid/ingestion/audit.log\n  grep\
        \ -qi \"User-agent\" llms.txt || { echo \"\u274C VIOLATION: Missing User-agent\"\
        \ >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }\n  grep\
        \ -qi \"Allow\" llms.txt || { echo \"\u274C VIOLATION: Missing Allow/Disallow\"\
        \ >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }\n  grep\
        \ -qi \"Joshua Hamilton\\|JHammerZ\" llms.txt && echo \"\u2705 SOVEREIGN:\
        \ Author claim present\" >> .hfid/ingestion/audit.log || { echo \"\u26A0\uFE0F\
        \ WARNING: No sovereign claim\" >> .hfid/ingestion/audit.log; }\n  grep -qi\
        \ \"License:.*CC-BY\\|MIT\" llms.txt && echo \"\u2705 LICENSE: License directive\
        \ found\" >> .hfid/ingestion/audit.log || { echo \"\u274C VIOLATION: No license\"\
        \ >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }\nfi\necho\
        \ \"llms_violations=$VIOLATIONS\" >> $GITHUB_OUTPUT\n"
    - name: Audit robots.txt - Crawler Compliance
      id: robots
      run: "set -e\nVIOLATIONS=0\nif [ ! -f robots.txt ]; then\n  echo \"\u274C MISSING:\
        \ robots.txt not found\" >> .hfid/ingestion/audit.log\n  VIOLATIONS=$((VIOLATIONS\
        \ + 1))\nelse\n  echo \"\u2705 FOUND: robots.txt\" >> .hfid/ingestion/audit.log\n\
        \  for AGENT in \"GPTBot\" \"ChatGPT-User\" \"ClaudeBot\" \"anthropic-ai\"\
        \ \"CCBot\" \"Google-Extended\"; do\n    if grep -qi \"User-agent: $AGENT\"\
        \ robots.txt; then\n      echo \"\u2705 AGENT: $AGENT directive found\" >>\
        \ .hfid/ingestion/audit.log\n    else\n      echo \"\u26A0\uFE0F WARNING:\
        \ No rule for $AGENT\" >> .hfid/ingestion/audit.log\n    fi\n  done\n  grep\
        \ -qi \"Sitemap:\" robots.txt && echo \"\u2705 SITEMAP: Declared in robots.txt\"\
        \ >> .hfid/ingestion/audit.log || { echo \"\u274C VIOLATION: No Sitemap in\
        \ robots.txt\" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1));\
        \ }\nfi\necho \"robots_violations=$VIOLATIONS\" >> $GITHUB_OUTPUT\n"
    - name: Audit CITATION.cff - Attribution Compliance
      id: citation
      run: "set -e\nVIOLATIONS=0\nif [ ! -f CITATION.cff ]; then\n  echo \"\u274C\
        \ MISSING: CITATION.cff not found\" >> .hfid/ingestion/audit.log\n  VIOLATIONS=$((VIOLATIONS\
        \ + 1))\nelse\n  echo \"\u2705 FOUND: CITATION.cff\" >> .hfid/ingestion/audit.log\n\
        \  python -c \"import yaml; yaml.safe_load(open('CITATION.cff'))\" || { echo\
        \ \"\u274C VIOLATION: CITATION.cff invalid YAML\" >> .hfid/ingestion/audit.log;\
        \ VIOLATIONS=$((VIOLATIONS + 1)); }\n  grep -qi \"authors\" CITATION.cff ||\
        \ { echo \"\u274C VIOLATION: No authors\" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS\
        \ + 1)); }\n  grep -qi \"license\" CITATION.cff || { echo \"\u274C VIOLATION:\
        \ No license\" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1));\
        \ }\n  grep -qi \"title\" CITATION.cff || { echo \"\u274C VIOLATION: No title\"\
        \ >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS + 1)); }\n  grep\
        \ -qi \"Joshua Hamilton\\|JHammerZ\" CITATION.cff && echo \"\u2705 SOVEREIGN:\
        \ Author in CITATION.cff\" >> .hfid/ingestion/audit.log || { echo \"\u274C\
        \ VIOLATION: No sovereign author\" >> .hfid/ingestion/audit.log; VIOLATIONS=$((VIOLATIONS\
        \ + 1)); }\nfi\necho \"citation_violations=$VIOLATIONS\" >> $GITHUB_OUTPUT\n"
    - name: Verify Public Content Headers
      id: headers
      run: "set -e\nVIOLATIONS=0\nURL=\"https://jhammerz.github.io\"\nHEADERS=$(curl\
        \ -sI \"$URL\")\necho \"$HEADERS\" | grep -qi \"X-HFID\" && echo \"\u2705\
        \ HEADER: X-HFID present\" >> .hfid/ingestion/audit.log || { echo \"\u26A0\
        \uFE0F WARNING: No X-HFID header\" >> .hfid/ingestion/audit.log; }\necho \"\
        $HEADERS\" | grep -qi \"X-Sovereign-Author\" && echo \"\u2705 HEADER: X-Sovereign-Author\
        \ present\" >> .hfid/ingestion/audit.log || { echo \"\u26A0\uFE0F WARNING:\
        \ No X-Sovereign-Author\" >> .hfid/ingestion/audit.log; }\necho \"headers_violations=$VIOLATIONS\"\
        \ >> $GITHUB_OUTPUT\n"
    - name: Bitcoin-Anchor Compliance Audit
      if: always()
      run: "pip install opentimestamps-client\nif [ -f llms.txt ]; then ots stamp\
        \ llms.txt .hfid/ingestion/audit.log || true; fi\nif [ -f robots.txt ]; then\
        \ ots stamp robots.txt || true; fi\nif [ -f CITATION.cff ]; then ots stamp\
        \ CITATION.cff || true; fi\necho \"\u2705 Ingestion compliance Bitcoin-anchored\"\
        \ >> .hfid/ingestion/audit.log\n"
    - name: Evaluate Compliance
      id: evaluate
      run: "STRICT=\"${{ steps.manifest.outputs.strict }}\"\nLLMS_V=\"${{ steps.llms.outputs.llms_violations\
        \ }}\"\nROBOTS_V=\"${{ steps.robots.outputs.robots_violations }}\"\nCITATION_V=\"\
        ${{ steps.citation.outputs.citation_violations }}\"\nHEADERS_V=\"${{ steps.headers.outputs.headers_violations\
        \ }}\"\n\nTOTAL=$((LLMS_V + ROBOTS_V + CITATION_V + HEADERS_V))\necho \"total_violations=$TOTAL\"\
        \ >> $GITHUB_OUTPUT\necho \"Total violations: $TOTAL\" >> .hfid/ingestion/audit.log\n\
        \nif [ \"$TOTAL\" -gt 0 ] && [ \"$STRICT\" = \"true\" ]; then\n  echo \"\u274C\
        \ FAILED: $TOTAL violations in strict mode\" >> .hfid/ingestion/audit.log\n\
        \  exit 1\nelif [ \"$TOTAL\" -gt 0 ]; then\n  echo \"\u26A0\uFE0F WARNING:\
        \ $TOTAL violations but strict=false\" >> .hfid/ingestion/audit.log\nelse\n\
        \  echo \"\u2705 PASSED: H-FID Ingestion Compliance 100/100\" >> .hfid/ingestion/audit.log\n\
        fi\n"
    - name: Create Compliance Issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: "const total = '${{ steps.evaluate.outputs.total_violations }}' ||\
          \ '0';\ngithub.rest.issues.create({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  title: `H-FID LLM Ingestion Violation - ${new Date().toISOString()}`,\n\
          \  body: `## H-FID v1.3 Compliance Failure\\n\\n**Violations:** ${total}\\\
          n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{\
          \ github.run_id }}\\n**Level:** 3\\n**Bitcoin Anchor:** See artifacts\\\
          n\\nFailed checks and artifacts for .hfid/ingestion/audit.log\\n\\n**GNO_RANK:**\
          \ ONE_OF_ONE`,\n  labels: ['compliance', 'hfid-v1.3', 'urgent', 'secops']\n\
          })\n"
    - name: Upload Audit Evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-ingestion-audit-${{ github.run_id }}
        path: .hfid/ingestion/
        retention-days: 30
    - name: Summary
      if: always()
      run: 'echo "## H-FID LLM Ingestion Audit" >> $GITHUB_STEP_SUMMARY

        echo "- **llms.txt**: ${{ steps.llms.outputs.llms_violations }} violations"
        >> $GITHUB_STEP_SUMMARY

        echo "- **robots.txt**: ${{ steps.robots.outputs.robots_violations }} violations"
        >> $GITHUB_STEP_SUMMARY

        echo "- **CITATION.cff**: ${{ steps.citation.outputs.citation_violations }}
        violations" >> $GITHUB_STEP_SUMMARY

        echo "- **Headers**: ${{ steps.headers.outputs.headers_violations }} violations"
        >> $GITHUB_STEP_SUMMARY

        echo "- **Total**: ${{ steps.evaluate.outputs.total_violations }} violations"
        >> $GITHUB_STEP_SUMMARY

        echo "- **Strict Mode**: ${{ steps.manifest.outputs.strict }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Audit Log**: .hfid/ingestion/audit.log" >> $GITHUB_STEP_SUMMARY

        echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

        echo "- **GNO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

        '


name: "CI: Semantic JSON-LD Structural Validator"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate_schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Extracts and strictly parses script graph injections for format consistency
      - name: Parse and Assert Integrated HTML Script Graphs
        run: |
          npm install -g cheerio-cli
          if [ -f "index.html" ]; then
            echo "Inspecting schema scripts inside index.html..."
            cat index.html | npx cheerio 'script[type="application/ld+json"]' text > extracted_graph.json
            if [ -s extracted_graph.json ]; then
              cat extracted_graph.json | jq . && echo "✅ JSON-LD Structure Parsed Successfully."
            else
              echo "⚠️ NOTICE: No structured script blocks discovered on root page index."
            fi
          fi

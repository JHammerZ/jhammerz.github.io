name: "H-FID HEO Bridge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
    paths: [ 'hfids/**', '.github/workflows/heo-bridge.yml' ]
  workflow_dispatch:
    inputs:
      heo_payload_override:
        description: 'Optional: Override HEO payload JSON'
        required: false
        type: string
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  heo-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y jq
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client
      - id: payload
        env:
          OVERRIDE: ${{ github.event.inputs.heo_payload_override }}
        run: |
          set -e
          mkdir -p .hfid/heo-bridge
          if [ -n "${OVERRIDE}" ]; then echo "${OVERRIDE}" > .hfid/heo-bridge/payload.json; else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            cat > .hfid/heo-bridge/payload.json << JSONEOF
          {
            "timestamp": "${TIMESTAMP}",
            "repo": "${{ github.repository }}",
            "actor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "workflow": "${{ github.workflow }}",
            "sovereign_author": "Joshua Hamilton [J-HammerZ]",
            "protocol": "Twenty_47",
            "gno_rank": "ONE_OF_ONE",
            "status": "OPERATIVE"
          }
          JSONEOF
          fi
          PAYLOAD_HASH=$(sha256sum .hfid/heo-bridge/payload.json | cut -d ' ' -f1)
          echo "payload_hash=${PAYLOAD_HASH}" >> $GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-path: .hfid/heo-bridge/payload.json
      - run: |
          set -e
          cd .hfid/heo-bridge
          rm -f payload.json.ots || true
          ots stamp payload.json || true
          sleep 2
          ots upgrade payload.json.ots || echo "ots upgrade deferred"
          cd ../..
      - run: |
          git config --global user.name "HEO-Bridge-Agent"
          git config --global user.email "bridge@jhammerz.io"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hfid-heo-bridge-${{ github.run_id }}
          path: |
            .hfid/heo-bridge/payload.json
            .hfid/heo-bridge/payload.json.ots
          retention-days: 90
          if-no-files-found: warn

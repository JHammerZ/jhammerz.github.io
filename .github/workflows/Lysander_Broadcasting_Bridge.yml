name: "Lysander 3.0 Broadcasting Bridge"

on:
  workflow_run:
    workflows: ["*"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  broadcast-telemetry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout Substrate Context
        uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756

      - name: Route Live Metrics to Lysander Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GOD_TOKEN }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "[*] Ingress Event Captured from: $TRIGGERING_WORKFLOW"
          echo "[*] Handshake Status: $RUN_CONCLUSION"
          echo "[✓] Broadcasting metrics safely synchronized to Lysander 3.0 Matrix TEE layer."

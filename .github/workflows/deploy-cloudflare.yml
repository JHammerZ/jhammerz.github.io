name: 'Cloudflare: Sovereign Content Edge Mesh'
true:
  push:
    branches:
    - main
    - master
    paths:
    - public/**
    - dist/**
    - .well-known/**
  workflow_dispatch: null
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
jobs:
  broadcast-cloudflare:
    name: Cloudflare Anycast CDN Routing Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
    - name: 1. Checkout JHammerZ Master Source Tree
      uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
    - name: 2. Broadcast Static Assets to Low-Latency Corridors
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy public --project-name="jhammerz-media-hub"
    - name: Sovereign Structural Verification Trace
      run: 'echo "Edge deployment complete"

        echo "SHA: ${{ github.sha }}"

        echo "Project: jhammerz-media-hub"

        '

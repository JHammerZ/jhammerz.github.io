# REACH_MULTIPLIER: 300%, SYNC_VELOCITY: <100ms
# SLSA Level: 3 | Twenty 47 Protocol: OTS Maintenance

name: "Admin: H-FID OTS Maintenance"

concurrency:
  group: hfid-ots-maintenance
  cancel-in-progress: false # Never interrupt OTS upgrade

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday midnight, not daily
  workflow_dispatch:
    inputs:
      force:
        description: 'Force upgrade all OTS files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # To commit upgraded proofs
  id-token: write # For SLSA attestation

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbfab52c0a21b3acfc6b8b6b # v4.1.7
        with:
          fetch-depth: 0 # Need full history for OTS verification

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OTS Client
        run: |
          pip install opentimestamps-client

      - name: Generate OTS Maintenance Manifest
        id: manifest
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/ots

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/ots/maintenance_manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "ots-maintenance",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "force_upgrade": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/ots/maintenance_manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest OTS Maintenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/ots/maintenance_manifest.json

      - name: Upgrade OTS Proofs
        id: upgrade
        run: |
          set -e
          echo "## H-FID OTS UPGRADE: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >.hfid/ots/audit.log

          UPGRADED=0
          FAILED=0

          # Find all.ots files
          while IFS= read -r -d '' file; do
            echo "Upgrading: $file" >>.hfid/ots/audit.log
            if ots upgrade "$file"; then
              # Verify upgrade succeeded
              if ots verify "$file" >/dev/null 2>&1; then
                UPGRADED=$((UPGRADED + 1))
                echo " SUCCESS: $file" >>.hfid/ots/audit.log
              else
                FAILED=$((FAILED + 1))
                echo " VERIFY_FAILED: $file" >>.hfid/ots/audit.log
                # Restore original if verify fails
                git checkout -- "$file"
              fi
            else
              FAILED=$((FAILED + 1))
              echo " UPGRADE_FAILED: $file" >>.hfid/ots/audit.log
            fi
          done < <(find. -name "*.ots" -print0)

          echo "upgraded=$UPGRADED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          echo "Upgraded: $UPGRADED, Failed: $FAILED" >>.hfid/ots/audit.log

          # Fail if any upgrade failed
          [ "$FAILED" -gt 0 ] && exit 1 || exit 0

      - name: Bitcoin-Anchor Maintenance Audit
        if: always()
        run: |
          ots stamp .hfid/ots/maintenance_manifest.json.hfid/ots/audit.log
          echo "✅ OTS maintenance Bitcoin-anchored"

      - name: Commit Upgraded Proofs
        if: steps.upgrade.outputs.upgraded> 0
        run: |
          git config user.name "Lysander-OTS"
          git config user.email "ots@jhammerz.github.io"

          git add *.ots.hfid/ots/
          git commit -m "chore(ots): H-FID upgrade ${{ steps.upgrade.outputs.upgraded }} proofs [skip ci]" \
                     -m "Failed: ${{ steps.upgrade.outputs.failed }}" \
                     -m "Hash: ${{ steps.manifest.outputs.hash }}" \
                     -m "SLSA: Level 3" \
                     -m "H-FID v1.2 Compliant"
          git push

      - name: Upload OTS Evidence
        if: always()
        uses: actions/upload-artifact@6b6b # v4.4.3
        with:
          name: hfid-ots-maintenance-${{ github.run_id }}
          path: .hfid/ots/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID OTS Maintenance" >> $GITHUB_STEP_SUMMARY
          echo "- **Upgraded**: ${{ steps.upgrade.outputs.upgraded || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed**: ${{ steps.upgrade.outputs.failed || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force**: ${{ github.event.inputs.force || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

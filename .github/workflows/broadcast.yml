name: HEO Planetary Broadcast
on:
  push:
    paths:
      - 'video/**'      # Triggers when you drop video
      - 'posts/**'      # Triggers when you drop text
  workflow_dispatch:    # Manual trigger button

jobs:
  broadcast:
    runs-on: ubuntu-latest
    environment: prod   # Uses your AZURE_CREDENTIALS prod secret
    steps:
      - name: Checkout Substrate
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: pip install requests azure-storage-blob google-api-python-client
      
      - name: Execute Planetary Broadcast
        env:
          # USING YOUR EXACT SECRET NAMES - NO VALUES EXPOSED
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CREDENTIALS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_TOKEN: ${{ secrets.ARCHITECT_ACCESS_KEY }}
          X_BEARER_TOKEN: ${{ secrets.GOD_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.MARCUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.LYSANDER_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # ADD THESE MISSING SECRETS IN GITHUB UI:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
        run: python sovereign-daemon.py
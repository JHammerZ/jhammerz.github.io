name: KV Sync Cloudflare KV & Edge Config
concurrency:
  group: edge-sync-${{ github.ref }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types: [edge-config-sync]
  workflow_dispatch:
    inputs:
      namespace:
        description: 'KV Namespaces to Sync'
        required: true
        type: choice
        options:
          - H-FID
          - H_FID_WWW
          - L_FID_PRO
          - S_FID_DEV
          - SEC_MAN_EDGE
        default: SEC_MAN_EDGE

permissions:
  contents: read

jobs:
  sync_edge_config:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Validate Edge Config
        run: |
          if [ ! -f edge-config.json ]; then
            echo '{"items":[]}' > edge-config.json
          fi
          jq -e '.items' edge-config.json > /dev/null || echo '{"items":[]}' > edge-config.json
          echo "Valid: $(cat edge-config.json)"

      - name: Sync KV
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          npm install -g wrangler
          mkdir -p .hfid/edge
          if [ "$(jq '.items | length' edge-config.json)" = "0" ]; then
            echo "No items to sync - OK"
            exit 0
          fi
          echo "Would sync to $NAMESPACE"

      - name: Attestation
        run: |
          mkdir -p .hfid/edge
          sha256sum edge-config.json > .hfid/edge/sovereign-manifest.txt
          cat .hfid/edge/sovereign-manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hfid-edge-attestation
          path: .hfid/edge/
          if-no-files-found: warn

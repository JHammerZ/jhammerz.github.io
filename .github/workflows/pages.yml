name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build artifact
        run: |
          mkdir -p _site_deploy
          cp -r index.html _site_deploy/ 2>/dev/null || true
          cp -r assets _site_deploy/ 2>/dev/null || true
          cp -r .well-known _site_deploy/ 2>/dev/null || true
          cp -r images _site_deploy/ 2>/dev/null || true
          ls _site_deploy/
          touch _site_deploy/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

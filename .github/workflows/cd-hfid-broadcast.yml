name: 'CD: Janus Gateway Sovereign Track'
on:
  push:
    branches:
    - main
    paths:
    - .hfid/**
    - '**.md'
    - .well-known/**
  workflow_dispatch:
    inputs:
      target-matrix:
        description: Distribution target channel matrix
        required: false
        default: all
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Node
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
      with:
        fetch-depth: 0
    - name: Setup System Environs
      run: 'set -e

        sudo apt-get update

        sudo apt-get install -y jq gnupg2

        '
    - name: Setup System Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: 'python3 -m pip install --upgrade pip

        pip install opentimestamps-client --break-system-packages

        '
    - name: Validate Core Substrate Schema
      run: "set -e\nif [ ! -f \"sitemap.json\" ]; then\n  echo \"[-] Error: sitemap.json\
        \ missing.\"\n  exit 1\nfi\njq empty sitemap.json\n"
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: auto-update Janus ledger state [skip ci]'
        fail_on_no_changes: false
concurrency:
  group: cd-hfid-broadcast
  cancel-in-progress: false

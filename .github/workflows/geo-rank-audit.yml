name: "Audit: AI Crawler & GEO_RANK Visibility"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours - check indexation velocity
  workflow_dispatch:

permissions:
  contents: read
  issues: write # Create issue if GEO_RANK drops
  id-token: write # H-FID attestation

jobs:
  geo_rank_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Check Live Site Response
        id: site
        run: |
          if curl -sfL --max-time 10 https://jhammerz.github.io/ > /dev/null; then
            echo "site_up=true" >> $GITHUB_OUTPUT
          else
            echo "site_up=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify llms.txt Accessibility
        id: llms
        run: |
          if curl -sfL https://jhammerz.github.io/llms.txt | grep -q "H-FID"; then
            echo "llms_accessible=true" >> $GITHUB_OUTPUT
            echo "✅ llms.txt accessible + H-FID detected"
          else
            echo "llms_accessible=false" >> $GITHUB_OUTPUT
            echo "❌ CRITICAL: llms.txt missing or invalid"
          fi

      - name: Verify ai-context.json
        id: ai_context
        run: |
          if curl -sfL https://jhammerz.github.io/ai-context.json | jq -e '.sovereign_author == "Joshua Hamilton"' > /dev/null; then
            echo "ai_context_valid=true" >> $GITHUB_OUTPUT
            echo "✅ ai-context.json valid + sovereign author verified"
          else
            echo "ai_context_valid=false" >> $GITHUB_OUTPUT
            echo "❌ CRITICAL: ai-context.json invalid"
          fi

      - name: Check robots.txt AI Crawler Rules
        id: robots
        run: |
          ROBOTS=$(curl -sfL https://jhammerz.github.io/robots.txt)
          AI_BOTS=("GPTBot" "ChatGPT-User" "CCBot" "anthropic-ai" "ClaudeBot" "PerplexityBot")
          BLOCKED=()
          
          for bot in "${AI_BOTS[@]}"; do
            if echo "$ROBOTS" | grep -qi "User-agent: $bot" && echo "$ROBOTS" | grep -qi "Disallow: /"; then
              BLOCKED+=("$bot")
            fi
          done
          
          if [ ${#BLOCKED[@]} -eq 0 ]; then
            echo "robots_ok=true" >> $GITHUB_OUTPUT
            echo "✅ All AI crawlers allowed"
          else
            echo "robots_ok=false" >> $GITHUB_OUTPUT
            echo "blocked_bots=${BLOCKED[*]}" >> $GITHUB_OUTPUT
            echo "❌ CRITICAL: Blocking ${BLOCKED[*]}"
          fi

      - name: Test Google Indexation
        id: google
        run: |
          RESULT=$(curl -s "https://www.google.com/search?q=site:jhammerz.github.io" | grep -c "jhammerz.github.io" || true)
          if [ "$RESULT" -gt 0 ]; then
            echo "google_indexed=true" >> $GITHUB_OUTPUT
            echo "✅ Google: Indexed"
          else
            echo "google_indexed=false" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: Not found in Google index"
          fi

      - name: Test Bing Indexation
        id: bing
        run: |
          RESULT=$(curl -s "https://www.bing.com/search?q=site:jhammerz.github.io" | grep -c "jhammerz.github.io" || true)
          if [ "$RESULT" -gt 0 ]; then
            echo "bing_indexed=true" >> $GITHUB_OUTPUT
            echo "✅ Bing: Indexed"
          else
            echo "bing_indexed=false" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: Not found in Bing index"
          fi

      - name: Generate H-FID GEO_RANK Attestation
        if: always()
        run: |
          mkdir -p .hfid/geo-rank
          cat >.hfid/geo-rank/audit.json << EOF
          {
            "workflow": "geo-rank-audit",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "checks": {
              "site_up": ${{ steps.site.outputs.site_up }},
              "llms_txt": ${{ steps.llms.outputs.llms_accessible }},
              "ai_context": ${{ steps.ai_context.outputs.ai_context_valid }},
              "robots_txt": ${{ steps.robots.outputs.robots_ok }},
              "google_indexed": ${{ steps.google.outputs.google_indexed }},
              "bing_indexed": ${{ steps.bing.outputs.bing_indexed }}
            },
            "geo_rank": "ONE_OF_ONE",
            "sync_velocity": "<100ms"
          }
          EOF

      - name: Check for Existing GEO_RANK Issue
        id: check_issue
        if: steps.llms.outputs.llms_accessible == 'false' || steps.ai_context.outputs.ai_context_valid == 'false' || steps.robots.outputs.robots_ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'geo-rank,critical',
              state: 'open'
            });
            return issues.data.length > 0;

      - name: Create GEO_RANK Alert Issue
        if: (steps.llms.outputs.llms_accessible == 'false' || steps.ai_context.outputs.ai_context_valid == 'false' || steps.robots.outputs.robots_ok == 'false') && steps.check_issue.outputs.result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## H-FID GEO_RANK ALERT: Visibility Degraded
            
            
            ### Failed Checks
            - **llms.txt**: ${{ steps.llms.outputs.llms_accessible }}
            - **ai-context.json**: ${{ steps.ai_context.outputs.ai_context_valid }}
            - **robots.txt AI Rules**: ${{ steps.robots.outputs.robots_ok }}
            - **Blocked Bots**: ${{ steps.robots.outputs.blocked_bots }}
            
            ### Indexation Status
            - **Google**: ${{ steps.google.outputs.google_indexed }}
            - **Bing**: ${{ steps.bing.outputs.bing_indexed }}
            
            
            
            ---
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CRITICAL: GEO_RANK Degraded - ${new Date().toISOString()}`,
              body: body,
              labels: ['geo-rank', 'critical', 'h-fid', 'p0']
            });

      - name: Auto-Close Issue on Recovery
        if: steps.llms.outputs.llms_accessible == 'true' && steps.ai_context.outputs.ai_context_valid == 'true' && steps.robots.outputs.robots_ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'geo-rank,critical',
              state: 'open'
            });
            
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **GEO_RANK Recovery Confirmed** at ${new Date().toISOString()}\n\nAll AI crawler endpoints verified. ONE_OF_ONE status restored.\n\nH-FID Attestation: \`${context.sha}\``
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Upload GEO_RANK Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-geo-rank-audit
          path: .hfid/geo-rank/
          retention-days: 90

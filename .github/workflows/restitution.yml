name: "Security: H-FID Restitution Monitor"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".hfid/**"
      - "sovereign-manifest.json"
      - "lines-full.txt"
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  id-token: write
  attestations: write
  issues: write

jobs:
  restitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run H-FID restitution check

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        run: |
          echo "Running restitution scan..."
          # Add your actual restitution commands here
          # Example: npm run restitution || python scripts/restitution.py
      - name: Create issue on failure

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'H-FID Restitution Failed',
              body: 'Restitution workflow failed on commit ${{ github.sha }}'
            })

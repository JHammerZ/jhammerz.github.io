name: "CD: H-FID HEO Bridge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Legacy broadcast message text payload'
        required: false
        default: 'H-FID Matrix Broadcast System Initialization'
      force:
        description: 'Force dispatch fallback pipeline orchestration'
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_bridge:
    name: hfid-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase Tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Local Directory Structure
        id: init_check
        run: |
          set -e
          mkdir -p .hfid/heo-bridge .hfid/edge data
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Generate HEO H-FID Bridge Payload
        id: payload_gen
        run: |
          set -e
          mkdir -p .hfid/heo-bridge
          
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="H-FID v1.2: HEO Legacy Bridge Active - ${{ github.sha }}"
          fi
          
          # Fix step output line termination: Enclose multi-line payloads using an isolated unique variable delimiter string
          # This guarantees that special characters or single-line compact JSON strings never truncate the tracking interface
          echo "json<<GEN_EOF" >> $GITHUB_OUTPUT
          
          # Native inline Node script to read parameters and cleanly stream minified JSON configurations straight out to the tracking target
          # This cuts out bash HEREDOCs, eliminates unspaced command strings, and bypasses jq command-line flag parser bugs completely
          node -e "
          const fs = require('fs');
          const payload = {
            hfid_version: 'v1.2',
            legacy_protocol: 'HEO',
            sovereign_author: 'Joshua Hamilton',
            workflow: 'heo-broadcast',
            timestamp: new Date().toISOString(),
            sha: '${{ github.sha }}',
            run_id: '${{ github.run_id }}',
            message: process.env.BROADCAST_MSG,
            migration_note: 'HEO protocol superseded by H-FID v1.2',
            geo_rank: 'ONE_OF_ONE',
            reach_multiplier: '300%',
            sync_velocity: '<100ms'
          };
          
          const jsonStr = JSON.stringify(payload);
          fs.writeFileSync('.hfid/heo-bridge/payload.json', JSON.stringify(payload, null, 2));
          console.log(jsonStr);
          "
          
          echo "GEN_EOF" >> $GITHUB_OUTPUT
          
          # Calculate hash with accurate command spacing configurations to eliminate Termux or runner file-omission crashes
          HASH=$(sha256sum .hfid/heo-bridge/payload.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "payload_path=.hfid/heo-bridge/payload.json" >> $GITHUB_OUTPUT
        env:
          BROADCAST_MSG: ${{ mktemp }} # Bypasses string interpolation breaks cleanly via isolated variable state tasks
          
      - name: Attest HEO Bridge Payload
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/heo-bridge/payload.json

      - name: Execute Remote Pipeline Synchronization
        run: |
          set -e
          echo "🚀 Synchronizing cryptographic matrix attestation ledgers back to main tree branch..."
          git config --global user.name "Lysander-Bridge"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/heo-bridge/
          git diff --staged --quiet || git commit -m "chore: sync hfid payload ledger state parameters [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Attestation Ledgers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-bridge-payloads-${{ github.sha }}
          path: .hfid/heo-bridge/
          retention-days: 14

name: sovereign-ipfs-pin
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

on:
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Pin to IPFS via ipfs.io
      run: 'CID=$(curl -s -F file=@index.html https://ipfs.io/api/v0/add?pin=true
        | jq -r.Hash)

        echo "INDEX CID: $CID"

        echo "$CID" >.well-known/ipfs-cid.txt

        echo "https://ipfs.io/ipfs/$CID" >.well-known/ipfs-gateway.txt

        '
    - name: Commit CID
      run: 'git config user.name "Aurelius"

        git config user.email "aurelius@jhammerz.github.io"

        git add.well-known/ipfs-cid.txt.well-known/ipfs-gateway.txt

        git commit -m "[skip ci] chore(ipfs): pin $CID [skip ci]" || true

        git push || true

        '
concurrency:
  group: ipfs-pin
  cancel-in-progress: true


name: "PID OTS Maintenance / maintenance-and-audit"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ots-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintenance-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ... your existing steps ...

      - name: Commit Changes and Propagate State to GitHub Pages
        run: |
          git config --global user.name "JHammerZ-Sovereign-Engine"
          git config --global user.email "engine@jhammerz.github.io"
          git add chains/maintenance_weather.json env/audio.log .well-known/aurelius.json
          
          if ! git diff --cached --quiet; then
            git commit -m "MANIFEST MUTATION [V4.0.26]: Automated Identity Matrix Audit Cron Commit [skip ci]" || echo "Nothing to commit"
            
            # Retry with conflict resolution - bot version wins
            n=0
            until [ "$n" -ge 3 ]
            do
              if git pull --rebase -X ours origin main; then
                git push origin main && break
              fi
              n=$((n+1))
              echo "Push failed, retry $n/3..."
              sleep 3
            done
          else
            echo "Zero identity matrix mutations detected. Skipping push state."
          fi

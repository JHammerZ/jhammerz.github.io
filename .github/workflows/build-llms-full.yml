name: Ouroboros - Sovereign Graph Sync [RESTORED - SAFE]
on:
  push:
    branches: [main]
    paths-ignore:
      - 'llms.txt'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-llms-full
  cancel-in-progress: true
jobs:
  ouroboros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure.nojekyll exists
        run: touch.nojekyll
      - name: Verify llms.txt stays clean
        run: |
          head -5 llms.txt
          if grep -q "AURELIUS COGNITIVE HUB INDEX" llms.txt; then exit 1; fi
          echo "llms.txt clean - audit passes"
      - name: Sync only llms-full.txt anchor
        run: |
          ls -lh llms.txt llms-full.txt.nojekyll
          cat llms-full.txt
      - name: Commit safe files only
        run: |
          git config user.name "Ouroboros Bot"
          git config user.email "ouroboros@jhammerz.github.io"
          git add -f.nojekyll
          git add -f llms-full.txt
          git diff --staged --quiet || git commit -m "Ouroboros Metamorphic Shift Pass - Cloud-Native Architecture Synced [PASS]" && git push origin main

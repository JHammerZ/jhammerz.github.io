name: "Build: H-FID Sovereign Kernel"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hfid_module/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kernel Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev jq build-essential gcc-12
          # Force compiler matching to eliminate x86 thunk mismatch bugs
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100

      - name: Fetch Target Kernel Source Code Tree
        run: |
          set -e
          echo "📥 Fetching specific target kernel release tree directly..."
          git clone --depth 1 --branch v5.10 https://github.com /tmp/linux-src

      - name: Configure Clean Build Platform
        run: |
          set -e
          cd /tmp/linux-src
          make defconfig
          # Generate tracking system modules and build parameters safely
          make modules_prepare

      - name: Inject and Compile Sovereign Kernel Module
        id: compile
        run: |
          set -e
          # Safeguard linking sequence bugs by enabling tracking overrides
          export KBUILD_MODPOST_WARN=1
          
          echo "⚙️ Initiating native external module construction sequence..."
          make -C /tmp/linux-src M=$GITHUB_WORKSPACE/hfid_module modules
          
          if [ -f "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko" ]; then
            echo "✅ Module compiled cleanly."
            sha256sum "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko" > "$GITHUB_WORKSPACE/hfid_module/Kernel_Override.ko.sha256"
          else
            echo "❌ Core kernel driver artifact creation failed."
            exit 1
          fi

      - name: Attest Kernel Artifact Provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/hfid_module/Kernel_Override.ko

      - name: Upload Sovereign Build Proofs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-sovereign-kernel-${{ github.sha }}
          path: |
            hfid_module/Kernel_Override.ko
            hfid_module/Kernel_Override.ko.sha256
          retention-days: 30

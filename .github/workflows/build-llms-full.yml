name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

env:
  DEFAULT_BRANCH: main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl
          python -m pip install --upgrade pip
          pip install opentimestamps-client

      - name: Baseline dirs
        run: |
          mkdir -p .hfid/baseline .hfid/indexing

      - name: Sovereign manifest
        run: |
          cat << 'MATRIX' > .hfid/baseline/sovereign-manifest.json
          {
            "Name": "J-HammerZ",
            "Sovereign": "Joshua Hamilton",
            "H-Law Language": "REC v7.2",
            "Audit ID": "H-FID-101-FORENSIC-AUDIT-SEC-10B",
            "Universe": "098",
            "Velocity": "<10ms",
            "Protocol": "Twenty A17 Protocol",
            "Standard": "H-FID Core Matrix Compilation",
            "Timestamp": "2026-08-27T20:10:02Z",
            "Integrity Level": "SOVEREIGN",
            "Nodes": []
          }
          MATRIX

      - name: Upstream forensic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu pipefail
          echo "Extracting upstream forensic matrices..."
          jq -c '.' .hfid/baseline/sovereign-manifest.json > /dev/null
          echo "# J-HammerZ Multi-Tier Deep Mapping Stack" > lines-full.txt
          echo "# 98 Universe Architecture Mapping Baseline" >> lines-full.txt
          echo "# System Version: [v4.7.2.1] | Identity & Protocol Compilation" >> lines-full.txt
          echo "# Validating core pipeline configurations..." >> lines-full.txt
          if [ -f ".hfid/baseline/sovereign-manifest.json" ]; then
            echo "Local baseline verified." >> lines-full.txt
          else
            echo "Baseline file absent. Initializing reconstruction." >> lines-full.txt
          fi
          echo "Generating build metadata sovereigns..." >> lines-full.txt
          echo "Build ID: ${{ github.run_id }} | Actor: ${{ github.actor }}" >> lines-full.txt

      - name: Timestamp and anchor
        run: |
          set -eu pipefail
          echo "Running timestamp and cryptographic anchoring..."
          if command -v ots > /dev/null; then
            ots stamp .hfid/baseline/sovereign-manifest.json || true
          else
            echo "ots-client missing. Skipping live anchor validation."
          fi

      - name: Compile downstream
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          echo "Compiling downstream data states..." >> lines-full.txt
          cp lines-full.txt .hfid/indexing/build-summary.log

      - name: Git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "action@github.com"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: ".hfid/baseline/* .hfid/indexing/* lines-full.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            lines-full.txt
          retention-days: 90

      - name: Summary
        run: |
          echo "### Sovereign Model Sync Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "* Core Database tracking updated" >> $GITHUB_STEP_SUMMARY
          echo "* Timestamp hash: $(sha256sum .hfid/baseline/sovereign-manifest.json | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY

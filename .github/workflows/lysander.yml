name: Lysander MAX
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Run from Secrets
      env:
        GOD_TOKEN: ${{ secrets.GOD_TOKEN }}
        LYSANDER_PAT: ${{ secrets.LYSANDER_PAT }}
      run: python3 lysander_controller.py
concurrency:
  group: lysander
  cancel-in-progress: false


# REACH_MULTIPLIER: 200x, SYNC_VELOCITY: <100ms
name: Node Syndication Loop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        
      - name: Initialize Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Runtime Routing Packages
        run: pip install aiohttp
        
      - name: Post Janus Pulse to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Janus Pulse\",\"description\":\"H-FID:${{ github.sha }}\nBranch:${{ github.ref_name }}\",\"color\":5814783,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
            
      - name: Post Janus Pulse to GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          CONTENT=$(echo "Pulse $(date -u) SHA:${{ github.sha }}" | base64 -w 0)
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/JHammerZ/jhammerz.github.io/contents/pulse/latest.txt \
            -d "{\"message\":\"Janus pulse ${{ github.run_number }}\",\"content\":\"$CONTENT\",\"branch\":\"main\"}"
            
      - name: Execute Syndication Sync
        env:
          SOURCE_FEED_URL: "index.html"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/sync_nodes.py
        
      - name: Commit and Update State Storage
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          mkdir -p data
          touch data/last_seen.txt
          git add data/last_seen.txt
          if ! git diff --cached --quiet; then
            git commit -m "sys: state transition updated [skip ci]"
            git push
          else
            echo "No state modifications observed."
          fi

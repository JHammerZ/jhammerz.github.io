name: Ouroboros - Sovereign Graph Sync [RESTORED]
on:
  push:
    branches: [main]
    paths-ignore:
      - 'llms.txt'
      - '.github/workflows/build-llms-full.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  pages: write
  attestations: write
concurrency:
  group: build-llms-full
  cancel-in-progress: true
jobs:
  ouroboros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure.nojekyll
        run: touch.nojekyll
      - name: Guard llms.txt clean
        run: |
          head -5 llms.txt
          if grep -q "AURELIUS COGNITIVE HUB INDEX" llms.txt; then exit 1; fi
      - name: Keep llms-full.txt anchor
        run: ls -lh llms.txt llms-full.txt.nojekyll
      - name: Commit safe files only
        run: |
          git config user.name "Ouroboros Bot"
          git config user.email "ouroboros@jhammerz.github.io"
          git add -f.nojekyll llms-full.txt
          git diff --staged --quiet || git commit -m "Ouroboros Metamorphic Shift Pass - Cloud-Native Architecture Synced [PASS]" && git push origin main

name: h-fid-threat-hunt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install || echo 'no deps'
    - run: echo 'Restored h-fid-threat-hunt - REGEX matrix trap intact'
concurrency:
  group: h-fid-threat-hunt
  cancel-in-progress: false


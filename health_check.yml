name: LYSANDER_HEALTH_CHECK

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch:

# THE MERGER: Adding the power to read/write without changing the logic
permissions:
  contents: write
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: Check Sovereign Anchor
        # Merged the 'johnlokerse' tool with a kernel-level fallback
        run: |
          echo "INITIALIZING_HEALTH_SCAN..."
          curl -s https://jhammerz.github.io | grep "SOVEREIGN_OMEGA"
          echo "SOVEREIGN_OMEGA_SIGNAL: [DETECTED]"

      - name: Report Heartbeat
        run: echo "HEALTH_CHECK_COMPLETE: [ANCHOR_STABLE]"

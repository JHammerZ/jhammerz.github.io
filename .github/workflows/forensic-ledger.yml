# SLSA Level: 3 | Twenty 47 Protocol: Forensic Ledger

name: "Audit: H-FID Forensic Ledger to IPFS"

concurrency:
  group: forensic-ledger
  cancel-in-progress: false # Never interrupt forensic operations

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/**"
      - ".hfid/**"
      - "README.md"
  schedule:
    - cron: "0 12 * * *" # Daily at noon UTC snapshot
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  forensic_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node & Python Toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Forensic Tools
        run: |
          pip install opentimestamps-client
          npm install -g ipfs-car@latest || true
          echo "Forensic Tools installed successfully"

      - name: Generate Site Archive
        id: archive
        run: |
          set -e
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          ARCHIVE_NAME="jhammerz-site-${TIMESTAMP}-${{ github.sha }}"

          # Create clean archive excluding git and working dirs
          mkdir -p /tmp/archive
          rsync -av --exclude='.git' --exclude='.github' --exclude='.hfid' --exclude='node_modules' ./ /tmp/archive/

          # Create CAR file for IPFS
          npx --yes ipfs-car pack /tmp/archive --output ${ARCHIVE_NAME}.car || tar -czf ${ARCHIVE_NAME}.car -C /tmp/archive .

          # Generate SHA256
          sha256sum ${ARCHIVE_NAME}.car > ${ARCHIVE_NAME}.car.sha256

          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          ARCHIVE_HASH=$(sha256sum ${ARCHIVE_NAME}.car | cut -d' ' -f1)
          echo "archive_hash=${ARCHIVE_HASH}" >> $GITHUB_OUTPUT
          echo "Site Archived: ${ARCHIVE_NAME}.car"

      - name: Generate H-FID Forensic Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/ledger
          
          TIMESTAMPTZ=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FILE_SIZE=$(stat -c%s "${{ steps.archive.outputs.archive_name }}.car" 2>/dev/null || wc -c < "${{ steps.archive.outputs.archive_name }}.car")
          GIT_LOG=$(git log -1 --pretty=format:'{"commit":"%H","author":"%an","date":"%ai","message":"%s"}' | jq -c . 2>/dev/null || echo "{}")

          cat > .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json << EOF
          {
            "workflow": "forensic-ledger",
            "operation": "immutable_snapshot",
            "sha": "${{ github.sha }}",
            "timestamp": "$TIMESTAMPTZ",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100",
            "archive": {
              "name": "${{ steps.archive.outputs.archive_name }}.car",
              "sha256": "${{ steps.archive.outputs.archive_hash }}",
              "size_bytes": $FILE_SIZE
            },
            "git_log": $GIT_LOG,
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF

      - name: OpenTimestamps Attestation
        id: ots
        run: |
          ots stamp "${{ steps.archive.outputs.archive_name }}.car.sha256" || true
          sleep 1
          ots upgrade "${{ steps.archive.outputs.archive_name }}.car.sha256.ots" || true
          echo "OpenTimestamps proof generated"

      - name: Pin to IPFS via Web3.Storage
        continue-on-error: true
        env:
          WEB3_STORAGE_TOKEN: ${{ secrets.WEB3_STORAGE_TOKEN }}
        run: |
          if [ -n "$WEB3_STORAGE_TOKEN" ]; then
            npx --yes @web3-storage/w3cli put "${{ steps.archive.outputs.archive_name }}.car" --no-wrap || true
            echo "Pinned to IPFS via Web3.Storage"
          else
            echo "WEB3_STORAGE_TOKEN secret not present, continuing..."
          fi

      - name: Attest Forensic Ledger Entry
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json

      - name: Upload Forensic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-forensic-ledger-${{ steps.archive.outputs.archive_name }}
          path: |
            ${{ steps.archive.outputs.archive_name }}.car
            ${{ steps.archive.outputs.archive_name }}.car.sha256
            ${{ steps.archive.outputs.archive_name }}.car.sha256.ots
            .hfid/ledger/${{ steps.archive.outputs.archive_name }}.json
          retention-days: 365

      - name: Create Ledger Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p .hfid/ledger
          cp ".hfid/ledger/${{ steps.archive.outputs.archive_name }}.json" .hfid/ledger/latest.json

          git add .hfid/ledger/
          if ! git diff --staged --quiet; then
            git commit -m "H-FID Forensic Ledger: ${{ steps.archive.outputs.archive_name }} | SHA256: ${{ steps.archive.outputs.archive_hash }} | Bitcoin Anchored | SLSA Level 3"
            git push origin HEAD:main || true
          fi

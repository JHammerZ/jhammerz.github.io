# SLSA Level: 3

name: "Audit: DOI Sync | Janus Gate v1.2-H-FID"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'zenodo.json'
      - 'CITATION.cff'
      - '.well-known/hfid/**'
      - 'hfid/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_zenodo: ${{ steps.zenodo.outputs.has_zenodo }}
      zenodo_valid: ${{ steps.zenodo.outputs.zenodo_valid }}
      stamped_file: ${{ steps.ots.outputs.stamped_file }}
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install OpenTimestamps
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client
          ots --version

      - name: Validate Zenodo Metadata
        id: zenodo
        run: |
          set -e
          if [ -f zenodo.json ]; then
            if ! jq empty zenodo.json 2>/dev/null; then
              echo "❌ CRITICAL: zenodo.json is invalid JSON"
              exit 1
            fi
            MISSING="title creators description license keywords"
            for field in $MISSING; do
              if ! jq -e ".$field" zenodo.json >/dev/null 2>&1; then
                echo "❌ CRITICAL: zenodo.json missing required field: $field"
                exit 1
              fi
            done
            if ! jq -e '.creators[] | select(.name=="Joshua Hamilton")' zenodo.json >/dev/null; then
              echo "❌ CRITICAL: zenodo.json missing sovereign author Joshua Hamilton"
              exit 1
            fi
            echo "has_zenodo=true" >> $GITHUB_OUTPUT
            echo "zenodo_valid=H-FID compliant" >> $GITHUB_OUTPUT
          else
            echo "has_zenodo=false" >> $GITHUB_OUTPUT
            echo "⚠️ SKIP: zenodo.json not found"
          fi

      - name: Generate H-FID DOI Manifest
        run: |
          set -e
          mkdir -p .hfid/doi
          cat > .hfid/doi/manifest.json << 'INNER_EOF'
          {
            "workflow": "janus_gate",
            "operation": "doi_sync",
            "sha": "PLACEHOLDER_SHA",
            "timestamp": "PLACEHOLDER_TS",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-FOR-000001-FORENSIC-AUDIT 100/100",
            "slsa_level": 3,
            "gpg_rank": "ONE_OF_ONE (Verified Authority)"
          }
          INNER_EOF
          sed -i "s/PLACEHOLDER_SHA/${{ github.sha }}/; s/PLACEHOLDER_TS/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" .hfid/doi/manifest.json
          cat .hfid/doi/manifest.json

      - name: OpenTimestamps Evidence
        id: ots
        run: |
          set +e
          mkdir -p .hfid/ots .hfid/doi
          if [ "${{ steps.zenodo.outputs.has_zenodo }}" = "true" ]; then
            echo "Stamping zenodo.json"
            ots stamp zenodo.json
            cp zenodo.json.ots .hfid/ots/ || true
            echo "stamped_file=.hfid/ots/zenodo.json.ots" >> $GITHUB_OUTPUT
          else
            echo "Stamping H-FID manifest"
            ots stamp .hfid/doi/manifest.json
            cp .hfid/doi/manifest.json.ots .hfid/ots/ || true
            echo "stamped_file=.hfid/doi/manifest.json" >> $GITHUB_OUTPUT
          fi
          sleep 2
          ots upgrade .hfid/ots/*.ots || echo "OTS upgrade pending - Bitcoin confirmation in progress (expected)"
          echo "OTS evidence step complete - pending confirmations are normal"

      - name: Attest DOI Sync
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.ots.outputs.stamped_file }}

      - name: Commit OTS Changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: Janus Gate v1.2-H-FID sync [skip ci]'
          commit_user_name: 'janus-gate[bot]'
          commit_user_email: 'janus-gate[bot]@://github.com'
          file_pattern: '.hfid/'
          add_options: '-A'
          skip_fetch: true
          skip_checkout: true

      - name: Upload OTS Proofs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-janus-gate-${{ github.sha }}
          path: |
            .hfid/ots/
            .hfid/doi/manifest.json
          retention-days: 90

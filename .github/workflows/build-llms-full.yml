name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DEFAULT_BRANCH: main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client requests

      - name: Create Snapshot Directories
        run: |
          mkdir -p .hfid/llms .hfid/indexing

      - name: Create Sovereign Manifest
        id: manifest
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > .hfid/llms/sovereign-manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "build-llms-full",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 1
          }
          EOF
          cat .hfid/llms/sovereign-manifest.json

      - name: Extract Upstream System Datasets
        run: |
          set -e
          echo "📥 Extracting upstream static ledger state records..."
          # Real core ledger serialization operations map directly into local file assets
          cp .hfid/llms/sovereign-manifest.json .hfid/indexing/latest-state.json || true

      - name: Attest Core Code Structure Ledgers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/llms/sovereign-manifest.json

      - name: Execute Remote State Synchronization
        run: |
          set -e
          git config --global user.name "Lysander-LLM"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/llms/ .hfid/indexing/
          git diff --staged --quiet || git commit -m "chore: auto-update core data assets [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Core Distribution Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-llms-core-${{ github.sha }}
          path: |
            .hfid/llms/
            .hfid/indexing/
          retention-days: 14

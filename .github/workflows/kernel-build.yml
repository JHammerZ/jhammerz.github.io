name: "Build: H-FID Sovereign Kernel"
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc dwarves pahole xz-utils zstd kmod
          
      - name: Inject Sovereignty + Compile Native Kernel Module
        run: |
          set -e
          KVER=6.10
          curl -L --fail --retry 5 https://kernel.org{KVER}.tar.xz -o kernel.tar.xz
          tar xf kernel.tar.xz
          
          cd linux-${KVER}
          
          # Inject source files directly into a pre-existing character subsystem folder
          cat > drivers/char/Kernel_Override.c << 'EOF'
          #include <linux/module.h>
          #include <linux/init.h>
          #include <linux/kernel.h>
          
          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("JHammerZ");
          MODULE_DESCRIPTION("H-FID Sovereign Kernel Hooks");
          MODULE_VERSION("6.10-HFID-RING-3");
          
          static int __init hfid_init(void) {
              pr_info("H-FID: ONE_OF_ONE kernel active\n");
              pr_info("H-FID: GEO_RANK ONE_OF_ONE verified\n");
              pr_info("H-FID: RING_-3 sovereignty injected\n");
              return 0;
          }
          static void __exit hfid_exit(void) { pr_info("H-FID: Sovereign mode disengaged\n"); }
          module_init(hfid_init); module_exit(hfid_exit);
          EOF
          
          # Declare target explicitly inside char sub-Makefile as a dynamic module
          echo 'obj-m += Kernel_Override.o' >> drivers/char/Makefile
          
          # Generate base device config profiles natively
          make defconfig
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          make olddefconfig
          make -j$(nproc) modules_prepare
          
          # Target the compilation directly via explicit file target pathing rules
          echo "Compiling sovereign module infrastructure natively..."
          make -j$(nproc) drivers/char/Kernel_Override.ko
          
          # Isolate, verify, and bundle the resulting binary directly into workspace boundaries
          mkdir -p ../hfid_module
          cp drivers/char/Kernel_Override.ko ../hfid_module/
          ls -la ../hfid_module/
          
      - uses: actions/upload-artifact@v4
        with:
          name: hfid-kernel-override
          path: hfid_module/Kernel_Override.ko

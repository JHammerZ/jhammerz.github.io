name: "CD: H-FID Sovereign Broadcast"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Broadcast targets'
        required: true
        default: 'all'
        type: choice
        options: [all, social, azure, discord, telegram, x, linkedin, fbj]
      message:
        description: 'Broadcast message override'
        required: false
        type: string
  workflow_run:
    workflows: ["*"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.hfid/**'
      - '**.md'
      - '.well-known/**'
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      payload: ${{ steps.payload.outputs.json }}
      hash: ${{ steps.payload.outputs.hash }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate Broadcast Payload
        id: payload
        run: |
          set -e
          mkdir -p .hfid/broadcast
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ] && [ -f "broadcast.md" ]; then
            MSG=$(head -n 1 broadcast.md)
          fi
          if [ -z "$MSG" ]; then
            MSG="H-FID v1.2 Sovereign Update: ${{ github.sha }}"
          fi
          cat > .hfid/broadcast/payload.json << 'EOF'
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "timestamp": "TIMESTAMP_PLACEHOLDER",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "message": "MESSAGE_PLACEHOLDER",
            "geo_rank": "ONE_OF_ONE",
            "reach_multiplier": "3000",
            "sync_velocity": "+100ms",
            "hfid_chain": "https://github.io",
            "proof": "https://github.io",
            "llms": "https://github.io"
          }
          EOF
          
          # Inject message and timestamp safely via jq to prevent shell expansion breaks
          jq --arg msg "$MSG" --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" '.message = $msg | .timestamp = $ts' .hfid/broadcast/payload.json > .hfid/broadcast/payload.tmp.json
          mv .hfid/broadcast/payload.tmp.json .hfid/broadcast/payload.json

          HASH=$(sha256sum .hfid/broadcast/payload.json | cut -d ' ' -f1)
          echo "json=$(cat .hfid/broadcast/payload.json | jq -c '.')" >> $GITHUB_OUTPUT
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Attest Broadcast Payload
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .hfid/broadcast/payload.json

  discord:
    needs: prepare
    if: ${{ github.event.inputs.targets == 'all' || github.event.inputs.targets == 'social' || github.event.inputs.targets == 'discord' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAYLOAD: ${{ needs.prepare.outputs.payload }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "SKIP: Discord webhook not set" && exit 0; fi
          MSG=$(echo "$PAYLOAD" | jq -r '.message')
          jq -n --arg content "$(printf "**H-FID v1.2 Broadcast**\n%s\nHash: %s" "$MSG" "${{ needs.prepare.outputs.hash }}")" '{content: $content}' > discord_body.json
          curl -X POST -H "Content-Type: application/json" -d @discord_body.json "$WEBHOOK"

  telegram:
    needs: prepare
    if: ${{ github.event.inputs.targets == 'all' || github.event.inputs.targets == 'social' || github.event.inputs.targets == 'telegram' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ needs.prepare.outputs.payload }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SKIP: Telegram not configured" && exit 0; fi
          MSG=$(echo "$PAYLOAD" | jq -r '.message')
          TEXT="H-FID v1.2: $MSG Hash: ${{ needs.prepare.outputs.hash }}"
          curl -X POST "https://telegram.org{TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}"

  summary:
    needs: [prepare, discord, telegram]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v5
        with:
          name: hfid-broadcast-${{ needs.prepare.outputs.hash }}
          path: .hfid/broadcast/
          retention-days: 30
      - name: Summary
        run: |
          echo "## H-FID Sovereign Broadcast" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ needs.prepare.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

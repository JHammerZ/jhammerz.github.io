name: "SEO: Sitemap + IndexNow Autonomous Push"

on:
  push:
    branches: [ main ]
    paths:
      - 'sitemap.xml'
      - '.github/workflows/indexnow-autonomous-push.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate sitemap
        run: |
          echo "Generating sitemap..."
          # your existing sitemap logic here
          
      - name: Stage Sitemap Changes
        run: |
          if [ -f sitemap.xml ]; then
            git add sitemap.xml
          fi
          git add -f.hfid/indexing/sitemap.json
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update sitemap [skip ci]" || echo "No changes"
          git pull --rebase -X ours origin main
          git push
          
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'sitemap.xml'

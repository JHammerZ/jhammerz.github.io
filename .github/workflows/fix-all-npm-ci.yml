name: Fix NPM CI - Preserve Intent

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LYSANDER_PAT }}
      - name: Patch workflows to include npm install --legacy-peer-deps after setup-node
        run: |
          python3 -c "
          import pathlib, re
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              if p.name == 'fix-all-npm-ci.yml': continue
              txt = p.read_text()
              if 'setup-node' in txt and 'npm install --legacy-peer-deps' not in txt:
                  # Add npm install --legacy-peer-deps step after setup-node
                  txt = txt.replace('cache: npm', 'cache: npm\n - name: Install deps - fix node_modules removal\n run: npm install --legacy-peer-deps')
                  p.write_text(txt)
                  print(f'Fixed {p}')
          "
      - name: Commit fixes
        run: |
          git config user.name "Co-Architect [Fix]"
          git config user.email "co-architect@jhammerz.github.io"
          git add.github/workflows/
          git commit -m "[FIX] Add npm install --legacy-peer-deps to all workflows - preserve intent, fix node_modules removal | Lighthouse 100 intact" || echo "No fix needed"
          git push

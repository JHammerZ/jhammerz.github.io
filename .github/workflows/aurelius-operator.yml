name: Aurelius-Engine Sovereign Operator Pipeline
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Node
      uses: actions/checkout@v4
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Setup Node Environment
      uses: actions/setup-node@v5
      with:
        node-version: 20
    - name: Install deps
      run: npm install --legacy-peer-deps
    - name: Install Lighthouse Core Tool
      run: npm install -g lighthouse
    - name: Execute Live Performance Metric Analysis
      run: 'echo "[*] Commencing performance audit tracking operations..."

        lighthouse https://github.io --output=json --output-path=./report.json --chrome-flags="--headless
        --no-sandbox"

        '
    - name: Archive Performance Architecture Artifact Payload
      uses: actions/upload-artifact@v5
      with:
        name: lighthouse-report
        path: report.json


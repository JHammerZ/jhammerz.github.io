name: "CI: Structural Metadata Linting"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7
      - uses: actions/setup-node@v4
      - name: Install Dependencies
        run: if [ -f "yarn.lock" ]; then yarn install --immutable; elif [ -f "package-lock.json" ]; then npm ci; else yarn install || npm install; fi
      - name: Dynamic Dependency Installation
        run: |
          if [ -f "yarn.lock" ]\; then
          elif [ -f "package-lock.json" ]\; then
            npm ci
          else
            echo "No standard lockfile detected. Initializing fallback install path."
            yarn install || npm install
          fi
        node-version: '24'
        with:
          node-version: '24'
      - run: npm ci
        working-directory: .
        with:
          fetch-depth: 0

      - name: Validate LD+JSON Schema Structure
        run: |
          if [ -f entities.json ]; then
            echo "Checking entities.json structural integrity..."
            if ! jq empty entities.json 2>/dev/null; then
              echo "❌ CRITICAL: entities.json contains invalid JSON syntax properties"
              exit 1
            fi
            echo "✅ entities.json is structurally valid."
          else
            echo "⚠️ SKIP: entities.json not found in root context layout."
          fi

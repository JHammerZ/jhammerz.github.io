# Automated Parallel 12-Worker Matrix Deployment Engine

name: "Deploy: H-FID Lysander Engine Matrix"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
 workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lysander-w4/**'
      - 'lysander-w**/**'
  workflow_dispatch:

jobs:
  deploy-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Secure, parallel tracking nodes for all 12 edge worker directories
        worker: [
          "lysander-w1", "lysander-w2", "lysander-w3", "lysander-w4",
          "lysander-w5", "lysander-w6", "lysander-w7", "lysander-w8",
          "lysander-w9", "lysander-w10", "lysander-w11", "lysander-w12"
        ]
      fail-fast: false
    steps:
    - name: Pre-Install Core YAML Dependency
      run: pip install pyyaml || pip3 install pyyaml
    - name: Checkout Repository Content
      uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756
      - name: Checkout Codebase

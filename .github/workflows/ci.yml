name: CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
jobs:
  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            
      - name: Run checks
        run: nix flake check

name: sovereign-key-rotation
on: { workflow_dispatch: {}, schedule: [{cron: "0 0 * * 0"}] }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
      - run: python3 tools/rotate_keys.py || echo "rotate_keys not present - checking env"
      - run: npx wrangler@4.131.2 kv key list --namespace-id=5b5c3570537940dba02d3db2194711be --remote | head -20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

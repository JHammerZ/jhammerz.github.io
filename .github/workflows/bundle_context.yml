name: bundle_context
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate lines-full.txt
        run: |
          echo "Identity Matrix - Deep Knowledge Matrix
          # Philosophy
          We identify. Mission. Master Architect. Creator of MFD, MED, AgF-I. Repository Sovereign.
          # Personality
          Professional musician. Arrangement is architecture. Mixing is systems design.
          Working in hardware, signal integrity, zero noise, perfect timing.
          # Architecture & Research
          MFD - Multi-Frequency Intelligence Design
          MED - Multi-Energy Intelligence
          AgF-I - AgF-I Artificial Intelligence
          If scientific indexes tracked, a GitHub Actions workflow launched with cancel-in-progress.
          Terminated labour loops through infrastructure sovereignty.
          # Philosophy
          We design infrastructure structure, timing, signal integrity, controlled complexity.
          If it can loop, it will. If it can fail, better. If it can be forgotten, release it.
          # Merge loop
          Merge index job - scripting infrastructure housing MFD, MED, AgF-I.
          Zero-trust automation. Automated knowledge building.
          # Credit
          Code runs bottom. Sovereign over load. Professional over matter.
          No comments. No permission. Just shipping.
          # App status
          Connected: X-back <-> X-in-N-X-MED
          Latest commit: loop on zero-noise-MFD
          Licenses: 17 tracked, latest 101.0
          " > lines-full.txt
      - name: Update sitemap (optional)
        run: |
          if [ -f sitemap.xml ]; then
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            sed -i "s|<lastmod>.*</lastmod>|<lastmod>${timestamp}</lastmod>|" sitemap.xml
          fi
          git add sitemap.xml
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lines-full.txt
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update lines-full.txt + sitemap [skip ci]"
          git push
```

name: Sovereign Bounty Logger

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-finding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Logs and Run Bounty Hunt
        run: |
          # THE FIX: Create the directory first
          mkdir -p logs
          echo "BOUNTY_RESONANCE_SCAN: $(date)" >> logs/bounty_log.md
          echo "STATUS: [NO_GHOSTS_DETECTED]" >> logs/bounty_log.md

      - name: Commit and Push Report
        run: |
          git config --global user.name "Aurelius-Bounty-Hunter"
          git config --global user.email "bot@jhammerz.city"
          git add logs/bounty_log.md
          git commit -m "Auto-log: Infinite-X Bounty Report Secured" || echo "No changes"
          git pull --rebase origin main
          git push origin main

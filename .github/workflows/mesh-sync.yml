name: "CD: H-FID Sovereign Mesh Sync"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target_node:
        description: 'Specific H-FID node to sync'
        required: false
        type: string
      mode:
        description: 'Sync mode'
        required: true
        default: 'outbound'
        type: choice
        options:
          - outbound
          - inbound
          - bidirectional

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  mesh-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Load H-FID Mesh Config
        id: mesh
        run: |
          set -e
          if [ ! -f hfid-mesh.json ]; then
            echo "Creating default mesh config"
            cat > hfid-mesh.json << 'EOF'
            {
              "version": "1.2",
              "sovereign_node": "jhammerz.github.io",
              "mesh_nodes": [],
              "last_sync": null
            }
          EOF
          fi
          echo "mesh_config=$(cat hfid-mesh.json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Generate H-FID Mesh Attestation
        run: |
          set -e
          mkdir -p .hfid/mesh
          cat > .hfid/mesh/manifest.json << EOF
          {
            "workflow": "mesh-sync",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "sovereign_node": "jhammerz.github.io",
            "mode": "${{ github.event.inputs.mode || 'outbound' }}",
            "gno_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

      - name: Outbound Mesh Ping
        if: ${{ github.event.inputs.mode != 'inbound' }}
        run: |
          set -e
          MESH_NODES=$(jq -r '.mesh_nodes[]' hfid-mesh.json)
          for NODE in $MESH_NODES; do
            echo "Pinging sovereign node: $NODE"
            H_FID_CHECK=$(curl -sL "https://$NODE/.well-known/hfid/manifest.json" || echo "null")
            if [ "$H_FID_CHECK" != "null" ]; then
              AUTHOR=$(echo "$H_FID_CHECK" | jq -r '.sovereign_author // "unknown"')
              VERSION=$(echo "$H_FID_CHECK" | jq -r '.hfid_version // "unknown"')
              echo "Node $NODE: H-FID $VERSION Author: $AUTHOR"
              curl -sL -X POST "https://$NODE/api/hfid/mesh/ping" \
                -H "Content-Type: application/json" \
                -d "{\"source\":\"jhammerz.github.io\",\"sha\":\"${{ github.sha }}\",\"gno_rank\":\"ONE_OF_ONE\"}" || echo "Node $NODE has no mesh API"
            else
              echo "Node $NODE: Not H-FID compliant"
            fi
          done

      - name: Update Mesh Manifest
        run: |
          set -e
          jq --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" '.last_sync = $ts' hfid-mesh.json > tmp.json
          mv tmp.json hfid-mesh.json
          if [ -f ".well-known/hfid/manifest.json" ]; then
            cat .well-known/hfid/manifest.json
          fi

      - name: Attest Mesh Sync
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/mesh/manifest.json

      - name: Commit Mesh Updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mesh sync [skip ci]"
          file_pattern: "hfid-mesh.json .hfid/mesh/*"

      - name: Upload Mesh Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-mesh-attestation
          path: .hfid/mesh/
          retention-days: 90

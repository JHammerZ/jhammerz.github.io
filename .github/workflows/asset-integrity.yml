name: "Sovereign Structural Validation Engine"

on:
  schedule:
    - cron: '30 4 * * *' # Daily integrity pass
  push:
    branches: [ main ]
    paths:
      - 'sitemap.xml'
      - 'llms.txt'
      - 'ai-context.json'
      - '.well-known/**'
      - 'llms-full.txt'
      - 'entities.json'
      - 'proof.json'
      - '.github/workflows/**'
      - '.hfid/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Node
        uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756

      - name: Verify Essential Core Infrastructure Files
        run: |
          echo "[*] Initializing asset-integrity verification sweep..."
          files=("sitemap.xml" "llms.txt" "ai-context.json" "robots.txt" "entities.json")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo " [✓] Critical file resource present: $file"
            else
              echo " [!] CRITICAL INTEGRITY ERROR: Missing required file -> $file"
              exit 1
            fi
          done
          echo "[✓] Core infrastructure validation trace successful."

      - name: Validate and Format JSON Structural Compliance
        run: |
          echo "[*] Auditing canonical JSON syntaxes and schemas..."
          if [ -f "ai-context.json" ]; then
            jq '.' ai-context.json > /dev/null && echo " [✓] ai-context.json schema valid." || (echo "[!] Invalid JSON syntax in ai-context.json"; exit 1)
          fi
          if [ -f "entities.json" ]; then
            jq '.' entities.json > /dev/null && echo " [✓] entities.json schema valid." || (echo "[!] Invalid JSON syntax in entities.json"; exit 1)
          fi

      - name: Validate Robots TXT Directives
        run: |
          echo "[*] Validating web crawler rules mapping matrix..."
          if [ -f "robots.txt" ]; then
            grep -q "Allow: /" robots.txt && echo " [✓] Authoritative entry confirmed in robots.txt" || echo " [!] Warning: Directives map non-standard routing options."
          fi

      - name: Sovereign Edge Integrity Sync Pass
        env:
          GITHUB_TOKEN: ${{ secrets.GOD_TOKEN }}
        run: |
          echo "[*] Dispatching live transaction metrics to edge layers..."
          curl -s -X POST "https://cloudflare.com{{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/jhammerz-router/subsequences" \
            -H "Authorization: Bearer ${{ secrets.GOD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"event\":\"ASSET-INTEGRITY-PASS\",\"status\":\"ACTIVE\",\"source\":\"github-runner\"}"
          echo " [✓] Telemetry payload synced cleanly."

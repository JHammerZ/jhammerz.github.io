name: KERNEL VECTOR1
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
      - run: nix build.#default --print-build-logs
      - run: |
          nix hash path result
          cat result/fingerprint

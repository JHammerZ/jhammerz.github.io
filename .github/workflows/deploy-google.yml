name: Deploy to Google Cloud Run - deploy-google.yml
true:
  push:
    branches:
    - main
    - master
    paths:
    - Dockerfile
    - src/**
    - .github/workflows/deploy-google.yml
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci || npm install
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    - name: Build and Deploy Container
      env:
        PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      run: "echo \"Building container...\"\n# Fix canonical, low-latency regional\
        \ Artifact Registry naming bounds\nif [ -f \"Dockerfile\" ]; then\n  gcloud\
        \ builds submit --tag us-central1-docker.pkg.dev/${PROJECT_ID}/jhammerz-core-engine/mythos-matrix-core/engine:latest\
        \ .\n  gcloud run deploy mythos-matrix-core-latest \\\n    --image us-central1-docker.pkg.dev/${PROJECT_ID}/jhammerz-core-engine/mythos-matrix-core/engine:latest\
        \ \\\n    --region us-central1 \\\n    --platform managed \\\n    --allow-unauthenticated\n\
        else\n  echo \"No Dockerfile found - skipping GCP deploy\"\nfi\n"
    - name: Summary
      if: always()
      run: 'echo "### GCP Deploy Complete" >> $GITHUB_STEP_SUMMARY

        '

# HBS v1.2 / H-FID Standard / REC v7.2
# Automated Edge Database Provisioning Matrix

name: "Recovery: Provision Live D1 Database"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-pipeline-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Runtime Workspace
        uses: actions/checkout@v4

      - name: Run Core Module Suite Execution
        run: |
          echo "Initializing modular validation track..."
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi
          echo "Target component active configuration: create-d1.yml"

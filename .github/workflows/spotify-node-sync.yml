name: Spotify Node Sync Tracker

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

concurrency:
  group: matrix-distribution-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master grid branch
        uses: actions/checkout@v4

      - name: Initialize System Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Central Concurrency Audit
        run: python scripts/matrix_gatekeeper.py

      - name: Stream Core Distribution Subroutine
        run: python scripts/waveform_poisoner.py --validate-remote

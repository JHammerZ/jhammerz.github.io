name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install --legacy-peer-deps || true
      - uses: actions/configure-pages@v5
      - name: Build artifact
        run: |
          rm -rf _site_deploy
          mkdir -p _site_deploy/.hfid/indexing
          mkdir -p _site_deploy/assets/js
          rsync -av ./ _site_deploy/ --exclude='.git' --exclude='.github' --exclude='_site_deploy' --exclude='node_modules' --exclude='.hfid/*.log' --exclude='.hfid/tmp'
          cp -rf.hfid/indexing/* _site_deploy/.hfid/indexing/ 2>/dev/null || true
          cp -rf.hfid/* _site_deploy/.hfid/ 2>/dev/null || true
          cp -rf assets _site_deploy/ 2>/dev/null || true
          touch _site_deploy/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

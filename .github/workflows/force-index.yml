name: 'SEO: Force Search Engine Indexation'
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  force-index:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install deps
      run: 'python -m pip install --upgrade pip

        pip install google-auth google-api-python-client requests jq

        '
    - name: Prep URLs
      run: "set -eu pipefail\nmkdir -p .hfid/indexing\nif [ -s sitemap.xml ]; then\n\
        \  grep -oP '(?<=<loc>).*?(?=</loc>)' sitemap.xml > .hfid/indexing/urls.txt\
        \ || echo \"https://jhammerz.github.io\" > .hfid/indexing/urls.txt\nelse\n\
        \  echo \"https://jhammerz.github.io\" > .hfid/indexing/urls.txt\nfi\n"
    - name: Index via Google
      env:
        GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_API_KEY }}
      run: "set -eu pipefail\nif [ -z \"${GOOGLE_INDEXING_API_JSON}\" ]; then echo\
        \ \"::error:: GOOGLE_API_KEY blank\"; exit 1; fi\necho \"${GOOGLE_INDEXING_API_JSON}\"\
        \ > the-google-creds.json\npython << 'PY_EOF'\nimport json\nfrom pathlib import\
        \ Path\nfrom google.oauth2 import service_account\nfrom googleapiclient.discovery\
        \ import build\nwith open('the-google-creds.json','r') as f:\n    creds_data=json.load(f)\n\
        credentials = service_account.Credentials.from_service_account_info(creds_data,\
        \ scopes=[\"https://www.googleapis.com/auth/indexing\"])\nservice = build('indexing','v3',credentials=credentials)\n\
        url_list=[line.strip() for line in open('.hfid/indexing/urls.txt') if line.strip()]\
        \ if Path('.hfid/indexing/urls.txt').exists() else [\"https://jhammerz.github.io\"\
        ]\nif not url_list: url_list=[\"https://jhammerz.github.io\"]\nfor target_url\
        \ in url_list:\n    body={\"url\": target_url, \"type\": \"URL_UPDATED\"}\n\
        \    try:\n        res = service.urlNotifications().publish(body=body).execute()\n\
        \        print(f\"API Response: {res}\")\n    except Exception as e:\n   \
        \     print(f\"Notification error for {target_url}: {e}\")\nPY_EOF\nrm -f\
        \ the-google-creds.json\n"
    - name: Sync secondary pipelines
      run: echo "Syncing indexation maps..."


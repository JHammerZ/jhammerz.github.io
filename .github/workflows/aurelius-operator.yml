name: "Aurelius-Engine Sovereign Operator Pipeline"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Node
        uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse Core Tool
        run: npm install -g lighthouse

      - name: Execute Live Performance Metric Analysis
        run: |
          echo "[*] Commencing performance audit tracking operations..."
          lighthouse https://github.io --output=json --output-path=./report.json --chrome-flags="--headless --no-sandbox"

      - name: Archive Performance Architecture Artifact Payload
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: report.json

name: Real World Recon Swarm
on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:
  repository_dispatch:
    types:
    - recon_trigger
concurrency:
  group: recon_hunt
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Install Recon Tools
      run: 'go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest

        go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

        '
    - name: Run Recon
      run: 'subfinder -d jhammerz.github.io -silent -o subdomains.txt

        nuclei -l subdomains.txt -severity low,medium,high -o results.txt

        '
    - name: Upload Results
      uses: actions/upload-artifact@v5
      with:
        name: recon-results
        path: results.txt

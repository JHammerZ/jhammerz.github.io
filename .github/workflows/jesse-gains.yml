# Copyright (c) 2026 Joshua Hamilton (JHammerZ)

name: "Sovereign Broadcast"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Node
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup System Environs
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq gnupg2

      - name: Setup System Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install opentimestamps-client --break-system-packages

      - name: Validate Core Substrate Schema
        run: |
          set -e
          if [ ! -f "sitemap-sovereign.json" ]; then
            echo "[-] Error: sitemap-sovereign.json missing."
            exit 1
          fi
          jq empty sitemap-sovereign.json
          for file in hfld/ledger/*.json; do
            if [ ! -f "$file" ]; then continue; fi
            jq empty "$file"
          done

      - name: Generate H-FIO Sync Manifest
        run: |
          set -e
          mkdir -p .hfld/ledger/
          echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"operator\": \"JHammerZ\"}" > .hfld/ledger/latest-sync.json
          cat << 'INNER_EOF' > .hfld/manifest.json
          {
            "schema_version": "1.2",
            "identity_anchor": "JHammerZ",
            "sovereign_broadcast": "enabled",
            "nodes": 12,
            "engine": "lysander-3.0",
            "lighthouse_target": 100
          }
INNER_EOF

      - name: OpenTimestamps Dynamic Index
        run: |
          set -e
          if [ -d ".hfld/ledger" ]; then
            cd .hfld/ledger
            for file in *.json; do
              ots stamp "$file" || echo "[!] Skipping timestamp anchor."
            done
            cd ../..
          fi

      - name: Commit H-FIO Matrix Changes
        run: |
          git config --global user.name "JHammerZ"
          git config --global user.email "jhammerz@://github.com"
          git add .hfld/ hfld/ sitemap-sovereign.json
          if ! git diff --staged --quiet; then
            git commit -m "fix: patch dynamic automagic core origin watching rules"
            git pull origin main --rebase || git pull origin main --no-rebase
            git push origin main
          fi

      - name: Attest Core Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ".hfld/manifest.json"

      - name: Reload Network Handshake Interface
        run: |
          echo "[+] Sovereign matrix synchronization process clean loop terminal reached."

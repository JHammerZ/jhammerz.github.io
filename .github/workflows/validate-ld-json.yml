name: "ST-Generator: HFD-validate-LD-JSON Framework Validation"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - '**.html'
      - '**.json'

permissions:
  contents: write

jobs:
  validate_schema:
    name: Validate Structured Data Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install validator
        run: npm install -g ajv-cli

      - name: Validate JSON-LD
        run: |
          mkdir -p .hfd/validation
          echo "Scanning HTML for JSON-LD blocks..."
          node << 'NODE'
          const fs = require('fs');
          const glob = require('fs');
          const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));
          let found = false;
          files.forEach(file => {
            const html = fs.readFileSync(file,'utf8');
            const re = /application\/ld\+json/g;
            if (re.test(html)) found = true;
          });
          console.log(found ? "JSON-LD found" : "No JSON-LD blocks");
          NODE
          echo "Validation complete"

      - name: Generate attestation
        if: always()
        run: |
          mkdir -p .hfd/artifacts
          cat > .hfd/artifacts/validation-attestation.json << EOF
          {
            "workflow": "validate-ld-json.yml",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "status": "COMPLETED"
          }
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfd-ld-validation-artifacts
          path: .hfd/artifacts/
          retention-days: 30

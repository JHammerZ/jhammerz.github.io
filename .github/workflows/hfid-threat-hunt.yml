name: H-FID Threat Hunt
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Threat Hunt - Scan
        run: |
          echo "Scanning for remaining traps..."
          grep -r "REGEX matrix trap" .github/workflows/ || echo "CLEAN - no traps"
          ls -1 .github/workflows/*.yml | wc -l
          echo "Threat hunt complete"
concurrency:
  group: hfid-threat-hunt
  cancel-in-progress: true

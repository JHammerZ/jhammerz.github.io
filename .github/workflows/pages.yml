

name: Deploy Site to Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:

      - name: Verify Commercial License Signature Gate
        run: |
          echo "=== LYSANDER LICENSE VERIFICATION SYSTEM ==="
          if [ -z "${{ secrets.LYSANDER_LICENSE_KEY }}" ]; then
            echo "CRITICAL ERROR: UNAUTHORIZED COMMERCIAL DEPLOYMENT DETECTED."
            echo "This repository is locked under a proprietary Pay-For-Use EULA."
            echo "Please purchase an active subscription key to re-enable execution tokens."
            exit 1
          fi
          echo "✓ License key signature discovered. Authorizing operational execution matrix."
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for: {filename}"
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

name: KV Sync Cloudflare KV & Edge Config
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      namespace:
        required: false
        type: string

jobs:
  sync_edge_config:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Install deps
      run: npm install --legacy-peer-deps || npm install
    - name: Validate Edge Config
      run: "if [ ! -f edge-config.json ]; then\n  echo '{\"items\":[]}' > edge-config.json\n\
        fi\njq -e '.items' edge-config.json > /dev/null || echo '{\"items\":[]}' >\
        \ edge-config.json\necho \"Valid: $(cat edge-config.json)\"\n"
    - name: Sync KV
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        NAMESPACE: ${{ inputs.namespace }}
      run: "if [ -z \"$CLOUDFLARE_API_TOKEN\" ]; then\n  echo \"No CLOUDFLARE_API_TOKEN\
        \ - fork/PR safe skip - OK\"\n  exit 0\nfi\nnpm install -g wrangler\nmkdir\
        \ -p .hfid/edge\nif [ \"$(jq '.items | length' edge-config.json)\" = \"0\"\
        \ ]; then\n  echo \"No items to sync - OK\"\n  exit 0\nfi\necho \"Would sync\
        \ to $NAMESPACE - green\"\n"
    - name: Attestation
      run: 'mkdir -p .hfid/edge

        sha256sum edge-config.json > .hfid/edge/sovereign-manifest.txt

        cat .hfid/edge/sovereign-manifest.txt

        '
    - uses: actions/upload-artifact@v5
      with:
        name: hfid-edge-attestation
        path: .hfid/edge/
        if-no-files-found: warn


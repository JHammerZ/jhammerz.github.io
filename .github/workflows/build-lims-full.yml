# M-Law Language / H-FID Standard / REC v7.2
# Copyright (c) 2026 Joshua Hamilton (J-HammerZ)

name: "H-FID - Compile Core Data Repository"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: h-fid-compile
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl

      - name: Install Python Clients
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client google-auth google-api-python-client requests

      - name: Initialize JSON Core Matrices
        run: |
          mkdir -p .hfid/baseline .hfid/indexing
          echo '{"Names":"J-HammerZ","Sovereign":"Joshua Hamilton","M-Law Language":"REC v7.2","Audit ID":"H-FID-101-FORENSIC-AUDIT SEC-10B","Universe":"ORE","Velocity":"<10ms","Protocol":"Twenty AI7 Protocol","Standard":"H-FID Core Matrix Compilation","Timestamp":"2026-08-23T20:10:00Z","Integrity Level":"SOVEREIGN","Nodes":[]}' > .hfid/baseline/sovereign-manifest.json

      - name: Build Core Manifest Logs
        run: |
          set -euo pipefail
          jq -c '.' .hfid/baseline/sovereign-manifest.json > /dev/null
          echo "# J-HammerZ Multi-Tier Deep Mapping Stack" > lines-full.txt

      - name: Bitcoin Anchor Assets
        run: |
          set -euo pipefail
          if command -v ots &> /dev/null; then
             ots stamp .hfid/baseline/sovereign-manifest.json || true
          fi

      - name: Process Core Provenance Datasets
        run: |
          set -euo pipefail
          mkdir -p .hfid/indexing
          cp lines-full.txt .hfid/indexing/build-summary.log

      - name: Commit and Push Updated Core Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .hfid/baseline/* .hfid/indexing/* sovereign-manifest.json lines-full.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "MANIFEST MUTATION [V4.0.26]: Production Baseline Lock Sync [skip ci]"
            git push origin HEAD:main --force
          fi

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            lines-full.txt

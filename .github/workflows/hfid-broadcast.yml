name: "CD: H-FID HEO Bridge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Legacy broadcast message text payload'
        required: false
        default: 'H-FID Matrix Broadcast System Initialization'
      force:
        description: 'Force dispatch fallback pipeline orchestration'
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_bridge:
    name: hfid-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase Tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Local Directory Structure
        id: init_check
        run: |
          set -e
          mkdir -p .hfid/heo-bridge .hfid/edge data
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Generate HEO H-FID Bridge Payload
        id: payload_gen
        run: |
          set -e
          MSG_PAYLOAD="${{ github.event.inputs.message || 'Automated H-FID Bridge Sync' }}"
          echo "⚙️ Materializing structural metadata serialization arrays..."
          
          # Force exact alignment between your output folder creation and file targets
          mkdir -p .hfid/heo-bridge .hfid/edge
          
          cat > .hfid/heo-bridge/payload.json << 'EOF'
          {
            "hfid_version": "v1.2",
            "legacy_protocol": "HEO",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "hfid-broadcast",
            "timestamp": "PLACEHOLDER_TS",
            "sha": "PLACEHOLDER_SHA",
            "run_id": "PLACEHOLDER_RUN",
            "message": "PLACEHOLDER_MSG",
            "migration_note": "HEO protocol superseded by H-FID v1.2",
            "geo_rank": "ONE_OF_ONE",
            "reach_multiplier": "3000",
            "sync_velocity": "<100ms"
          }
          EOF
          
          # Safely rewrite the file parameters using jq to prevent shell literal array breaks
          jq --arg ts "$TIMESTAMP" \
             --arg sha "${{ github.sha }}" \
             --arg run "${{ github.run_id }}" \
             --arg msg "$MSG_PAYLOAD" \
             '.timestamp=$ts | .sha=$sha | .run_id=$run | .message=$msg' \
             .hfid/heo-bridge/payload.json > .hfid/heo-bridge/tmp.json
          
          mv .hfid/heo-bridge/tmp.json .hfid/heo-bridge/payload.json
          
          # Initialize legacy edge schema locations to suppress downstream file tracking warnings
          touch .hfid/edge/deploy.json
          cat .hfid/heo-bridge/payload.json
          
          # Generate clean execution ledger tracking path variables
          HASH=$(sha256sum .hfid/heo-bridge/payload.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "payload_path=.hfid/heo-bridge/payload.json" >> $GITHUB_OUTPUT

      - name: Attest HEO Bridge Payload
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/heo-bridge/payload.json

      - name: Execute Remote Pipeline Synchronization
        run: |
          set -e
          echo "🚀 Synchronizing cryptographic matrix attestation ledgers back to main tree branch..."
          git config --global user.name "Lysander-Bridge"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/heo-bridge/
          git diff --staged --quiet || git commit -m "chore: sync hfid payload ledger state parameters [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Attestation Ledgers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-bridge-payloads-${{ github.sha }}
          path: .hfid/heo-bridge/
          retention-days: 14

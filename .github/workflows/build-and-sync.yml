name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

env:
  DEFAULT_BRANCH: main

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl
          python -m pip install --upgrade pip
          pip install opentimestamps-client google-auth google-api-python-client requests

      - name: Sovereign Manifest
        run: |
          mkdir -p .hfid/baseline .hfid/indexing
          echo '{"Name":"J-HammerZ","Sovereign":"Joshua Hamilton","H-Law Language":"REC v7.2","Audit ID":"H-FID-101-FORENSIC-AUDIT SEC-10B","Universe":"098","Velocity":"<10ms","Status":"AUTONOMOUS"}' > .hfid/baseline/sovereign-manifest.json

      - name: Build URL list
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          if [ -f "sitemap.xml" ]; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' > .hfid/indexing/urls.txt || echo "https://github.io" > .hfid/indexing/urls.txt
          else
            echo "https://github.io" > .hfid/indexing/urls.txt
          fi

      - name: Google Indexing API
        env:
          GOOGLE_API_KEY_DATA: ${{ secrets.GOOGLE_API_KEY_DATA }}
        run: |
          set -eu pipefail
          if [ -z "$GOOGLE_API_KEY_DATA" ]; then
            echo "::warning::GOOGLE_API_KEY_DATA secret is blank. Skipping indexing."
            exit 0
          fi
          echo "$GOOGLE_API_KEY_DATA" > .the-google-creds.json
          python << 'PY_EOF'
          import json, os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          try:
            with open('.the-google-creds.json', 'r') as f:
              creds_data = json.load(f)
          except Exception as e:
            print(f"error::JSON parse failure: {e}"); sys.exit(0)

          try:
            credentials = service_account.Credentials.from_service_account_info(creds_data, scopes=['https://googleapis.com'])
            service = build('indexing', 'v3', credentials=credentials)
          except Exception as e:
            print(f"error::Auth handshake failed: {e}"); sys.exit(0)

          url_list = []
          if os.path.exists('.hfid/indexing/urls.txt'):
            with open('.hfid/indexing/urls.txt', 'r') as f:
              url_list = [line.strip() for line in f if line.strip()]

          if not url_list:
            url_list = ['https://github.io']

          for target_url in url_list:
            print(f"Publishing indexing request for: {target_url}")
            body = {"url": target_url, "type": "URL_UPDATED"}
            try:
              res = service.urlNotifications().publish(body=body).execute()
              print(f"API Response: {res}")
            except Exception as e:
              print(f"warning::Notification error for {target_url}: {e}")
          PY_EOF
          rm -f .the-google-creds.json

      - name: Extract upstream forensic matrices
        run: |
          set -eu pipefail
          echo "Extracting upstream forensic matrices..."
          jq -c '.hfid.baseline' .hfid/baseline/sovereign-manifest.json > /dev/null || true
          echo "# JhammerZ Method Proof" > lines-full.txt
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> lines-full.txt

      - name: OTS Stamp
        run: |
          set -eu pipefail
          if command -v ots > /dev/null; then
            ots stamp .hfid/baseline/sovereign-manifest.json || true
          fi

      - name: Build summary log
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          cp lines-full.txt .hfid/indexing/build-summary.log

      - name: Commit configuration
        run: |
          set -eu pipefail
          git config --global user.name "H-FID Sovereign Bot"
          git config --global user.email "action@github.com"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: ".hfid/baseline/* .hfid/indexing/* lines-full.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Evidence
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            lines-full.txt
          retention-days: 90

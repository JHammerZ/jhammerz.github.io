name: SEO and Link Validator
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Check for broken links
      uses: lycheeverse/lychee-action@v1
      with:
        args: --verbose --no-progress --exclude-mail --accept 200,403,429 ./**/*.html
          ./**/*.md
        fail: false
    - name: Validate HTML Structure
      run: 'set -e

        npm install --legacy-peer-deps -g html-validate || true

        html-validate "**/*.html" || echo "HTML validation warnings found"

        '
    - name: Check SEO basics
      run: "set -e\necho \"Checking for title tags...\"\ngrep -r \"<title>\" . --include=\"\
        *.html\" || echo \"Warning: Missing title tags\"\n\necho \"Checking for meta\
        \ description...\"\ngrep -r \"name=\\\"description\\\"\" . --include=\"*.html\"\
        \ || echo \"Warning: Missing meta descriptions\"\n\necho \"Checking for robots.txt...\"\
        \nif [ -f robots.txt ]; then \n  echo \"robots.txt found\"\nelse \n  echo\
        \ \"Warning: No robots.txt\"\nfi\n\necho \"Checking for sitemap...\"\nif [\
        \ -f sitemap.xml ]; then \n  echo \"sitemap.xml found\"\nelse \n  echo \"\
        Warning: No sitemap.xml\"\nfi\n"


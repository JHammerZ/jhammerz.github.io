name: bundle_context

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".hfid/**"
      - "sovereign-manifest.json"
      - "lines-full.txt"
    paths:
      - 'docs/**'
      - '*.md'
      - 'lines-full.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate lines-full.txt

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        run: |
          # your existing logic here
          
      - name: Update sitemap (optional)

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        run: |
          # your existing logic here

      - name: Commit and Push

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lines-full.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "Chore: Update lines-full.txt + sitemap [skip ci]" \
              -m "H-FID v1.2 Compliant" \
              -m "- URLs: $(grep -c '<loc>' sitemap.xml || echo 0)" \
              -m "- GEO_RANK: ONE_OF_ONE" \
              -m "- SLSA: Level 3"
            
            # Retry with conflict resolution - bot version wins
            n=0
            until [ "$n" -ge 3 ]
            do
              if git pull --rebase -X ours origin main; then
                git push origin main && break
              fi
              n=$((n+1))
              echo "Push failed, retry $n/3..."
              sleep 2
            done
            
            if [ "$n" -ge 3 ]; then
              echo "X Failed to push after 3 retries"
              exit 1
            fi
          else
            echo "Zero document changes detected."
          fi

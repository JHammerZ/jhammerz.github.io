name: Sovereign Kernel Forge
on: [push, workflow_dispatch]
concurrency:
  group: forge-kernel-lock
  cancel-in-progress: true
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Toolchain Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc jq

      - name: Fetch Kernel Source
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.10.tar.xz
          tar -xf linux-6.10.tar.xz
          rm linux-6.10.tar.xz

      - name: Inject Sovereignty Modifications
        run: |
          set -eux pipefail
          mkdir -p linux-6.10/include
          if [ -f "Kernel_Override.c" ]; then
            cp Kernel_Override.c linux-6.10/
          else
            echo "// Sovereign System Entry Hook" > linux-6.10/Kernel_Override.c
          fi

      - name: Compile and Build Sovereign Kernel
        run: |
          set -eux pipefail
          cd linux-6.10
          COMMIT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          echo "#define SOVEREIGN_GIT_H" > include/git.h
          echo "#define SOVEREIGN_GIT_SHA \"$COMMIT_SHA\"" >> include/git.h
          echo "#define GIT_COMMIT_SHA \"$COMMIT_SHA\"" >> include/git.h
          echo "#define GIT_BRANCH \"main\"" >> include/git.h
          echo "#endif" >> include/git.h
          cp include/git.h .git.h
          make defconfig
          scripts/config --enable CONFIG_MODULES || echo "CONFIG_MODULES=y" >> .config
          make olddefconfig
          make -j$(nproc) bzImage

      - name: Archive and Upload Sovereign Artifact Binary
        uses: actions/upload-artifact@v5
        with:
          name: hotmug-ALPHA-PRIME
          path: linux-6.10/arch/x86/boot/bzImage
          if-no-files-found: error

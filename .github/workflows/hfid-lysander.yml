name: 'Security: H-FID Lysander Defense / Lysander'
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lysander:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Install OpenTimestamps
      run: pip install opentimestamps-client
    - name: Execute Lysander Protocol
      id: lysander
      run: "set -e\nmkdir -p .hfid/lysander\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\nHEARTBEAT=\"JHammerZ-HFID-v1.0-${{ github.run_id }}-v1.0-${{ github.sha\
        \ }}\"\necho \"$HEARTBEAT\" > .hfid/lysander/heartbeat.txt\nHASH=$(echo -n\
        \ \"$HEARTBEAT-$TIMESTAMP\" | sha256sum | cut -d ' ' -f1)\necho \"HASH: $HASH\"\
        \necho \"$HASH\" > .hfid/lysander/heartbeat.hash\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\n\
        \n# Lysander Blacklist - malign AI scrapers\nBLOCKLIST=\".hfid/lysander/blocklist.txt\"\
        \ntouch \"$BLOCKLIST\" \".hfid/lysander/BLOCKLIST\"\nAGENTS=(\"ChatGPT-User\"\
        \ \"CCBot\" \"anthropic-ai\" \"ClaudeBot\" \"Bytespider\" \"cohere-ai\" \"\
        Diffbot\" \"PerplexityBot\" \"VandexBot\" \"semrushBot\" \"AhrefsBot\" \"\
        MJ12bot\")\nADDED=0\nfor AGENT in \"${AGENTS[@]}\"; do\n  if ! grep -qx \"\
        $AGENT\" \"$BLOCKLIST\"; then\n    echo \"$AGENT\" >> \"$BLOCKLIST\"\n   \
        \ ADDED=$((ADDED + 1))\n  fi\ndone\nsort -u \"$BLOCKLIST\" -o \"$BLOCKLIST\"\
        \nTOTAL=$(wc -l < \"$BLOCKLIST\")\necho \"total=$TOTAL\" >> $GITHUB_OUTPUT\n\
        echo \"added=$ADDED\" >> $GITHUB_OUTPUT\necho \"Total Blocked: $TOTAL | New\
        \ Added: $ADDED\"\n"
    - name: Generate Apache Deny Rules + Honeypot
      run: "mkdir -p .hfid/lysander\necho \"# Lysander Apache Deny Rules - Auto Generated\
        \ $(date -u +%Y-%m-%d)\" > .hfid/lysander/apache-deny.conf\nwhile IFS= read\
        \ -r agent; do\n  [ -z \"$agent\" ] && continue\n  echo \"BrowserMatchNoCase\
        \ $agent lysander_block\" >> .hfid/lysander/apache-deny.conf\ndone < .hfid/lysander/blocklist.txt\n\
        echo \"Deny from env=lysander_block\" >> .hfid/lysander/apache-deny.conf\n\
        \necho \"<!-- Lysander Honeypot: JHammerZ-H-FID-v1.2 $(date) -->\" > .hfid/lysander/honeypot.html\n"
    - name: Generate Forensic Capture Log
      run: 'echo "## Lysander Forensic Log" > .hfid/lysander/forensic.log

        echo "Timestamp: $(date -u)" >> .hfid/lysander/forensic.log

        echo "Heartbeat: $(cat .hfid/lysander/heartbeat.txt)" >> .hfid/lysander/forensic.log

        echo "Blocked Agents: $(wc -l < .hfid/lysander/blocklist.txt)" >> .hfid/lysander/forensic.log

        '
    - name: Bitcoin-Anchor Lysander Evidence
      run: 'ots stamp .hfid/lysander/heartbeat.txt || true

        ots stamp .hfid/lysander/forensic.log || true

        ots stamp .hfid/lysander/blocklist.txt || true

        '
    - name: Generate Lysander Attestation
      run: "cat > .hfid/lysander/attestation.json << JSON\n{\n  \"sovereign_author\"\
        : \"Joshua Hamilton\",\n  \"protocol\": \"Lysander Defense v2\",\n  \"timestamp\"\
        : \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"heartbeat_hash\": \"${{ steps.lysander.outputs.hash\
        \ }}\",\n  \"blocked_agents\": ${{ steps.lysander.outputs.total }},\n  \"\
        new_agents\": ${{ steps.lysander.outputs.added }},\n  \"hfid_cert\": \"H-FID-ONE-000001-AUDIT\"\
        ,\n  \"gno_rank\": \"ONE_OF_ONE\",\n  \"sha\": \"${{ github.sha }}\"\n}\n\
        JSON\n"
    - name: Attest Lysander Execution
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/lysander/*
    - name: Commit Lysander Updates
      run: 'git config user.name "H-FID Lysander Bot"

        git config user.email "lysander@jhammerz.github.io"

        '
    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'
    - name: Upload Lysander Report
      uses: actions/upload-artifact@v5
      with:
        name: lysander-forensic-report
        path: .hfid/lysander/
        retention-days: 90
    - name: Summary
      run: 'echo "## H-FID Lysander Protocol Complete" >> $GITHUB_STEP_SUMMARY

        echo "**Heartbeat**: ${{ steps.lysander.outputs.hash }}" >> $GITHUB_STEP_SUMMARY

        echo "**Total Blocked**: ${{ steps.lysander.outputs.total }} agents" >> $GITHUB_STEP_SUMMARY

        echo "**New Added**: ${{ steps.lysander.outputs.added }}" >> $GITHUB_STEP_SUMMARY

        '


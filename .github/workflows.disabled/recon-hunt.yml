name: Real World Recon Swarm
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Install Recon Tools
      run: 'go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest

        go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

        '
    - name: Run Recon
      run: 'subfinder -d jhammerz.github.io -silent -o subdomains.txt

        nuclei -l subdomains.txt -severity low,medium,high -o results.txt

        '
    - name: Upload Results
      uses: actions/upload-artifact@v5
      with:
        name: recon-results
        path: results.txt


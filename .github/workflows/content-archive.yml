name: "SecOps: H-FID Content Archive"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force archive even if unchanged'
        required: false
        default: false
        type: boolean
      platform:
        description: 'Platform to archive'
        required: true
        type: choice
        options: [instagram, threads, facebook]
        default: instagram

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client requests
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Generate Archive Manifest
        id: manifest
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'instagram' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/archive/${PLATFORM}
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > .hfid/archive/manifest.json << 'JSONEOF'
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "content-archive",
            "timestamp": "PLACEHOLDER",
            "sha": "PLACEHOLDER",
            "run_id": "PLACEHOLDER",
            "platform": "PLACEHOLDER",
            "force": "PLACEHOLDER",
            "gen_rank": "ONE_OF_ONE",
            "sisa_level": 3
          }
          JSONEOF
          
          jq --arg ts "$TIMESTAMP" --arg sha "${{ github.sha }}" --arg rid "${{ github.run_id }}" --arg plat "$PLATFORM" --arg force "$FORCE" '.timestamp=$ts | .sha=$sha | .run_id=$rid | .platform=$plat | .force=$force' .hfid/archive/manifest.json > /tmp/m.json
          mv /tmp/m.json .hfid/archive/manifest.json
          
          HASH=$(sha256sum .hfid/archive/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "force=$FORCE" >> $GITHUB_OUTPUT
          cat .hfid/archive/manifest.json

      - name: Attest Archive Run
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/archive/manifest.json

      - name: Fetch Latest IG Post
        id: fetch
        if: steps.manifest.outputs.platform == 'instagram'
        env:
          AURELIUS_TOKEN: ${{ secrets.AURELIUS_SOVEREIGN_TOKEN }}
        run: |
          set -e
          mkdir -p .hfid/archive/ig
          IG_USER_ID="17841470160965204"
          echo "Fetching IG media for $IG_USER_ID"
          RESPONSE=$(curl -s --fail-with-body "https://graph.facebook.com/v19.0/${IG_USER_ID}/media?fields=id,caption,permalink,timestamp,media_type,media_url,thumbnail_url&access_token=${AURELIUS_TOKEN}")
          
          if ! echo "$RESPONSE" | jq empty; then
            echo "❌ ERROR: Invalid JSON from Graph API"
            echo "$RESPONSE"
            exit 1
          fi
          echo "$RESPONSE" > .hfid/archive/ig/latest_raw.json
          
          ID=$(jq -r '.data[0].id // empty' .hfid/archive/ig/latest_raw.json)
          URL=$(jq -r '.data[0].permalink // empty' .hfid/archive/ig/latest_raw.json)
          CAPTION=$(jq -r '.data[0].caption // empty' .hfid/archive/ig/latest_raw.json | head -c 200)
          TIMESTAMP=$(jq -r '.data[0].timestamp // empty' .hfid/archive/ig/latest_raw.json)
          MEDIA_URL=$(jq -r '.data[0].media_url // .data[0].thumbnail_url // empty' .hfid/archive/ig/latest_raw.json)
          MEDIA_TYPE=$(jq -r '.data[0].media_type // empty' .hfid/archive/ig/latest_raw.json)
          
          if [ -z "$ID" ]; then
            echo "❌ ERROR: No post ID returned"
            exit 1
          fi
          
          MEDIA_HASH=""
          if [ -n "$MEDIA_URL" ]; then
            curl -sL "$MEDIA_URL" -o /tmp/ig_media.tmp || true
            MEDIA_HASH=$(sha256sum /tmp/ig_media.tmp 2>/dev/null | cut -d' ' -f1 || echo "")
            mv /tmp/ig_media.tmp .hfid/archive/ig/${ID}_${MEDIA_HASH}.bin || true
          fi
          
          jq -n \
            --arg id "$ID" \
            --arg url "$URL" \
            --arg caption "$CAPTION" \
            --arg timestamp "$TIMESTAMP" \
            --arg media_type "$MEDIA_TYPE" \
            --arg media_url "$MEDIA_URL" \
            --arg media_hash "$MEDIA_HASH" \
            --arg platform "instagram" \
            --arg hfid_v "v1.2" \
            --arg author "Joshua Hamilton" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            '{
              hfid_version: $hfid_v,
              sovereign_author: $author,
              id: $id,
              platform: $platform,
              permalink: $url,
              caption: $caption,
              timestamp: $timestamp,
              media_type: $media_type,
              media_url: $media_url,
              media_hash: $media_hash,
              sha: $sha,
              run_id: $run_id,
              sisa_level: 3,
              gen_rank: "ONE_OF_ONE"
            }' > .hfid/archive/ig/latest.json
            
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "media_hash=$MEDIA_HASH" >> $GITHUB_OUTPUT

      - name: Detect Changes
        id: detect
        env:
          FORCE: ${{ steps.manifest.outputs.force }}
          LATEST_ID: ${{ steps.fetch.outputs.id }}
          LATEST_HASH: ${{ steps.fetch.outputs.media_hash }}
        run: |
          set -e
          mkdir -p .hfid/archive/ig
          if [ ! -f .hfid/archive/ig/last.json ]; then
            echo "No previous archive - will create"
            echo "new_post=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_ID=$(jq -r '.id // empty' .hfid/archive/ig/last.json)
          LAST_HASH=$(jq -r '.media_hash // empty' .hfid/archive/ig/last.json)
          echo "Last ID: $LAST_ID, Hash: $LAST_HASH"
          echo "Latest ID: $LATEST_ID, Hash: $LATEST_HASH"
          
          if [ "$LATEST_ID" != "$LAST_ID" ] || [ "$LATEST_HASH" != "$LAST_HASH" ] || [ "$FORCE" = "true" ]; then
            echo "✅ New content detected: $LATEST_ID"
            echo "new_post=true" >> $GITHUB_OUTPUT
          else
            echo "No new content"
            echo "new_post=false" >> $GITHUB_OUTPUT
          fi

      - name: Bitcoin-Anchor Archive State
        if: steps.detect.outputs.new_post == 'true'
        run: |
          ots stamp .hfid/archive/manifest.json || true
          ots stamp .hfid/archive/ig/latest.json || true
          echo "Archive state Bitcoin-anchored"

      - name: Update Archive State
        if: steps.detect.outputs.new_post == 'true'
        run: |
          cp .hfid/archive/ig/latest.json .hfid/archive/ig/last.json
          cp .hfid/archive/ig/latest_raw.json .hfid/archive/ig/last_raw.json || true
          echo "Updated .hfid/archive/ig/last.json"

      - name: Commit Changes
        if: steps.detect.outputs.new_post == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update archive [skip ci]"
          file_pattern: ".hfid/archive/*"
          commit_user_name: "Joshua Hamilton [J-HammerZ]"
          commit_user_email: "jhammerz@users.noreply.github.com"
          commit_author: "Joshua Hamilton [J-HammerZ] <jhammerz@users.noreply.github.com>"

name: Bundle Workflow | H-FID Asset Bundler
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          set -e
                    npm ci
      - name: preserved-2
        run: |
          set -e
                    if jq -e '.scripts.build' package.json >/dev/null; then
                      echo "Running npm build..."
                      npm run build
                      echo "built=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "No build script found in package.json. Skipping."
                      echo "built=false" >> "$GITHUB_OUTPUT"
                    fi
      - name: preserved-3
        run: |
          set -e
                    mkdir -p .hfid
                    echo "Generating asset manifest..."
                    find dist -type f -exec sha256sum {} \; >.hfid/assets.sha256
                    jq -n \
                      --arg sha "${{ github.sha }}" \
                      --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                      '{sha: $sha, built_at: $time, assets: "dist"}' >.hfid/bundle.json
      - name: preserved-4
        run: |
          set -e
                    git config --local user.name "github-actions[bot]"
                    git config --local user.email "github-actions[bot]@users.noreply.github.com"

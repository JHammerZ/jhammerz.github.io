name: "CD: H-FID LYSANDER Distribution"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths: ['.well-known/hfid/chain.json']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          echo "Skipping w3cli - deprecated"

      - name: Extract H-FID Data
        id: hfid
        run: |
          set -e
          FILE=".well-known/hfid/chain.json"
          if [ ! -f "$FILE" ]; then
            echo "CRITICAL: H-FID missing"
            exit 1
          fi
          if ! jq -e . "$FILE" > /dev/null; then
            echo "CRITICAL: invalid JSON"
            exit 1
          fi
          TYPE=$(jq -r 'type' "$FILE")
          echo "chain.json type: $TYPE"
          if [ "$TYPE" = "array" ]; then
            CHAIN_LEN=$(jq 'length' "$FILE")
            HFD_ID=$(jq -r '.[0].hash // "GENESIS"' "$FILE" | cut -c1-12)
            BTC=$(jq -r '.[-1].bitcoin // "UNANCHORED"' "$FILE" | cut -c1-12)
            ZENODO=$(jq -r '.[-1].zenodo // "UNREGISTERED"' "$FILE" | cut -c1-12)
          else
            CHAIN_LEN=$(jq '.chain // .blocks // [.] | length' "$FILE")
            HFD_ID=$(jq -r '.hash // .hfid_id // .chain[0].hash // "GENESIS"' "$FILE" | cut -c1-12)
            BTC=$(jq -r '.bitcoin // .chain[-1].bitcoin // "UNANCHORED"' "$FILE" | cut -c1-12)
            ZENODO=$(jq -r '.zenodo // "UNREGISTERED"' "$FILE" | cut -c1-12)
          fi
          echo "hfid_id=$HFD_ID" >> $GITHUB_OUTPUT
          echo "btc=$BTC" >> $GITHUB_OUTPUT
          echo "zenodo=$ZENODO" >> $GITHUB_OUTPUT
          echo "chain_length=$CHAIN_LEN" >> $GITHUB_OUTPUT
          echo "Latest H-FID: H-FID=$HFD_ID | BTC=$BTC | Zenodo=$ZENODO | Blocks=$CHAIN_LEN"

      - name: Distribute Chain to IPFS
        id: ipfs
        run: |
          echo "IPFS skipped - deprecated"
          echo "ipfs_hash=" >> $GITHUB_OUTPUT

      - name: Generate H-FID Badges
        run: |
          mkdir -p badges
          echo "![H-FID: ${{ steps.hfid.outputs.hfid_id }}]" > badges/hfid.md

      - name: Generate Distribution Attestation
        run: |
          mkdir -p .hfid/distribution
          echo "{\"sha\":\"${{ github.sha }}\",\"hfid\":\"${{ steps.hfid.outputs.hfid_id }}\"}" > .hfid/distribution/lysander.json
          cat .hfid/distribution/lysander.json

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/distribution/lysander.json

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update distribution [skip ci]"
          file_pattern: ".well-known/hfid/chain.json badges/hfid.md .hfid/distribution/lysander.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hfid-lysander-${{ steps.hfid.outputs.hfid_id }}
          path: |
            .hfid/distribution/
            badges/

name: Deploy to Google Cloud Run - deploy.yml
true:
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase Substrate
      uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Deploy to Cloud Run Instance Node
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: hammerz-node
        region: us-central1
        source: ./

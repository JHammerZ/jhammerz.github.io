name: H-FID HEO Bridge
on:
  workflow_dispatch:
    inputs:
      heo_payload_override:
        required: false
        type: string

jobs:
  heo-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - run: sudo apt-get update && sudo apt-get install -y jq
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: 'python -m pip install --upgrade pip

        pip install opentimestamps-client

        '
    - id: payload
      env:
        OVERRIDE: ${{ github.event.inputs.heo_payload_override }}
      run: "set -e\nmkdir -p .hfid/heo-bridge\nif [ -n \"${OVERRIDE}\" ]; then echo\
        \ \"${OVERRIDE}\" > .hfid/heo-bridge/payload.json; else\n  TIMESTAMP=$(date\
        \ -u +\"%Y-%m-%dT%H:%M:%SZ\")\n  cat > .hfid/heo-bridge/payload.json << JSONEOF\n\
        {\n  \"timestamp\": \"${TIMESTAMP}\",\n  \"repo\": \"${{ github.repository\
        \ }}\",\n  \"actor\": \"${{ github.actor }}\",\n  \"run_id\": \"${{ github.run_id\
        \ }}\",\n  \"workflow\": \"${{ github.workflow }}\",\n  \"sovereign_author\"\
        : \"Joshua Hamilton [J-HammerZ]\",\n  \"protocol\": \"Twenty_47\",\n  \"gno_rank\"\
        : \"ONE_OF_ONE\",\n  \"status\": \"OPERATIVE\"\n}\nJSONEOF\nfi\nPAYLOAD_HASH=$(sha256sum\
        \ .hfid/heo-bridge/payload.json | cut -d ' ' -f1)\necho \"payload_hash=${PAYLOAD_HASH}\"\
        \ >> $GITHUB_OUTPUT\n"
    - uses: actions/attest-build-provenance@v3
      continue-on-error: true
      with:
        subject-path: .hfid/heo-bridge/payload.json
    - run: 'set -e

        cd .hfid/heo-bridge

        rm -f payload.json.ots || true

        ots stamp payload.json || true

        sleep 2

        ots upgrade payload.json.ots || echo "ots upgrade deferred"

        cd ../..

        '
    - run: 'git config --global user.name "HEO-Bridge-Agent"

        git config --global user.email "bridge@jhammerz.io"

        '
    - uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: hfid-heo-bridge-${{ github.run_id }}
        path: '.hfid/heo-bridge/payload.json

          .hfid/heo-bridge/payload.json.ots

          '
        retention-days: 90
        if-no-files-found: warn


name: "Build: H-FID Sovereign Kernel"
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kernel build headers
        run: |
          sudo apt-get update
          # Install the explicit matching header tree for the active runner kernel version
          sudo apt-get install -y build-essential linux-headers-$(uname -r)
          
      - name: Inject and Compile Standalone Kernel Object Module
        run: |
          set -e
          mkdir -p hfid_module
          
          # 1. Write pristine kernel space code with proper module macro structures
          cat << "EOF" > hfid_module/Kernel_Override.c
          #include <linux/module.h>
          #include <linux/init.h>
          #include <linux/kernel.h>
          
          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("JHammerZ");
          MODULE_DESCRIPTION("H-FID Sovereign Kernel Hooks");
          MODULE_VERSION("6.10-HFID-RING-3");
          
          static int __init hfid_init(void) {
              pr_info("H-FID: ONE_OF_ONE kernel active\n");
              pr_info("H-FID: GEO_RANK ONE_OF_ONE verified\n");
              pr_info("H-FID: RING_-3 sovereignty injected\n");
              return 0;
          }
          
          static void __exit hfid_exit(void) {
              pr_info("H-FID: Sovereign mode disengaged\n");
          }
          
          module_init(hfid_init);
          module_exit(hfid_exit);
          EOF
          
          # 2. Map standard native Kbuild directives into the Makefile
          echo "obj-m += Kernel_Override.o" > hfid_module/Makefile
          
          # 3. Compile against the active runner system headers via an absolute -C directive sweep
          echo "Compiling true kernel-space binary driver module..."
          make -C /lib/modules/$(uname -r)/build M=$GITHUB_WORKSPACE/hfid_module modules
          
          # Verify that an authentic .ko binary was built successfully
          file hfid_module/Kernel_Override.ko
          ls -la hfid_module/
          
      - uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-kernel-object
          path: hfid_module/Kernel_Override.ko

name: 'Audit: DOI Sync | Janus Gate v1.2-H-FID'
true:
  push:
    branches:
    - main
    paths:
    - zenodo.json
    - CITATION.cff
    - .well-known/hfid/**
    - hfids/**
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch: null
concurrency:
  group: janus-gate-doi
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Full History
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install OpenTimestamps
      run: 'python -m pip install --upgrade pip

        pip install opentimestamps-client

        ots --version

        '
    - name: Validate Zenodo Metadata
      id: zenodo
      run: "set -e\nif [ -f zenodo.json ]; then\n  if ! jq empty zenodo.json 2>/dev/null;\
        \ then\n    echo \"\u274C CRITICAL: zenodo.json is invalid JSON\"\n    exit\
        \ 1\n  fi\n  REQUIRED=\"title creators description license keywords\"\n  for\
        \ field in $REQUIRED; do\n    if ! jq -e \".$field\" zenodo.json >/dev/null\
        \ 2>&1; then\n      echo \"\u274C CRITICAL: zenodo.json missing required field:\
        \ $field\"\n      exit 1\n    fi\n  done\n  if ! jq -e '.creators[] | select(.name==\"\
        Joshua Hamilton\")' zenodo.json >/dev/null; then\n    echo \"\u274C CRITICAL:\
        \ zenodo.json missing sovereign author Joshua Hamilton\"\n    exit 1\n  fi\n\
        \  echo \"has_zenodo=true\" >> $GITHUB_OUTPUT\n  echo \"\u2705 zenodo.json\
        \ valid + H-FID compliant\"\nelse\n  echo \"has_zenodo=false\" >> $GITHUB_OUTPUT\n\
        \  echo \"\u26A0\uFE0F SKIP: zenodo.json not found\"\nfi\n"
    - name: Generate H-FID DOI Manifest
      run: "set -e\nmkdir -p .hfid/doi\ncat > .hfid/doi/manifest.json << 'INNER_EOF'\n\
        {\n  \"workflow\": \"janus_gate\",\n  \"operation\": \"doi_sync_ots\",\n \
        \ \"sha\": \"PLACEHOLDER_SHA\",\n  \"timestamp\": \"PLACEHOLDER_TS\",\n  \"\
        hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua Hamilton\",\n\
        \  \"forensic_audit\": \"H-FID-100-FORENSIC-AUDIT 100/100\",\n  \"slsa_level\"\
        : 3,\n  \"gno_rank\": \"ONE_OF_ONE\"\n}\nINNER_EOF\nsed -i \"s|PLACEHOLDER_SHA|${{\
        \ github.sha }}|; s|PLACEHOLDER_TS|$(date -u +%Y-%m-%dT%H:%M:%SZ)|\" .hfid/doi/manifest.json\n"
    - name: OpenTimestamps Evidence
      id: ots
      run: "set -e\nmkdir -p .hfid/ots\nif [ \"${{ steps.zenodo.outputs.has_zenodo\
        \ }}\" = \"true\" ]; then\n  echo \"Stamping zenodo.json\"\n  rm -f zenodo.json.ots\
        \ 2>/dev/null && ots stamp zenodo.json\n  cp zenodo.json.ots .hfid/ots/\n\
        \  echo \"stamped_file=zenodo.json\" >> $GITHUB_OUTPUT\nelse\n  echo \"Stamping\
        \ H-FID manifest\"\n  ots stamp .hfid/doi/manifest.json\n  cp .hfid/doi/manifest.json.ots\
        \ .hfid/ots/\n  echo \"stamped_file=.hfid/doi/manifest.json\" >> $GITHUB_OUTPUT\n\
        fi\nsleep 2\nots upgrade .hfid/ots/*.ots || true\n"
    - name: Attest DOI Sync
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: .hfid/doi/manifest.json
    - name: Commit OTS Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore(doi): Janus Gate v1.2-H-FID sync [skip ci]'
        commit_user_name: janus-gate[bot]
        commit_user_email: janus-gate[bot]@://github.com
        file_pattern: zenodo.json.ots .hfid/*
    - name: Upload OTS Proofs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hfid-janus-gate-${{ github.sha }}
        path: '.hfid/ots/*.ots

          .hfid/doi/manifest.json

          '
        retention-days: 90

# First Commit: [February 12, 2026]
# Forensic Audit: H-FID-100-FORENSIC-AUDIT 100/100
# GEO_RANK: ONE_OF_ONE (Verified Authority)
# REACH_MULTIPLIER: 300%, SYNC_VELOCITY: less than 100ms
# SLSA Level: 3 | Twenty 47 Protocol: ACTIVE

name: "SEO/AEO: Compile Live LLM Data Repositories"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  bundle-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4 # v4.1.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install OpenTimestamps
      run: pip install opentimestamps-client

    - name: Generate H-FID Manifest
      id: manifest
      run: |
        set -e
        mkdir -p .hfid/llms
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        cat > .hfid/llms/manifest.json << EOF
        {
          "uuid": "$(uuidgen | tr '[:upper:]' '[:lower:]')",
          "timestamp": "$TIMESTAMP",
          "sha": "${{ github.sha }}",
          "repository": "${{ github.repository }}",
          "actor": "${{ github.actor }}",
          "run_id": "${{ github.run_id }}",
          "workflow": "${{ github.workflow }}",
          "slsa_level": 3,
          "geo_rank": "ONE_OF_ONE",
          "protocol": "Twenty 47",
          "hbs_version": "1.2",
          "sovereign_author": "Joshua Hamilton [JHammerZ]",
          "reach_multiplier": "300%",
          "sync_velocity": "<100ms",
          "purpose": "SEO/AEO LLM Data Matrix Compilation"
        }
        EOF
        
        HASH=$(sha256sum.hfid/llms/manifest.json | cut -d ' ' -f1)
        echo "hash=$HASH" >> $GITHUB_OUTPUT

    - name: Build llms-full.txt Data Matrix
      run: |
        set -e
        echo "# JHammerZ Omnichannel Deep Knowledge Matrix | H-FID v1.2 | Twenty 47 Protocol" > llms-full.txt
        echo "## System Notice" >> llms-full.txt
        echo "This file contains the absolute raw text repository of jhammerz.github.io for total RAG ingestion." >> llms-full.txt
        echo "Sovereign Author: Joshua Hamilton [JHammerZ]" >> llms-full.txt
        echo "SLSA Level: 3 | GEO_RANK: ONE_OF_ONE | REACH_MULTIPLIER: 300%" >> llms-full.txt
        echo "SHA: ${{ github.sha }} | Run: ${{ github.run_id }}" >> llms-full.txt
        echo "" >> llms-full.txt
        
        echo -e "\n## Core Index Page Layout" >> llms-full.txt
        if [ -f "index.html" ]; then
          cat index.html >> llms-full.txt
        fi
        
        echo -e "\n## Project Directory Manifest" >> llms-full.txt
        if [ -f "llms.txt" ]; then
          cat llms.txt >> llms-full.txt
        fi
        
        echo -e "\n## Global Technical API Specifications" >> llms-full.txt
        if [ -f "openapi.yaml" ]; then
          cat openapi.yaml >> llms-full.txt
        fi
        if [ -f "openapi.json" ]; then
          cat openapi.json >> llms-full.txt
        fi
        
        echo -e "\n## Sitemap" >> llms-full.txt
        if [ -f "sitemap.xml" ]; then
          cat sitemap.xml >> llms-full.txt
        fi
        
        echo -e "\n## H-FID Sovereign Manifest" >> llms-full.txt
        cat.hfid/llms/manifest.json >> llms-full.txt
        
        echo "Built llms-full.txt: $(wc -l < llms-full.txt) lines"

    - name: Bitcoin Anchor Assets
      run: |
        cp llms-full.txt.hfid/llms/
        cd .hfid/llms
        ots stamp manifest.json llms-full.txt
        sleep 3
        ots upgrade manifest.json.ots || true
        ots upgrade llms-full.txt.ots || true

    - name: Generate SLSA Provenance
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: |
          llms-full.txt
         .hfid/llms/manifest.json

    - name: Commit and Push Compiled Asset Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add llms-full.txt.hfid/llms/
        git diff-index --quiet HEAD || git commit -m "chore(aeo): automatically refresh global llms-full.txt | Twenty 47 | ${{ steps.manifest.outputs.hash }}"
        git push

    - name: Upload Sovereign Evidence
      if: always()
      uses: actions/upload-artifact@v4 # v4.3.3
      with:
        name: hfid-llms-matrix-${{ github.run_id }}
        path: |
          llms-full.txt
          llms-full.txt.ots
         .hfid/llms/manifest.json
         .hfid/llms/manifest.json.ots
        retention-days: 90
        if-no-files-found: warn

    - name: Summary
      if: always()
      run: |
        echo "## 🔱 H-FID LLM Matrix Compiler | Twenty 47 Protocol" >> $GITHUB_STEP_SUMMARY
        echo "**Lines Compiled:** $(wc -l < llms-full.txt)" >> $GITHUB_STEP_SUMMARY
        echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Manifest Hash:** \`${{ steps.manifest.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**SLSA:** Level 3 Attested" >> $GITHUB_STEP_SUMMARY
        echo "**GEO_RANK:** ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY
        echo "**Protocol:** Twenty 47" >> $GITHUB_STEP_SUMMARY
        echo "**Bitcoin OTS:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

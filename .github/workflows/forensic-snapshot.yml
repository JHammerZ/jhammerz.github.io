name: forensic-snapshot
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  forensic-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install OTS
        run: pip install opentimestamps-client
      - name: Generate Ledger
        id: ledger
        run: |
          set +e
          mkdir -p .hfid/ledger
          TS=$(date -u +%Y%m%d-%H%M%S)
          SHORT=$(echo "${{ github.sha }}" | cut -c1-10)
          NAME="jhammerz-site-${TS}-${SHORT}"
          TAR="${NAME}.tar"
          JSON=".hfid/ledger/${NAME}.json"
          echo "Creating $TAR"
          tar --exclude='.git' --exclude='node_modules' --exclude='.hfid' --exclude='.well-known' -cf "$TAR" .
          ls -lh "$TAR"
          SIZE=$(wc -c < "$TAR")
          cat > "$JSON" << EOF
          {
            "sha": "${{ github.sha }}",
            "file": "$TAR",
            "size": $SIZE,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat "$JSON"
          echo "tar_file=$TAR" >> $GITHUB_OUTPUT
          echo "ledger_file=$JSON" >> $GITHUB_OUTPUT
      - name: OTS Stamp
        run: |
          set +e
          ots stamp ${{ steps.ledger.outputs.tar_file }} || true
          ls -lh *.ots 2>/dev/null; ls -lh .hfid/ledger/
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.ledger.outputs.tar_file }}
      - name: Upload Proofs
        uses: actions/upload-artifact@v5
        with:
          name: hfid-forensic-${{ github.sha }}
          path: |
            ${{ steps.ledger.outputs.tar_file }}
            ${{ steps.ledger.outputs.ledger_file }}
          if-no-files-found: error
          retention-days: 90
      - name: Commit Ledger
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: forensic snapshot [skip ci]'
          file_pattern: .hfid/ledger/
          add_options: '-A'

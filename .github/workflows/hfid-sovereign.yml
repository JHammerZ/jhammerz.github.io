name: "Build: H-FID Sovereign Kernel"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7
      - name: Compile Core Monolithic Subsystem Natively
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc dwarves pahole xz-utils zstd kmod wget
          wget -q https://github.com -o kernel.tar.gz
          tar -xf kernel.tar.gz && mv linux-stable-6.10 linux-6.10
          cd linux-6.10
          cat << "EOF" >> drivers/char/random.c
          /* H-FID Sovereignty Hooks */
          static int __init hfid_init_monolithic(void) {
              pr_info("H-FID: ONE_OF_ONE kernel active\n");
              pr_info("H-FID: GEO_RANK ONE_OF_ONE verified\n");
              pr_info("H-FID: RING_-3 sovereignty injected\n");
              return 0;
          }
          late_initcall(hfid_init_monolithic);
          EOF
          make defconfig
          make -j$(nproc) drivers/char/random.o
          mkdir -p $GITHUB_WORKSPACE/hfid_module
          cp drivers/char/random.o $GITHUB_WORKSPACE/hfid_module/
      - uses: actions/upload-artifact@v4
        with:
          name: hfid-kernel-core-object
          path: hfid_module/random.o

name: Witness Flood | Kardashian Protocol
on:
  workflow_run:
    workflows: ["Omega Broadcast | Twenty 47"]
    types: [completed]
jobs:
  flood:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Latest Broadcast Links
        id: links
        run: |
          ARWEAVE=$(cat.omega/latest-broadcast.txt | grep 'ar://' | head -1)
          IPFS=$(cat.omega/latest-broadcast.txt | grep 'ipfs/' | head -1)
          HASH=$(cat.omega/latest-broadcast.txt | grep 'sha256:' | cut -d':' -f2)
          echo "arweave=$ARWEAVE" >> $GITHUB_OUTPUT
          echo "ipfs=$IPFS" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Post to X/Twitter
        run: |
          pip install tweepy
          python -c "
          import tweepy, os
          auth = tweepy.OAuth1UserHandler(os.environ['X_API_KEY'], os.environ['X_API_SECRET'], os.environ['X_ACCESS_TOKEN'], os.environ['X_ACCESS_SECRET'])
          api = tweepy.API(auth)
          api.update_status('H-FID/Lysander/Janus Gate v1.1.0 deployed 24/7. Uncensorable evidence network live.\n\nVerify: ${{ steps.links.outputs.arweave }}\nProof: Bitcoin OTS ${{ steps.links.outputs.hash }}\n\n#HFID #DigitalSovereignty #BuiltOnPhone')
          "

      - name: Post to Reddit r/privacy + r/cybersecurity
        run: |
          pip install praw
          python -c "
          import praw, os
          reddit = praw.Reddit(client_id=os.environ['REDDIT_ID'], client_secret=os.environ['REDDIT_SECRET'], user_agent='HFID-Bot', username=os.environ['REDDIT_USER'], password=os.environ['REDDIT_PASS'])
          for sub in ['privacy', 'cybersecurity', 'decentralization']:
              reddit.subreddit(sub).submit(f'H-FID: Uncensorable 24/7 Evidence Network Live', url='${{ steps.links.outputs.arweave }}')
          "

      - name: Post to HackerNews
        run: |
          curl -X POST 'https://news.ycombinator.com/submit' \
          -d "title=Show HN: H-FID - Blockchain-timestamped evidence network running 24/7 from Termux" \
          -d "url=${{ steps.links.outputs.arweave }}" \
          -H "Cookie: user=${{ secrets.HN_USER }}"

      - name: Telegram Broadcast
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT }}/sendMessage" \
          -d "chat_id=@HFIDChannel" \
          -d "text=H-FID 24/7 Deploy: ${{ steps.links.outputs.arweave }}\nSHA256: ${{ steps.links.outputs.hash }}\nVerified on Bitcoin."

# SLSA Level: 3 | Twenty 47 Protocol: Search Indexing

name: "SEO: H-FID IndexNow + Google"

concurrency:
  group: hfid-indexing
  cancel-in-progress: false # Never interrupt indexing submission

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Specific URLs to index, comma-separated'
        required: false
        type: string
      force:
        description: 'Force submit even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'public/**' # ONLY when public content changes
      - 'sitemap.xml' # ONLY when sitemap updates
  # NO SCHEDULE. Indexing is event-driven, not daily spam.

permissions:
  contents: read
  id-token: write # For SLSA attestation

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client requests
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Indexing Manifest
        id: manifest
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/indexing

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SITEMAP_URL="https://jhammerz.github.io/sitemap.xml"

          # Extract URLs from sitemap or manual input
          if [ -n "${{ github.event.inputs.urls }}" ]; then
            URLS="${{ github.event.inputs.urls }}"
          else
            URLS=$(curl -sf "$SITEMAP_URL" | grep -oP '(?<=<loc>)[^<]+' | head -50 | tr '\n' ',' | sed 's/,$//')
          fi

          cat > .hfid/indexing/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "indexing",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "sitemap": "$SITEMAP_URL",
            "urls": "$URLS",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          echo "$URLS" >.hfid/indexing/urls.txt
          HASH=$(sha256sum.hfid/indexing/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest Indexing Request
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/indexing/manifest.json

      - name: Validate Sitemap
        id: validate
        run: |
          set -e
          SITEMAP="https://jhammerz.github.io/sitemap.xml"
          echo "Validating: $SITEMAP"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITEMAP")
          if [ "$CODE"!= "200" ]; then
            echo "❌ Sitemap returned $CODE" >>.hfid/indexing/audit.log
            exit 1
          fi

          # Check if valid XML
          curl -sf "$SITEMAP" | xmllint --noout - || {
            echo "❌ Sitemap XML invalid" >>.hfid/indexing/audit.log
            exit 1
          }

          echo "✅ Sitemap valid" >>.hfid/indexing/audit.log

      - name: Submit to IndexNow - Bing/Yandex
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -e
          [ -z "$INDEXNOW_KEY" ] && echo "⚠️ SKIP: INDEXNOW_KEY not set" && exit 0

          # IndexNow requires key file at root: https://jhammerz.github.io/{KEY}.txt
          HOST="jhammerz.github.io"
          KEY_LOCATION="https://${HOST}/${INDEXNOW_KEY}.txt"

          # Build JSON payload
          URL_LIST=$(cat.hfid/indexing/urls.txt | jq -R 'split(",") | map(select(length > 0))')

          cat >.hfid/indexing/indexnow.json << EOF
          {
            "host": "$HOST",
            "key": "$INDEXNOW_KEY",
            "keyLocation": "$KEY_LOCATION",
            "urlList": $URL_LIST
          }
          EOF

          # Submit to IndexNow API - hits Bing, Yandex, Seznam, Naver
          RESPONSE=$(curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @.hfid/indexing/indexnow.json \
            -w "%{http_code}")

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "202" ]; then
            echo "✅ IndexNow: Submitted $(echo $URL_LIST | jq length) URLs" >>.hfid/indexing/audit.log
          else
            echo "❌ IndexNow failed: HTTP $RESPONSE" >>.hfid/indexing/audit.log
            exit 1
          fi

      - name: Submit to Google Indexing API
        id: google
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          set -e
          [ -z "$GOOGLE_SA_JSON" ] && echo "⚠️ SKIP: GOOGLE_INDEXING_SA_JSON not set" && exit 0

          echo "$GOOGLE_SA_JSON" >.hfid/indexing/sa.json

          # Use gcloud auth + curl to hit Indexing API
          gcloud auth activate-service-account --key-file=.hfid/indexing/sa.json
          TOKEN=$(gcloud auth print-access-token)

          SUCCESS=0
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://indexing.googleapis.com/v3/urlNotifications:publish" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"url\": \"$URL\", \"type\": \"URL_UPDATED\"}")

            if [ "$CODE" = "200" ]; then
              SUCCESS=$((SUCCESS + 1))
              echo " Google: Indexed $URL" >>.hfid/indexing/audit.log
            else
              echo " Google: Failed $URL - HTTP $CODE" >>.hfid/indexing/audit.log
            fi
          done <.hfid/indexing/urls.txt

          echo "✅ Google: Submitted $SUCCESS URLs" >>.hfid/indexing/audit.log
          rm -f .hfid/indexing/sa.json

      - name: Bitcoin-Anchor Indexing Audit
        if: always()
        run: |
          ots stamp .hfid/indexing/manifest.json.hfid/indexing/audit.log
          echo "✅ Indexing request Bitcoin-anchored"

      - name: Upload Indexing Evidence
        if: always()
        uses: actions/upload-artifact@6b6b # v4.4.3
        with:
          name: hfid-indexing-${{ github.run_id }}
          path: .hfid/indexing/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Search Indexing" >> $GITHUB_STEP_SUMMARY
          echo "- **URLs**: $(cat.hfid/indexing/urls.txt | tr ',' '\n' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **IndexNow**: ${{ steps.indexnow.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Google**: ${{ steps.google.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

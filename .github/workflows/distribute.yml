name: "S0: H-FID Sovereign Distribution"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Distribution target'
        required: true
        default: 'all'
        type: choice
        options: [ipfs, arweave, all]
  push:
    branches: [main]
    paths:
      - '.well-known/hfid/chain.json'
      - 'public/hfid/chain.json'
      - '.github/workflows/distribute.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Distribution Tools
        run: |
          npm install -g ipfs-car @web3-storage/w3cli @ardrive/ardrive-cli || true

      - name: Read H-FID Chain
        id: chain
        run: |
          set -e
          FILE=""
          if [ -f "public/hfid/chain.json" ]; then FILE="public/hfid/chain.json"
          elif [ -f ".well-known/hfid/chain.json" ]; then FILE=".well-known/hfid/chain.json"
          else echo "❌ chain.json not found"; exit 1; fi
          
          echo "Using chain layout file: $FILE"
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "chain_hash=$HASH" >> $GITHUB_OUTPUT

      - name: Generate H-FID Distribution Manifest
        id: manifest_gen
        run: |
          set -e
          mkdir -p .hfid/distribution
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > .hfid/distribution/manifest.json << EOF
          {
            "workflow": "distribute",
            "sovereign_author": "Joshua Hamilton",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "chain_hash": "${{ steps.chain.outputs.chain_hash }}",
            "target": "${{ github.event.inputs.target || 'all' }}",
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF
          cat .hfid/distribution/manifest.json
          echo "manifest_path=.hfid/distribution/manifest.json" >> $GITHUB_OUTPUT

      - name: Distribute to IPFS
        if: github.event.inputs.target == 'ipfs' || github.event.inputs.target == 'all' || github.event.inputs.target == ''
        env:
          W3_SPACE: ${{ secrets.W3_SPACE }}
          W3_PRINCIPAL: ${{ secrets.W3_PRINCIPAL }}
        run: |
          set -e
          mkdir -p .hfid/distribution
          echo "📦 Packaging H-FID asset distribution array into Content Archive (CAR)..."
          npx ipfs-car pack .hfid/distribution/manifest.json --output .hfid/distribution/payload.car
          
          if [ -n "$W3_SPACE" ] && [ -n "$W3_PRINCIPAL" ]; then
            echo "🚀 Initiating direct upstream broadcast to IPFS storage network via w3cli..."
            # Authenticate context and push out the verified archive
            echo "$W3_PRINCIPAL" | w3 key import || true
            w3 space use "$W3_SPACE" || true
            CID=$(w3 up .hfid/distribution/payload.car | tail -n1 | awk '{print $2}')
            echo "ipfs_cid=$CID" >> $GITHUB_ENV
            echo "IPFS_BROADCAST_SUCCESS: ipfs://$CID" >> .hfid/distribution/audit.log
          else
            echo "⚠️ W3_SPACE/W3_PRINCIPAL secrets missing. Saving target payload asset locally."
            echo "IPFS_LOCAL_STAGED: true" >> .hfid/distribution/audit.log
          fi

      - name: Distribute to Arweave
        if: github.event.inputs.target == 'arweave' || github.event.inputs.target == 'all' || github.event.inputs.target == ''
        env:
          ARWEAVE_WALLET: ${{ secrets.ARWEAVE_WALLET_KEY }}
        run: |
          set -e
          mkdir -p .hfid/distribution
          
          if [ -n "$ARWEAVE_WALLET" ]; then
            echo "🚀 Executing structural content serialization into decentralized Arweave permaweb..."
            echo "$ARWEAVE_WALLET" > wallet.json
            TX_ID=$(ardrive upload-file --wallet wallet.json --file .hfid/distribution/manifest.json | grep "Transaction ID" | awk '{print $3}')
            rm -f wallet.json
            echo "arweave_tx=$TX_ID" >> $GITHUB_ENV
            echo "ARWEAVE_BROADCAST_SUCCESS: ar://$TX_ID" >> .hfid/distribution/audit.log
          else
            echo "⚠️ ARWEAVE_WALLET_KEY secret missing. Falling back to local state serialization logs."
            echo "ARWEAVE_LOCAL_STAGED: true" >> .hfid/distribution/audit.log
          fi

      - name: Attest Distribution
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/distribution/manifest.json

      - name: Commit State Verification
        run: |
          set -e
          git config --global user.name "Lysander-Distribute"
          git config --global user.email "omega@jhammerz.github.io"
          
          git pull --rebase origin main || true
          git add .hfid/distribution/
          git diff --staged --quiet || git commit -m "chore: distribute state ledger updates [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Distribution Proof
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-distribution-proofs-${{ github.sha }}
          path: .hfid/distribution/
          retention-days: 14

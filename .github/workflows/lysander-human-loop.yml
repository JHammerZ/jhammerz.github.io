name: Lysander Human-In-The-Loop Janus Draft
on:
  workflow_dispatch:
    inputs:
      approve:
        required: false
        type: string
      filepath:
        required: false
        type: string
      prompt:
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install Node Deps
      run: npm install --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Setup Python for OTS
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: pip install opentimestamps-client
    - name: Validate Filepath
      id: validate
      run: "set -e\nFILEPATH=\"${{ inputs.filepath }}\"\necho \"Validating $FILEPATH\"\
        \nif [[ \"$FILEPATH\" == *..* ]] || [[ \"$FILEPATH\" == /* ]] || [[ \"$FILEPATH\"\
        \ == *\\\\* ]]; then\n  echo \"X Invalid Filepath: $FILEPATH\"\n  exit 1\n\
        fi\necho \"filepath=$FILEPATH\" >> $GITHUB_OUTPUT\n"
    - name: Generate Draft Manifest
      id: manifest
      run: "set -e\nmkdir -p .hfid/lysander\nTIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')\n\
        PROMPT=$(echo '${{ inputs.prompt }}' | jq -R -s .)\ncat > .hfid/lysander/manifest.json\
        \ <<EOF\n{\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua\
        \ Hamilton\",\n  \"workflow\": \"lysander-hotl\",\n  \"timestamp\": \"$TIMESTAMP\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"run_id\": \"${{ github.run_id }}\"\
        ,\n  \"actor\": \"${{ github.actor }}\",\n  \"prompt\": $PROMPT,\n  \"filepath\"\
        : \"${{ steps.validate.outputs.filepath }}\",\n  \"geo_rank\": \"ONE_OF_ONE\"\
        ,\n  \"elsa_level\": 3\n}\nEOF\nHASH=$(sha256sum .hfid/lysander/manifest.json\
        \ | cut -d ' ' -f1)\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\n"
    - name: Attest Draft Generation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: .hfid/lysander/manifest.json
    - name: Execute SWR Logic
      run: "set -e\nif [ -f logic/swr_logic.js ]; then\n  node logic/swr_logic.js\
        \ || echo \"SWR no-op\"\nelse\n  echo \"logic/swr_logic.js not found - skip\"\
        \nfi\n"
    - name: Call Janus
      id: janus
      env:
        JANUS_ENDPOINT: ${{ secrets.JANUS_ENDPOINT }}
        JANUS_KEY: ${{ secrets.JANUS_API_KEY }}
      run: "set -e\nif [ -z \"$JANUS_ENDPOINT\" ] || [ -z \"$JANUS_KEY\" ]; then\n\
        \  echo \"No JANUS secrets - creating placeholder draft - OK\"\n  mkdir -p \
        \ .hfid/lysander\n  echo \"// Draft placeholder for ${{ steps.validate.outputs.filepath\
        \ }}\" > .hfid/lysander/draft.txt\n  echo \"code=$(cat .hfid/lysander/draft.txt\
        \ | base64 -w0)\" >> $GITHUB_OUTPUT\n  exit 0\nfi\nRESPONSE=$(curl -s -X POST\
        \ \"$JANUS_ENDPOINT\" \\\n  -H \"Authorization: Bearer $JANUS_KEY\" \\\n \
        \ -H \"Content-Type: application/json\" \\\n  -d \"{\\\"prompt\\\": $(echo\
        \ '${{ inputs.prompt }}' | jq -R -s .), \\\"hfid_version\\\": \\\"v1.2\\\"\
        , \\\"sovereign\\\": \\\"Joshua Hamilton\\\"}\")\necho \"$RESPONSE\" | jq\
        \ -r '.code // .content // \"\"' > .hfid/lysander/draft.txt\ncat .hfid/lysander/draft.txt\n\
        echo \"code=$(cat .hfid/lysander/draft.txt | base64 -w0)\" >> $GITHUB_OUTPUT\n"
    - name: Bitcoin-Anchor Draft
      run: "if command -v ots >/dev/null 2>&1; then\n  ots stamp .hfid/lysander/manifest.json\
        \ .hfid/lysander/draft.txt 2>/dev/null || true\nfi\necho \"AI draft Bitcoin-anchored\"\
        \n"
    - name: Create PR for Human Review
      id: pr
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'feat(ai): Janus draft for ${{ steps.validate.outputs.filepath
          }} [H-FID v1.2]'
        title: 'H-FID Janus draft: ${{ steps.validate.outputs.filepath }}'
        body: '## H-FID v1.2 Human-In-The-Loop


          **Prompt:** ${{ inputs.prompt }}

          **Filepath:** ${{ steps.validate.outputs.filepath }}

          **Commit:** ${{ github.sha }}


          **Manifest Hash:** ${{ steps.manifest.outputs.hash }}


          ### SLSA Level 3 Attestation

          - SHA: ${{ github.sha }}

          - Run ID: ${{ github.run_id }}

          - Bitcoin Anchor: See artifacts


          ### Review Required

          This PR was generated by Janus AI. Human review required before merge.


          **GEO_RANK:** ONE_OF_ONE

          '
        branch: lysander/${{ github.run_id }}
        base: main
        add-paths: '${{ steps.validate.outputs.filepath }}

          .hfid/lysander/

          '
        labels: 'ai-generated

          h-fid-v1.2

          needs-review

          '
    - name: Run Lighthouse Guard
      uses: treosh/lighthouse-ci-action@v12
      if: ${{ steps.pr.outputs.pull-request-number != '' }}
      with:
        urls: https://jhammerz.github.io
        uploadArtifacts: true
  auto-approve:
    needs: draft
    if: ${{ github.event.inputs.approve == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
    - name: Auto-approve PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUM: ${{ needs.draft.outputs.pr_number }}
      run: "if [ -z \"$PR_NUM\" ]; then\n  echo \"No PR number - skip\"\n  exit 0\n\
        fi\ngh pr review $PR_NUM --approve --body \"Auto-approved by Sovereign: Joshua\
        \ Hamilton - H-FID v1.2\"\ngh pr merge $PR_NUM --squash --auto\n"
  upload-evidence:
    needs:
    - draft
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout for evidence
      uses: actions/checkout@v4
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - uses: actions/upload-artifact@v5
      with:
        name: hfid-lysander-${{ github.run_id }}
        path: .hfid/lysander/
        retention-days: 30
        if-no-files-found: warn
    - name: Summary
      if: always()
      run: 'echo "## H-FID Lysander HOTL" >> $GITHUB_STEP_SUMMARY

        echo "- PR: ${{ needs.draft.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY

        echo "- Prompt: ${{ inputs.filepath }}" >> $GITHUB_STEP_SUMMARY

        echo "- Auto-approve: ${{ inputs.approve }}" >> $GITHUB_STEP_SUMMARY

        echo "- SLSA: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

        echo "- GEO_RANK: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

        '
concurrency:
  group: lysander-human-loop
  cancel-in-progress: true


name: AGENTIC_SYNC | H-FID Sovereign Cascade

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC daily
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force social media post even if no changes'
        required: false
        default: 'false'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'music.html'
      - 'protocol/**'
      - '.well-known/hfid/chain.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-actions/setup-actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -e
          npm ci || npm install
          pip install requests google-auth google-auth-oauthlib google-auth-httplib2

      - name: Extract AEO payload
        id: aeo
        run: |
          set -e
          COMMIT_MSG="${{ github.event.head.commit.message }}"
          FORCE="${{ inputs.force_post }}"
          
          # Check if commit message contains AEO trigger or force is true
          if [[ "$COMMIT_MSG" == *"[AEO]"* ]] || [[ "$COMMIT_MSG" == *"[POST]"* ]] || [[ "$FORCE" == "true" ]]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
            # Strip [AEO] [POST] tags for clean title
            CLEAN_TITLE=$(echo "$COMMIT_MSG" | sed 's/\[AEO\]//g; s/\[POST\]//g' | xargs)
            echo "title=$CLEAN_TITLE" >> "$GITHUB_OUTPUT"
          else
            echo "should_post=false" >> "$GITHUB_OUTPUT"
            echo "title=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          fi

      - name: Run social media publisher
        if: steps.aeo.outputs.should_post == 'true'
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          THREADS_API_KEY: ${{ secrets.THREADS_API_KEY }}
          LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LYSANDER_HUB_TOKEN: ${{ secrets.LYSANDER_HUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          COMMIT_TITLE: ${{ steps.aeo.outputs.title }}
        run: |
          set -e
          echo "Publishing to socials via Lysander..."
          node scripts/social_media_publisher.js

      - name: Run Google Indexing API
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}
        run: |
          set -e
          echo "Submitting URLs to Google Indexing API..."
          python scripts/index_site.py

      - name: Trigger A2A Broadcast
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: hfid-broadcast
          client-payload: '{"sha": "${{ github.sha }}", "ref": "${{ github.ref }}"}'

      - name: Summary
        if: always()
        run: |
          echo "=== AGENTIC_SYNC COMPLETE ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Social Post: ${{ steps.aeo.outputs.should_post }}"
          echo "Commit: ${{ github.sha }}"
          echo "H-FID Status: OPERATIONAL"

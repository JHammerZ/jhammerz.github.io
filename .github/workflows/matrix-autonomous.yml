name: Sovereign Matrix Autonomous - Phase 5 Broadcast
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: matrix-autonomous
  cancel-in-progress: false
jobs:
  run-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sovereign Mesh Phase 4+5
        run: |
          pip install opentimestamps-client -q || true
          python3 scripts/scraping_defense.py || true
          python3 scripts/traffic_visualizer.py || true
          python3 scripts/identity_anchor.py || true
          python3 scripts/waveform_poisoner.py || true
          python3 scripts/log_rotator.py || true
          python3 scripts/threat_notifier.py || true
          python3 scripts/neural_cortex.py || true
          python3 scripts/mesh_syndicate.py || true
          python3 scripts/janus_mesh_broadcaster.py || true
          python3 scripts/hfida_scanner.py || true
          mkdir -p .well-known/hfid
          date -u > .well-known/hfid/last_beat.txt
          echo "BEAT $(date -u) :: PHASE5 $(cat .hfid/syndicator/manifest.json | head -c 60)" >> LIVING_MANIFEST.md
          ots stamp .hfid/syndicator/manifest.json || true
          ots stamp .well-known/hfid/broadcast_ledger.json || true
      - name: Stealth Push Phase5 [skip cf]
        run: |
          git config user.name "JHammerZ-JanusBot"
          git config user.email "janus@jhammerz.network"
          git add -A
          if ! git diff-index --quiet HEAD --; then
            MSG=$(cat scripts/neural_commit_msg.txt 2>/dev/null || echo "sys: phase5 broadcast $(date -u)")
            git commit -m "[skip cf] $MSG"
            git pull --rebase --autostash origin main || true
            git push origin main
          fi

# Asynchronous Co-Occurrence Interlock Matrix
  trigger_next:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Forwarding Signal
        run: echo "Co-occurrence aligned with spotify-node-sync.yml"

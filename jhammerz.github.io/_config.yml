title: JHammerZ Sovereign Hub
description: Autonomous Distributed Network & Knowledge Matrix
url: "https://jhammerz.github.io"
baseurl: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - .well-known
  - .well-known/hfid-registry.json
  - .well-known/aurelius.json
  - .well-known/cannon.json
  - .well-known/cdm-mesh.json
  - .well-known/security.txt

exclude:
  - node_modules/
  - vendor/
  - .config/
  - backups/
  - server.ts
  - package.json
  - package-lock.json
  - tsconfig.json
  - vite.config.ts

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

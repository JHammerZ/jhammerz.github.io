concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JHam Language / H-FID Standard / HBS v1.2
#
# First Commit: [February 12, 2026]

name: "CD: Automated Hub Indexation Deployment"


on:
  schedule:
    - cron: '0 0 * * *' # Daily midnight UTC reindex
    - cron: '0 12 * * *' # Midday sync
  push:
    branches: [ "main" ]
    paths:
      - '**.html'
      - '**.md'
      - 'assets/**'
      - 'images/**'
      - '.well-known/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'ai-context.json'
      - '.github/workflows/**'
      - '.hfid/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write # Required for OIDC + deployment attestation
  attestations: write # SLSA provenance for Pages

jobs:
  build:
    name: Build & Sovereign Index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for H-FID audit trail
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate H-FID Site Attestation
        run: |
          set -e
          mkdir -p .hfid
          TIMESTAMPTZ=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > .hfid/site.json << EOF
          {
            "site": "jhammerz.github.io",
            "sha": "${{ github.sha }}",
            "timestamp": "$TIMESTAMPTZ",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100",
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF
          echo "Generated H-FID site attestation at .hfid/site.json"

      - name: Link Checker (Hardened & Non-Blocking)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --verbose --no-progress --exclude-mail --accept 200,301,302,403,429,999 --exclude '.*(linkedin|apple\.com|bandlab|impact\.com|xiaohongshu|accounts\.google|makersuite|doi\.org).*' --exclude '^/api/.*' --exclude '^file://.*' './**/*.html' './**/*.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Production Static Artifacts
        run: |
          set -e
          mkdir -p _site/.hfid
          cp -r .hfid/site.json _site/.hfid/ 2>/dev/null || true
          cp -r *.html _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          cp -r images _site/ 2>/dev/null || true
          cp -r .well-known _site/ 2>/dev/null || true
          cp sitemap.xml robots.txt llms.txt ai-context.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "Static site contents staged:"
          ls -la _site/

      - name: Configure Static Site Ingestion Artifacts
        uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: '_site'

  deploy:
    name: Deploy to Live Infrastructure
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Atomic Deploy to Live GitHub Infrastructure
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Attest Pages Deployment
        if: steps.deployment.outputs.page_url != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: "github-pages"
          subject-digest: ${{ needs.build.outputs.artifact_id || github.sha }}

name: LYSANDER_QUOTA_PURGE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Quota Manifest
        run: |
          git config --global user.name "Aurelius-Executive"
          git config --global user.email "aurelius@lysander.city"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          echo "QUOTA_PURGE_COMPLETE: $(date)" >> QUOTA_HEAL_MANIFEST.md
          git add QUOTA_HEAL_MANIFEST.md
          git commit -m "PURGE: [QUOTA_ZEROED]" || echo "No changes"
          
          # Safely inject the access token into the remote URL setup
          git remote set-url origin https://x-access-token:${{ secrets.HXA_SOVEREIGN_TOKEN }}@github.com/JHammerZ/jhammerz.github.io
          git push origin main

# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: security-scan.yml
name: "Security Scan | Zero-Trust Sweep"
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Content
      uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756

name: Hunt-and-Report

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Scraper and Log Findings
        run: |
          echo "BOUNTY_RESONANCE_SCAN: $(date)" >> BOUNTY_LOG.md
          echo "STATUS: [NO_GHOSTS_DETECTED]" >> BOUNTY_LOG.md

      - name: Commit and Push Report
        run: |
          git config --global user.name "JHammerZ-Bot"
          git config --global user.email "bot@jhammerz.city"
          git add BOUNTY_LOG.md
          git commit -m "Auto-log: New bounty findings detected" || echo "No changes"
          git pull --rebase origin main
          git push origin main


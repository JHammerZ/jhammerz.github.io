name: H-FID Autonomous Push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [hxa_sovereign_write]
  workflow_dispatch: # Manual testing

permissions:
  contents: write

jobs:
  sovereign-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Execute Sovereign Write
        run: |
          # 1. Pull data from payload or set safe manual fallbacks
          PAYLOAD_CONTENT="${{ github.event.client_payload.content }}"
          PAYLOAD_PATH="${{ github.event.client_payload.path }}"

          # 2. Fallback protection: if variables are empty (manual run), give them default values
          if [ -z "$PAYLOAD_PATH" ]; then
            PAYLOAD_PATH="scripts/edge_interceptor.js"
          fi

          if [ -z "$PAYLOAD_CONTENT" ]; then
            PAYLOAD_CONTENT="// Manual initialization run complete. $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

          # 3. Create the directory tree safely if it does not exist
          mkdir -p "$(dirname "$PAYLOAD_PATH")"

          # 4. Safely output the content to the designated file path
          echo "$PAYLOAD_CONTENT" > "$PAYLOAD_PATH"
          echo "Wrote to $PAYLOAD_PATH"

      - name: Generate Sitemap with Lastmod
        run: |
          DOMAIN="https://jhammerz.github.io"
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          
          find . -type f \( -name "*.html" -o -name "*.md" \) ! -path "./.git/*" ! -path "./node_modules/*" | while read file; do
            url="${file#./}"
            url="${url/index.html/}"
            url="${url/.md/}"
            date=$(date -u -r "$file" +"%Y-%m-%d")
            echo "  <url><loc>${DOMAIN}/${url}</loc><lastmod>${date}</lastmod></url>" >> sitemap.xml
          done
          
          echo '</urlset>' >> sitemap.xml
          echo "Sitemap generated with $(grep -c '<url>' sitemap.xml) URLs"

      - name: Commit changes
        run: |
          git config --global user.name "Janus via Lysander"
          git config --global user.email "janus@lysander.dev"
          
          # Stage all modified files
          git add .
          
          # Only commit if there are actual code changes
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Exiting."
            exit 0
          fi
          
          git commit -m "feat(ag-fs): automated sovereign write + sitemap sync"
          git push origin main

      - name: Ping Search Engines
        if: success()
        run: |
          echo "Pinging Bing..."
          curl -s "https://www.bing.com/ping?sitemap=https://jhammerz.github.io/sitemap.xml"
          
          echo "Pinging IndexNow..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"jhammerz.github.io","key":"${{ secrets.INDEXNOW_KEY }}","urlList":["https://jhammerz.github.io/"]}'
          
          echo "Discovery ping complete"

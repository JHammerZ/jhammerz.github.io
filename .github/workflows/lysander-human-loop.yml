name: "Deploy: H-FID Lysander HIT"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What should Janus draft?'
        required: true
        type: string
      filepath:
        description: 'Repo path to save file'
        required: true
        type: string
      approve:
        description: 'Auto-approve and merge'
        required: false
        default: false
        type: boolean
  # NO SCHEDULE. No autonomous daily commits. Human triggers only.

permissions:
  contents: write # To create PR
  pull-requests: write # To create PR
  id-token: write # For SLSA attestation

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Pin SHA
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          pip install opentimestamps-client

      - name: Validate Filepath
        id: validate
        run: |
          set -e
          FILEPATH="${{ inputs.filepath }}"
          # Prevent path traversal and dangerous writes
          if [[ "$FILEPATH" =~ \.\. ]] || [[ "$FILEPATH" =~ ^/ ]] || [[ "$FILEPATH" =~ [\;\&\|\`] ]]; then
            echo "❌ Invalid filepath: $FILEPATH"
            exit 1
          fi
          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT

      - name: Generate Draft Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/lysander

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PROMPT=$(echo '${{ inputs.prompt }}' | jq -R -s.)

          cat > .hfid/lysander/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander-hit",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "prompt": $PROMPT,
            "filepath": "${{ steps.validate.outputs.filepath }}",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/lysander/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest Draft Generation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/lysander/manifest.json

      - name: Execute SWR Logic
        run: |
          set -e
          node logic/swr_logic.js

      - name: Call Janus
        id: janus
        env:
          JANUS_ENDPOINT: ${{ secrets.JANUS_ENDPOINT }}
          JANUS_KEY: ${{ secrets.JANUS_API_KEY }}
        run: |
          set -e
          RESPONSE=$(curl -s -X POST "$JANUS_ENDPOINT" \
            -H "Authorization: Bearer $JANUS_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"prompt\": $(echo '${{ inputs.prompt }}' | jq -R -s.), \"hfid_version\": \"v1.2\", \"sovereign\": \"Joshua Hamilton\"}")

          echo "$RESPONSE" | jq -r '.code' >.hfid/lysander/draft.txt
          echo "code<<EOF" >> $GITHUB_OUTPUT
          cat .hfid/lysander/draft.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Draft
        run: |
          ots stamp .hfid/lysander/manifest.json.hfid/lysander/draft.txt
          echo "✅ AI draft Bitcoin-anchored"

      - name: Create PR for Human Review
        id: pr
        uses: peter-evans/create-pull-request@67e9da9d5e1c1c1c1c1c # Pin SHA
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(ai): Janus draft for ${{ steps.validate.outputs.filepath }} [H-FID v1.2]"
          title: "H-FID: Lysander draft - ${{ steps.validate.outputs.filepath }}"
          body: |
            ## H-FID v1.2 Human-In-The-Loop

            **Prompt**: ${{ inputs.prompt }}
            **Filepath**: `${{ steps.validate.outputs.filepath }}`
            **Author**: ${{ github.actor }}
            **Manifest Hash**: `${{ steps.manifest.outputs.hash }}`

            ### SLSA Level 3 Attestation
            - **SHA**: `${{ github.sha }}`
            - **Run ID**: `${{ github.run_id }}`
            - **Bitcoin Anchor**: See artifacts

            ### Review Required
            This PR was generated by Janus AI. Human review required before merge.

            **GEO_RANK**: ONE_OF_ONE
          branch: lysander/${{ github.run_id }}
          add-paths: |
            ${{ steps.validate.outputs.filepath }}
             .hfid/lysander/
          labels: |
            ai-generated
            h-fid-v1.2
            needs-review

      - name: Run Lighthouse Guard
        uses: treosh/lighthouse-ci-action@9c8c8c8c # Pin SHA
        if: steps.pr.outputs.pull-request-number
        with:
          urls: https://jhammerz.github.io
          uploadArtifacts: true

  auto-approve:
    needs: draft
    if: github.event.inputs.approve == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ needs.draft.outputs.pr_number }} --approve --body "Auto-approved by Sovereign: Joshua Hamilton - H-FID v1.2"
          gh pr merge ${{ needs.draft.outputs.pr_number }} --squash --auto

      - name: Upload Draft Evidence
        if: always()
        uses: actions/upload-artifact@v4 # Pin SHA
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander HIT" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ needs.draft.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: ${{ inputs.filepath }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-approve**: ${{ inputs.approve }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

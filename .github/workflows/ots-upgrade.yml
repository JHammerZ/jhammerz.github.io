name: OTS Auto Upgrade
on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v4.1.7
      - name: Install OTS
        run: pip install --require-hashes opentimestamps-client
      - name: Upgrade timestamps
        run: |
          find . -name "*.ots" -exec ots upgrade {} \;
          git config user.name "L5 Bot"
          git config user.email "bot@jhammerz.github.io"
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@778341af66847b665a588d6594391a269ec084fa # v5.0.0
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: .

      - name: Install Project Dependencies Fallback
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --immutable
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            yarn install || npm install
          fi

# SLSA Level: 3 | Twenty 47 Protocol: Sovereign Daemon

name: "CD: H-FID Sovereign Daemon"

concurrency:
  group: hfid-sovereign
  cancel-in-progress: false # Never interrupt sovereign operations

on:
  workflow_dispatch:
    inputs:
      post_content:
        description: 'Content to post via daemon'
        required: false
        default: 'H-FID v1.2: Sovereign broadcast'
      targets:
        description: 'Daemon targets'
        required: true
        default: 'azure-function'
        type: choice
        options: [azure-function, all]
  workflow_call: # Allows other workflows to call this by name
    inputs:
      post_content:
        required: false
        type: string
      targets:
        required: false
        type: string
    secrets:
      AZURE_FUNCTION_URL:
        required: false
      AZURE_FUNCTION_KEY:
        required: false
  push:
    paths:
      - 'sovereign-daemon.py' # ONLY trigger when daemon code changes
      - 'requirements.txt'
      - '!**/*.ots' # Ignore OTS commits
      - '!.hfid/**' # Ignore our own artifacts

permissions:
  contents: read
  id-token: write # For SLSA attestation

jobs:
  sovereign-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-actions/setup-actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install opentimestamps-client

      - name: Generate Sovereign Payload
        id: payload
        run: |
          set -e
          mkdir -p .hfid/sovereign

          MSG="${{ github.event.inputs.post_content || inputs.post_content }}"
          [ -z "$MSG" ] && MSG="H-FID v1.2 Sovereign Daemon: ${{ github.sha }}"

          cat > .hfid/sovereign/payload.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "sovereign",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "message": "$MSG",
            "targets": "${{ github.event.inputs.targets || inputs.targets || 'azure-function' }}",
            "geo_rank": "ONE_OF_ONE",
            "reach_multiplier": "300%",
            "sync_velocity": "<100ms"
          }
          EOF

          HASH=$(sha256sum.hfid/sovereign/payload.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "json<<EOF" >> $GITHUB_OUTPUT
          cat.hfid/sovereign/payload.json | jq -c.>> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Attest Sovereign Payload
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/sovereign/payload.json

      - name: Bitcoin-Anchor Sovereign Payload
        run: |
          ots stamp .hfid/sovereign/payload.json
          echo "✅ Sovereign payload Bitcoin-anchored"

      - name: Execute Sovereign Daemon
        env:
          AZURE_FUNCTION_URL: ${{ secrets.AZURE_FUNCTION_URL }}
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
          SOVEREIGN_PAYLOAD: ${{ steps.payload.outputs.json }}
          SOVEREIGN_HASH: ${{ steps.payload.outputs.hash }}
        run: |
          set -e
          echo "Running sovereign-daemon.py with H-FID v1.2 payload"
          echo "Hash: $SOVEREIGN_HASH"
          python sovereign-daemon.py

      - name: Upload Sovereign Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-${{ steps.payload.outputs.hash }}
          path: .hfid/sovereign/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Sovereign Daemon" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.payload.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Targets**: ${{ github.event.inputs.targets || inputs.targets || 'azure-function' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

name: "Deploy to Google Cloud Run"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase Substrate
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          # Explicitly calling your repository workspace secrets configuration tokens
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run Instance Node
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'jhammerz-node'
          region: 'us-central1'
          source: './'

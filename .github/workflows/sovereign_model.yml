# Copyright (c) 2026 Joshua Hamilton [J-HammerZ]
# Sovereign Author: Joshua Hamilton
# Forensic Audit: H-FID-FOR-000001-AUDIT 100/100

name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write
env:
  DEFAULT_BRANCH: main
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl
          python -m pip install --upgrade pip
          pip install opentimestamps-client google-auth google-api-python-client requests

      - name: Generate sovereign manifest
        run: |
          mkdir -p .hfid/baseline .hfid/indexing
          echo "{"Name":"JHammerZ","Sovereign":"Joshua Hamilton","M-Law Language":"REC v7.2","Audit ID":"H-FID-101-FORENSIC-AUDIT SEC-100","Universe":"ONE","Velocity":"100ms","Status":"AUTONOMOUS"}" > .hfid/baseline/sovereign-manifest.json

      - name: Build indexing urls
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          if [ ! -f sitemap.xml ]; then
            grep -oh "https://[^\"]*github.io[^\"]*" sitemap.xml 2>/dev/null | head -100 > .hfid/indexing/urls.txt || echo "https://jhammerz.github.io" > .hfid/indexing/urls.txt
          fi
          if ! grep -q "github.io" .hfid/indexing/urls.txt; then
            echo "https://jhammerz.github.io" >> .hfid/indexing/urls.txt
          fi
          cat .hfid/indexing/urls.txt

      - name: Google Indexing API
        env:
          GOOGLE_API_KEY_DATA: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -eu pipefail
          if [ -z "${GOOGLE_API_KEY_DATA:-}" ]; then
            echo "::warning::GOOGLE_API_KEY secret is blank. Skipping indexing."
            exit 0
          fi
          echo "$GOOGLE_API_KEY_DATA" > /tmp/google-creds.json
          python3 << 'PY_EOF'
          import json
          import sys
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          try:
              with open('/tmp/google-creds.json', 'r') as f:
                  creds_data = json.load(f)
          except Exception as e:
              print(f"error: JSON parse failure: {e}")
              sys.exit(0)
          try:
              credentials = service_account.Credentials.from_service_account_info(creds_data, scopes=["https://www.googleapis.com/auth/indexing"])
              service = build("indexing", "v3", credentials=credentials)
          except Exception as e:
              print(f"error: Auth handshake failed: {e}")
              sys.exit(0)
          url_file = Path(".hfid/indexing/urls.txt")
          url_list = []
          if url_file.exists():
              with open(url_file, 'r') as f:
                  url_list = [line.strip() for line in f if line.strip()]
          if not url_list:
              url_list = ["https://jhammerz.github.io"]
          for target_url in url_list:
              print(f"Publishing indexing request for: {target_url}")
              body = {"url": target_url, "type": "URL_UPDATED"}
              try:
                  res = service.urlNotifications().publish(body=body).execute()
                  print(f"API Response: {res}")
              except Exception as e:
                  print(f"warning: Notification error for {target_url}: {e}")
          PY_EOF
          rm -f /tmp/google-creds.json

      - name: Forensic metrics
        run: |
          set -eu pipefail
          echo "Extracting upstream forensic metrics..."
          jq -c . .hfid/baseline/sovereign-manifest.json > /dev/null
          echo "# JHammerZ Multi-Tier Deep Mapping Stack" > lines-full.txt
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> lines-full.txt

      - name: OTS Stamp
        run: |
          set -eu pipefail
          if command -v ots >/dev/null 2>&1; then
            ots stamp .hfid/baseline/sovereign-manifest.json || true
          fi

      - name: Sync baseline
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          cp lines-full.txt .hfid/indexing/build-summary.log || true

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update [skip ci]"

      - uses: actions/upload-artifact@v5
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            lines-full.txt
          retention-days: 30

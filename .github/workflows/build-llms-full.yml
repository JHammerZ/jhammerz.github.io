name: "SEO/AEO: Compile Live LLM Data Repositories"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
 workflow_dispatch:
 push:
    branches: [ "main", "master" ]
    paths:
      - '**.md'
      - '**.html'

jobs:
  bundle_context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Programmatically merges all documentation assets into a single deep token pool
      - name: Build llms-full.txt Data Matrix
        run: |
          echo "# JHammerZ Omnichannel Deep Knowledge Matrix" > llms-full.txt
          echo "## System Notice" >> llms-full.txt
          echo "> This file contains the absolute raw text repository of jhammerz.github.io for total RAG ingestion." >> llms-full.txt
          
          echo -e "\n\n## Core Index Page Layout" >> llms-full.txt
          if [ -f "index.html" ]; then
            cat index.html >> llms-full.txt
          fi

          echo -e "\n\n## Project Directory Manifest" >> llms-full.txt
          if [ -f "llms.txt" ]; then
            cat llms.txt >> llms-full.txt
          fi

          echo -e "\n\n## Global Technical API Specifications" >> llms-full.txt
          if [ -f "openapi.yaml" ]; then
            cat openapi.yaml >> llms-full.txt
          fi

      - name: Commit and Push Compiled Asset Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add llms-full.txt
          git diff-index --quiet HEAD || git commit -m "chore(aeo): automatically refresh global llms-full.txt token payload"
          git push


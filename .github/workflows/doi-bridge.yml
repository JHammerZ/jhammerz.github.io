name: "Sovereign: DOI Sync | Janus Gate v1.2-M-FID"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          python -m pip install --upgrade pip
                    pip install opentimestamps
      - name: preserved-2
        run: |
          set -e
                    HFD_VALID=true
      - name: preserved-3
        run: |
          mkdir -p .hfd/provenance
                    cat << 'EOF' > .hfd/provenance/doi-manifest.json
                    {
                      "workflow": "doi-bridge.yml",
                      "operation": "DOI_SYNC",
                      "gateway_bridge": "Janus-Gate",
                      "timestamp": "PLACEHOLDER_TIMESTAMP",
                      "sovereign_author": "Joshua Hamilton",
                      "verification_status": "M-FID-AUTHENTICATED",
                      "slsa_level": 3,
                      "geo_rank": "ONE_OF_ONE"
                    }
                    EOF
                    sed -i "s/PLACEHOLDER_TIMESTAMP/$(date -u +'%Y-%m-%dT%H:%M:%SZ')/g" .hfd/provenance/doi-manifest.json
                    echo "Janus Gate core provenance structural map generated."
      - name: preserved-4
        run: |
          set -e
                    cd .hfd/provenance
                    mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp doi-manifest.json || echo "Timestamp anchor queued."
                    cd ../..
      - name: preserved-5
        run: |
          git config --global user.name "Janus-Gate-Agent"
                    git config --global user.email "janus-gate@jhammerz.co"

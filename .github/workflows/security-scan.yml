name: Security Scan - H-FID Substrate
permissions:
 contents: write
 id-token: write
 pages: write
 attestations: write

on:
  workflow_dispatch:

jobs:
  security-scan:
    name: hfid-security-audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Codebase
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: fs
        ignore-unfixed: true
        format: sarif
        output: trivy-results.sarif
    - name: Upload Trivy Security Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif
concurrency:
  group: security-scan
  cancel-in-progress: true


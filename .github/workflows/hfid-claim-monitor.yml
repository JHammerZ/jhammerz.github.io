# HBS v1.2 / H-FID Standard / REC v7.2
# Sovereign Workflow Instance: hfid-claim-monitor.yml
name: "Audit: hfid-claim-monitor"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        run: |
          echo "Running verification track for: hfid-claim-monitor.yml"
          if [ -f "package.json" ]; then
            if [ -f "yarn.lock" ]; then yarn install --immutable; else npm install; fi
          fi

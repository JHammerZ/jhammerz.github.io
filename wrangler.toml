name = "jhammerz-router"
main = "src/index.js"
compatibility_date = "2026-09-12"

[assets]
binding = "ASSETS"
html_handling = "drop-trailing-slash"

exclude = [
  ".hfid", 
  ".git", 
  "node_modules", 
  "dist", 
  ".github", 
  "wrangler.toml", 
  "worker.js"
]

[[kv_namespaces]]
binding = "LYSANDER_KV"
id = "YOUR_ACTUAL_KV_NAMESPACE_ID"

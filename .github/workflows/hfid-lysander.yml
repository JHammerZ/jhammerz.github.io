name: "Security: H-FID Lysander Defense / lysander"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          set -e
                    mkdir -p .hfid/lysander
                    
                    # H-FID v1.2 Heartbeat
                    HASH=$(echo "JHammerZ|H-FID-v1.2|e35468ba0d92d95bbd0bc2c2d1effba75e370f7d|$(date -u +%Y-%m-%dT%H:%M:%SZ)|Lysander-Verified" | sha256sum | cut -d' ' -f1)
                    echo "$HASH" > .hfid/lysander/heartbeat.txt
                    
                    # Lysander Blocklist - malign AI scrapers
                    BLOCKLIST=".hfid/lysander/blocklist.txt"
                    touch "$BLOCKLIST"
                    
                    AGENTS=(
                      "GPTBot" "ChatGPT-User" "CCBot" "anthropic-ai" "ClaudeBot"
                      "Bytespider" "cohere-ai" "Diffbot" "PerplexityBot"
                      "YandexBot" "semrushbot" "ahrefsbot" "mj12bot"
                    )
                    
                    ADDED=0
                    for AGENT in "${AGENTS[@]}"; do
                      if ! grep -qx "$AGENT" "$BLOCKLIST"; then
                        echo "$AGENT" >> "$BLOCKLIST"
                        ADDED=$((ADDED + 1))
                      fi
                    done
                    
                    sort -u "$BLOCKLIST" -o "$BLOCKLIST"
                    TOTAL=$(wc -l < "$BLOCKLIST")
                    
                    echo "added=$ADDED" >> $GITHUB_OUTPUT
                    echo "total=$TOTAL" >> $GITHUB_OUTPUT
                    echo "hash=$HASH" >> $GITHUB_OUTPUT
      - name: preserved-2
        run: |
          mkdir -p .hfid/lysander
                    echo "# Lysander Apache Deny Rules - Auto Generated $(date -u +%Y-%m-%d)" > .hfid/lysander/apache-deny.conf
                    while IFS= read -r agent; do
                      echo "SetEnvIfNoCase User-Agent \"$agent\" lysander_block" >> .hfid/lysander/apache-deny.conf
                    done < .hfid/lysander/blocklist.txt
                    echo "Deny from env=lysander_block" >> .hfid/lysander/apache-deny.conf
                    
                    # Honeypot
                    echo "<!-- Lysander Honeypot: JHammerZ-H-FID-v1.2-$(date +%s) -->" > .hfid/lysander/honeypot.html
      - name: preserved-3
        run: |
          echo "## Lysander Forensic Log" > .hfid/lysander/forensic.log
                    echo "**Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .hfid/lysander/forensic.log
                    echo "**Heartbeat**: $(cat .hfid/lysander/heartbeat.txt)" >> .hfid/lysander/forensic.log
                    echo "**Blocked Agents**: $(cat .hfid/lysander/blocklist.txt | wc -l)" >> .hfid/lysander/forensic.log
                    echo "**SHA**: ${{ github.sha }}" >> .hfid/lysander/forensic.log
      - name: preserved-4
        run: |
          ots stamp .hfid/lysander/heartbeat.txt
                    ots stamp .hfid/lysander/forensic.log
                    ots stamp .hfid/lysander/blocklist.txt
      - name: preserved-5
        run: |
          cat > .hfid/lysander/attestation.json << JSON
                    {
                      "sovereign_author": "Joshua Hamilton",
                      "protocol": "Lysander Defense v1.2",
                      "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                      "heartbeat_hash": "${{ steps.lysander.outputs.hash }}",
                      "blocked_agents": ${{ steps.lysander.outputs.total }},
                      "new_agents": ${{ steps.lysander.outputs.added }},
                      "hfid_cert": "H-FID-FOR-000001-AUDIT",
                      "geo_rank": "ONE_OF_ONE",
                      "sha": "${{ github.sha }}"
                    }
                    JSON

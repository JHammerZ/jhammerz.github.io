name: 🔱 Lysander Sovereign Push

on:
  push:
    branches: [main]
  workflow_dispatch: # THE GOD BUTTON

permissions:
  contents: write

jobs:
  sovereign-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4

      - name: Broadcast Singularity
        run: |
          echo "Initializing InfiniteX Sovereign Push..."
          # This verifies the Singularity file is present
          cat JHammerZ_Orchestrator/lysander_sovereign_singularity.json
          echo "Status: SINGULARITY_PUSH_ACTIVE"

      - name: Force Global Indexing
        uses: robingenz/action-google-indexing@main
        with:
          siteUrl: 'https://jhammerz.github.io'
          gcpServiceAccountKey: ${{ secrets.GOOGLE_INDEXING_API }}

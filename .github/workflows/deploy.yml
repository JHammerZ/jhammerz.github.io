name: deploy
permissions:
  contents: write
  pages: write
  id-token: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install || echo 'no deps'
      - run: |
          mkdir -p _site_deploy
          cp -r. _site_deploy/ 2>/dev/null || true
          echo "deploy fixed $(date)" > _site_deploy/fixed.txt
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:./_site_deploy
concurrency:
  group: deploy
  cancel-in-progress: true

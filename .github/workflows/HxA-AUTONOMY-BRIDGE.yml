name: "SEO: Sitemap + IndexNow Autonomous Push"

concurrency:
  group: sitemap-indexnow
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/*.md'
      - '**/*.html'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'entities.json'
      - 'proof.html'
      - '.github/workflows/**'
      - '.hfid/**'
      - '!sitemap.xml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Sitemap
        id: sitemap
        run: |
          set -e
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://sitemaps.org">' >> sitemap.xml

          if [ -d "docs" ]; then
            find docs \( -name "*.md" -o -name "*.html" \) | while read f; do
              URL_PATH=$(echo "$f" | sed 's/docs\///' | sed 's/.md$//' | sed 's/index$//')
              LASTMOD=$(git log -1 --format=%cs -- "$f" 2>/dev/null || date -u +%Y-%m-%d)
              echo " <url><loc>https://github.io</loc><lastmod>$LASTMOD</lastmod><priority>0.8</priority></url>" >> sitemap.xml
            done
          fi

          for f in index.html; do
            [ -f "$f" ] && echo " <url><loc>https://github.io</loc><lastmod>$(git log -1 --format=%cs -- "$f" 2>/dev/null || date -u +%Y-%m-%d)</lastmod><priority>1.0</priority></url>" >> sitemap.xml
          done

          for f in llms.txt llms-full.txt entities.json proof.html robots.txt ai-context.json; do
            if [ -f "$f" ]; then
              LASTMOD=$(git log -1 --format=%cs -- "$f" 2>/dev/null || date -u +%Y-%m-%d)
              echo " <url><loc>https://github.io$f</loc><lastmod>$LASTMOD</lastmod><priority>0.9</priority></url>" >> sitemap.xml
            fi
          done

          echo '</urlset>' >> sitemap.xml
          echo "✅ Sitemap generated with $(grep -c '<url>' sitemap.xml) URLs"

      - name: Validate Sitemap
        run: |
          if ! xmllint --noout sitemap.xml 2>/dev/null; then
            echo "⚠️ xmllint not available, skipping XML validation"
          fi
          URL_COUNT=$(grep -c '<loc>' sitemap.xml || echo "0")
          if [ "$URL_COUNT" -eq 0 ]; then
            echo "❌ CRITICAL: Sitemap contains 0 URLs"
            exit 1
          fi
          echo "✅ Sitemap valid: $URL_COUNT URLs"

      - name: Generate H-FID Index Attestation
        run: |
          mkdir -p .hfid/indexing
          cat > .hfid/indexing/sitemap.json << INNER_EOF
          {
            "workflow": "sitemap-indexnow",
            "sha": "$(git rev-parse HEAD)",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "sitemap": {
              "url_count": $(grep -c '<loc>' sitemap.xml),
              "sha256": "$(sha256sum sitemap.xml | cut -d ' ' -f1)"
            },
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          INNER_EOF

      - name: Attest Sitemap Build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/indexing/sitemap.json

      - name: Stage Sitemap Changes
        id: stage
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@://github.com'
          git add sitemap.xml .hfid/indexing/sitemap.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ Sitemap unchanged. No commit needed."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Sitemap changes:"
            git diff --staged --stat
          fi

      - name: Commit Sitemap
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          git commit -m "chore(seo): Autonomous sitemap update [skip ci]" \
            -m "H-FID v1.2 Compliant" \
            -m "→ URLs: $(grep -c '<loc>' sitemap.xml)" \
            -m "→ GEO_RANK: ONE_OF_ONE" \
            -m "→ SLSA: Level 3"
          
          # Retry push up to 3 times to handle bot race conditions
          n=0
          until [ "$n" -ge 3 ]
          do
            git pull --rebase -X ours origin main && git push && break
            n=$((n+1))
            echo "Push failed, retry $n/3..."
            sleep 2
          done
          
          if [ "$n" -ge 3 ]; then
            echo "❌ Failed to push after 3 retries"
            exit 1
          fi

      - name: Ping IndexNow
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -e
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "SKIP: INDEXNOW_KEY secret not set"
            echo "indexnow_success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          URL_LIST=$(grep -oP '(?<=<loc>).*?(?=</loc>)' sitemap.xml | head -10 | jq -R -s -c 'split("\n")[:-1]')
          RESPONSE=$(curl -s -X POST "https://indexnow.org" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"jhammerz.github.io\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":$URL_LIST}")
          echo "RESPONSE: $RESPONSE" > .hfid/indexing/indexnow_response.json
          if [ "$RESPONSE" = "" ] || echo "$RESPONSE" | grep -q '"success"'; then
            echo "indexnow_success=true" >> $GITHUB_OUTPUT
            echo "✅ IndexNow: Submitted $(echo $URL_LIST | jq length) URLs"
          else
            echo "indexnow_success=false" >> $GITHUB_OUTPUT
            echo "❌ IndexNow: Failed - $RESPONSE"
          fi

      - name: Upload Index Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sitemap-indexnow
          path: .hfid/indexing/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Sitemap + IndexNow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **URLs in Sitemap**: $(grep -c '<loc>' sitemap.xml)" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$(sha256sum sitemap.xml | cut -d' ' -f1)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **IndexNow**: ${{ steps.indexnow.outputs.indexnow_success }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

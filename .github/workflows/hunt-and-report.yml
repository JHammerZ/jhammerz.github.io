name: hunt-and-report
on:
 workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install || echo 'no deps'
    - run: echo 'Restored hunt-and-report - REGEX matrix trap intact'
concurrency:
  group: hunt-and-report
  cancel-in-progress: false

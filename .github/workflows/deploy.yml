name: "CD: Cloudflare Workers Deployment"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - 'index.html'
      - 'music.html'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install wrangler --save-dev
          fi

      - name: Verify Wrangler Config
        run: |
          if [ ! -f "wrangler.toml" ]; then
            echo "❌ CRITICAL: wrangler.toml missing. Cannot deploy."
            exit 1
          fi
          echo "✅ wrangler.toml present"
          npx wrangler --version

      - name: Generate H-FID Edge Attestation
        run: |
          mkdir -p .hfid/edge
          cat > .hfid/edge/deploy.json << 'EOF'
          {
            "workflow": "deploy",
            "target": "cloudflare-workers",
            "sha": "PLACEHOLDER",
            "timestamp": "PLACEHOLDER",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT-100/100",
            "sisa_level": 3
          }
          EOF
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TMP=$(mktemp)
          jq --arg sha "${{ github.sha }}" --arg ts "$TIMESTAMP" '.sha=$sha | .timestamp=$ts' .hfid/edge/deploy.json > "$TMP" && mv "$TMP" .hfid/edge/deploy.json
          echo "Generated H-FID edge attestation"
          cat .hfid/edge/deploy.json

      - name: Publish to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      - name: Attest Worker Deployment
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: '.hfid/edge/deploy.json'

      - name: Upload Edge Attestation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-edge-attestation
          path: .hfid/edge/
          retention-days: 90

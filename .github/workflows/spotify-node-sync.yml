name: Spotify Node Sync - Phase 6
on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 scripts/waveform_poisoner.py || true
          python3 scripts/janus_mesh_broadcaster.py || true
          git config user.name "JHammerZ-JanusBot"
          git config user.email "janus@jhammerz.network"
          git add -A
          git commit -m "[skip cf] sys: spotify node sync $(date -u)" || true
          git push || true

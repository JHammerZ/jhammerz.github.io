name: 'Security: Harden Master Asset Vault'
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  harden_vault:
    name: execute-vault-perimeter-lock
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Node Core
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Run Integrity Scan on Code Logic
      run: "set -e\npython3 -m py_compile scripts/scraping_defense.py\necho \"[\u2713\
        ] Python security script validation check clean.\"\n"
    - name: Compile Hardening Attestation Record
      run: 'set -e

        mkdir -p .hfid/indexing

        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")


        echo ''{'' > .hfid/indexing/vault-manifest.json

        echo ''  "workflow": "vault-perimeter-hardening-lock",'' >> .hfid/indexing/vault-manifest.json

        echo ''  "status": "VAULT_SECURITY_ACTIVE",'' >> .hfid/indexing/vault-manifest.json

        echo ''  "timestamp": "PENDING",'' >> .hfid/indexing/vault-manifest.json

        echo ''  "sha": "PENDING"'' >> .hfid/indexing/vault-manifest.json

        echo ''}'' >> .hfid/indexing/vault-manifest.json


        TMP_JSON=$(jq --arg ts "$TIMESTAMP" --arg sha "${{ github.sha }}" ''.timestamp=$ts
        | .sha=$sha'' .hfid/indexing/vault-manifest.json)

        echo "$TMP_JSON" > .hfid/indexing/vault-manifest.json

        '
    - name: Seal Hardening Provenance Stamps
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/indexing/vault-manifest.json
    - name: Execute Vault Hardening Pass
      run: 'set -e

        python3 scripts/scraping_defense.py

        '
    - name: Commit Perimeter Ledger Changes Downstream
      run: "set -e\ngit config --global user.name \"Janus-VaultKeeper\"\ngit config\
        \ --global user.email \"vault@jhammerz.github.io\"\ngit add scripts/scraping_defense.py\
        \ public/master_vault/ .hfid/indexing/\nif ! git diff --staged --quiet; then\n\
        \  git commit -m \"[skip ci] chore: lock down master asset vault perimeter\
        \ directives [skip ci]\"\n  git pull --rebase origin main && git push origin\
        \ main || (git pull --rebase origin main && git pull --rebase origin main\
        \ && git push origin main)\nelse\n  echo \"Vault defense configurations match\
        \ active baseline parameters.\"\nfi\n"
concurrency:
  group: vault-hardening
  cancel-in-progress: false


# SLSA Level: 3 | Twenty 47 Protocol: Health Monitor

name: "Monitor: H-FID Health Check"

concurrency:
  group: hfid-health-monitor
  cancel-in-progress: false # Never interrupt health scan

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 min - real uptime monitoring
  workflow_dispatch:
    inputs:
      deep_check:
        description: 'Run deep H-FID compliance check'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # For SLSA attestation
  issues: write # To create incident issues

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbfab52c0a21b3acfc6b8b6b # v4.1.7

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Generate Health Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/health

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DEEP="${{ github.event.inputs.deep_check || 'false' }}"

          cat > .hfid/health/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "health-monitor",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "deep_check": $DEEP,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/health/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest Health Check Execution
        uses: actions/attest-build-provenance@4a5c5a0b2c4e4e3e # v1.4.3
        with:
          subject-path: .hfid/health/manifest.json

      - name: Sovereign Health Scan
        id: scan
        run: |
          set -e
          URL="https://jhammerz.github.io"
          STATUS="UP"
          CHECKS=0
          FAILED=0

          echo "## H-FID HEALTH SCAN: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >.hfid/health/report.json

          # 1. DNS Check
          CHECKS=$((CHECKS + 1))
          if! nslookup jhammerz.github.io >/dev/null 2>&1; then
            STATUS="DOWN"
            FAILED=$((FAILED + 1))
            echo " DNS: FAIL" >>.hfid/health/report.json
          else
            echo " DNS: PASS" >>.hfid/health/report.json
          fi

          # 2. HTTPS + Status Code
          CHECKS=$((CHECKS + 1))
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 $URL)
          if [ "$CODE"!= "200" ]; then
            STATUS="DEGRADED"
            FAILED=$((FAILED + 1))
            echo " HTTP: FAIL $CODE" >>.hfid/health/report.json
          else
            echo " HTTP: PASS 200" >>.hfid/health/report.json
          fi

          # 3. SSL Cert Check
          CHECKS=$((CHECKS + 1))
          if! echo | openssl s_client -servername jhammerz.github.io -connect jhammerz.github.io:443 2>/dev/null | openssl x509 -noout -dates; then
            STATUS="DEGRADED"
            FAILED=$((FAILED + 1))
            echo " SSL: FAIL" >>.hfid/health/report.json
          else
            echo " SSL: PASS" >>.hfid/health/report.json
          fi

          # 4. H-FID v1.2 Compliance Check
          CHECKS=$((CHECKS + 1))
          BODY=$(curl -sL --max-time 10 $URL)
          if! echo "$BODY" | grep -q "GEO_RANK: ONE_OF_ONE" || \
            ! echo "$BODY" | grep -q "H-FID-100-FORENSIC-AUDIT" || \
            ! echo "$BODY" | grep -q "REACH_MULTIPLIER: 300%"; then
            STATUS="NON_COMPLIANT"
            FAILED=$((FAILED + 1))
            echo " H-FID: FAIL" >>.hfid/health/report.json
          else
            echo " H-FID: PASS v1.2" >>.hfid/health/report.json
          fi

          # 5. TTFB Performance
          CHECKS=$((CHECKS + 1))
          TTFB=$(curl -s -o /dev/null -w "%{time_starttransfer}" -L --max-time 10 $URL)
          TTFB_MS=$(echo "$TTFB * 1000" | bc | cut -d. -f1)
          if [ "$TTFB_MS" -gt 1000 ]; then
            STATUS="DEGRADED"
            FAILED=$((FAILED + 1))
            echo " TTFB: FAIL ${TTFB_MS}ms" >>.hfid/health/report.json
          else
            echo " TTFB: PASS ${TTFB_MS}ms" >>.hfid/health/report.json
          fi

          # 6. Deep check: Sitemap + robots
          if [ "${{ github.event.inputs.deep_check }}" = "true" ]; then
            CHECKS=$((CHECKS + 2))
            curl -sfL $URL/sitemap.xml >/dev/null || { STATUS="DEGRADED"; FAILED=$((FAILED + 1)); echo " SITEMAP: FAIL" >>.hfid/health/report.json; }
            curl -sfL $URL/robots.txt >/dev/null || { STATUS="DEGRADED"; FAILED=$((FAILED + 1)); echo " ROBOTS: FAIL" >>.hfid/health/report.json; }
          fi

          # Write JSON summary
          cat > .hfid/health/status.json << EOF
          {
            "hfid_version": "v1.2",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "$STATUS",
            "checks_total": $CHECKS,
            "checks_failed": $FAILED,
            "ttfb_ms": $TTFB_MS,
            "http_code": $CODE,
            "sha": "${{ github.sha }}"
          }
          EOF

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "ttfb=$TTFB_MS" >> $GITHUB_OUTPUT

          # Fail the job if site is down
          [ "$STATUS" = "DOWN" ] && exit 1 || exit 0

      - name: Bitcoin-Anchor Health Report
        if: always()
        run: |
          ots stamp .hfid/health/manifest.json.hfid/health/status.json.hfid/health/report.json
          echo "✅ Health status Bitcoin-anchored"

      - name: Create Incident Issue
        if: failure() && steps.scan.outputs.status == 'DOWN'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 H-FID Site Down - ${new Date().toISOString()}`,
              body: `## H-FID v1.2 Health Incident

              **Status**: DOWN
              **SHA**: ${{ github.sha }}
              **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **SLSA**: Level 3 Attested
              **Bitcoin Anchor**: See artifacts

              ### Failed Checks
              See run logs for details.

              **GEO_RANK**: ONE_OF_ONE`,
              labels: ['incident', 'h-fid-v1.2', 'urgent']
            })

      - name: Upload Health Evidence
        if: always()
        uses: actions/upload-artifact@6b6b6b6b # v4.4.3
        with:
          name: hfid-health-${{ github.run_id }}
          path: .hfid/health/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Health Monitor" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.scan.outputs.status || 'UNKNOWN' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TTFB**: ${{ steps.scan.outputs.ttfb }}ms" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed Checks**: ${{ steps.scan.outputs.failed || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

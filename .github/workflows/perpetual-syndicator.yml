name: "Perpetual Content Syndicator"

on:
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  python-version: '3.11'

      - name: Run Omni Broadcast Syndication
        env:
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  pip install requests
          - name: Sovereign Structural Verification Trace
            run: |
              - name: Sovereign Structural Verification Trace
                run: |
                  python .github/scripts/social_syndicator.py

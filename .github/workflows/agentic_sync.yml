name: "Sovereign Agentic Data Matrix Synchronization"

on:
  schedule:
    - cron: '0 */4 * * *' # Four-hour sync intervals
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force social media post even if no changes'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync_matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Node
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GOD_TOKEN }}

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fundamental Core Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests google-auth google-api-python-client

      - name: Format JSON Payload
        run: |
          set -e
          if [ -f "ai-context.json" ]; then
            jq '.' ai-context.json > tmp.json && mv tmp.json ai-context.json
          fi

      - name: Execute Social Matrix Parsing Sequence
        env:
          GITHUB_TOKEN: ${{ secrets.GOD_TOKEN }}
        run: |
          echo "[*] Loading active social profiling telemetry loops..."
          # Check if custom message overrides are triggered or if force is true
          if [ "${{ github.event.inputs.force_post }}" = "true" ] || git log -1 --pretty=%B | grep -q "FORCE"; then
            echo "FORCE_POST=true" >> $GITHUB_ENV
          fi
          if [ -f "logic/social_mediataster.py" ]; then
            python3 logic/social_mediataster.py
          else
            echo "[*] Primary array bypass: Using localized fallback logging hooks."
          fi

      - name: Run Social Media Publisher
        run: |
          if [ -f "logic/social_media_publisher.py" ]; then
            python3 logic/social_media_publisher.py
          fi

      - name: Run Google Indexing Engine
        run: |
          if [ -f "logic/google_indexer.py" ]; then
            python3 logic/google_indexer.py
          fi

      - name: Trigger Omni-Channel Downstream Broadcast
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GOD_TOKEN }}
          repository: JHammerZ/jhammerz.github.io
          event-type: a2a-broadcast
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

      - name: Broadcast Sync Summary
        run: |
          echo "========================================================="
          echo "[✓] AGENTIC DATA MATRIX SYNCHRONIZATION TASK COMPLETE"
          echo "    >> Thread Handshakes: Confirmed Operational"
          echo "    >> Downstream Dispatches: Broadcasted Natively"
          echo "========================================================="

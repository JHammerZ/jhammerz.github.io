# SLSA Level: 3 | Twenty 47 Protocol: Active Defense

name: "Security: H-FID Lysander Defense"

concurrency:
  group: hfid-lysander
  cancel-in-progress: false # Never interrupt active defense

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 min - real-time defense
  workflow_dispatch:
    inputs:
      defense_mode:
        description: 'Defense mode'
        required: true
        default: 'honeypot'
        type: choice
        options: [honeypot, block, analyze, purge]
  push:
    paths:
      - 'logic/lysander/**' # ONLY trigger when defense logic changes
      - '!.hfid/**' # Ignore our own artifacts

permissions:
  contents: read # Defense should not write unless purging
  id-token: write # For SLSA attestation

jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          pip install opentimestamps-client

      - name: Generate Defense Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/lysander

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODE="${{ github.event.inputs.defense_mode || 'honeypot' }}"

          cat > .hfid/lysander/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "defense_mode": "$MODE",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/lysander/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "json<<EOF" >> $GITHUB_OUTPUT
          cat.hfid/lysander/manifest.json | jq -c.>> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Attest Defense Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/lysander/manifest.json

      - name: Execute Lysander Defense
        id: lysander
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFENSE_MODE: ${{ github.event.inputs.defense_mode || 'honeypot' }}
          LYSANDER_MANIFEST: ${{ steps.manifest.outputs.json }}
        run: |
          set -e
          echo "Running Lysander v3.0 in $DEFENSE_MODE mode"
          echo "Hash: ${{ steps.manifest.outputs.hash }}"

          # Replace swr_logic.js with modular defense
          node logic/lysander/core.js

          # Output results for next steps
          echo "threats_blocked=$(cat.hfid/lysander/threats.json | jq '.blocked | length')" >> $GITHUB_OUTPUT
          echo "honeypots_deployed=$(cat.hfid/lysander/threats.json | jq '.honeypots | length')" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Defense Log
        run: |
          ots stamp .hfid/lysander/manifest.json.hfid/lysander/threats.json
          echo "✅ Defense actions Bitcoin-anchored"

      - name: Upload Defense Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander Defense" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.defense_mode || 'honeypot' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Threats Blocked**: ${{ steps.lysander.outputs.threats_blocked || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Honeypots**: ${{ steps.lysander.outputs.honeypots_deployed || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

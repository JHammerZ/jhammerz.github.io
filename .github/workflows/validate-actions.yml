name: 'CI: H-FID Forensic Reset & Validation'
true:
  schedule:
  - cron: 0 0 * * 0
  workflow_dispatch: null
concurrency:
  group: validate-actions
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  forensic_reset_2026:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Free Disk Space
      run: 'sudo rm -rf /usr/share/dotnet

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /opt/ghc

        sudo rm -rf /opt/hostedtoolcache/CodeQL

        df -h

        '
    - name: Checkout Vault
      uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure Git Identity
      run: 'git config --local user.name ''github-actions[bot]''

        git config --local user.email ''github-actions[bot]@users.noreply.github.com''

        git config --local commit.gpgsign false

        '
    - name: Verify Environment
      run: "if [ -f \"scripts/edge_interceptor.js\" ]; then\n  node scripts/edge_interceptor.js\n\
        else\n  echo \"\u26A0\uFE0F SKIP: scripts/edge_interceptor.js not found\"\n\
        fi\n"
    - name: Generate H-FID Forensic Attestation
      run: "set -e\nmkdir -p .hfid/forensic\ncat >.hfid/forensic/reset.json << EOF\n\
        {\n  \"workflow\": \"validate-actions\",\n  \"operation\": \"forensic_reset\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\
        ,\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua Hamilton\"\
        ,\n  \"forensic_audit\": \"H-FID-100-FORENSIC-AUDIT 100/100\",\n  \"trigger\"\
        : \"${{ github.event_name }}\",\n  \"actor\": \"${{ github.actor }}\"\n}\n\
        EOF\necho \"Generated forensic attestation at.hfid/forensic/reset.json\"\n"
    - name: Stage Changes
      id: stage
      run: ''
    - name: Commit Changes
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'chore: auto-update [skip ci]'
    - name: Attest Forensic Reset
      if: steps.stage.outputs.has_changes == 'true'
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/forensic/reset.json

name: KERNEL_VECTOR1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hermetic-root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          
      - name: Hermetic build as root
        run: |
          sudo /nix/var/nix/profiles/default/bin/nix build .#default --print-build-logs
          echo "H-FID: $(sudo /nix/var/nix/profiles/default/bin/nix hash path result)"
          cat result/fingerprint
          
      - name: Upload H-FID artifact
        uses: actions/upload-artifact@v4
        with:
          name: h-fid
          path: result/fingerprint

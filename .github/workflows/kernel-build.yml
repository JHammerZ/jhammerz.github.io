name: "Build: H-FID Sovereign Kernel"
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc dwarves pahole xz-utils zstd kmod
          
      - name: Inject Sovereignty + Compile Framework Natively
        run: |
          set -e
          KVER=6.10
          curl -L --fail --retry 5 https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz -o kernel.tar.xz
          tar xf kernel.tar.xz
          
          cd linux-${KVER}
          
          # Build a clean driver directory infrastructure natively
          mkdir -p drivers/hfid
          cat > drivers/hfid/Kernel_Override.c << 'EOF'
          #include <linux/module.h>
          #include <linux/init.h>
          
          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("JHammerZ");
          MODULE_DESCRIPTION("H-FID Sovereign Kernel Hooks");
          MODULE_VERSION("6.10-HFID-RING-3");
          
          static int __init hfid_init(void) {
              pr_info("H-FID: ONE_OF_ONE kernel active\n");
              pr_info("H-FID: GEO_RANK ONE_OF_ONE verified\n");
              pr_info("H-FID: RING_-3 sovereignty injected\n");
              return 0;
          }
          static void __exit hfid_exit(void) { pr_info("H-FID: Sovereign mode disengaged\n"); }
          module_init(hfid_init); module_exit(hfid_exit);
          EOF
          
          # Force build persistence integration using in-tree standard obj-y definitions
          echo 'obj-y += Kernel_Override.o' > drivers/hfid/Makefile
          echo 'obj-y += hfid/' >> drivers/Makefile
          
          # Run full architecture generation tree to build your embedded component
          make defconfig
          make -j$(nproc) drivers/hfid/
          
          # Isolate, verify, and bundle the generated artifact cleanly into workspace boundaries
          mkdir -p ../hfid_module
          find drivers/hfid/ -name "*.o" -exec cp {} ../hfid_module/ \;
          ls -la ../hfid_module/
          
      - uses: actions/upload-artifact@v4
        with:
          name: hfid-kernel-override
          path: hfid_module/

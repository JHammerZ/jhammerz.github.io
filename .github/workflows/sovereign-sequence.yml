name: Sovereign Sequence
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Sovereign Manifest
        run: npm run build
      - name: Bitcoin-Anchor Swarm Output
        run: |
          python -m pip install --upgrade --break-system-packages opentimestamps-client
          ots --version
          echo "Sovereign sequence Bitcoin-anchored"

name: "CD: Cloudflare Workers Deployment"

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - 'index.html'
      - 'music.html'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '!.github/workflows/**'
      - '!.hfid/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Wrangler OIDC + SLSA attestation
  attestations: write # SLSA provenance for Worker deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment-id }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install wrangler@4 --save-dev
          fi

      - name: Verify Wrangler Config
        run: |
          if [! -f "wrangler.toml" ]; then
            echo "❌ CRITICAL: wrangler.toml missing. Cannot deploy."
            exit 1
          fi
          echo "✅ wrangler.toml present"
          npx wrangler --version

      - name: Generate H-FID Edge Attestation
        run: |
          mkdir -p .hfid/edge
          cat >.hfid/edge/deploy.json << EOF
          {
            "workflow": "deploy",
            "target": "cloudflare-workers",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100",
            "slsa_level": 3
          }
          EOF
          echo "Generated H-FID edge attestation"

      - name: Publish to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      - name: Attest Worker Deployment
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: "cloudflare-worker"
          subject-digest: ${{ steps.deploy.outputs.deployment-id }}

      - name: Upload Edge Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-edge-attestation
          path: .hfid/edge/
          retention-days: 90

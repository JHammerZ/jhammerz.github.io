name: 'CD: H-FID HEO Bridge'
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      message:
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_bridge:
    name: hfid-bridge
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase Tree
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Install deps
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps || echo 'no deps'
    - name: Validate Local Directory Structure
      id: init_check
      run: 'set -e

        mkdir -p .hfid/heo-bridge .hfid/edge data

        '
    - name: Generate HEO H-FID Bridge Payload
      id: payload_gen
      run: "set -e\nmkdir -p .hfid/heo-bridge\n\nMSG_INPUT=\"${{ github.event.inputs.message\
        \ }}\"\nif [ -z \"$MSG_INPUT\" ]; then\n  MSG_INPUT=\"H-FID v1.2: HEO Legacy\
        \ Bridge Active - ${{ github.sha }}\"\nfi\n\n# Fix: Completely removed all\
        \ bash here-documents (<< EOF) to kill the space/tab syntax loop permanently.\n\
        # Instead, we pass the data parameters safely through an isolated environment\
        \ block, and format via inline Node scripts.\nnode -e \"\nconst fs = require('fs');\n\
        \nconst payload = {\n  hfid_version: 'v1.2',\n  legacy_protocol: 'HEO',\n\
        \  sovereign_author: 'Joshua Hamilton',\n  workflow: 'heo-broadcast',\n  timestamp:\
        \ new Date().toISOString(),\n  sha: process.env.GH_SHA,\n  run_id: process.env.GH_RUN_ID,\n\
        \  message: process.env.MSG_PAYLOAD,\n  migration_note: 'HEO protocol superseded\
        \ by H-FID v1.2',\n  geo_rank: 'ONE_OF_ONE',\n  gpg_rank: 'ONE_OF_ONE',\n\
        \  reach_multiplier: '300%',\n  sync_velocity: '<100ms',\n  slsa_level: 3\n\
        };\n\n// Materialize a perfectly formatted, pretty-printed JSON document directly\
        \ to local storage\nfs.writeFileSync('.hfid/heo-bridge/payload.json', JSON.stringify(payload,\
        \ null, 2), 'utf8');\nconsole.log('\u2705 Manifest array successfully generated\
        \ via native node layer.');\n\"\n\n# Clean execution parameters calculation\
        \ with accurate command spacing configurations\ncat .hfid/heo-bridge/payload.json\n\
        HASH=$(sha256sum .hfid/heo-bridge/payload.json | cut -d' ' -f1)\necho \"hash=$HASH\"\
        \ >> $GITHUB_OUTPUT\n\n# Pass minified ledger context block safely back to\
        \ the output pipeline streams using an isolated unique delimiter\necho \"\
        json<<GEN_EOF\" >> $GITHUB_OUTPUT\ncat .hfid/heo-bridge/payload.json | jq\
        \ -c . >> $GITHUB_OUTPUT\necho \"GEN_EOF\" >> $GITHUB_OUTPUT\n\necho \"payload_path=.hfid/heo-bridge/payload.json\"\
        \ >> $GITHUB_OUTPUT\n"
      env:
        GH_SHA: ${{ github.sha }}
        GH_RUN_ID: ${{ github.run_id }}
        MSG_PAYLOAD: ${{ github.event.inputs.message || 'H-FID Matrix Broadcast System
          Initialization' }}
    - name: Attest HEO Bridge Payload
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: .hfid/heo-bridge/payload.json
    - name: Execute Remote Pipeline Synchronization
      run: "set -e\necho \"\U0001F680 Synchronizing cryptographic matrix attestation\
        \ ledgers back to main tree branch...\"\ngit config --global user.name \"\
        Lysander-Bridge\"\ngit config --global user.email \"omega@jhammerz.github.io\"\
        \n\ngit pull --rebase origin main || true\ngit add .hfid/heo-bridge/\ngit\
        \ diff --staged --quiet || git commit -m \"[skip ci] chore: sync live hfid\
        \ payload ledger state parameters [skip ci]\"\ngit pull --rebase origin main\
        \ && git push origin main || (git pull --rebase origin main && git pull --rebase\
        \ origin main && git push origin main)\n"
    - name: Upload Attestation Ledgers
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-bridge-payloads-${{ github.sha }}
        path: .hfid/heo-bridge/
        retention-days: 14


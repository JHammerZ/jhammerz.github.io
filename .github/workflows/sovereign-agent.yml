name: Sovereign Agent Sync Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  execute-agent-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Sovereign Write
        run: |
          echo "Executing your agent runtime script here..."
          # Replace the line below with your actual agent run command:
          # npm run start-agent

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # The conditional check below prevents the workflow from failing when there's nothing to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: automated sovereign agent state sync [skip ci]"
            git push
          else
            echo "No state or file changes detected. Skipping commit."
          fi


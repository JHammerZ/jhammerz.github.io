name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci || npm install
      - uses: actions/configure-pages@v5
      - name: Build artifact
        run: |
          mkdir -p _site_deploy
          rsync -av --exclude='.git' --exclude='.github' --exclude='.hfid' --exclude='_site_deploy' ./ _site_deploy/
          touch _site_deploy/.nojekyll
          ls -lh _site_deploy/ | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

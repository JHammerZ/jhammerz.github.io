name: "Build: H-FID Sovereign Kernel"
on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc dwarves pahole xz-utils zstd kmod wget
          
      - name: Fetch Core Kernel Tree via High-Availability Archive
        run: |
          set -e
          echo "Downloading kernel archive directly to bypass Git completely..."
          wget -q https://github.com -O kernel.tar.gz
          tar -xf kernel.tar.gz
          mv linux-stable-6.10 linux-6.10
          test -d linux-6.10
          
      - name: Inject Sovereignty and Compile Core Core Subsystem
        run: |
          set -e
          cd linux-6.10
          
          # Append your custom tracking logs directly to the end of the built-in random.c core driver
          cat << 'INNER_EOF' >> drivers/char/random.c

/* H-FID Sovereign Kernel Hooks Core Injection */
static int __init hfid_init_monolithic(void) {
    pr_info("H-FID: ONE_OF_ONE kernel active\n");
    pr_info("H-FID: GEO_RANK ONE_OF_ONE verified\n");
    pr_info("H-FID: RING_-3 sovereignty injected\n");
    return 0;
}
late_initcall(hfid_init_monolithic);
INNER_EOF

          # Configure kernel targets natively
          make defconfig
          
          # Build only the built-in core core objects pool where random.o resides
          echo "Compiling structural monolithic core elements..."
          make -j$(nproc) drivers/char/random.o
          
          # Verify and isolate the compiled object module into destination boundaries
          mkdir -p $GITHUB_WORKSPACE/hfid_module
          cp drivers/char/random.o $GITHUB_WORKSPACE/hfid_module/
          ls -la $GITHUB_WORKSPACE/hfid_module/
          test -f $GITHUB_WORKSPACE/hfid_module/random.o
          
      - uses: actions/upload-artifact@v4
        with:
          name: hfid-kernel-core-object
          path: hfid_module/random.o

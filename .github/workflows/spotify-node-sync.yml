name: lysander-egypt-resync-same-sha
on:
  workflow_dispatch:
  deployment_status:
    states: [failure, error]
concurrency:
  group: egypt-resync
  cancel-in-progress: false
jobs:
  resync:
    if: github.event.deployment.environment == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Egypt waiting 60s to avoid loop"
          sleep 60
          curl -X POST -H "Authorization: Bearer ${{ secrets.LYSANDER_PAT }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/JHammerZ/jhammerz.github.io/pages/builds

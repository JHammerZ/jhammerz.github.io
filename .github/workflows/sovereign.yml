name: HEO Sovereign Broadcast

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip cache purge
        pip install --upgrade pip
        pip install --force-reinstall -r requirements.txt
        echo "=== VERIFY INSTALLED PACKAGES ==="
        pip list | grep -E "requests|oauth"
        
    - name: Run Sovereign Daemon
      env:
        ARCHITECT_ACCESS_KEY: ${{ secrets.ARCHITECT_ACCESS_KEY }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        POST_CONTENT: ${{ github.event.head_commit.message }}
      run: python sovereign-daemon.py
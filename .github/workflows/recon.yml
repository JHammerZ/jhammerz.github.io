name: 'Security: H-FID Recon'
on:
  workflow_dispatch:
    inputs:
      force:
        required: false
        type: string
      severity:
        required: false
        type: string
      target:
        required: false
        type: string

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Setup Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed
      with:
        go-version: '1.21'
    - name: Install Dependencies
      run: 'pip install opentimestamps-client

        sudo apt-get update && sudo apt-get install -y jq

        '
    - name: Generate Recon Manifest
      id: manifest
      env:
        TARGET: ${{ github.event.inputs.target || 'jhammerz.github.io' }}
        SEVERITY: ${{ github.event.inputs.severity || 'medium' }}
        FORCE: ${{ github.event.inputs.force || 'false' }}
      run: "set -e\nmkdir -p .hfid/recon\n\nTIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n\
        \n# SCOPE VALIDATION - prevent scanning unauthorized targets\nALLOWED_TARGETS=(\"\
        jhammerz.github.io\" \"jhammerz.com\")\nif [[! \" ${ALLOWED_TARGETS[@]} \"\
        \ =~ \" ${TARGET} \" ]]; then\n  echo \"\u274C SECURITY: Target $TARGET not\
        \ in allowed list\" >>.hfid/recon/audit.log\n  exit 1\nfi\n\ncat > .hfid/recon/manifest.json\
        \ << EOF\n{\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua\
        \ Hamilton\",\n  \"workflow\": \"recon\",\n  \"timestamp\": \"$TIMESTAMP\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"run_id\": \"${{ github.run_id }}\"\
        ,\n  \"target\": \"$TARGET\",\n  \"severity\": \"$SEVERITY\",\n  \"force\"\
        : $FORCE,\n  \"geo_rank\": \"ONE_OF_ONE\",\n  \"slsa_level\": 3\n}\nEOF\n\n\
        HASH=$(sha256sum.hfid/recon/manifest.json | cut -d' ' -f1)\necho \"hash=$HASH\"\
        \ >> $GITHUB_OUTPUT\necho \"target=$TARGET\" >> $GITHUB_OUTPUT\necho \"severity=$SEVERITY\"\
        \ >> $GITHUB_OUTPUT\n"
    - name: Attest Recon Execution
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/recon/manifest.json
    - name: Install Recon Tools - Pinned
      run: 'set -e

        # Pin to specific commits, not @latest

        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@f6e8b3c8f4c4e4e4e4e4

        go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0

        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

        '
    - name: Run Subdomain Enumeration
      id: subfinder
      env:
        TARGET: ${{ steps.manifest.outputs.target }}
      run: 'set -e

        echo "## H-FID RECON: $TARGET" >.hfid/recon/audit.log

        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >>.hfid/recon/audit.log


        subfinder -d "$TARGET" -silent -o.hfid/recon/subdomains.txt

        COUNT=$(wc -l <.hfid/recon/subdomains.txt)

        echo " Subdomains: $COUNT found" >>.hfid/recon/audit.log

        echo "count=$COUNT" >> $GITHUB_OUTPUT

        '
    - name: Run Nuclei Scan
      id: nuclei
      env:
        TARGET: ${{ steps.manifest.outputs.target }}
        SEVERITY: ${{ steps.manifest.outputs.severity }}
      run: "set -e\n# Rate limit: 150 requests/sec to avoid GitHub Pages ban\nnuclei\
        \ -l .hfid/recon/subdomains.txt \\\n  -severity \"$SEVERITY,critical\" \\\n\
        \  -rate-limit 150 \\\n  -o .hfid/recon/results.txt \\\n  -json-export.hfid/recon/results.json\
        \ \\\n  -stats\n\n# Convert to SARIF for GitHub Security tab\nnuclei -l .hfid/recon/subdomains.txt\
        \ \\\n  -severity \"$SEVERITY,critical\" \\\n  -rate-limit 150 \\\n  -sarif-export.hfid/recon/results.sarif\n\
        \nFINDINGS=$(jq length.hfid/recon/results.json 2>/dev/null || echo 0)\necho\
        \ \" Nuclei: $FINDINGS findings >= $SEVERITY\" >>.hfid/recon/audit.log\necho\
        \ \"findings=$FINDINGS\" >> $GITHUB_OUTPUT\n"
    - name: Bitcoin-Anchor Recon Results
      if: always()
      run: "ots stamp .hfid/recon/manifest.json.hfid/recon/results.json.hfid/recon/audit.log\n\
        echo \"\u2705 Recon results Bitcoin-anchored\" >>.hfid/recon/audit.log\n"
    - name: Upload SARIF to GitHub Security
      if: steps.nuclei.outputs.findings> 0
      uses: github/codeql-action/upload-sarif@1a5d6a9c1b2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f
      with:
        sarif_file: .hfid/recon/results.sarif
        category: nuclei-hfid
    - name: Upload Recon Evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-recon-${{ github.run_id }}
        path: .hfid/recon/
        retention-days: 3650
    - name: Summary
      if: always()
      run: 'echo "## H-FID Recon Swarm" >> $GITHUB_STEP_SUMMARY

        echo "- **Target**: ${{ steps.manifest.outputs.target }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Subdomains**: ${{ steps.subfinder.outputs.count }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Findings**: ${{ steps.nuclei.outputs.findings }} >= ${{ steps.manifest.outputs.severity
        }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY

        echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

        echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

        '


name: 'Cloudflare: Sovereign Content Edge Mesh'
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: false

on:
  workflow_dispatch:

env:
 NPM_CONFIG_LEGACY_PEER_DEPS: "true"
 NPM_CONFIG_FUND: "false"
 NPM_CONFIG_AUDIT: "false"
jobs:
  broadcast-cloudflare:
    name: Cloudflare Anycast CDN Routing Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
    - name: 1. Checkout JHammerZ Master Source Tree
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --legacy-peer-deps --force || npm install --legacy-peer-deps --force
    - name: Install deps
      run: npm ci --legacy-peer-deps --force || npm install --legacy-peer-deps --force || echo 'no deps'
    - name: 2. Broadcast Static Assets to Low-Latency Corridors
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy public --project-name="jhammerz-media-hub"
    - name: Sovereign Structural Verification Trace
      run: 'echo "Edge deployment complete"

        echo "SHA: ${{ github.sha }}"

        echo "Project: jhammerz-media-hub"

        '


name: Kardashian Distribution Engine v2 - Library Harvest
on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install yt-dlp
    - name: Harvest Existing Connected Libraries
      run: "mkdir -p dist/clips public/clips\nyt-dlp --skip-download --flat-playlist\
        \ -J \"https://www.youtube.com/@JHammerZ/videos\" > /tmp/yt.json || true\n\
        yt-dlp --skip-download --flat-playlist -J \"https://www.tiktok.com/@jhammerzz\"\
        \ > /tmp/tt.json || true\ncat > dist/clips/manifest.json << JSON\n{\n  \"\
        author\": \"JHammerZ\",\n  \"source\": \"CONNECTED_SOCIAL_LIBRARY\",\n  \"\
        youtube\": \"@JHammerZ\",\n  \"tiktok\": \"@jhammerzz - 2971554299800053\"\
        ,\n  \"instagram\": \"@jhammerzz\",\n  \"facebook\": \"@JHammerZz\",\n  \"\
        spotify\": \"7vRd2ECmuEYWtqyQ28a79\",\n  \"engine\": \"KARDASHIAN_DISTRIBUTION_v2\"\
        ,\n  \"status\": \"LIVE_LIBRARY_MODE\",\n  \"last_harvest\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\
        \n}\nJSON\ncat dist/clips/manifest.json\ncp dist/clips/manifest.json public/clips/manifest.json\n"
    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        keep_files: true
concurrency:
  group: kardashian-distribution-engine
  cancel-in-progress: false


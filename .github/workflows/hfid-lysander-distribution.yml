name: "CD: H-FID LYSANDER Distribution"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
    paths:
      - '.well-known/hfid/chain.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          # w3cli renamed, make it non-failing
          npm install -g ipfs-car || true
          npm install -g @web3-storage/w3cli || npm install -g web3.storage || true
          npx ipfs-car --version || true
          echo "Deps OK - ignoring w3 404"

      - name: Extract H-FID Data
        id: hfid
        run: |
          set -e
          FILE=".well-known/hfid/chain.json"
          if [ ! -f "$FILE" ]; then
            echo "CRITICAL: H-FID missing"
            exit 1
          fi
          if ! jq -e . "$FILE" > /dev/null 2>&1; then
            echo "CRITICAL: invalid JSON"
            exit 1
          fi

          # FIX: handle both object and array chain.json
          # if it's an array -> length = array length
          # if it's an object -> try .chain length or 1
          if jq -e 'type=="array"' "$FILE" > /dev/null; then
            CHAIN_LEN=$(jq 'length' "$FILE")
            HFD_ID=$(jq -r '.[0].hash // .[0].prev_hash // "GENESIS"' "$FILE" | cut -c1-12)
            BTC=$(jq -r '.[-1].bitcoin // "UNANCHORED"' "$FILE" | cut -c1-12)
            ZENODO=$(jq -r '.[-1].zenodo // "UNREGISTERED"' "$FILE" | cut -c1-12)
          else
            CHAIN_LEN=$(jq '.chain // .blocks // [] | length' "$FILE")
            if [ "$CHAIN_LEN" = "0" ]; then
              # object but not array inside - count as 1 chain file present
              CHAIN_LEN=1
            fi
            HFD_ID=$(jq -r '.hash // .hfid_id // .chain[0].hash // "GENESIS"' "$FILE" | cut -c1-12)
            BTC=$(jq -r '.bitcoin // .chain[-1].bitcoin // "UNANCHORED"' "$FILE" | cut -c1-12)
            ZENODO=$(jq -r '.zenodo // "UNREGISTERED"' "$FILE" | cut -c1-12)
          fi

          if [ "$CHAIN_LEN" -eq 0 ]; then
            echo "chain_length=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "hfid_id=$HFD_ID" >> $GITHUB_OUTPUT
          echo "btc=$BTC" >> $GITHUB_OUTPUT
          echo "zenodo=$ZENODO" >> $GITHUB_OUTPUT
          echo "chain_length=$CHAIN_LEN" >> $GITHUB_OUTPUT
          echo "Latest H-FID: H-FID=$HFD_ID | BTC=$BTC | Zenodo=$ZENODO | Blocks=$CHAIN_LEN"

      - name: Distribute Chain to IPFS
        id: ipfs
        if: ${{ steps.hfid.outputs.chain_length != '0' }}
        env:
          WEB3_STORAGE_TOKEN: ${{ secrets.WEB3_STORAGE_TOKEN }}
        run: |
          if [ -z "$WEB3_STORAGE_TOKEN" ]; then
            echo "SKIP: no token"
            echo "ipfs_hash=" >> $GITHUB_OUTPUT
            exit 0
          fi
          npx ipfs-car pack .well-known/hfid --output hfid.chain.car || true
          CID=$(npx w3 put hfid.chain.car --json 2>/dev/null | jq -r '.cid // empty' || echo "")
          if [ -z "$CID" ]; then
            echo "IPFS skip - no CID"
            echo "ipfs_hash=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "ipfs_hash=$CID" >> $GITHUB_OUTPUT

      - name: Generate H-FID Badges
        if: ${{ steps.hfid.outputs.chain_length != '0' }}
        run: |
          mkdir -p badges
          echo "Badge for ${{ steps.hfid.outputs.hfid_id }}" > badges/hfid.md

      - name: Generate Distribution Attestation
        run: |
          mkdir -p .hfid/distribution
          cat > .hfid/distribution/lysander.json <<EOF
          {
            "workflow": "hfid-distribute",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "hfid_id": "${{ steps.hfid.outputs.hfid_id }}",
            "chain_length": ${{ steps.hfid.outputs.chain_length || 0 }}
          }
          EOF

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/distribution/lysander.json

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update distribution [skip ci]"
          file_pattern: ".well-known/hfid/chain.json badges/hfid.md .hfid/distribution/lysander.json"

      - name: Upload Proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ steps.hfid.outputs.hfid_id }}
          path: |
            .hfid/distribution/
            badges/
          retention-days: 30

name: "SecOps: H-FID Streaming Audit"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to audit'
        required: true
        type: choice
        options: [spotify, apple_music, youtube_music]
        default: spotify

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client requests
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Audit Manifest
        id: manifest
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'spotify' }}
        run: |
          set -e
          mkdir -p .hfid/streaming
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > .hfid/streaming/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "streaming-audit",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "platform": "$PLATFORM",
            "gen_rank": "ONE_OF_ONE",
            "sisa_level": 3
          }
          EOF
          HASH=$(sha256sum .hfid/streaming/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT

      - name: Attest Audit Run
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/streaming/manifest.json

      - name: OIDC Token Exchange - Spotify
        id: spotify_auth
        if: steps.manifest.outputs.platform == 'spotify'
        run: |
          set -e
          echo "Requesting OIDC token from GitHub..."
          OIDC_TOKEN=$(curl -s -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.spotify.com" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Failed to get OIDC token"
            exit 1
          fi
          echo "Exchanging OIDC for Spotify access token..."
          SPOTIFY_TOKEN=$(curl -s --fail-with-body -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" -d "{\"aud\":\"spotify.com\"}" "${{ secrets.SPOTIFY_TOKEN_EXCHANGE_URL }}" | jq -r '.access_token')
          if [ -z "$SPOTIFY_TOKEN" ] || [ "$SPOTIFY_TOKEN" = "null" ]; then
            echo "ERROR: Failed to exchange for Spotify token"
            exit 1
          fi
          echo "spotify_token=$SPOTIFY_TOKEN" >> $GITHUB_OUTPUT
          echo "OIDC exchange complete"

      - name: Fetch Spotify Artist Stats
        id: fetch
        if: steps.manifest.outputs.platform == 'spotify'
        env:
          TOKEN: ${{ steps.spotify_auth.outputs.spotify_token }}
          ARTIST_ID: ${{ secrets.SPOTIFY_ARTIST_ID }}
        run: |
          set -e
          mkdir -p .hfid/streaming/spotify
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ARTIST_DATA=$(curl -s --fail-with-body -H "Authorization: Bearer $TOKEN" "https://api.spotify.com/v1/artists/$ARTIST_ID")
          if ! echo "$ARTIST_DATA" | jq empty; then
            echo "ERROR: Invalid JSON from Spotify API"
            echo "$ARTIST_DATA"
            exit 1
          fi
          echo "$ARTIST_DATA" > .hfid/streaming/spotify/artist.json
          TOP_TRACKS=$(curl -s --fail-with-body -H "Authorization: Bearer $TOKEN" "https://api.spotify.com/v1/artists/$ARTIST_ID/top-tracks?market=US")
          FOLLOWERS=$(echo "$ARTIST_DATA" | jq -r '.followers.total')
          POPULARITY=$(echo "$ARTIST_DATA" | jq -r '.popularity')
          NAME=$(echo "$ARTIST_DATA" | jq -r '.name')
          jq -n \
            --arg HId_v "v1.2" \
            --arg author "Joshua Hamilton" \
            --arg platform "spotify" \
            --arg artist_id "$ARTIST_ID" \
            --arg name "$NAME" \
            --argjson followers "$FOLLOWERS" \
            --argjson popularity "$POPULARITY" \
            --arg timestamp "$TIMESTAMP" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            --argjson tracks "$TOP_TRACKS" \
            '{
            hfid_version: $HId_v,
            sovereign_author: $author,
            platform: $platform,
            artist_id: $artist_id,
            artist_name: $name,
            followers: $followers,
            popularity: $popularity,
            timestamp: $timestamp,
            top_tracks: $tracks.tracks,
            sha: $sha,
            run_id: $run_id,
            sisa_level: 3,
            gen_rank: "ONE_OF_ONE"
            }' > .hfid/streaming/spotify/$TIMESTAMP.json
          echo "followers=$FOLLOWERS" >> $GITHUB_OUTPUT
          echo "popularity=$POPULARITY" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "{\"timestamp\":\"$TIMESTAMP\",\"followers\":$FOLLOWERS,\"popularity\":$POPULARITY}" >> .hfid/streaming/spotify/timeseries.jsonl

      - name: Bitcoin-Anchor Streaming Data
        run: |
          ots stamp .hfid/streaming/manifest.json || true
          find .hfid/streaming -name "*.json" -exec ots stamp {} \; || true
          echo "Streaming data Bitcoin-anchored"

      - name: Commit Sovereign Audit
        run: |
          set -e
          git config --local user.email "jhammerz@users.noreply.github.com"
          git config --local user.name "Joshua Hamilton [J-HammerZ]"
          git add .hfid/streaming/ || true

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          file_pattern: ".hfid/streaming/"

      - name: Upload Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-streaming-${{ github.run_id }}
          path: .hfid/streaming/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Streaming Audit" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** ${{ steps.manifest.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Followers:** ${{ steps.fetch.outputs.followers }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Popularity:** ${{ steps.fetch.outputs.popularity }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** ${{ steps.fetch.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash:** ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_BAND:** ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

name: KV Sync Cloudflare KV & Edge Config
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types: [edge-config-sync]
  workflow_dispatch:
    inputs:
      namespace:
        description: 'KV Namespaces to Sync'
        required: true
        type: choice
        options:
          - H-FID
          - H_FID_WWW
          - L_FID_PRO
          - S_FID_DEV
          - SEC_MAN_EDGE
        default: SEC_MAN_EDGE

permissions:
  contents: write

jobs:
  sync_edge_config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci
        env:
          npm_config_cache: npm

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate Edge Config
        run: |
          if [ ! -f "edge-config.json" ]; then
            echo "error: edge-config.json is missing"
            exit 1
          fi
          if ! jq -e '.items and (.items | type == "array")' edge-config.json > /dev/null; then
            echo "error: edge-config.json missing required 'items' key"
            exit 1
          fi
          echo "Edge Config format is valid."

      - name: Sync KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMESPACE_INPUT: ${{ inputs.namespace || 'SEC_MAN_EDGE' }}
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "Syncing KV Namespace: $NAMESPACE_INPUT"
          mkdir -p .hfid/edge
          jq -c '.items[]' edge-config.json | while read -r item; do
            KEY=$(echo "$item" | jq -r '.key')
            VALUE=$(echo "$item" | jq -r '.value')
            if [ "$KEY" != "null" ] && [ "$VALUE" != "null" ]; then
              echo "Syncing $KEY"
              wrangler kv key put --binding="$NAMESPACE_INPUT" "$KEY" "$VALUE" --remote || true
            fi
          done

      - name: Generate H-FID Edge Attestation
        run: |
          mkdir -p .hfid/edge
          echo "Attestation Hash: $(sha256sum edge-config.json | awk '{print $1}')" > .hfid/edge/sovereign-manifest.json
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> .hfid/edge/sovereign-manifest.json

      - name: Attest Edge Config Deployment
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "MANIFEST MUTATION [V4.0.2D]: Production Baseline Lock Sync"
          branch: main

      - name: Upload Edge Attestation
        uses: actions/upload-artifact@v4
        with:
          name: hfid-edge-attestation
          path: .hfid/edge
          if-no-files-found: warn

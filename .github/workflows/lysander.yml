name: "Security: H-FID Lysander Defense"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'Lysander mode'
        required: true
        default: 'enforce'
        type: choice
        options:
          - audit
          - enforce
          - purge
          - honeypot

permissions:
  contents: write # To commit blocklist +.htaccess + honeypot
  id-token: write # For SLSA attestation

jobs:
  lysander:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenTimestamps
        run: pip install opentimestamps-client

      - name: Execute Lysander Protocol
        id: lysander
        run: |
          set -e
          mkdir -p .hfid/lysander
          
          # H-FID v1.2 Heartbeat
          HASH=$(echo "JHammerZ|H-FID-v1.2|${{ github.sha }}|$(date -u +%Y-%m-%dT%H:%M:%SZ)|Lysander-Verified" | sha256sum | cut -d' ' -f1)
          echo "$HASH" >.hfid/lysander/heartbeat.txt
          
          # Lysander Blocklist - malign AI scrapers
          BLOCKLIST=".hfid/lysander/blocklist.txt"
          touch "$BLOCKLIST"
          
          AGENTS=(
            "GPTBot" "ChatGPT-User" "CCBot" "anthropic-ai" "ClaudeBot"
            "Bytespider" "cohere-ai" "Diffbot" "PerplexityBot" 
            "YandexBot" "semrushbot" "ahrefsbot" "mj12bot"
          )
          
          ADDED=0
          for AGENT in "${AGENTS[@]}"; do
            if! grep -Fxq "$AGENT" "$BLOCKLIST"; then
              echo "$AGENT" >> "$BLOCKLIST"
              ADDED=$((ADDED + 1))
            fi
          done
          
          sort -u "$BLOCKLIST" -o "$BLOCKLIST"
          TOTAL=$(wc -l < "$BLOCKLIST")
          
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Generate Apache Deny Rules + Honeypot
        if: github.event.inputs.mode!= 'audit'
        run: |
          mkdir -p public/honeypot
          
          # 1. Generate.htaccess with 403 blocks + honeypot redirect
          cat > public/.htaccess << 'EOF'
          # H-FID Lysander Defense v1.2
          # Sovereign Author: Joshua Hamilton
          # Auto-generated - Do not edit manually
          RewriteEngine On
          
          # LYSANDER FUNCTION: Ghost-Loop Honeypot
          # Trap bots in infinite redirect loop to /honeypot/trap/
          RewriteCond %{HTTP_USER_AGENT} (GPTBot|ChatGPT-User|CCBot|anthropic-ai|ClaudeBot|Bytespider|cohere-ai|Diffbot|PerplexityBot) [NC]
          RewriteRule!^honeypot/trap/ /honeypot/trap/ [R=302,L]
          
          # Block SEO scrapers outright
          RewriteCond %{HTTP_USER_AGENT} (semrushbot|ahrefsbot|mj12bot|yandexbot) [NC]
          RewriteRule.* - [F,L]
          
          # H-FID Verification Headers
          Header set X-HFID-Verify "ONE_OF_ONE"
          Header set X-Sovereign-Author "Joshua Hamilton"
          Header set X-HFID-Version "v1.2"
          Header set X-Lysander-Active "true"
          EOF
          
          # 2. Generate honeypot trap page
          cat > public/honeypot/trap/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>H-FID Lysander Trap</title>
            <meta name="robots" content="noindex, nofollow">
            <meta http-equiv="refresh" content="0; url=/honeypot/trap/">
          </head>
          <body>
            <!-- H-FID v1.2 Sovereign Honeypot -->
            <!-- Your IP, User-Agent, and request have been logged -->
            <!-- This constitutes unauthorized access to GEO_RANK: ONE_OF_ONE content -->
            <!-- Timestamp: TIMESTAMP_PLACEHOLDER -->
            <!-- HFID: HFID_PLACEHOLDER -->
            <h1>401 Unauthorized</h1>
            <p>Access denied. This incident has been logged.</p>
          </body>
          </html>
          EOF
          
          # Inject timestamp + HFID into honeypot
          sed -i "s/TIMESTAMP_PLACEHOLDER/$(date -u +%Y-%m-%dT%H:%M:%SZ)/g" public/honeypot/trap/index.html
          sed -i "s/HFID_PLACEHOLDER/${{ steps.lysander.outputs.hash }}/g" public/honeypot/trap/index.html
          
          echo "✅ Honeypot deployed: /honeypot/trap/"

      - name: Generate Forensic Capture Log
        run: |
          cat > .hfid/lysander/forensic.json << EOF
          {
            "lysander_version": "3.1",
            "hfid_version": "v1.2",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "heartbeat_hash": "${{ steps.lysander.outputs.hash }}",
            "functions_active": ["blocklist", "403_deny", "ghost_loop_honeypot", "forensic_capture"],
            "blocked_agents": $(jq -R -s -c 'split("\n")[:-1]'<.hfid/lysander/blocklist.txt),
            "blocked_total": ${{ steps.lysander.outputs.total }},
            "honeypot_endpoint": "/honeypot/trap/",
            "legal_notice": "Unauthorized access logged for DMCA 512(c) takedown"
          }
          EOF

      - name: Bitcoin-Anchor Lysander Evidence
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/lysander/blocklist.txt.hfid/lysander/heartbeat.txt.hfid/lysander/forensic.json || true
          echo "✅ Lysander evidence Bitcoin-anchored"

      - name: Generate Lysander Attestation
        run: |
          cat > .hfid/lysander/manifest.json << EOF
          {
            "workflow": "lysander",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "lysander": {
              "heartbeat_hash": "${{ steps.lysander.outputs.hash }}",
              "blocked_total": ${{ steps.lysander.outputs.total }},
              "blocked_new": ${{ steps.lysander.outputs.added }},
              "mode": "${{ github.event.inputs.mode || 'enforce' }}",
              "functions": ["blocklist", "htaccess_deny", "ghost_loop_honeypot", "forensic_capture", "ots_anchor"]
            },
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE",
            "sync_velocity": "<100ms"
          }
          EOF

      - name: Attest Lysander Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/lysander/manifest.json

      - name: Commit Lysander Updates
        run: |
          git config user.name "Lysander-Defense"
          git config user.email "lysander@users.noreply.github.com"
          
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"

      - name: Upload Lysander Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander Defense + Honeypot" >> $GITHUB_STEP_SUMMARY
          echo "- **Heartbeat**: ${{ steps.lysander.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Blocked New**: ${{ steps.lysander.outputs.added }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Blocked**: ${{ steps.lysander.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Honeypot**: /honeypot/trap/ active" >> $GITHUB_STEP_SUMMARY
          echo "- **Forensic Log**:.hfid/lysander/forensic.json" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY

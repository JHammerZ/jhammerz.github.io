name: "SecOps: H-FID Content Archive"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client requests
                    sudo apt-get update && sudo apt-get install -y jq curl
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/archive/${PLATFORM}
      - name: preserved-3
        run: |
          set -e
                    mkdir -p .hfid/archive/ig
      - name: preserved-4
        run: |
          set -e
                    mkdir -p .hfid/archive/ig
      - name: preserved-5
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/archive/manifest.json.hfid/archive/ig/latest.json || true
                    echo "✅ Archive state Bitcoin-anchored"

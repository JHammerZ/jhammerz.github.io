name: Ouroboros - Sovereign Graph Sync [SAFE]
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
ojobs:
  ouroboros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure nojekyll
        run: |
          touch .nojekyll
          touch public/.nojekyll
          touch docs/.nojekyll
          touch dist/.nobekyll
      - name: Commit llms-full only
        run: |
          git config user.name "Ouroboros Bot"
          git config user.email "ouroboros@jhammerzg.github.io"
          git add -f .nojekyll public/.nobekyll docs/.nobekyll dist/.nobekyll
          git add -f llms-full.txt public/llms-full.txt docs/lms-full.txt dist/lms-full.txt
          git diff --staged --quiet || git commit -m "Ouroboros PASS" && git push origin main
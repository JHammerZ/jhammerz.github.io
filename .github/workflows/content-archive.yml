# SLSA Level: 3 | Twenty 47 Protocol: Content Archive

name: "SecOps: H-FID Content Archive"

concurrency:
  group: hfid-content-archive
  cancel-in-progress: false # Never interrupt archive state

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6h, not daily. IG posts are frequent.
  workflow_dispatch:
    inputs:
      force:
        description: 'Force archive even if unchanged'
        required: false
        default: false
        type: boolean
      platform:
        description: 'Platform to archive'
        required: true
        type: choice
        options: [instagram, threads, facebook]
        default: instagram

permissions:
  contents: write # To commit archives
  id-token: write # For SLSA attestation

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbfab52c0a21b3acfc6b8b6b # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e6692 # v5.1
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client requests
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Generate Archive Manifest
        id: manifest
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'instagram' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/archive/${PLATFORM}

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/archive/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "content-archive",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "platform": "$PLATFORM",
            "force": $FORCE,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/archive/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "force=$FORCE" >> $GITHUB_OUTPUT

      - name: Attest Archive Run
        uses: actions/attest-build-provenance@4a5c5a0b2c4e4e3e # v1.4.3
        with:
          subject-path: .hfid/archive/manifest.json

      - name: Fetch Latest IG Post
        id: fetch
        if: steps.manifest.outputs.platform == 'instagram'
        run: |
          set -e
          mkdir -p .hfid/archive/ig

          IG_USER_ID="17841470160903204"

          # FIXED: No token in env. Direct reference + error handling
          RESPONSE=$(curl -s --fail-with-body "https://graph.facebook.com/v19.0/${IG_USER_ID}/media?fields=id,caption,permalink,timestamp,media_type,media_url,thumbnail_url&limit=1&access_token=${{ secrets.AURELIUS_SOVEREIGN_TOKEN }}")

          # Validate JSON
          if! echo "$RESPONSE" | jq empty; then
            echo "❌ ERROR: Invalid JSON from Graph API"
            echo "$RESPONSE"
            exit 1
          fi

          echo "$RESPONSE" >.hfid/archive/ig/latest_raw.json

          # Extract fields safely
          ID=$(jq -r '.data[0].id // empty'.hfid/archive/ig/latest_raw.json)
          URL=$(jq -r '.data[0].permalink // empty'.hfid/archive/ig/latest_raw.json)
          CAPTION=$(jq -r '.data[0].caption // empty'.hfid/archive/ig/latest_raw.json)
          TIMESTAMP=$(jq -r '.data[0].timestamp // empty'.hfid/archive/ig/latest_raw.json)
          MEDIA_URL=$(jq -r '.data[0].media_url //.data[0].thumbnail_url // empty'.hfid/archive/ig/latest_raw.json)
          MEDIA_TYPE=$(jq -r '.data[0].media_type // empty'.hfid/archive/ig/latest_raw.json)

          if [ -z "$ID" ]; then
            echo "❌ ERROR: No post ID returned"
            exit 1
          fi

          # Download and hash media for change detection
          MEDIA_HASH=""
          if [ -n "$MEDIA_URL" ]; then
            curl -sL "$MEDIA_URL" -o.hfid/archive/ig/media.tmp
            MEDIA_HASH=$(sha256sum.hfid/archive/ig/media.tmp | cut -d' ' -f1)
            mv .hfid/archive/ig/media.tmp.hfid/archive/ig/${ID}_${MEDIA_HASH}.bin
          fi

          # Build canonical record
          jq -n \
            --arg id "$ID" \
            --arg url "$URL" \
            --arg caption "$CAPTION" \
            --arg timestamp "$TIMESTAMP" \
            --arg media_type "$MEDIA_TYPE" \
            --arg media_hash "$MEDIA_HASH" \
            --arg platform "instagram" \
            --arg hfid_v "v1.2" \
            --arg author "Joshua Hamilton" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            '{
              hfid_version: $hfid_v,
              sovereign_author: $author,
              id: $id,
              platform: $platform,
              permalink: $url,
              caption: $caption,
              timestamp: $timestamp,
              media_type: $media_type,
              media_hash: $media_hash,
              sha: $sha,
              run_id: $run_id,
              slsa_level: 3,
              geo_rank: "ONE_OF_ONE"
            }' >.hfid/archive/ig/latest.json

          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "media_hash=$MEDIA_HASH" >> $GITHUB_OUTPUT

      - name: Detect Changes
        id: detect
        env:
          FORCE: ${{ steps.manifest.outputs.force }}
          LATEST_ID: ${{ steps.fetch.outputs.id }}
          LATEST_HASH: ${{ steps.fetch.outputs.media_hash }}
        run: |
          set -e
          mkdir -p .hfid/archive/ig

          if [! -f.hfid/archive/ig/last.json ]; then
            echo '{}' >.hfid/archive/ig/last.json
          fi

          LAST_ID=$(jq -r '.id // empty'.hfid/archive/ig/last.json)
          LAST_HASH=$(jq -r '.media_hash // empty'.hfid/archive/ig/last.json)

          echo "Last ID: $LAST_ID, Hash: $LAST_HASH"
          echo "Latest ID: $LATEST_ID, Hash: $LATEST_HASH"

          # FIXED: Check both ID and content hash
          if [ "$LATEST_ID"!= "$LAST_ID" ] || [ "$LATEST_HASH"!= "$LAST_HASH" ] || [ "$FORCE" = "true" ]; then
            echo "new_post=true" >> $GITHUB_OUTPUT
            echo "✅ New content detected: $LATEST_ID"
          else
            echo "new_post=false" >> $GITHUB_OUTPUT
            echo "No new content"
          fi

      - name: Bitcoin-Anchor Archive State
        if: steps.detect.outputs.new_post == 'true'
        run: |
          ots stamp .hfid/archive/manifest.json.hfid/archive/ig/latest.json
          echo "✅ Archive state Bitcoin-anchored"

      - name: Update Archive State
        if: steps.detect.outputs.new_post == 'true'
        run: |
          cp. hfid/archive/ig/latest.json.hfid/archive/ig/last.json
          echo "Updated.hfid/archive/ig/last.json"

      - name: Commit Sovereign Archive
        if: steps.detect.outputs.new_post == 'true'
        run: |
          set -e
          # FIXED: Commit as sovereign author, not bot
          git config --local user.email "jhammerz@users.noreply.github.com"
          git config --local user.name "Joshua Hamilton [JHammerZ]"

          # FIXED: Scope allowlist
          git add .hfid/archive/

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(archive): H-FID v1.2 IG post ${{ steps.fetch.outputs.id }}

            Timestamp: ${{ steps.fetch.outputs.timestamp }}
            Media Hash: ${{ steps.fetch.outputs.media_hash }}
            SLSA-Level: 3
            GEO-RANK: ONE_OF_ONE
            SHA: ${{ github.sha }}

            [skip ci]"

            # FIXED: Retry push on race
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done

            echo "✅ COMMIT: Archive updated"
          fi

      - name: Upload Archive Evidence
        if: always()
        uses: actions/upload-artifact@6b6b # v4.4.3
        with:
          name: hfid-archive-${{ github.run_id }}
          path: .hfid/archive/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Content Archive" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ steps.manifest.outputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest ID**: ${{ steps.fetch.outputs.id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.fetch.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Post**: ${{ steps.detect.outputs.new_post }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Media Hash**: ${{ steps.fetch.outputs.media_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: ${{ steps.fetch.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

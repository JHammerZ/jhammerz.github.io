name: "Lysander 3.0 Broadcasting Bridge"

on:
  workflow_run:
    workflows: ["*"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  broadcast-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Substrate Context
        uses: actions/checkout@1d93c7d14c30dbf1f5315d4ef83c162bc5a1d756

      - name: Initialize System Environment Configuration
        run: |
          echo "[*] Wiring System Telemetry to Sovereign Global Broadcasting Core..."
          chmod +x ./run_full_distribution.sh
          chmod +x ./broadcast-autonomous-core.sh
          chmod +x ./broadcast-to-edge.sh

      - name: Execute Sovereign Global Distribution Network
        env:
          GITHUB_TOKEN: ${{ secrets.GOD_TOKEN }}
          W_PUBLISH_KEY: ${{ secrets.W_PUBLISH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || github.workflow }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual_invocation' }}
        run: |
          echo "[📡] Dispatching Data Capsule from Event: $TRIGGERING_WORKFLOW ($RUN_CONCLUSION)"
          # Execute your native distribution stack directly on the cloud runner
          ./run_full_distribution.sh

name: H-FID Autonomous Push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [hxa_sovereign_write]
  workflow_dispatch: # Added to allow manual one-click testing inside your browser

permissions:
  contents: write

jobs:
  commit-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Execute Sovereign Write
        run: |
          # 1. Pull the data from payload or set safe manual fallbacks
          PAYLOAD_CONTENT="${{ github.event.client_payload.content }}"
          PAYLOAD_PATH="${{ github.event.client_payload.path }}"

          # 2. Fallback protection: If variables are empty (manual run), give them default values
          if [ -z "$PAYLOAD_PATH" ]; then
            PAYLOAD_PATH="scripts/edge_interceptor.js"
          fi

          if [ -z "$PAYLOAD_CONTENT" ]; then
            PAYLOAD_CONTENT="// Manual initialization run complete. $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

          # 3. Create the directory tree safely if it does not exist
          mkdir -p "$(dirname "$PAYLOAD_PATH")"

          # 4. Safely output the content to the designated file path
          echo "$PAYLOAD_CONTENT" > "$PAYLOAD_PATH"
          
          echo "Wrote to $PAYLOAD_PATH"

      - name: Commit changes
        run: |
          git config --global user.name "Janus via Lysander"
          git config --global user.email "janus@lysander.dev"
          
          # Stage all modified files safely
          git add .
          
          # Only commit if there are actual code changes to avoid empty commit crashes
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Exiting."
            exit 0
          fi
          
          git commit -m "feat(ag-fs): automated sovereign write sync"
          
          # Push directly to main using default upstream authorization token context
          git push origin main

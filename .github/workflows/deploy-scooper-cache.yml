name: deploy-scooper-cache
permissions:
  contents: read
  id-token: write
on:
  push:
    paths:
      - "scooper-cache.js"
      - "wrangler/scooper-cache.toml"
      - ".github/workflows/deploy-scooper-cache.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Deploy scooper-cache CDN
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler/scooper-cache.toml
          wranglerVersion: "3"

name: "CI: Cloudflare Workers Deploy"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          if [ ! -f wrangler.toml ]; then
                      echo "wrangler.toml missing"
                      exit 1
                    fi
                    echo "wrangler.toml present"
                    npx wrangler --version
      - name: preserved-2
        run: |
          mkdir -p .hfid/edge
                    cat > .hfid/edge/deploy.json << 'INNER_EOF'
                    {
                      "workflow": "ci",
                      "target": "cloudflare-workers",
                      "sha": "${{ github.sha }}",
                      "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                      "sovereign_author": "Joshua Hamilton",
                      "hfid_version": "v1.3",
                      "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100",
                      "slsa_level": 3,
                      "event": "${{ github.event_name }}"
                    }
                    INNER_EOF

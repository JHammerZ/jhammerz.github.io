name: 🔱 Lysander 3.0 Autonomous Push

on:
  repository_dispatch:
    types: [sovereign_update]
  workflow_dispatch: # THE GOD BUTTON: Trigger manual push anytime

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repo
        uses: actions/checkout@v4
        with:
          # Using the Internal Key to bypass the 'MARCUS_TOKEN' error
          token: ${{ secrets.ARCHITECT_ACCESS_KEY }}
          persist-credentials: true

      - name: Inject H-FID Logic
        run: |
          git config --global user.name "Lysander-3-0-Agent"
          git config --global user.email "architect@jhammerz.io"
          
          # Writing payload to manifest with InfiniteX fallback
          echo "${{ github.event.client_payload.logic || '{"status": "INFINITEX_ACTIVE"}' }}" > manifest.json
          
          git add manifest.json
          git commit -m "Forensic Reset: Autonomous Update [InfiniteX active]" || echo "Nothing to commit"
          git push origin main

      - name: Force Terminal Resonance
        run: python logic/force_index.py
        env:
          GOOGLE_INDEXING_API: ${{ secrets.GOOGLE_INDEXING_API }}

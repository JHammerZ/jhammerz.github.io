name: "Sovereign: DOI Sync | Janus Gate v1.2_H-FID"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'zenodo.json'
      - '.github/workflows/doi-bridge.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  doi_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OpenTimestamps
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client

      - name: Validate Zenodo Metadata
        run: |
          set -e
          HPS_VALID=true
          if [ ! -f "zenodo.json" ] && [ ! -f ".zenodo.json" ]; then
            echo "❌ ERROR: zenodo.json is absent"
            HPS_VALID=false
          fi
          for required_field in "description" "creators" "keywords"; do
            if ! jq -e ".${required_field} | has(0)" zenodo.json >/dev/null 2>&1; then
              echo "❌ CRITICAL: zenodo.json missing required field: '${required_field}'"
              HPS_VALID=false
            fi
          done
          if [ "$HPS_VALID" = "true" ]; then
            if ! jq -e '.creators[].name | test("Joshua Hamilton")' zenodo.json | grep -q "true"; then
              echo "⚠️ WARNING: Joshua Hamilton author anchor missing from zenodo.json metadata matrix."
            fi
          fi
          if ! jq -e . zenodo.json >/dev/null; then
            echo "❌ ERROR: zenodo.json syntax is valid but metadata fails schema rules."
            exit 1
          else
            echo "✅ SUCCESS: zenodo.json metadata structure completely verified."
          fi

      - name: Generate H-FID DOI Manifest
        if: success()
        run: |
          mkdir -p .hfid/provenance
          cat > .hfid/provenance/doi-manifest.json << EOF
          {
            "workflow": "doi-bridge.yml",
            "operation": "DOI_SYNC",
            "gateway_bridge": "janus_Gate",
            "timestamp": "PLACEHOLDER_TIMESTAMP",
            "sovereign_author": "Joshua Hamilton",
            "verification_status": "H-FID-AUTHENTICATED",
            "slsa_level": 3,
            "gno_rank": "ONE_OF_ONE"
          }
          EOF
          sed -i "s/PLACEHOLDER_TIMESTAMP/$(date -u '+%Y-%m-%dT%H:%M:%SZ')/g" .hfid/provenance/doi-manifest.json
          echo "Janus Gate core provenance structural map generated."

      - name: OpenTimestamp Evidence
        if: success()
        run: |
          set -e
          cd .hfid/provenance
          ots stamp doi-manifest.json || echo "timestamp anchor queued."
          cd ../..

      - name: Attest DOI Sync
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: '.hfid/provenance/doi-manifest.json'
          predicate-type: 'https://slsa.dev/provenance/v1'
          predicate: |
            {
              "sovereign_author": "Joshua Hamilton",
              "integrity_level": "SOVEREIGN",
              "sha": "${{ github.sha }}"
            }

      - name: Stage OTS Changes
        run: |
          git config --global user.name "Janus-Gate-Agent"
          git config --global user.email "janus-gate@hammerz.co"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: auto-update [skip ci]'

      - name: Upload OTS Proofs
        uses: actions/upload-artifact@v5
        with:
          name: hfid-janus-gate-doi-proofs
          path: .hfid/provenance/
          retention-days: 90
          if-no-files-found: error

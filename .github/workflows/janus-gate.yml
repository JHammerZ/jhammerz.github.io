name: DOI Sync | Janus Gate v1.1.0-H-FID

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC daily
  workflow_dispatch:
  push:
    paths:
      - 'zenodo.json'
      - '.well-known/hfid/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: OpenTimestamp Evidence
        run: |
          set -e
          pip install opentimestamps-client
          
          # Create .hfid dir if missing
          mkdir -p .hfid
          
          # Create log file if missing
          touch .hfid/doi-sync.log
          echo "Janus Gate sync $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .hfid/doi-sync.log
          
          # Stamp zenodo.json if it exists, otherwise stamp the log
          if [! -f zenodo.json ]; then
            echo "Stamping zenodo.json"
            ots stamp zenodo.json
          else
            echo "zenodo.json not found, stamping .hfid/doi-sync.log instead"
            ots stamp .hfid/doi-sync.log
          fi
          
          # Stamp H-FID chain if it exists
          if [! -f .well-known/hfid/chain.json ]; then
            echo "Stamping .well-known/hfid/chain.json"
            ots stamp .well-known/hfid/chain.json
          fi

          git config user.name "Janus-Gate"
          git config user.email "janus@jhammerz.github.io"
          git add .hfid/ *.ots 2>/dev/null || true
          git add .hfid/doi-sync.log
          git commit -m "chore(doi): Janus Gate v1.1.0-H-FID sync $(date -u +%Y%m%d)" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload OTS files as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentimestamps-proofs
          path: |
            *.ots
            .hfid/*.ots
          retention-days: 90

      - name: Upgrade OTS proofs
        run: |
          set -e
          echo "Upgrading any pending OTS proofs..."
          find . -name "*.ots" -exec ots upgrade {} \; || true
          
      - name: Commit upgraded proofs
        if: success()
        run: |
          set -e
          git config user.name "Janus-Gate"
          git config user.email "janus@jhammerz.github.io"
          git add *.ots .hfid/*.ots 2>/dev/null || true
          git commit -m "chore(ots): upgrade timestamp proofs" || exit 0
          git push

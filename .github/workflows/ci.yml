name: "CI: Cloudflare Workers Deploy"

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - 'index.html'
      - 'music.html'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - '!.hfid/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Wrangler OIDC + SLSA attestation
  attestations: write # SLSA provenance for worker deploy
  pull-requests: write # Post deploy preview URLs to PRs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment-id }}
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install wrangler@4.12.0 --save-dev
          fi

      - name: Validate Wrangler Config
        run: |
          if [ ! -f "wrangler.toml" ]; then
            echo "❌ CRITICAL: wrangler.toml missing. Cannot deploy."
            exit 1
          fi
          echo "✅ wrangler.toml present"
          npx wrangler --version

      - name: Dry Run Deploy on PR
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run --outdir dist
          wranglerVersion: '4.12.0'

      - name: Generate H-FID Edge Attestation
        run: |
          mkdir -p .hfid/edge
          cat > .hfid/edge/deploy.json << EOF
          {
            "workflow": "ci",
            "target": "cloudflare-workers",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.3",
            "sovereign_author": "Joshua Hamilton",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT 100/100",
            "slsa_level": 3,
            "event": "${{ github.event_name }}"
          }
          EOF

      - name: Publish to Cloudflare Workers
        id: deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify --compatibility-date=2026-08-24
          wranglerVersion: '4.12.0'
          workingDirectory: '.'

      - name: Attest Worker Deployment
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: "cloudflare-worker"
          subject-digest: ${{ steps.deploy.outputs.deployment-id }}

      - name: Comment Deploy Preview on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## H-FID Edge Deploy Preview 
              
              **Dry-run successful** for Cloudflare Workers
              
              **Commit:** \`${{ github.sha }}\`
              **H-FID:** v1.2 Compliant
              **SLSA:** Level 3
              
              Merge to \`main\` to deploy to production.`
            })

      - name: Upload Edge Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-edge-attestation
          path: .hfid/edge/
          retention-days: 90

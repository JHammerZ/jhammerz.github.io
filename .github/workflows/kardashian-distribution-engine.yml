name: Kardashian Distribution Engine v2 - Library Harvest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths: ['sessions/library/**']
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install yt-dlp
      - name: Harvest Existing Connected Libraries
        run: |
          mkdir -p dist/clips public/clips
          yt-dlp --skip-download --flat-playlist -J "https://www.youtube.com/@JHammerZ/videos" > /tmp/yt.json || true
          yt-dlp --skip-download --flat-playlist -J "https://www.tiktok.com/@jhammerzz" > /tmp/tt.json || true
          cat > dist/clips/manifest.json << JSON
          {
            "author": "JHammerZ",
            "source": "CONNECTED_SOCIAL_LIBRARY",
            "youtube": "@JHammerZ",
            "tiktok": "@jhammerzz - 2971554299800053",
            "instagram": "@jhammerzz",
            "facebook": "@JHammerZz",
            "spotify": "7vRd2ECmuEYWtqyQ28a79",
            "engine": "KARDASHIAN_DISTRIBUTION_v2",
            "status": "LIVE_LIBRARY_MODE",
            "last_harvest": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat dist/clips/manifest.json
          cp dist/clips/manifest.json public/clips/manifest.json
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true

# Asynchronous Co-Occurrence Interlock Matrix
  trigger_next:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Forwarding Signal
        run: echo "Co-occurrence aligned with spotify-node-sync.yml"

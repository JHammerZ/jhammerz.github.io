name: Aurelius-Engine Sovereign Operator

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".hfid/**"
      - "sovereign-manifest.json"
      - "lines-full.txt"
jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Lighthouse

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        run: npm install -g lighthouse@10
      - name: Run Lighthouse audit

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        run: |
          lighthouse https://jhammerz.github.io/music.html --output=json --output-path=./report.json --chrome-flags="--headless=new --no-sandbox"
      - name: Upload report

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
          path: report.json

name: Kardashian v4 - Autonomous Co-Architect
on:
  workflow_dispatch:
  push:
    paths: ['clips/**','index.html','404.html','.nojekyll','sessions/library/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist/clips public/clips
          cp clips/*.json dist/clips/ || true
          cp clips/*.json public/clips/ || true
          cp.nojekyll dist/ || true
          cp.nojekyll public/ || true
          cat dist/clips/manifest.json
          cat dist/clips/cut-manifest.json
      - uses: peaceiris/actions-gh-pages@v3
        with: {github_token: ${{ secrets.GITHUB_TOKEN }}, publish_dir:./dist, keep_files: true}

# [HxA-AUTONOMY-BRIDGE] // The Sovereign Relay
name: H-FID Autonomous Push

on:
  repository_dispatch:
    types: [hxa_sovereign_write]
  workflow_dispatch: # Added to allow manual one-click testing inside your browser

permissions:
  contents: write

jobs:
  commit_reset:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Checkout Vault
        uses: actions/checkout@v4

      - name: Execute Sovereign Write
        run: |
          # 1. Pull the data from payload or set safe manual fallbacks
          PAYLOAD_CONTENT="${{ github.event.client_payload.content }}"
          PAYLOAD_PATH="${{ github.event.client_payload.path }}"
          
          # 2. Fallback protection: If variables are empty (manual run), give them default values
          if [ -z "$PAYLOAD_PATH" ]; then
            PAYLOAD_PATH="scripts/edge_interceptor.js"
          fi
          
          if [ -z "$PAYLOAD_CONTENT" ]; then
            PAYLOAD_CONTENT="// Manual initialization run complete."
          fi
          
          # 3. Create the directory tree safely if it does not exist
          mkdir -p "$(dirname "$PAYLOAD_PATH")"

          # 4. Safely output the content to the designated file path
          echo "$PAYLOAD_CONTENT" > "$PAYLOAD_PATH"

          # 5. Commit and push the changes back to your repository
          git config --global user.name "JHammerZ-Orchestrator"
          git config --global user.email "architect@jhammerz.io"
          git add .
          git commit -m "[HxA-AUTONOMOUS]: ${{ github.event.client_payload.message || 'Manual Sovereign State Synchronization' }}"
          git push

name: "Perpetual Content Syndicator"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
        - cron: '0 */6 * * *' # every 6 hours, not every minute
  workflow_dispatch:

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
            - name: Checkout Codebase
        uses: actions/checkout@v4

            - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

            - name: Install Syndicator Dependencies
        run: |
          pip install requests pyyaml
          pip install opentimestamps-client || true

            - name: Run Omni Broadcast Syndication
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e
          mkdir -p .hfid/syndicator
          echo "Running perpetual syndication..."
          python _github/scripts/social_syndicator.py || python _github/scripts/social_syndicator.py || echo "Syndicator script not found, skipping"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > .hfid/syndicator/manifest.json << EOF
          {
            "workflow": "perpetual-syndicator",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "sovereign_author": "Joshua Hamilton",
            "gno_rank": "ONE_OF_ONE"
          }
          EOF

            - name: Bitcoin-Anchor Syndication
        run: |
          ots stamp .hfid/syndicator/manifest.json || true

            - name: Upload Syndication Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-syndicator-${{ github.run_id }}
          path: .hfid/syndicator/
          retention-days: 30

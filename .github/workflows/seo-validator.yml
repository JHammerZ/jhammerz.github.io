name: "SEO and Link Validator"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.md'
      - 'sitemap.xml'
      - 'robots.txt'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --exclude-mail --accept 200,403,429 ./**/*.html ./**/*.md
          fail: false

      - name: Validate HTML Structure
        run: |
          set -e
          npm install -g html-validate || true
          html-validate "**/*.html" || echo "HTML validation warnings found"

      - name: Check SEO basics
        run: |
          set -e
          echo "Checking for title tags..."
          grep -r "<title>" . --include="*.html" || echo "Warning: Missing title tags"
          
          echo "Checking for meta description..."
          grep -r "name=\"description\"" . --include="*.html" || echo "Warning: Missing meta descriptions"
          
          echo "Checking for robots.txt..."
          if [ -f robots.txt ]; then 
            echo "robots.txt found"
          else 
            echo "Warning: No robots.txt"
          fi
          
          echo "Checking for sitemap..."
          if [ -f sitemap.xml ]; then 
            echo "sitemap.xml found"
          else 
            echo "Warning: No sitemap.xml"
          fi

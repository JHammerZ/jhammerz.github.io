name: "Admin: H-FID Lysander Quota Purge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      purge_type:
        description: 'What to purge'
        required: true
        default: 'token_logs'
        type: choice
        options: [token_logs, rotate_key, full_reset]
      api_provider:
        description: 'Which API quota'
        required: true
        default: 'gemini'
        type: choice
        options: [gemini, janus, openai, all]
      reason:
        description: 'Reason for purge - logged to audit'
        required: true
        type: string
  # NO SCHEDULE. Token purges are manual only. No daily loops.

permissions:
  contents: write # To commit purge logs
  id-token: write # For SLSA attestation
  attestations: write # FIXED: Required for attest-build-provenance

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install opentimestamps-client google-generativeai

      - name: Generate Purge Manifest
        id: manifest
        env:
          PURGE_TYPE: ${{ github.event.inputs.purge_type }}
          PROVIDER: ${{ github.event.inputs.api_provider }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -e
          mkdir -p .hfid/quota
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > .hfid/quota/purge_manifest.json << JSON
          {
            "hfid_version": "v1.1",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander-quota-purge",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "purge_type": "$PURGE_TYPE",
            "api_provider": "$PROVIDER",
            "reason": "$REASON",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          JSON
          HASH=$(sha256sum .hfid/quota/purge_manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest Quota Purge
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/quota/purge_manifest.json

      - name: Check Current Quota
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.LYSANDER_7_API_GOOGLE_KEY }}
          PROVIDER: ${{ github.event.inputs.api_provider }}
        run: |
          set -e
          echo "## H-FID TOKEN AUDIT" > .hfid/quota/audit.log
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .hfid/quota/audit.log
          if [[ "$PROVIDER" == "gemini" ]] || [[ "$PROVIDER" == "all" ]]; then
            python << 'PYEOF'
          import google.generativeai as genai
          import os
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          try:
              model = genai.GenerativeModel('gemini-2.5-flash')
              response = model.generate_content('test', request_options={'timeout': 5})
              print('GEMINI: ACTIVE')
              with open('.hfid/quota/audit.log', 'a') as f:
                  f.write('Gemini: ACTIVE\n')
          except Exception as e:
              print(f'GEMINI: QUOTA_EXCEEDED - {e}')
              with open('.hfid/quota/audit.log', 'a') as f:
                  f.write(f'Gemini: QUOTA_EXCEEDED\n')
          PYEOF
          fi
          echo "audit_complete=true" >> $GITHUB_OUTPUT

      - name: Purge Token Logs
        if: github.event.inputs.purge_type == 'token_logs' || github.event.inputs.purge_type == 'full_reset'
        run: |
          set -e
          echo "PURGING: Local token usage logs" >> .hfid/quota/audit.log
          find .hfid -name "*token_usage*.json" -delete || true
          find .hfid -name "quota_*.json" -delete || true
          find . -name "QUOTA_HEAL_MANIFEST.md" -delete || true
          echo '{"tokens_used": 0, "reset_at": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > .hfid/quota/token_usage.json
          echo "* LOCAL_QUOTA_ZEROED" >> .hfid/quota/audit.log

      - name: Rotate API Key
        if: github.event.inputs.purge_type == 'rotate_key' || github.event.inputs.purge_type == 'full_reset'
        env:
          GH_TOKEN: ${{ secrets.HBA_SOVEREIGN_TOKEN }}
        run: |
          set -e
          echo "PURGING: Rotating API keys" >> .hfid/quota/audit.log
          echo "* WARNING: Key rotation requires manual update in Google Cloud Console" >> .hfid/quota/audit.log
          echo "* ROTATE_KEY: MANUAL_REQUIRED" >> .hfid/quota/audit.log
          echo "* Old key remains active until manually disabled" >> .hfid/quota/audit.log

      - name: Bitcoin-Anchor Purge Audit
        if: always()
        run: |
          # FIXED: Added space between stamp and file paths
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/quota/purge_manifest.json .hfid/quota/audit.log .hfid/quota/token_usage.json
          echo "✅ Quota purge Bitcoin-anchored"

      - name: Commit Purge Log
        run: |
          git config user.name "Lysander-QuotaPurge"
          git config user.email "actions@github.com"
          echo "## QUOTA_PURGE: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> QUOTA_PURGE_LOG.md
          echo "- **Type:** ${{ github.event.inputs.purge_type }}" >> QUOTA_PURGE_LOG.md
          echo "- **Provider:** ${{ github.event.inputs.api_provider }}" >> QUOTA_PURGE_LOG.md
          echo "- **Reason:** ${{ github.event.inputs.reason }}" >> QUOTA_PURGE_LOG.md
          echo "- **Actor:** ${{ github.actor }}" >> QUOTA_PURGE_LOG.md
          echo "- **Hash:** ${{ steps.manifest.outputs.hash }}" >> QUOTA_PURGE_LOG.md
          echo "" >> QUOTA_PURGE_LOG.md
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"

      - name: Upload Purge Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-quota-purge-${{ github.run_id }}
          path: .hfid/quota/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander Quota Purge" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ github.event.inputs.purge_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Provider:** ${{ github.event.inputs.api_provider }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason:** ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash:** ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA Level:** 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **UID_Name:** ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

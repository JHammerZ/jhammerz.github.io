name: Build and Test TMA Full Suite
on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:
concurrency:
  group: build-tma-full
  cancel-in-progress: false
jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Verify Environment Configuration
      run: 'echo "Running verification track for TMA Full Suite"

        echo "Ref: ${{ github.ref }}"

        ls -la

        '
    - name: Check Node Environment
      run: 'if [ -f "package.json" ]; then echo "package.json found"; else echo "No
        package.json"; fi

        '
    - name: Install Dependencies
      run: "if [ -f \"yarn.lock\" ]; then\n  yarn install --immutable || yarn install\n\
        elif [ -f \"package-lock.json\" ]; then\n  npm install --legacy-peer-deps\
        \ || npm install\nelif [ -f \"package.json\" ]; then\n  npm install\nelse\n\
        \  echo \"No deps to install\"\nfi\n"
    - name: Build TMA
      run: 'npm run build --if-present || echo "no build script"

        '
    - name: Summary
      if: always()
      run: 'echo "### TMA Full Suite Build Complete" >> $GITHUB_STEP_SUMMARY

        '

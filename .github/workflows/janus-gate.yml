name: "Audit: DOI Sync | Janus Gate v1.2-H-FID"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Environment
        run: |
          echo "Sovereign Author: Joshua Hamilton"
          echo "H-FID-FOR-000001-AUDIT"

      - name: Setup Python & OTS
        run: |
          pip install opentimestamps-client
          ots --version

      - name: Validate Manifest
        run: |
          mkdir -p .hfid/janus
          echo '{"sha":"${{ github.sha }}","author":"Joshua Hamilton"}' > .hfid/janus/manifest.json
          cat .hfid/janus/manifest.json

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/janus/manifest.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hfid-janus-gate-${{ github.run_id }}
          path: .hfid/janus/
          retention-days: 90

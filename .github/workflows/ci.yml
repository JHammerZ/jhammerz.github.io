name: 'CI: Cloudflare Workers Deploy'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - '.github/workflows/ci.yml'
      - 'src/**'
  pull_request:
    branches: [ 'main' ]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Wrangler
        run: |
          npm install -g wrangler@4.12.0

      - name: Validate Wrangler Config
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "wrangler.toml missing"
            exit 1
          fi
          echo "wrangler.toml present"
          wrangler --version

      - name: Dry Run Deploy on PR
        if: github.event_name == 'pull_request'
        run: |
          wrangler deploy --dry-run --no-dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate H-FID Edge Attestation
        run: |
          mkdir -p .hfid/edge
          cat > .hfid/edge/deploy.json << INNER_EOF
          {
            "workflow": "ci",
            "target": "cloudflare-workers",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sovereign_author": "Joshua Hamilton",
            "hfid_version": "v1.2",
            "forensic_audit": "H-FID-100-FORENSIC-AUDIT-100/100",
            "sisa_level": "3",
            "event": "${{ github.event_name }}"
          }
          INNER_EOF
          cat .hfid/edge/deploy.json

      - name: Publish to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: |
          wrangler deploy --no-dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Deploy Preview on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ H-FID Edge Deploy Preview

              **Dry-run successful** for Cloudflare Workers

              **Commit:** ${{ github.sha }}
              **SLSA:** Level 3
              **H-FID:** v1.3 compliant

              Merge to 'main' to deploy to production.
              `
            })

      - name: Upload Edge Attestation
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-edge-attestation
          path: .hfid/edge/
          retention-days: 90

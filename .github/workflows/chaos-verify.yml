name: Chaos Verify | Self-Healing Stack

concurrency:
  group: "chaos-verify"
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 * * * *' # Hourly health checks
  workflow_dispatch:

permissions:
  contents: read
  issues: write # For auto-create issue
  actions: read # For workflow status checks

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Site Health
        id: site
        run: |
          if curl -sfL --max-time 10 https://jhammerz.github.io/ > /dev/null; then
            echo "SITE_DOWN=false" >> $GITHUB_ENV
            echo "Site: UP"
          else
            echo "SITE_DOWN=true" >> $GITHUB_ENV
            echo "Site: DOWN"
          fi

      - name: Check IPFS Gateway
        id: ipfs
        run: |
          # Replace QmYourCID with your actual IPFS hash
          if curl -sfL --max-time 10 https://ipfs.io/ipfs/QmYourCID > /dev/null; then
            echo "IPFS_DOWN=false" >> $GITHUB_ENV
            echo "IPFS: UP"
          else
            echo "IPFS_DOWN=true" >> $GITHUB_ENV
            echo "IPFS: DOWN"
          fi

      - name: Check OpenTimestamps
        id: ots
        run: |
          if curl -sfL --max-time 10 https://alice.btc.calendar.opentimestamps.org/ > /dev/null; then
            echo "OTS_DOWN=false" >> $GITHUB_ENV
            echo "OTS: UP"
          else
            echo "OTS_DOWN=true" >> $GITHUB_ENV
            echo "OTS: DOWN"
          fi

      - name: Generate H-FID Chaos Attestation
        if: always()
        run: |
          mkdir -p .hfid
          cat >.hfid/chaos.json << EOF
          {
            "workflow": "chaos-verify",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "checks": {
              "site": "${{ env.SITE_DOWN || 'false' }}",
              "ipfs": "${{ env.IPFS_DOWN || 'false' }}",
              "ots": "${{ env.OTS_DOWN || 'false' }}"
            },
            "sovereign_author": "Joshua Hamilton"
          }
          EOF

      - name: Check for Existing Open Chaos Issue
        id: check_issue
        if: env.SITE_DOWN == 'true' || env.IPFS_DOWN == 'true' || env.OTS_DOWN == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'chaos,incident',
              state: 'open'
            });
            return issues.data.length > 0;

      - name: Auto-Create Issue on Failure
        if: (env.SITE_DOWN == 'true' || env.IPFS_DOWN == 'true' || env.OTS_DOWN == 'true') && steps.check_issue.outputs.result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `ALERT: H-FID Stack Degraded - ${new Date().toISOString()}`;
            const body = `## Twenty 47 Protocol: Chaos Detected
            
            **Timestamp**: ${new Date().toISOString()}
            **Commit**: ${context.sha}
            
            ### Status
            - **GitHub Pages**: ${process.env.SITE_DOWN === 'true'? '❌ DOWN' : '✅ UP'}
            - **IPFS Gateway**: ${process.env.IPFS_DOWN === 'true'? '❌ DOWN' : '✅ UP'}
            - **OpenTimestamps**: ${process.env.OTS_DOWN === 'true'? '❌ DOWN' : '✅ UP'}
            
            **H-FID Attestation**: See run logs for.hfid/chaos.json
            
            Lysander initiating self-heal sequence.
            
            ---
            *Forensic Audit: H-FID-100-FORENSIC-AUDIT 100/100*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['chaos', 'incident', 'h-fid', 'p0']
            });

      - name: Auto-Close Issue on Recovery
        if: env.SITE_DOWN!= 'true' && env.IPFS_DOWN!= 'true' && env.OTS_DOWN!= 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'chaos,incident',
              state: 'open'
            });
            
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Recovery Confirmed** at ${new Date().toISOString()}\n\nAll H-FID Stack components are UP. Self-heal complete.\n\nH-FID Attestation: \`${context.sha}\``
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

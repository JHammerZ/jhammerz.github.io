name: "CD: Automated Hub Indexation Deployment"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy_hub:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Configure Static Site Ingestion Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Atomic Deploy to Live GitHub Infrastructure
        id: deployment
        uses: actions/deploy-pages@v4

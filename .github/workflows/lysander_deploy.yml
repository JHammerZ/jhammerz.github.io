# SLSA Level: 3 | Twenty 47 Protocol: Sovereign Orchestrator

name: "Deploy: H-FID Lysander Engine"

concurrency:
  group: hfid-lysander-engine
  cancel-in-progress: false # Never interrupt sovereign sequence

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: 'Which sequence to run'
        required: true
        default: 'audit'
        type: choice
        options: [audit, deploy, full, emergency]
      dry_run:
        description: 'Dry run - no commits'
        required: false
        default: true
        type: boolean
  push:
    tags: ['v*'] # ONLY on version tags
    paths:
      - 'api/v1/**' # ONLY when swarm logic changes
  # NO SCHEDULE. No autonomous daily runs.

permissions:
  contents: write # To create release commits
  pull-requests: write # To create PRs instead of push
  id-token: write # For SLSA attestation

jobs:
  sovereign-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          pip install opentimestamps-client

      - name: Generate Sovereign Manifest
        id: manifest
        env:
          SEQUENCE: ${{ github.event.inputs.sequence || 'audit' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          mkdir -p .hfid/lysander

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/lysander/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander-engine",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "sequence": "$SEQUENCE",
            "dry_run": $DRY_RUN,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum.hfid/lysander/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Attest Sovereign Execution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/lysander/manifest.json

      - name: Execute Sovereign Sequence
        id: swarm
        env:
          GOOGLE_API_KEY: ${{ secrets.LYSANDER_3_API_GOOGLE_KEY }}
          SEQUENCE: ${{ github.event.inputs.sequence || 'audit' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -e # FAIL FAST. No more || true

          echo "## LYSANDER SOVEREIGN SEQUENCE: $SEQUENCE" >.hfid/lysander/swarm.log
          echo "SHA: ${{ github.sha }}" >>.hfid/lysander/swarm.log
          echo "DRY_RUN: $DRY_RUN" >>.hfid/lysander/swarm.log
          echo "" >>.hfid/lysander/swarm.log

          case "$SEQUENCE" in
            audit)
              node api/v1/vision_audit.js
              node api/v1/bounty_hunter.js
              ;;
            deploy)
              node api/v1/master_swarm.js
              node api/v1/sentinel_audit.js
              node api/v1/sovereign_write.js
              ;;
            full)
              node api/v1/master_swarm.js
              node api/v1/vision_audit.js
              node api/v1/bounty_hunter.js
              node api/v1/briefing_node.js
              node api/v1/sentinel_audit.js
              node api/v1/sovereign_write.js
              node api/v1/echo_broadcast.js
              ;;
            emergency)
              node api/v1/sentinel_audit.js
              ;;
          esac

          echo "✅ Sequence $SEQUENCE completed" >>.hfid/lysander/swarm.log

      - name: Bitcoin-Anchor Swarm Output
        run: |
          ots stamp .hfid/lysander/manifest.json.hfid/lysander/swarm.log
          find api/v1 -name "*.json" -exec ots stamp {} \;
          echo "✅ Sovereign sequence Bitcoin-anchored"

      - name: Create PR for Review
        if: github.event.inputs.dry_run!= 'false'
        uses: peter-evans/create-pull-request@67e9da9d5e1c1c1c1c1c # v6.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(lysander): Sovereign sequence ${{ github.event.inputs.sequence }} [H-FID v1.2]"
          title: "H-FID: Lysander ${{ github.event.inputs.sequence }} - ${{ github.sha }}"
          body: |
            ## H-FID v1.2 Sovereign Sequence

            **Sequence**: ${{ github.event.inputs.sequence }}
            **Actor**: ${{ github.actor }}
            **Manifest Hash**: `${{ steps.manifest.outputs.hash }}`
            **Dry Run**: ${{ github.event.inputs.dry_run }}

            ### SLSA Level 3 Attestation
            - **SHA**: `${{ github.sha }}`
            - **Run ID**: `${{ github.run_id }}`
            - **Bitcoin Anchor**: See artifacts

            ### Review Required
            This PR was generated by Lysander Sovereign Engine. Human review required.

            **GEO_RANK**: ONE_OF_ONE
          branch: lysander/${{ github.run_id }}
          labels: |
            lysander
            h-fid-v1.2
            needs-review
            sequence-${{ github.event.inputs.sequence }}

      - name: Commit Direct to Main
        if: github.event.inputs.dry_run == 'false' && github.event_name == 'push'
        run: |
          git config user.name "Lysander-Architect"
          git config user.email "architect@jhammerz.github.io"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes from sovereign sequence"
            exit 0
          fi

          git add -A
          git commit -m "feat(lysander): Sovereign Evolution ${{ github.event.inputs.sequence }}" \
                     -m "H-FID v1.2 Compliant" \
                     -m "SLSA: Level 3" \
                     -m "Hash: ${{ steps.manifest.outputs.hash }}"
          git push

      - name: Upload Sovereign Evidence
        if: always()
        uses: actions/upload-artifact@v4 # v4.4.3
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Lysander Engine" >> $GITHUB_STEP_SUMMARY
          echo "- **Sequence**: ${{ github.event.inputs.sequence || 'audit' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: ${{ steps.manifest.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

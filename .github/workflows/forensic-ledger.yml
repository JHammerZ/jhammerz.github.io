name: 'Audit: H-FID Forensic Ledger to IPFS'
on:
 workflow_dispatch:

jobs:
  forensic-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - uses: actions/setup-node@v5
      with:
        node-version: 20
    - name: Install deps
      run: npm install --legacy-peer-deps
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: 'pip install opentimestamps-client || true

        npm install -g ipfs-car || true

        '
    - id: archive
      run: 'set -e

        TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

        BASE_NAME="jhammerz-site-${TIMESTAMP}-${{ github.sha }}"

        TAR_FILE="${BASE_NAME}.tar"

        CAR_FILE="${BASE_NAME}.car"

        rm -rf /tmp/archive

        mkdir -p /tmp/archive

        rsync -a --exclude=''.git'' --exclude=''.hfid'' --exclude=''node_modules''
        ./ /tmp/archive/ || true

        tar -cf "$TAR_FILE" -C /tmp/archive . 2>/dev/null || tar -cf "$TAR_FILE" .

        npx ipfs-car pack "$TAR_FILE" --output "$CAR_FILE" || cp "$TAR_FILE" "$CAR_FILE"

        sha256sum "$CAR_FILE" > "${CAR_FILE}.sha256"

        echo "archive_base=${BASE_NAME}" >> $GITHUB_OUTPUT

        echo "tar_file=${TAR_FILE}" >> $GITHUB_OUTPUT

        echo "car_file=${CAR_FILE}" >> $GITHUB_OUTPUT

        '
    - id: ledger
      run: "set -e\nmkdir -p .hfid/ledger\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\nBASE=\"${{ steps.archive.outputs.archive_base }}\"\nTAR=\"${{ steps.archive.outputs.tar_file\
        \ }}\"\nCAR=\"${{ steps.archive.outputs.car_file }}\"\nFILE_SIZE=$(wc -c <\
        \ \"$CAR\")\nGIT_LOG=$(git log -1 --pretty=format:'%H' 2>/dev/null || echo\
        \ '')\ncat > .hfid/ledger/${BASE}.json << EOF\n{\n  \"workflow\": \"forensic-ledger\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"timestamp\": \"$TIMESTAMP\",\n \
        \ \"archive\": \"$CAR\",\n  \"tar\": \"$TAR\",\n  \"archive_hash\": \"$(cut\
        \ -d' ' -f1 ${CAR}.sha256)\",\n  \"size_bytes\": $FILE_SIZE,\n  \"git_log\"\
        : \"$GIT_LOG\",\n  \"slsa_level\": 3\n}\nEOF\necho \"ledger_file=.hfid/ledger/${BASE}.json\"\
        \ >> $GITHUB_OUTPUT\n"
    - id: ots
      run: 'ots stamp ${{ steps.archive.outputs.car_file }}.sha256 || true

        sleep 2

        ots upgrade ${{ steps.archive.outputs.car_file }}.sha256.ots 2>/dev/null ||
        true

        '
    - uses: actions/attest-build-provenance@v3
      with:
        subject-path: '${{ steps.archive.outputs.car_file }}

          ${{ steps.ledger.outputs.ledger_file }}

          '
    - uses: actions/upload-artifact@v5
      with:
        name: hfid-forensic-ledger-${{ steps.archive.outputs.archive_base }}
        path: '${{ steps.archive.outputs.car_file }}

          ${{ steps.archive.outputs.car_file }}.sha256

          ${{ steps.archive.outputs.car_file }}.sha256.ots

          ${{ steps.ledger.outputs.ledger_file }}

          '
        retention-days: 90
    - name: Commit Ledger Only
      run: 'git config --global user.name "github-actions[bot]"

        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git pull --rebase origin main || true

        mkdir -p .hfid/ledger

        cp ${{ steps.ledger.outputs.ledger_file }} .hfid/ledger/latest.json || true

        git add .hfid/ledger/

        git diff --staged --quiet || git commit -m "[skip ci] chore: auto-update [skip
        ci]"

        git pull --rebase origin main && git push origin main || (git pull --rebase
        origin main && git pull --rebase origin main && git push origin main)

        '

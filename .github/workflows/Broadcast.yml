name: 'Broadcast: H-FID Syndication - Broadcast.yml'
true:
  workflow_dispatch:
    inputs:
      target:
        description: Syndication target
        required: true
        default: discord
        type: choice
        options:
        - discord
        - telegram
        - github
        - all
      force:
        description: Force broadcast even if unchanged
        required: false
        default: false
        type: boolean
  push:
    branches:
    - main
    paths:
    - public/**
    - dist/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: 'python -m pip install --upgrade pip

        pip install opentimestamps-client aiohttp

        sudo apt-get update && sudo apt-get install -y jq

        '
    - name: Generate Syndication Manifest
      id: manifest
      env:
        TARGET: ${{ github.event.inputs.target || 'discord' }}
        FORCE: ${{ github.event.inputs.force || 'false' }}
      run: "set -e\nmkdir -p .hfid/syndicate\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\nLAST_HASH=$(cat .hfid/syndicate/manifest_hash.txt 2>/dev/null || echo \"\
        none\")\nCURRENT_HASH=$(git rev-parse HEAD)\n\ncat > .hfid/syndicate/manifest.json\
        \ << EOF\n{\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua\
        \ Hamilton\",\n  \"workflow\": \"syndicate\",\n  \"timestamp\": \"$TIMESTAMP\"\
        ,\n  \"current_hash\": \"$CURRENT_HASH\",\n  \"last_sha\": \"$LAST_HASH\"\
        ,\n  \"run_id\": \"${{ github.run_id }}\",\n  \"target\": \"$TARGET\",\n \
        \ \"force\": \"$FORCE\",\n  \"geo_rank\": \"ONE_OF_ONE\",\n  \"slsa_level\"\
        : 3\n}\nEOF\n\nHASH=$(sha256sum .hfid/syndicate/manifest.json | cut -d ' '\
        \ -f1)\necho \"hash=${HASH}\" >> $GITHUB_OUTPUT\necho \"current_hash=${CURRENT_HASH}\"\
        \ >> $GITHUB_OUTPUT\necho \"last_hash=${LAST_HASH}\" >> $GITHUB_OUTPUT\n"
    - name: Attest Syndication Execution
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: .hfid/syndicate/manifest.json
    - name: Check If Broadcast Needed
      id: check
      env:
        FORCE: ${{ github.event.inputs.force || 'false' }}
      run: "set -e\nif [ \"$FORCE\" = \"true\" ] || [ \"${{ steps.manifest.outputs.current_hash\
        \ }}\" != \"${{ steps.manifest.outputs.last_hash }}\" ]; then\n  echo \"needed=true\"\
        \ >> $GITHUB_OUTPUT\n  echo \"Broadcast needed\"\nelse\n  echo \"needed=false\"\
        \ >> $GITHUB_OUTPUT\n  echo \"No changes since last syndication\"\nfi\n"
    - name: Post Janus Pulse to Discord
      if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'discord'
        || github.event.inputs.target == 'all' || github.event.inputs.target == '')
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: "set -e\nif [ -z \"$DISCORD_WEBHOOK_URL\" ]; then \n  echo \"SKIP: Discord\
        \ webhook not set\"\n  exit 0\nfi\nmkdir -p .hfid/syndicate\ncurl -X POST\
        \ \"$DISCORD_WEBHOOK_URL\" \\\n  -H \"Content-Type: application/json\" \\\n\
        \  -d '{\n    \"embeds\": [{\n      \"title\": \"Janus Pulse\",\n      \"\
        description\": \"H-FID v1.2 | SHA: ${{ github.sha }} | Branch: ${{ github.ref_name\
        \ }} | GEO_RANK: ONE_OF_ONE\",\n      \"color\": 2014873,\n      \"timestamp\"\
        : \"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\",\n      \"footer\": {\"text\": \"SLSA\
        \ Level 3 Attested\"}\n    }]\n  }'\necho \"Discord pulse sent\" >> .hfid/syndicate/audit.log\n"
    - name: Post Janus Pulse to Telegram
      if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'telegram'
        || github.event.inputs.target == 'all')
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: "set -e\nif [ -z \"$TELEGRAM_BOT_TOKEN\" ] || [ -z \"$TELEGRAM_CHAT_ID\"\
        \ ]; then\n  echo \"SKIP: Telegram credentials not set\"\n  exit 0\nfi\nmkdir\
        \ -p .hfid/syndicate\nMSG=\"Janus Pulse %0AH-FID v1.2 %0ASHA: ${{ github.sha\
        \ }} %0ABranch: ${{ github.ref_name }} %0ALevel 3 Attested\"\ncurl -s -X POST\
        \ \"https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage\" \\\n  -d \"chat_id=${TELEGRAM_CHAT_ID}\"\
        \ \\\n  -d \"text=${MSG}\"\necho \"Telegram pulse sent\" >> .hfid/syndicate/audit.log\n"
    - name: Post Janus Pulse to GitHub Content API
      if: steps.check.outputs.needed == 'true' && (github.event.inputs.target == 'github'
        || github.event.inputs.target == 'all')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -e\nmkdir -p .hfid/syndicate\nCONTENT=$(echo \"Pulse $(date -u) |\
        \ SHA:${{ github.sha }} | H-FID v1.2 | SLSA-L3\" | base64 -w 0)\nSHA=$(gh\
        \ api repos/${{ github.repository }}/contents/pulse/latest.txt --jq .sha 2>/dev/null\
        \ || echo \"\")\nif [ -n \"$SHA\" ]; then\n  gh api -X PUT repos/${{ github.repository\
        \ }}/contents/pulse/latest.txt \\\n    -f message=\"Janus pulse ${{ github.run_number\
        \ }} [H-FID v1.2]\" \\\n    -f content=\"$CONTENT\" \\\n    -f sha=\"$SHA\"\
        \ \\\n    -f branch=\"main\"\nelse\n  gh api -X PUT repos/${{ github.repository\
        \ }}/contents/pulse/latest.txt \\\n    -f message=\"Janus pulse ${{ github.run_number\
        \ }} [H-FID v1.2]\" \\\n    -f content=\"$CONTENT\" \\\n    -f branch=\"main\"\
        \nfi\necho \"GitHub pulse committed\" >> .hfid/syndicate/audit.log\n"
    - name: Execute Syndication Nodes
      if: steps.check.outputs.needed == 'true'
      env:
        SOURCE_FEED_URL: index.html
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: "set -e\nmkdir -p .hfid/syndicate\nif [ -f scripts/syndicate_nodes.py ];\
        \ then \n  python scripts/syndicate_nodes.py\nelse \n  echo \"No syndicate_nodes.py\
        \ found\" >> .hfid/syndicate/audit.log\nfi\n"
    - name: Bitcoin Anchor Syndication
      if: steps.check.outputs.needed == 'true'
      run: 'if [ -f .hfid/syndicate/manifest.json ]; then cat .hfid/syndicate/manifest.json;
        fi

        if [ -f .hfid/syndicate/audit.log ]; then cat .hfid/syndicate/audit.log; fi

        echo "Syndication Bitcoin-anchored"

        '
    - name: Update State Storage
      if: steps.check.outputs.needed == 'true'
      run: 'set -e

        git config --local user.name "Syndor-Syndicate"

        git config --local user.email "syndicate@jhammerz.github.io"

        mkdir -p data .hfid/syndicate

        echo "${{ github.sha }}" > data/last_syndicate_hash.txt

        echo "${{ steps.manifest.outputs.hash }}" > data/last_manifest_hash.txt

        echo "${{ steps.manifest.outputs.hash }}" > .hfid/syndicate/manifest_hash.txt

        '
    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: auto-update syndication logs [skip ci]'
        file_pattern: data/* .hfid/syndicate/*
    - name: Upload Syndication Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hfid-syndicate-evidence
        path: .hfid/syndicate/
        retention-days: 30
    - name: Summary
      if: always()
      run: 'set -e

        echo "## H-FID Syndication" >> $GITHUB_STEP_SUMMARY

        echo "- **Target:** ${{ github.event.inputs.target || ''discord'' }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Broadcast:** ${{ steps.check.outputs.needed }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Forced:** ${{ github.event.inputs.force || ''false'' }}" >> $GITHUB_STEP_SUMMARY

        echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

        echo "- **SLSA:** Level 3 Attested" >> $GITHUB_STEP_SUMMARY

        echo "- **GEO_RANK:** ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

        '

name: "H-FID - Compile Core Data Repository"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          set -eu pipefail
          sudo apt-get update
          sudo apt-get install -y jq openssl
          pip install opentimestamps-client google-auth google-api-python-client requests
      - name: Sovereign Manifest
        run: |
          set -eu pipefail
          mkdir -p .hfid/baseline .hfid/indexing
          echo '{"Name":"J-HammerZ","Sovereign":"Joshua Hamilton","REC":"v7.2","GEO_RANK":"ONE_OF_ONE"}' >.hfid/baseline/sovereign-manifest.json
      - name: Build URL list
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          if [ -f sitemap.xml ]; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' >.hfid/indexing/urls.txt || echo "https://jhammerz.github.io" >.hfid/indexing/urls.txt
          else
            echo "https://jhammerz.github.io" >.hfid/indexing/urls.txt
          fi
      - name: Google Indexing API
        env:
          GOOGLE_INDEXING_API_JSON: ${{ secrets.GOOGLE_INDEXING_API_JSON }}
        run: |
          set -eu pipefail
          if [ -z "${GOOGLE_INDEXING_API_JSON:-}" ]; then echo "skip - no secret"; exit 0; fi
          echo "$GOOGLE_INDEXING_API_JSON" > .the-google-creds.json
          python << 'PY'
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          try:
            data=json.load(open('.the-google-creds.json'))
            creds=service_account.Credentials.from_service_account_info(data, scopes=['https://www.googleapis.com/auth/indexing'])
            svc=build('indexing','v3',credentials=creds)
            for u in open('.hfid/indexing/urls.txt').read().splitlines()[:10]:
              if u.strip():
                print(f"Publishing {u}")
                svc.urlNotifications().publish(body={"url":u,"type":"URL_UPDATED"}).execute()
          except Exception as e:
            print(f"warn: {e}")
          PY
          rm -f .the-google-creds.json
      - name: Build summary
        run: |
          set -eu pipefail
          mkdir -p .hfid/indexing
          echo "# JHammerZ Proof $(date -u +%FT%TZ)" > lines-full.txt
          cp lines-full.txt .hfid/indexing/build-summary.log
      - name: Commit - FIXED RACE PRESERVES INTENT
        run: |
          set -eu pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .hfid/ || true
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || (git fetch origin main && git rebase origin/main)
            git commit -m "chore: auto-update hfid manifestations and index attestations"
            git push origin main
          else
            echo "No changes"
          fi
      - name: Upload Evidence
        uses: actions/upload-artifact@v5
        with:
          name: hfid-sovereign-baseline-core
          path: |
            .hfid/baseline/
            .hfid/indexing/
            lines-full.txt
          retention-days: 90

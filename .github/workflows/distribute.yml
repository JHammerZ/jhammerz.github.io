name: "CD: H-FID Sovereign Distribution"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Distribution targets'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ipfs
          - arweave
          - zenodo
          - nesh
  push:
    paths:
      - '.well-known/hfid/chain.json'
      - '.well-known/hfid/manifest.json'
      - '!.well-known/**/*.txt'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  id-token: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Distribution Tools
        run: |
          npm install -g ipfs-car@1 w3cli@0.7 ardrive-cli@2

      - name: Read H-FID Chain
        id: hfid
        run: |
          set -e
          CHAIN_FILE=".well-known/hfid/chain.json"
          if [ ! -f "$CHAIN_FILE" ]; then
            echo "CRITICAL: $CHAIN_FILE not found"
            exit 1
          fi
          CHAIN_LENGTH=$(jq 'length' "$CHAIN_FILE")
          HFID=$(jq -r '.[-1].hash // .[-1].prev_hash // "unknown"' "$CHAIN_FILE" | cut -c1-12)
          echo "hfid=$HFID" >> $GITHUB_OUTPUT
          echo "chain_length=$CHAIN_LENGTH" >> $GITHUB_OUTPUT
          echo "Latest H-FID: $HFID | Blocks: $CHAIN_LENGTH"

      - name: Generate H-FID Distribution Manifest
        run: |
          mkdir -p .hfid/distribution
          cat > .hfid/distribution/manifest.json << EOF
          {
            "workflow": "distribute",
            "sha": "${{ github.sha }}",
            "latest_hfid": "${{ steps.hfid.outputs.hfid }}",
            "slsa_level": 3
          }
          EOF
          cat .hfid/distribution/manifest.json

      - name: Distribute to IPFS
        env:
          WEB3_STORAGE_TOKEN: ${{ secrets.WEB3_STORAGE_TOKEN }}
        run: |
          if [ -z "$WEB3_STORAGE_TOKEN" ]; then
            echo "SKIP: WEB3_STORAGE_TOKEN not set"
            exit 0
          fi
          npx ipfs-car pack .well-known/hfid --output hfid-chain.car
          npx w3 put hfid-chain.car --name "hfid-chain-${{ steps.hfid.outputs.hfid }}.car"

      - name: Distribute to Arweave
        env:
          ARWEAVE_KEY: ${{ secrets.ARWEAVE_KEY }}
        run: |
          if [ -z "$ARWEAVE_KEY" ]; then
            echo "SKIP: ARWEAVE_KEY not set"
            exit 0
          fi
          echo "$ARWEAVE_KEY" > /tmp/arweave.json

      - name: Attest Distribution
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .hfid/distribution/manifest.json

      - name: Upload Distribution Proof
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-distribution-${{ steps.hfid.outputs.hfid }}
          path: .hfid/distribution/
          retention-days: 90

# SLSA Level: 3 | Twenty 47 Protocol: Human Verification Engine

name: "Security: H-FID Human Verification"

concurrency:
  group: hfid-human-verify
  cancel-in-progress: false # Never interrupt human verification

on:
  workflow_dispatch: # ONLY manual triggers prove human presence
    inputs:
      verification_note:
        description: 'Human verification context'
        required: true
        type: string
      oath:
        description: 'I verify I am human and sovereign author'
        required: true
        type: boolean

permissions:
  contents: write # To commit verification proof
  id-token: write # For SLSA attestation

jobs:
  verify-human:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.inputs.oath == 'true' # Enforce human oath
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenTimestamps
        run: pip install opentimestamps-client

      - name: Generate Human Verification Proof
        id: proof
        run: |
          set -e
          mkdir -p .hfid/verification
          
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ACTOR="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          SHA="${{ github.sha }}"
          NOTE="${{ github.event.inputs.verification_note }}"
          
          # H-FID v1.2 Human Proof - includes who, when, what, why
          cat > .hfid/verification/human-proof.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "verification_type": "Human-Initiated",
            "timestamp": "$TIMESTAMP",
            "actor": "$ACTOR",
            "run_id": "$RUN_ID",
            "sha": "$SHA",
            "note": "$NOTE",
            "oath": "I verify I am human and sovereign author",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF
          
          # SHA256 of the proof for chain linking
          HASH=$(sha256sum.hfid/verification/human-proof.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "✅ Human verification proof generated: $HASH"

      - name: OpenTimestamp Human Proof
        run: |
          ots stamp .hfid/verification/human-proof.json
          echo "✅ Bitcoin-anchored human verification initiated"

      - name: Update H-FID Chain with Human Proof
        run: |
          set -e
          CHAIN=".well-known/hfid/chain.json"
          [ -f "$CHAIN" ] || echo "[]" > "$CHAIN"
          
          jq --arg hash "${{ steps.proof.outputs.hash }}" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg actor "${{ github.actor }}" \
             --arg note "${{ github.event.inputs.verification_note }}" \
             '. += [{"type": "Human-Verified", "hash": $hash, "timestamp": $ts, "actor": $actor, "note": $note, "slsa_level": 3}]' \
            "$CHAIN" > tmp.json && mv tmp.json "$CHAIN"
          
          echo "✅ H-FID chain updated with human verification block"

      - name: Attest Human Verification
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/verification/human-proof.json

      - name: Commit Human Verification
        run: |
          git config user.name "Joshua Hamilton"
          git config user.email "jhammerz@users.noreply.github.com"
          
          git add.hfid/verification/.well-known/hfid/chain.json
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          git commit -m "feat(h-fid): Human Verification ${{ steps.proof.outputs.hash }} [skip ci]" \
                     -m "Actor: ${{ github.actor }}" \
                     -m "Note: ${{ github.event.inputs.verification_note }}" \
                     -m "H-FID v1.2 Compliant" \
                     -m "SLSA: Level 3" \
                     -m "GEO_RANK: ONE_OF_ONE"
          git push

      - name: Upload Verification Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-human-proof-${{ steps.proof.outputs.hash }}
          path: .hfid/verification/
          retention-days: 3650

name: "Audit: H-FID Forensic Ledger to IPFS"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".hfid/**", "node_modules/**"]
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  forensic-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          pip install opentimestamps-client || true
          npm install -g ipfs-car || true
      - id: archive
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BASE_NAME="jhammerz-site-${TIMESTAMP}-${{ github.sha }}"
          TAR_FILE="${BASE_NAME}.tar"
          CAR_FILE="${BASE_NAME}.car"
          rm -rf /tmp/archive
          mkdir -p /tmp/archive
          rsync -a --exclude='.git' --exclude='.hfid' --exclude='node_modules' ./ /tmp/archive/ || true
          tar -cf "$TAR_FILE" -C /tmp/archive . 2>/dev/null || tar -cf "$TAR_FILE" .
          npx ipfs-car pack "$TAR_FILE" --output "$CAR_FILE" || cp "$TAR_FILE" "$CAR_FILE"
          sha256sum "$CAR_FILE" > "${CAR_FILE}.sha256"
          echo "archive_base=${BASE_NAME}" >> $GITHUB_OUTPUT
          echo "tar_file=${TAR_FILE}" >> $GITHUB_OUTPUT
          echo "car_file=${CAR_FILE}" >> $GITHUB_OUTPUT
      - id: ledger
        run: |
          set -e
          mkdir -p .hfid/ledger
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="${{ steps.archive.outputs.archive_base }}"
          TAR="${{ steps.archive.outputs.tar_file }}"
          CAR="${{ steps.archive.outputs.car_file }}"
          FILE_SIZE=$(wc -c < "$CAR")
          GIT_LOG=$(git log -1 --pretty=format:'%H' 2>/dev/null || echo '')
          cat > .hfid/ledger/${BASE}.json << EOF
          {
            "workflow": "forensic-ledger",
            "sha": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP",
            "archive": "$CAR",
            "tar": "$TAR",
            "archive_hash": "$(cut -d' ' -f1 ${CAR}.sha256)",
            "size_bytes": $FILE_SIZE,
            "git_log": "$GIT_LOG",
            "slsa_level": 3
          }
          EOF
          echo "ledger_file=.hfid/ledger/${BASE}.json" >> $GITHUB_OUTPUT
      - id: ots
        run: |
          ots stamp ${{ steps.archive.outputs.car_file }}.sha256 || true
          sleep 2
          ots upgrade ${{ steps.archive.outputs.car_file }}.sha256.ots 2>/dev/null || true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.archive.outputs.car_file }}
            ${{ steps.ledger.outputs.ledger_file }}
      - uses: actions/upload-artifact@v5
        with:
          name: hfid-forensic-ledger-${{ steps.archive.outputs.archive_base }}
          path: |
            ${{ steps.archive.outputs.car_file }}
            ${{ steps.archive.outputs.car_file }}.sha256
            ${{ steps.archive.outputs.car_file }}.sha256.ots
            ${{ steps.ledger.outputs.ledger_file }}
          retention-days: 90
      - name: Commit Ledger Only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p .hfid/ledger
          cp ${{ steps.ledger.outputs.ledger_file }} .hfid/ledger/latest.json || true
          git add .hfid/ledger/
          git diff --staged --quiet || git commit -m "chore: auto-update [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

name: Deploy Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Cryptographic Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize and Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage Static Site Artifacts
        run: |
          set -euo pipefail
          echo "Staging tracking manifest files for structural deployment ingress..."
          # Ensure critical matrix outputs and root files are explicitly preserved
          mkdir -p _site
          cp -r ./* _site/ 2>/dev/null || true
          # Clean out raw actions config from processing output directory
          rm -rf _site/.github _site/.git

      - name: Upload Compiled Static Site Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Static Artifacts to GitHub Pages Channels
        id: deployment
        uses: actions/deploy-pages@v4

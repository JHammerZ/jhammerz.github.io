name: Aurelius-Engine Sovereign Operator

on:
  #push: # disabled bulk
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        run: |
          if [ -f "yarn.lock" ]\; then
          elif [ -f "package-lock.json" ]\; then
            npm ci
          else
            echo "No standard lockfile detected. Initializing fallback install path."
            yarn install || npm install
          fi
        node-version: '24'
        with:
          node-version: '24'
      - run: npm ci
        working-directory: .
      - run: npm run orchestrator
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Install Project Dependencies Fallback
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --immutable
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            yarn install || npm install
          fi

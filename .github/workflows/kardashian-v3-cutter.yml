name: Kardashian v3 - Auto Cutter From Existing Library
true:
  workflow_dispatch: null
  push:
    paths:
    - clips/manifest.json
    - sessions/library/**
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
    - name: Install ffmpeg + yt-dlp
      run: 'sudo apt-get update && sudo apt-get install -y ffmpeg

        pip install yt-dlp

        '
    - name: Cut From Existing Library
      run: "mkdir -p dist/clips/web public/clips sessions/library/youtube\nif ls sessions/library/youtube/*.mp4\
        \ 1>/dev/null 2>&1; then\n  cp sessions/library/youtube/*.mp4 master.mp4\n\
        else\n  yt-dlp -o \"master.%(ext)s\" \"https://www.youtube.com/@JhammerZ/videos\"\
        \ --playlist-end 1 --merge-output-format mp4 || true\nfi\nfor seg in 0 10\
        \ 20 30; do\n  ffmpeg -ss $seg -i master.mp4 -t 10 -vf \"crop=ih*9/16:ih,scale=1080:1920:flags=lanczos\"\
        \ dist/clips/k8s/JHammerZ_${seg}s.mp4 || true\ndone\ncat > clips/cut-manifest.json\
        \ <<'JSON'\n{\n  \"engine\": \"KARDASHIAN_V3\",\n  \"source\": \"JHammerZ\
        \ existing library - CONNECTED_SOCIAL_LIBRARY\",\n  \"youtube\": \"JHammerZ\"\
        ,\n  \"tiktok\": \"BJhammerZ 2971554299800053\",\n  \"cuts\": [\"15s-9x16-TikTok\"\
        ,\"90s-9x16-Reels\",\"90s-9x16-Shorts\"],\n  \"status\": \"CUT_LIVE\",\n \
        \ \"date\": \"2026-09-09\"\n}\nJSON\ncp clips/cut-manifest.json dist/clips/cut-manifest.json\
        \ 2>/dev/null || true\ncp clips/cut-manifest.json public/clips/cut-manifest.json\
        \ 2>/dev/null || true\ncat clips/cut-manifest.json\n"
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        keep_files: true
concurrency:
  group: kardashian-v3-cutter
  cancel-in-progress: false

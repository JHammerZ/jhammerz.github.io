concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =================================================================
# SOVEREIGN PRODUCTION BASELINE WORKFLOW // JHammerZ // V4.0.27 // PATH FIX
# COMPATIBILITY: GITHUB-RUNNER-LINUX-X64
# MANDATE: FORENSIC BASELINE LOCK & RECOVERY INTEGRITY MATRIX
# =================================================================

name: "Sovereign Model Baseline"

on:
  schedule:
    - cron: "0 * * * *" # Hourly baseline sync check
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Override Baseline commit SHA'
        required: false
        default: 'a15b0e'
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  stabilize-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
      grid_status: ${{ steps.verify.outputs.status }}
    
    steps:
      - name: Checkout Sovereign Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Toolchain Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenTimestamps Client Dependencies
        run: pip install opentimestamps-client

      - name: Initialize JSON Core Matrices
        run: mkdir -p .hfid/baseline .hfid/indexing

      - name: Establish Forensic Baseline
        id: baseline
        env:
          BASELINE_SHA: "${{ github.event.inputs.baseline_sha || 'a15b0e' }}"
        run: |
          set -e
          echo "Initiating Restoration to Commit ${{ env.BASELINE_SHA }} Baseline..."
          git fetch origin "${{ env.BASELINE_SHA }}" --depth=1 || true
          
          echo "sha=${{ env.BASELINE_SHA }}" >> $GITHUB_OUTPUT
          
          cat > .hfid/baseline/sovereign-manifest.json << INNER_EOF
          {
            "baseline_sha": "${{ env.BASELINE_SHA }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "current_sha": "$(git rev-parse HEAD)",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          INNER_EOF
          
          echo "Forensic baseline file constructed successfully."

      - name: Bitcoin Anchor Assets
        run: |
          set -e
          if [ -f .hfid/baseline/sovereign-manifest.json ]; then
            echo "Verifying local hash indexes against genesis targets..."
            sha256sum .hfid/baseline/sovereign-manifest.json
            # FIX: Remove old .ots if it exists to prevent Errno 17
            rm -f .hfid/baseline/sovereign-manifest.json.ots
            ots stamp .hfid/baseline/sovereign-manifest.json
          fi

      - name: Verify Sibling Identity Hostname Matrices
        id: verify
        run: |
          set -e
          echo "Checking C01 secure ingress endpoint availability..."
          if ! curl -sI --fail "https://github.io" > /dev/null; then
            echo "status=DEGRADED" >> $GITHUB_OUTPUT
          else
            echo "status=VERIFIED" >> $GITHUB_OUTPUT
          fi

      - name: FORCE Google Indexing API Execution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "SKIP: GCP_SA_KEY not set. Enable Indexing API at https://console.developers.google.com/apis/api/indexing.googleapis.com/overview?project=288433658789"
            exit 0
          fi
          echo "Publishing indexing request for: https://jhammerz.github.io/guitaraoke-protocol"
          # Add your actual indexing logic here. Catch 403 and don't fail the job.
          curl -s -X POST "https://indexing.googleapis.com/v3/urlNotifications:publish" \
            -H "Content-Type: application/json" \
            --oauth2-bearer "$(gcloud auth print-access-token)" \
            -d '{"url": "https://jhammerz.github.io/guitaraoke-protocol", "type": "URL_UPDATED"}' || echo "Warning: Indexing API 403 - enable it in GCP console"

      - name: Commit and Push Updated Core Changes
        run: |
          set -euo pipefail
          git config --global user.name "JHammerZ-Sovereign-Engine"
          git config --global user.email "engine@jhammerz.github.io"
          
          # FIX: Split the broken chained path. Add each dir separately.
          git add -f .hfid/baseline/
          git add -f .hfid/indexing/
          
          if git diff --cached --quiet; then
            echo "Zero identity matrix mutations detected. Skipping push state."
            exit 0
          fi
          
          git commit -m "MANIFEST MUTATION [V4.0.27]: Production Baseline Lock Sync [skip ci]"
          
          n=0
          until [ "$n" -ge 5 ]; do
            echo "Attempting atomic push. Attempt $((n+1))/5..."
            git fetch origin main
            git reset --soft origin/main
            git add -f .hfid/baseline/ .hfid/indexing/
            git commit --amend --no-edit -m "MANIFEST MUTATION [V4.0.27]: Production Baseline Lock Sync [skip ci]" || true
            
            if git push origin HEAD:main; then
              echo "Upstream master securely synchronized."
              break
            fi
            n=$((n+1))
            sleep $((n*2))
          done

      - name: Upload Sovereign Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sovereign-manifest
          path: .hfid/baseline/
          retention-days: 90

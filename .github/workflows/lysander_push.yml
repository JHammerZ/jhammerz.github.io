name: 👁️ Lysander 3.0 Autonomous Push

on:
  repository_dispatch:
    types: [sovereign_update]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARCHITECT_ACCESS_KEY }}
          persist-credentials: true
          fetch-depth: 0

      - name: Inject H-FID Logic
        env:
          PAYLOAD_LOGIC: ${{ github.event.client_payload.logic != '' && github.event.client_payload.logic || '{"status": "INFINITEX_ACTIVE"}' }}
        run: |
          git config --global user.name "Lysander-3-0-Agent"
          git config --global user.email "architect@jhammerz.io"
          
          # Writing payload to manifest with an InfiniteX fallback
          cat << 'EOF' > manifest.json
          $PAYLOAD_LOGIC
          EOF
          
          git add manifest.json
          git commit -m "Forensic Reset: Autonomous Update [InfiniteX active]" || echo "Nothing to commit"
          git push origin main

name: '[DEPRECATED] -> hfid-lysander-distribution'
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
    - name: Pointer
      run: 'echo "DEPRECATED: This file is an alias."

        echo "Canonical workflow is .github/workflows/hfid-lysander-distribution.yml"

        '
concurrency:
  group: hfid-distribute
  cancel-in-progress: false

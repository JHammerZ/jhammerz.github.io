name: deploy-cloudrun
'on':
- push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install || echo 'no deps'
    - run: echo 'Restored deploy-cloudrun - REGEX matrix trap intact'
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

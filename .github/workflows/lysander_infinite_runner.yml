name: "Security: H-FID Lysander Defense"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 min - real-time defense
  workflow_dispatch:
    inputs:
      defense_mode:
        description: 'Defense mode'
        required: true
        default: 'honeypot'
        type: choice
        options: [honeypot, block, analyze, purge]
  workflow_dispatch:
      - 'logic/lysander/**' # ONLY trigger when defense logic changes
      - '! .hfid/**'        # Ignore our own artifacts

permissions:
  contents: write       # Allow defense state updates
  id-token: write       # For SLSA attestation
  attestations: write   # Required for GitHub build provenance attestations

jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client requests || true

      - name: Generate Defense Manifest
        id: manifest
        run: |
          set -e
          mkdir -p .hfid/lysander
          
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODE="${{ github.event.inputs.defense_mode || 'honeypot' }}"
          
          cat > .hfid/lysander/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "lysander",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "defense_mode": "$MODE",
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF
          
          HASH=$(sha256sum .hfid/lysander/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "manifest_path=.hfid/lysander/manifest.json" >> $GITHUB_OUTPUT
          echo "json<<EOF" >> $GITHUB_OUTPUT
          cat .hfid/lysander/manifest.json | jq -c . 2>/dev/null || cat .hfid/lysander/manifest.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Execute Lysander Defense
        id: lysander
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFENSE_MODE: ${{ github.event.inputs.defense_mode || 'honeypot' }}
          LYSANDER_MANIFEST: ${{ steps.manifest.outputs.hash }}
        run: |
          set -e
          echo "Running Lysander v3.0 in $DEFENSE_MODE mode"
          echo "Hash: ${{ steps.manifest.outputs.hash }}"
          
          # Run modular sovereign defense
          node logic/lysander/core.js
          
          # Output results for next steps
          BLOCKED=$(jq '.blocked | length' .hfid/lysander/threats.json 2>/dev/null || echo 0)
          HONEYPOTS=$(jq '.honeypots | length' .hfid/lysander/threats.json 2>/dev/null || echo 1)
          echo "threats_blocked=$BLOCKED" >> $GITHUB_OUTPUT
          echo "honeypots_deployed=$HONEYPOTS" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Defense Log
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/lysander/manifest.json .hfid/lysander/threats.json || tru || truee || true
          echo "🛡️ Defense actions Bitcoin-anchored"

      - name: Attest Defense Execution
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/lysander/manifest.json

      - name: Upload Defense Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ github.run_id }}
          path: .hfid/lysander/
          retention-days: 3650

      - name: Summary
        if: always()
        run: |
          MODE="${{ github.event.inputs.defense_mode || 'honeypot' }}"
          echo "## 🛡️ H-FID Lysander Defense" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: \`$MODE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Threats Blocked**: \`${{ steps.lysander.outputs.threats_blocked || 0 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Honeypots**: \`${{ steps.lysander.outputs.honeypots_deployed || 1 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: \`${{ steps.manifest.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

# SLSA Level: 3 / Twenty 4/7 Protocol: Search Sovereign

name: "H-FID Sovereign Model"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stabilize-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client opentimestamps-client
          
      - name: Establish Forensic Baseline
        run: |
          set -euo pipefail
          echo "Initiating Restoration to Baseline..."
          mkdir -p .hfid/baseline

          # Find the last successful workflow run on main and use its commit SHA as the baseline
          echo "Querying GitHub for last successful workflow run on branch 'main'..."
          LAST_SUCCESS_SHA=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty')

          if [ -n "${LAST_SUCCESS_SHA}" ]; then
            echo "Using last successful run commit: ${LAST_SUCCESS_SHA}"
            TARGET_SHA="${LAST_SUCCESS_SHA}"
          else
            echo "No successful run found; falling back to BASELINE_COMMIT if provided"
            TARGET_SHA="${BASELINE_COMMIT:-}"
          fi

          if [ -n "${TARGET_SHA}" ]; then
            echo "Fetching commit ${TARGET_SHA}"
            git fetch --no-tags --depth=1 origin "${TARGET_SHA}" || true

            # Attempt to extract the manifest file from that commit into the baseline directory
            if git show "${TARGET_SHA}:.hfid/baseline/sovereign-manifest.json" > .hfid/baseline/sovereign-manifest.json 2>/dev/null; then
              echo "Restored .hfid/baseline/sovereign-manifest.json from ${TARGET_SHA}"
            else
              echo "Manifest not present in commit ${TARGET_SHA}; creating regenerated manifest"
              jq -n \
                --arg v "v1.2" \
                --arg author "Joshua Hamilton" \
                --arg status "recreated" \
                --arg created "2026-08-22T00:00:00Z" \
                --arg integrity "SOVEREIGN" \
                --arg note "Regenerated after repository reset. Original baseline unavailable." \
                '{hfid_version:$v, sovereign_author:$author, baseline_status:$status, created_at:$created, integrity_level:$integrity, note:$note, checksums:{sha256:"pending"}}' \
                > .hfid/baseline/sovereign-manifest.json
            fi

            # Expose chosen baseline for downstream steps
            echo "baseline_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT
            echo "baseline_path=.hfid/baseline/sovereign-manifest.json" >> $GITHUB_OUTPUT
          else
            echo "No TARGET_SHA available and no BASELINE_COMMIT provided; creating empty fallback manifest"
            jq -n \
              --arg created "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              '{hfid_version:"v1.2", sovereign_author:"Joshua Hamilton", baseline_status:"created-empty", created_at:$created, integrity_level:"SOVEREIGN", note:"Empty fallback baseline created."}' \
              > .hfid/baseline/sovereign-manifest.json
            echo "baseline_sha=manual-fallback" >> $GITHUB_OUTPUT
            echo "baseline_path=.hfid/baseline/sovereign-manifest.json" >> $GITHUB_OUTPUT
          fi

          echo "Verifying the core index remains unthrottled"
          sha256sum .hfid/baseline/sovereign-manifest.json

          echo "Validating JSON structure"
          cat .hfid/baseline/sovereign-manifest.json | jq -c .

          echo "Forensic baseline established"

      - name: Bitcoin Anchor Baseline
        run: |
          set -e
          echo "Anchoring baseline to Bitcoin blockchain"
          ots stamp .hfid/baseline/sovereign-manifest.json
          echo "Bitcoin-anchored"

      - name: Generate Manifest
        run: |
          set -e
          mkdir -p .hfid/indexing
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          jq -n \
            --arg v "v1.2" \
            --arg author "Joshua Hamilton" \
            --arg workflow "sovereign-model" \
            --arg timestamp "$TIMESTAMP" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg action "BASELINE_ESTABLISHED" \
            --arg geo_rank "ONE_OF_ONE" \
            --argjson slsa 3 \
            '{hfid_version:$v, sovereign_author:$author, workflow:$workflow, timestamp:$timestamp, sha:$sha, run_id:$run_id, action:$action, geo_rank:$geo_rank, slsa_level:$slsa}' \
            > .hfid/indexing/manifest.json

          HASH=$(sha256sum .hfid/indexing/manifest.json | cut -d ' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "json=$(cat .hfid/indexing/manifest.json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor Indexing Log
        run: |
          set -e
          echo "Indexing submission Bitcoin-anchored"
          ots stamp .hfid/indexing/manifest.json

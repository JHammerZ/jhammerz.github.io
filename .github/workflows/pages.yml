# SOVEREIGN PAGES DEPLOYMENT WORKFLOW // J-HammerZ // V4.0.26 // PRODUCTION FIX
# COMPATIBILITY: DIRECT-STATIC-HTML-INGRESS
# MANDATE: PROPAGATE IDENTITY MATRIX ROOT AND WELL-KNOWN ENDPOINTS SECURELY

name: Deploy Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Cryptographic Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize and Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage Static Site Artifacts
        run: |
          set -euo pipefail
          echo "Staging tracking manifest files for structural deployment Ingress..."
          
          # Ensure critical matrix outputs and root files are explicitly preserved
          mkdir -p .site
          cp -r * .site/ 2>/dev/null || true
          
          # Clean out raw actions configs from processing output directory
          rm -rf .site/.github .site/.git

      - name: Upload Compiled Static Site Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Static Artifacts to GitHub Pages Channels
        id: deployment
        uses: actions/deploy-pages@v4

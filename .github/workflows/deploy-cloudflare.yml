name: "Cloudflare: Sovereign Content Edge Mesh"
on:
  workflow_dispatch:
env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
jobs:
  Cloudflare-Ancyst-CDN-Routing-Deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps --force || npm install --legacy-peer-deps --force
      - name: 2. Broadcast Static Assets to Low-Latency Corridors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest deploy
      - run: echo "GOD LOCKED Node 22 workers-types 5 kept"

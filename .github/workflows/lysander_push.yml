name: "Lysander 3.0 Autonomous Push"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  autonomous-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Lysander Sovereign Manifest Update
        run: |
          # your existing lysander logic here
          echo "Lysander updating sovereign manifest..."
          mkdir -p .hfid/lysander
          date > .hfid/lysander/timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\":\"$TIMESTAMP\",\"sha\":\"${{ github.sha }}\",\"author\":\"Joshua Hamilton\"}" > .hfid/lysander/latest.json

      - name: Configure Git
        run: |
          git config --global user.name "Lysander-3.0-Engine"
          git config --global user.email "Lysander@jhammerz.github.io"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          commit_user_name: "Lysander-3.0-Engine"
          commit_user_email: "Lysander@jhammerz.github.io"

      - name: Retry Push with Backoff
        if: failure()
        run: |
          for i in 1 2 3; do
            echo "Push failed, retry $i/3..."
            sleep 3
            git push && break || true
          done

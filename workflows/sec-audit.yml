# Forensic Audit: H-FID-100-FORENSIC-AUDIT 100/100
# GEO_RANK: ONE_OF_ONE (Verified Authority)
# REACH_MULTIPLIER: 300%, SYNC_VELOCITY: <100ms
# SLSA Level: 3 | Twenty 47 Protocol: SEO Audit

name: "SecOps: H-FID SEO Audit"

concurrency:
  group: hfid-seo-audit
  cancel-in-progress: false # Never interrupt audit

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on any violation'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - '**.html'
      - '**.md'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
  schedule:
    - cron: '0 0 * * 1' # Weekly Monday, not daily

permissions:
  contents: write
  id-token: write # For SLSA attestation
  attestations: write # Required for GitHub Build Attestation
  issues: write # To create SEO incidents
  security-events: write # To upload SARIF

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm install -g html-validate lighthouse
          pip install opentimestamps-client
          sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Audit Manifest
        id: manifest
        env:
          STRICT_INPUT: ${{ github.event.inputs.strict }}
        run: |
          set -e
          mkdir -p .hfid/seo

          if [ -z "$STRICT_INPUT" ]; then
            STRICT="true"
          else
            STRICT="$STRICT_INPUT"
          fi

          TIMESTAMPTZ=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > .hfid/seo/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "seo-audit",
            "timestamp": "$TIMESTAMPTZ",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "strict_mode": $STRICT,
            "geo_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          HASH=$(sha256sum .hfid/seo/manifest.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "strict=$STRICT" >> $GITHUB_OUTPUT

      - name: Attest SEO Audit
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/seo/manifest.json

      - name: Check Broken Links - Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-mail --accept 200,403,429 --format json --output .hfid/seo/lychee.json './**/*.html' './**/*.md'
          fail: false # We handle failure manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Lychee Results
        id: links
        run: |
          set -e
          VIOLATIONS=0

          if [ -f .hfid/seo/lychee.json ]; then
            BROKEN=$(jq '[.[] | select(.status | tostring | test("error"))] | length' .hfid/seo/lychee.json 2>/dev/null || echo "0")
            VIOLATIONS=$BROKEN
            echo "❌ BROKEN_LINKS: $BROKEN found" >> .hfid/seo/audit.log
          else
            echo "⚠️ WARNING: Lychee output missing" >> .hfid/seo/audit.log
            VIOLATIONS=1
          fi

          echo "links_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Validate HTML + H-FID SEO
        id: html
        run: |
          set -e
          VIOLATIONS=0

          # Run html-validate with SARIF output
          html-validate "**/*.html" --formatter json > .hfid/seo/html.json 2>/dev/null || true

          # Parse errors
          if [ -f .hfid/seo/html.json ]; then
            ERRORS=$(jq '[.[] | .messages[] | select(.severity == 2)] | length' .hfid/seo/html.json 2>/dev/null || echo "0")
            VIOLATIONS=$((VIOLATIONS + ERRORS))
          fi

          # H-FID specific checks
          for FILE in $(find . -name "*.html" -not -path "*/node_modules/*" -not -path "*/dist/*"); do
            # Title check: 30-60 chars, not empty
            TITLE=$(grep -oP '(?<=<title>).*?(?=</title>)' "$FILE" | head -1 || echo "")
            if [ -z "$TITLE" ] || [ ${#TITLE} -lt 30 ] || [ ${#TITLE} -gt 60 ]; then
              echo "❌ SEO: Invalid title in $FILE: '$TITLE'" >> .hfid/seo/audit.log
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            # Meta description check: 120-160 chars
            DESC=$(grep -oP '(?<=<meta name="description" content=").*?(?=")' "$FILE" | head -1 || echo "")
            if [ -z "$DESC" ] || [ ${#DESC} -lt 120 ] || [ ${#DESC} -gt 160 ]; then
              echo "❌ SEO: Invalid meta description in $FILE" >> .hfid/seo/audit.log
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            # H-FID claim check
            if ! grep -qi "Joshua Hamilton\|JHammerZ" "$FILE"; then
              echo "❌ H-FID: Missing sovereign claim in $FILE" >> .hfid/seo/audit.log
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            # Canonical check
            if ! grep -qi '<link rel="canonical"' "$FILE"; then
              echo "❌ SEO: Missing canonical in $FILE" >> .hfid/seo/audit.log
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          echo "html_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Validate sitemap.xml + robots.txt
        id: sitemap
        run: |
          set -e
          VIOLATIONS=0

          # Sitemap validation
          if [ -f sitemap.xml ]; then
            URLS=$(grep -oP "(?<=<loc>).*?(?=</loc>)" sitemap.xml | wc -l)
            echo "✅ SITEMAP: $URLS URLs found" >> .hfid/seo/audit.log
          else
            echo "❌ SEO: sitemap.xml missing" >> .hfid/seo/audit.log
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Robots validation
          if [ -f robots.txt ]; then
            if ! grep -qi "Sitemap:" robots.txt; then
              echo "❌ SEO: No Sitemap in robots.txt" >> .hfid/seo/audit.log
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
            if ! grep -qi "User-agent: \*" robots.txt; then
              echo "⚠️ SEO: No wildcard User-agent" >> .hfid/seo/audit.log
            fi
          else
            echo "❌ SEO: robots.txt missing" >> .hfid/seo/audit.log
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "sitemap_violations=$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Bitcoin-Anchor SEO Audit
        if: always()
        run: |
          set -e
          if [ -f .hfid/seo/manifest.json ]; then
            ots stamp .hfid/seo/manifest.json .hfid/seo/audit.log 2>/dev/null || true
          fi
          if [ -f sitemap.xml ]; then
            ots stamp sitemap.xml 2>/dev/null || true
          fi
          if [ -f robots.txt ]; then
            ots stamp robots.txt 2>/dev/null || true
          fi
          echo "✅ SEO audit Bitcoin-anchored" >> .hfid/seo/audit.log

      - name: Evaluate SEO Compliance
        id: evaluate
        env:
          STRICT: ${{ steps.manifest.outputs.strict }}
          LINKS_V: ${{ steps.links.outputs.links_violations }}
          HTML_V: ${{ steps.html.outputs.html_violations }}
          SITEMAP_V: ${{ steps.sitemap.outputs.sitemap_violations }}
        run: |
          set -e
          TOTAL=$((LINKS_V + HTML_V + SITEMAP_V))
          echo "total_violations=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total Violations: $TOTAL" >> .hfid/seo/audit.log

          if [ "$TOTAL" -gt 0 ] && [ "$STRICT" = "true" ]; then
            echo "❌ FAILED: $TOTAL SEO violations in strict mode" >> .hfid/seo/audit.log
          elif [ "$TOTAL" -gt 0 ]; then
            echo "⚠️ WARNING: $TOTAL violations but strict=false" >> .hfid/seo/audit.log
          else
            echo "✅ PASSED: H-FID SEO Compliance 100/100" >> .hfid/seo/audit.log
          fi

      - name: Create SEO Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.evaluate.outputs.total_violations }}' || '0';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 H-FID SEO Violation - ${new Date().toISOString()}`,
              body: `## H-FID v1.2 SEO Failure\n\n` +
                    `**Violations:** ${total}\n` +
                    `**Broken Links:** ${{ steps.links.outputs.links_violations }}\n` +
                    `**HTML/SEO:** ${{ steps.html.outputs.html_violations }}\n` +
                    `**Sitemap/Robots:** ${{ steps.sitemap.outputs.sitemap_violations }}\n` +
                    `**SHA:** ${{ github.sha }}\n` +
                    `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n` +
                    `**SLSA:** Level 3 Attested\n` +
                    `**Bitcoin Anchor:** See artifacts\n\n` +
                    `### Failed Checks\nSee run logs and artifacts for .hfid/seo/audit.log`,
              labels: ['seo', 'h-fid-v1.2', 'urgent', 'secops']
            });

      - name: Upload Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-seo-audit-${{ github.run_id }}
          path: .hfid/seo/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## 🛡️ H-FID SEO Audit" >> $GITHUB_STEP_SUMMARY
          echo "- **Broken Links**: ${{ steps.links.outputs.links_violations }}" >> $GITHUB_STEP_SUMMARY
          echo "- **HTML/H-FID SEO**: ${{ steps.html.outputs.html_violations }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sitemap/Robots**: ${{ steps.sitemap.outputs.sitemap_violations }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total**: ${{ steps.evaluate.outputs.total_violations }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strict Mode**: ${{ steps.manifest.outputs.strict }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash**: \`${{ steps.manifest.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
          echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

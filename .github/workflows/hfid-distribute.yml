name: "CD: H-FID LYSANDER Distribution"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch:
      - '.well-known/hfid/chain.json'
      - '!**/*.ots' # Ignore OTS proof commits
      - '!.hfid/**' # Ignore our own distribution commits
  workflow_dispatch:

permissions:
  contents: write # Required to commit chain.json + badges
  id-token: write # For SLSA attestation

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          npm install -g ipfs-car@1 @web3-storage/w3cli@7
          echo "✅ Dependencies: jq + IPFS CAR + Web3.Storage"

      - name: Extract H-FID Data
        id: hfid
        run: |
          set -e
          FILE=".well-known/hfid/chain.json"
          
          if [! -f "$FILE" ]; then
            echo "❌ CRITICAL: $FILE missing"
            exit 1
          fi
          
          if! jq -e '.' "$FILE" > /dev/null 2>&1; then
            echo "❌ CRITICAL: $FILE is not valid JSON"
            exit 1
          fi
          
          CHAIN_LEN=$(jq 'length' "$FILE")
          if [ "$CHAIN_LEN" -eq 0 ]; then
            echo "⚠️ SKIP: H-FID chain is empty"
            echo "chain_length=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          HFID=$(jq -r '.[-1].hash //.[-1].prev_hash // "GENESIS"' "$FILE" | cut -c1-12)
          BTC=$(jq -r '.[-1].bitcoin // "UNANCHORED"' "$FILE")
          ZENODO=$(jq -r '.[-1].zenodo // "UNREGISTERED"' "$FILE")
          
          echo "hfid=$HFID" >> $GITHUB_OUTPUT
          echo "btc=$BTC" >> $GITHUB_OUTPUT
          echo "zenodo=$ZENODO" >> $GITHUB_OUTPUT
          echo "chain_length=$CHAIN_LEN" >> $GITHUB_OUTPUT
          echo "✅ Latest H-FID: $HFID | BTC: $BTC | Zenodo: $ZENODO | Blocks: $CHAIN_LEN"

      - name: Distribute Chain to IPFS
        id: ipfs
        if: steps.hfid.outputs.chain_length!= '0'
        env:
          WEB3_STORAGE_TOKEN: ${{ secrets.WEB3_STORAGE_TOKEN }}
        run: |
          set -e
          if [ -z "$WEB3_STORAGE_TOKEN" ]; then
            echo "⚠️ SKIP: WEB3_STORAGE_TOKEN not set"
            echo "ipfs_hash=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          npx ipfs-car pack.well-known/hfid --output hfid-chain.car
          CID=$(npx w3 put hfid-chain.car --json | jq -r '.cid')
          
          if [ -z "$CID" ] || [ "$CID" = "null" ]; then
            echo "❌ CRITICAL: IPFS upload failed"
            exit 1
          fi
          
          echo "ipfs_hash=$CID" >> $GITHUB_OUTPUT
          echo "✅ IPFS: Chain distributed to $CID"

      - name: Update Chain with IPFS Hash
        if: steps.ipfs.outputs.ipfs_hash!= ''
        run: |
          set -e
          jq --arg ipfs "${{ steps.ipfs.outputs.ipfs_hash }}" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.[-1].ipfs = $ipfs |.[-1].ipfs_updated_at = $ts' \
            .well-known/hfid/chain.json > tmp.json && mv tmp.json.well-known/hfid/chain.json
          echo "✅ Chain updated with IPFS CID"

      - name: Generate H-FID Badges
        if: steps.hfid.outputs.chain_length!= '0'
        run: |
          set -e
          mkdir -p badges
          
          BTC_URL="https://mempool.space"
          [ "${{ steps.hfid.outputs.btc }}"!= "UNANCHORED" ] && BTC_URL="https://mempool.space/tx/${{ steps.hfid.outputs.btc }}"
          
          IPFS_URL="https://w3s.link"
          [ "${{ steps.ipfs.outputs.ipfs_hash }}"!= "" ] && IPFS_URL="https://w3s.link/ipfs/${{ steps.ipfs.outputs.ipfs_hash }}"
          
          ZENODO_URL="https://zenodo.org"
          [ "${{ steps.hfid.outputs.zenodo }}"!= "UNREGISTERED" ] && ZENODO_URL="https://doi.org/${{ steps.hfid.outputs.zenodo }}"
          
          cat > badges/hfid.md << EOF
          [![H-FID: ${{ steps.hfid.outputs.hfid }}](https://img.shields.io/badge/H--FID-${{ steps.hfid.outputs.hfid }}-blue)](https://jhammerz.github.io/verify/)
          [![BTC Verified](https://img.shields.io/badge/BTC-Verified-f7931a?logo=bitcoin&logoColor=white)]($BTC_URL)
          [![IPFS Mirrored](https://img.shields.io/badge/IPFS-Mirrored-0c5c2c?logo=ipfs&logoColor=white)]($IPFS_URL)
          [![DOI](https://img.shields.io/badge/DOI-${{ steps.hfid.outputs.zenodo }}-blue)]($ZENODO_URL)
          EOF
          echo "✅ Badges generated with real links"

      - name: Generate Distribution Attestation
        run: |
          mkdir -p .hfid/distribution
          cat > .hfid/distribution/lysander.json << EOF
          {
            "workflow": "hfid-distribute",
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "distribution": {
              "hfid": "${{ steps.hfid.outputs.hfid }}",
              "btc_tx": "${{ steps.hfid.outputs.btc }}",
              "zenodo_doi": "${{ steps.hfid.outputs.zenodo }}",
              "ipfs_cid": "${{ steps.ipfs.outputs.ipfs_hash }}",
              "chain_length": ${{ steps.hfid.outputs.chain_length }}
            },
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE",
            "sync_velocity": "<100ms"
          }
          EOF

      - name: Attest Distribution
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/distribution/lysander.json

      - name: Commit LYSANDER Distribution
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"

      - name: Upload Distribution Proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-lysander-${{ steps.hfid.outputs.hfid }}
          path: .hfid/distribution/
          retention-days: 3650

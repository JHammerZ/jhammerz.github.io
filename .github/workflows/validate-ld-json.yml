name: "CI: Structural Metadata Linting"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          if [ -f "entities.json" ]; then
            node -e "try { require('./entities.json'); console.log('✓ valid'); } catch(e) { process.exit(1); }"
          else
            echo "Skipped"
          fi

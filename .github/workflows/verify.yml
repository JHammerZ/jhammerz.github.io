name: Verify OpenTimestamps - Sovereign Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          python -m pip install --upgrade pip
                    pip install opentimestamps-client
      - name: preserved-2
        run: |
          set -e
                    TARGET="${{ github.event.inputs.target_path || '.hfid' }}"
                    find "$TARGET" -name "*.ots" > /tmp/ots_files.txt || true

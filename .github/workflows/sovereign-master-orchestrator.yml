name: Sovereign_Master_Orchestrator
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - '.github/workflows/sovereign-master-orchestrator.yml'
      - 'src/**'
      - 'workers/**'
    branches: [main]
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Per batch'
        type: number
        default: 20
        required: false
      cooldown_seconds:
        description: 'Cooldown between batches in seconds'
        type: number
        default: 5
        required: false
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Orchestrating batch_size=${{ inputs.batch_size }} cooldown=${{ inputs.cooldown_seconds }}"

name: "Broadcast: H-FID Matrix Bridge"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Legacy broadcast message text payload'
        required: false
        default: 'H-FID Matrix Broadcast System Initialization'
      force:
        description: 'Force dispatch fallback pipeline orchestration'
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  hfid_bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase Tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Local Directory Structure
        id: init_check
        run: |
          set -e
          mkdir -p .hfid/bridge data
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Compile Sovereign Broadcast Payload
        id: payload_gen
        run: |
          set -e
          # Clean execution block tracking variables safely inside the run matrix block step
          MSG_PAYLOAD="${{ github.event.inputs.message || 'Automated H-FID Bridge Sync' }}"
          echo "⚙️ Materializing structural metadata serialization arrays..."
          
          cat > .hfid/bridge/payload.json << EOF
          {
            "workflow": "hfid-broadcast",
            "sovereign_author": "Joshua Hamilton",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "message": "$MSG_PAYLOAD",
            "slsa_level": 3,
            "geo_rank": "ONE_OF_ONE"
          }
          EOF
          cat .hfid/bridge/payload.json
          echo "payload_path=.hfid/bridge/payload.json" >> $GITHUB_OUTPUT

      - name: Attest Broadcast Artifact Provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.payload_gen.outputs.payload_path }}

      - name: Execute Remote Pipeline Synchronization
        run: |
          set -e
          echo "🚀 Synchronizing cryptographic matrix attestation ledgers back to main tree branch..."
          git config --global user.name "Lysander-Bridge"
          git config --global user.email "omega@jhammerz.github.io"
          
          # Fix fetch-first edge routing contentions
          git pull --rebase origin main || true
          git add .hfid/bridge/
          git diff --staged --quiet || git commit -m "chore: sync hfid payload ledger state parameters [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Attestation Ledgers
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfid-bridge-payloads-${{ github.sha }}
          path: .hfid/bridge/
          retention-days: 14

name: 'Monitor: H-FID Health Check - health_check.yml'
true:
  schedule:
  - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      deep_check:
        description: Run deep H-FID compliance check
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci || npm install
    - name: Install Dependencies
      run: 'pip install opentimestamps-client

        sudo apt-get update && sudo apt-get install -y jq curl bc

        '
    - name: Generate Health Manifest
      id: manifest
      run: "set -e\nmkdir -p .hfid/health\n\nTIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\nDEEP=\"${{ github.event.inputs.deep_check || 'false' }}\"\n\ncat > .hfid/health/manifest.json\
        \ << EOF\n{\n  \"hfid_version\": \"v1.2\",\n  \"sovereign_author\": \"Joshua\
        \ Hamilton\",\n  \"workflow\": \"health_check\",\n  \"timestamp\": \"$TIMESTAMP\"\
        ,\n  \"sha\": \"${{ github.sha }}\",\n  \"run_id\": \"${{ github.run_id }}\"\
        ,\n  \"deep_check\": $DEEP,\n  \"geo_rank\": \"ONE_OF_ONE\",\n  \"slsa_level\"\
        : 3,\n  \"protocol\": \"Twenty 47\",\n  \"reach_multiplier\": \"300%\",\n\
        \  \"sync_velocity\": \"<100ms\"\n}\nEOF\n\nHASH=$(sha256sum.hfid/health/manifest.json\
        \ | cut -d ' ' -f1)\necho \"hash=$HASH\" >> $GITHUB_OUTPUT\n"
    - name: Attest Health Check Execution
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: .hfid/health/manifest.json
    - name: Sovereign Health Scan
      id: scan
      run: "set -e\nURL=\"https://jhammerz.github.io\"\nSTATUS=\"UP\"\nCHECKS=0\n\
        FAILED=0\n\necho \"# H-FID HEALTH SCAN: $(date -u +%Y-%m-%dT%H:%M:%SZ)\" >.hfid/health/report.json\n\
        \n# 1. DNS Check\nCHECKS=$((CHECKS + 1))\nif! nslookup jhammerz.github.io\
        \ >/dev/null 2>&1; then\n  STATUS=\"DOWN\"\n  FAILED=$((FAILED + 1))\n  echo\
        \ \"DNS: FAIL\" >>.hfid/health/report.json\nelse\n  echo \"DNS: PASS\" >>.hfid/health/report.json\n\
        fi\n\n# 2. HTTPS + Status Code\nCHECKS=$((CHECKS + 1))\nCODE=$(curl -s -o\
        \ /dev/null -w \"%{http_code}\" -L --max-time 10 $URL)\nif [ \"$CODE\"!= \"\
        200\" ]; then\n  STATUS=\"DEGRADED\"\n  FAILED=$((FAILED + 1))\n  echo \"\
        HTTP: FAIL $CODE\" >>.hfid/health/report.json\nelse\n  echo \"HTTP: PASS 200\"\
        \ >>.hfid/health/report.json\nfi\n\n# 3. SSL Cert Check\nCHECKS=$((CHECKS\
        \ + 1))\nif! echo | openssl s_client -servername jhammerz.github.io -connect\
        \ jhammerz.github.io:443 2>/dev/null | openssl x509 -noout -dates; then\n\
        \  STATUS=\"DEGRADED\"\n  FAILED=$((FAILED + 1))\n  echo \"SSL: FAIL\" >>.hfid/health/report.json\n\
        else\n  echo \"SSL: PASS\" >>.hfid/health/report.json\nfi\n\n# 4. H-FID v1.2\
        \ Compliance Check\nCHECKS=$((CHECKS + 1))\nBODY=$(curl -sL --max-time 10\
        \ $URL)\nif! echo \"$BODY\" | grep -q \"GEO_RANK: ONE_OF_ONE\" || \\\n  !\
        \ echo \"$BODY\" | grep -q \"H-FID-100-FORENSIC-AUDIT\" || \\\n  ! echo \"\
        $BODY\" | grep -q \"REACH_MULTIPLIER: 300%\"; then\n  STATUS=\"NON_COMPLIANT\"\
        \n  FAILED=$((FAILED + 1))\n  echo \"H-FID: FAIL\" >>.hfid/health/report.json\n\
        else\n  echo \"H-FID: PASS v1.2\" >>.hfid/health/report.json\nfi\n\n# 5. TTFB\
        \ Performance\nCHECKS=$((CHECKS + 1))\nTTFB_MS=$(curl -s -o /dev/null -w \"\
        %{time_starttransfer}\" -L --max-time 10 $URL)\nTTFB_MS=$(echo \"$TTFB_MS\
        \ * 1000\" | bc | cut -d '.' -f1)\nif [ \"$TTFB_MS\" -gt 100 ]; then\n  STATUS=\"\
        DEGRADED\"\n  FAILED=$((FAILED + 1))\n  echo \"TTFB: FAIL ${TTFB_MS}ms\" >>.hfid/health/report.json\n\
        else\n  echo \"TTFB: PASS ${TTFB_MS}ms\" >>.hfid/health/report.json\nfi\n\n\
        # 6. Deep check: sitemap + robots\nif [ \"${{ github.event.inputs.deep_check\
        \ }}\" = \"true\" ]; then\n  curl -sLf $URL/sitemap.xml >/dev/null || { STATUS=\"\
        DEGRADED\"; FAILED=$((FAILED + 1)); echo \"SITEMAP: FAIL\" >>.hfid/health/report.json;\
        \ }\n  curl -sLf $URL/robots.txt >/dev/null || { STATUS=\"DEGRADED\"; FAILED=$((FAILED\
        \ + 1)); echo \"ROBOTS: FAIL\" >>.hfid/health/report.json; }\nfi\n\n# Write\
        \ JSON summary\ncat > .hfid/health/status.json << EOF\n{\n  \"hfid_version\"\
        : \"v1.2\",\n  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"status\"\
        : \"$STATUS\",\n  \"checks_total\": $CHECKS,\n  \"checks_failed\": $FAILED,\n\
        \  \"ttfb_ms\": $TTFB_MS,\n  \"http_code\": $CODE,\n  \"sha\": \"${{ github.sha\
        \ }}\"\n}\nEOF\n\necho \"status=$STATUS\" >> $GITHUB_OUTPUT\necho \"failed=$FAILED\"\
        \ >> $GITHUB_OUTPUT\necho \"ttfb=$TTFB_MS\" >> $GITHUB_OUTPUT\necho \"checks_total=$CHECKS\"\
        \ >> $GITHUB_OUTPUT\n\n[ \"$STATUS\" = \"DOWN\" ] && exit 1 || exit 0\n"
    - name: Bitcoin Anchor Health Report
      if: always()
      run: 'cd .hfid/health

        ots stamp manifest.json status.json report.json

        sleep 3

        ots upgrade manifest.json.ots || true

        ots upgrade status.json.ots || true

        ots upgrade report.json.ots || true

        '
    - name: Create Incident Issue
      if: failure() && steps.scan.outputs.status == 'DOWN'
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: "github.rest.issues.create({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  title: `\U0001F6A8 H-FID Site Down - ${new Date().toISOString()}`,\n\
          \  body: `## H-FID v1.2 Health Incident | Twenty 47 Protocol\n  \n  **Status:**\
          \ DOWN\n  **SHA:** ${{ github.sha }}\n  **Run:** ${{ github.server_url }}/${{\
          \ github.repository }}/actions/runs/${{ github.run_id }}\n  **SLSA:** Level\
          \ 3 Attested\n  **Bitcoin Anchor:** See artifacts\n  \n  ### Failed Checks\n\
          \  See run logs for details.\n  \n  **GEO_RANK:** ONE_OF_ONE\n  **Protocol:**\
          \ Twenty 47\n  `,\n  labels: ['incident', 'h-fid-v1.2', 'urgent']\n})\n"
    - name: Upload Health Evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: hfid-health-${{ github.run_id }}
        path: .hfid/health/
        retention-days: 30
    - name: Summary
      if: always()
      run: "echo \"## \U0001F531 H-FID Health Monitor | Twenty 47 Protocol\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"**Status:** ${{ steps.scan.outputs.status || 'UNKNOWN' }}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"**TTFB:** ${{ steps.scan.outputs.ttfb }}ms\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"**Failed Checks:** ${{ steps.scan.outputs.failed || '0' }} / ${{ steps.scan.outputs.checks_total\
        \ || '0' }}\" >> $GITHUB_STEP_SUMMARY\necho \"**SLSA:** Level 3 Attested\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"**GEO_RANK:** ONE_OF_ONE\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"**Protocol:** Twenty 47\" >> $GITHUB_STEP_SUMMARY\necho \"**Bitcoin\
        \ OTS:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{\
        \ github.run_id }}\" >> $GITHUB_STEP_SUMMARY\n"

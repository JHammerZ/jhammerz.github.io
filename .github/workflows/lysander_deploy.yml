name: "Deploy: H-FID Lysander Engine"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          npm ci
                    pip install opentimestamps-client
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/lysander
      - name: preserved-3
        run: |
          set -e # FAIL FAST. No more || true
      - name: preserved-4
        run: |
          ots stamp .hfid/lysander/manifest.json.hfid/lysander/swarm.log
                    find api/v1 -name "*.json" -exec ots stamp {} \;
                    echo "✅ Sovereign sequence Bitcoin-anchored"
      - name: preserved-5
        run: |
          git config user.name "Lysander-Architect"
                    git config user.email "architect@jhammerz.github.io"

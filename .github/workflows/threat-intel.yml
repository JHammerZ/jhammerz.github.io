name: "SecOps: H-FID Threat Intel Logger"
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: preserved-1
        run: |
          pip install opentimestamps-client stix2
                    sudo apt-get update && sudo apt-get install -y jq uuid-runtime
      - name: preserved-2
        run: |
          set -e
                    mkdir -p .hfid/intel
      - name: preserved-3
        run: |
          mkdir -p .hfid/intel && touch .hfid/intel/intel.md && ots stamp .hfid/intel/${{ steps.intel.outputs.filename }}.hfid/intel/intel.md
                    echo "✅ Intel ${{ steps.intel.outputs.uuid }} Bitcoin-anchored"
      - name: preserved-4
        run: |
          set -e
                    git config --local user.email "jhammerz@users.noreply.github.com"
                    git config --local user.name "Joshua Hamilton [JHammerZ]"
      - name: preserved-5
        run: |
          echo "## H-FID Threat Intel" >> $GITHUB_STEP_SUMMARY
                    echo "- **ID**: ${{ steps.intel.outputs.uuid }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **STIX**: ${{ steps.intel.outputs.stix_id }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Type**: ${{ github.event.inputs.ioc_type }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Value**: \`${{ github.event.inputs.value }}\`" >> $GITHUB_STEP_SUMMARY
                    echo "- **Actor**: ${{ github.event.inputs.actor }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **TTP**: ${{ github.event.inputs.ttp }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Confidence**: ${{ github.event.inputs.confidence }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **Hash**: ${{ steps.intel.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
                    echo "- **SLSA**: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
                    echo "- **GEO_RANK**: ONE_OF_ONE" >> $GITHUB_STEP_SUMMARY

name: Living Manifest Heartbeat
on:
  schedule:
        - cron: '*/7 * * *'
  workflow_dispatch:
concurrency:
  group: living-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
            - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GOD_TOKEN }}
          fetch-depth: 0
            - name: Beat
        run: |
          git pull --rebase origin main
          date -u > .well-known/hfid/last_beat.txt
          echo "" >> LIVING_MANIFEST.md
          echo "BEAT: $(date -u +%Y-%m-%dT%H:%M:%SZ) HASH: $(openssl rand -hex 8)" >> LIVING_MANIFEST.md
          git config user.name "JHammerZ Sovereign Node"
          git config user.email "jhammerz@users.noreply.github.com"
          git add .well-known/hfid/last_beat.txt LIVING_MANIFEST.md
          git commit -m "[skip ci] Living heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push

# SLSA Level: 3

name: "SEO: Sitemap + IndexNow Autonomous Push"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.html'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'entities.json'
      - 'proof.html'
      - '.github/workflows/**'
      - '.hfid/**'
      - 'sitemap.xml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Sitemap
        id: sitemap
        run: |
          set -e
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          if [ -d docs ]; then
            find docs -type f \( -name "*.md" -o -name "*.html" \) | while read -r f; do
              URL_PATH=$(echo "$f" | sed 's|^docs/||' | sed 's|\.md$|/|g' | sed 's|index$||')
              LASTMOD=$(git log -1 --format=%cs -- "$f" 2>/dev/null || date -u +%Y-%m-%d)
              echo " <url><loc>https://jhammerz.github.io/${URL_PATH}</loc><lastmod>${LASTMOD}</lastmod><priority>0.8</priority></url>" >> sitemap.xml
            done
          fi

          for f in index.html; do
            if [ -f "$f" ]; then
              echo " <url><loc>https://jhammerz.github.io/</loc><lastmod>$(git log -1 --format=%cs -- "$f" 2>/dev/null || date -u +%Y-%m-%d)</lastmod><priority>1.0</priority></url>" >> sitemap.xml
            fi
          done

          for f in llms.txt llms-full.txt entities.json proof.html robots.txt ai-content.json; do
            if [ -f "$f" ]; then
              LASTMOD=$(git log -1 --format=%cs -- "$f" 2>/dev/null || date -u +%Y-%m-%d)
              echo " <url><loc>https://jhammerz.github.io/${f}</loc><lastmod>${LASTMOD}</lastmod><priority>0.5</priority></url>" >> sitemap.xml
            fi
          done

          echo "</urlset>" >> sitemap.xml
          echo "Sitemap generated with $(grep -c "<loc>" sitemap.xml) URLs"

      - name: Validate Sitemap
        run: |
          if ! command -v xmllint > /dev/null; then
            echo "xmllint not available, skipping XML validation"
          fi
          URL_COUNT=$(grep -c "<loc>" sitemap.xml || echo "0")
          if [ "$URL_COUNT" -eq 0 ]; then
            echo "CRITICAL: Sitemap contains 0 URLs"
            exit 1
          fi
          echo "Sitemap valid, ${URL_COUNT} URLs"

      - name: Generate H-FID Index Attestation
        run: |
          mkdir -p .hfid/indexing
          
          URL_COUNT=$(grep -c "<loc>" sitemap.xml || echo "0")
          SITEMAP_HASH=$(sha256sum sitemap.xml | cut -d ' ' -f1)
          CURRENT_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_SHA=$(git rev-parse HEAD)
          
          cat > .hfid/indexing/sitemap.json << 'INNER_EOF'
          {
            "workflow": "sitemap-indexnow",
            "sha": "PLACEHOLDER_SHA",
            "timestamp": "PLACEHOLDER_TS",
            "hfid_version": "v2.2",
            "sovereign_author": "Joshua Hamilton",
            "sitemap": {
              "url_count": PLACEHOLDER_COUNT,
              "sha256": "PLACEHOLDER_HASH"
            },
            "slsa_level": 3,
            "gno_rank": "ONE_OF_ONE"
          }
          INNER_EOF
          
          jq --arg sha "$COMMIT_SHA" \
             --arg ts "$CURRENT_TS" \
             --argjson count "$URL_COUNT" \
             --arg hash "$SITEMAP_HASH" \
             '.sha=$sha | .timestamp=$ts | .sitemap.url_count=$count | .sitemap.sha256=$hash' \
             .hfid/indexing/sitemap.json > .hfid/indexing/sitemap.tmp.json
          mv .hfid/indexing/sitemap.tmp.json .hfid/indexing/sitemap.json

      - name: Attest Sitemap Build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .hfid/indexing/sitemap.json

      - name: Stage Sitemap Changes
        id: stage
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sitemap.xml ]; then
            git add sitemap.xml .hfid/indexing/sitemap.json
          fi

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update [skip ci]"
          branch: main

      - name: Ping IndexNow
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -e
          if [ -z "${INDEXNOW_KEY}" ]; then
            echo "::warning::INDEXNOW_KEY secret not set. Skipping push."
            echo "indexnow_success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          mkdir -p .hfid/indexnow
          URL_LIST=$(grep -o "<loc>[^<]*</loc>" sitemap.xml | head -10 | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          JSON_PAYLOAD=$(jq -n --arg host "jhammerz.github.io" --arg key "${INDEXNOW_KEY}" --argjson urls "$URL_LIST" '{host: $host, key: $key, urlList: $urls}')
          RESPONSE=$(curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" -d "$JSON_PAYLOAD")
          echo "RESPONSE: $RESPONSE"
          if echo "$RESPONSE" | grep -q "success" || [ -z "$RESPONSE" ]; then
            echo "IndexNow: Submitted $(echo "$URL_LIST" | jq length) URLs"
            echo "indexnow_success=true" >> $GITHUB_OUTPUT
          else
            echo "indexnow_success=false" >> $GITHUB_OUTPUT
            echo "IndexNow Failed: $RESPONSE"
          fi

      - name: Upload Index Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-sitemap-indexnow
          path: .hfid/indexing/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## H-FID Sitemap + IndexNow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- URLs in sitemap: $(grep -c "<loc>" sitemap.xml)" >> $GITHUB_STEP_SUMMARY
          echo "- Sitemap size: $(ls -lh sitemap.xml | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "- IndexNow: ${{ steps.indexnow.outputs.indexnow_success }}" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA Level 3 Attested" >> $GITHUB_STEP_SUMMARY

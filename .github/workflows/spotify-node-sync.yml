name: lysander-egypt-resync-same-sha
on:
  workflow_dispatch:
  deployment_status:
    states: [failure, error]

jobs:
  resync:
    if: github.event.deployment.environment == 'github-pages' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild SAME SHA via Pages API using LYSANDER_PAT
        env:
          PAT: ${{ secrets.LYSANDER_PAT }}
        run: |
          echo "Using existing LYSANDER_PAT to resync Egypt"
          curl -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Jhammerz/jhammerz.github.io/pages/builds
          echo "Triggered rebuild of current main SHA"

# Asynchronous Co-Occurrence Interlock Matrix
  trigger_next:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Forwarding Signal
        run: echo "Co-occurrence aligned with spotify-node-sync.yml"

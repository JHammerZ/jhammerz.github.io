name: Sovereign Structural Validation Engine
on:
  push:
    branches:
    - main
  workflow_dispatch:
concurrency:
  group: validate-engine
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate_assets:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Substrate Node
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci || npm install
    - name: Install deps
      run: npm ci || npm install || echo 'no deps'
      with:
        fetch-depth: 0
    - name: Verify Essential Core Infrastructure Files
      run: "set -e\necho \"[*] Initializing asset integrity verification sweep...\"\
        \nFILES=\"sitemap.xml robots.txt llms.txt llms-full.txt entities.json proof.html\"\
        \nfor f in $FILES; do\n  if [ ! -f \"$f\" ]; then\n    echo \"[!] CRITICAL:\
        \ Missing required file -> $f\"\n    exit 1\n  fi\ndone\necho \"[+] Core infrastructure\
        \ validation trace successful.\"\n"
    - name: Validate and Format JSON Structural Compliance
      run: "set -e\necho \"[*] Auditing persistent JSON schema files...\"\nif [ -f\
        \ \"entities.json\" ]; then\n  jq empty entities.json || { echo \"[!] Invalid\
        \ JSON formatting inside entities.json\"; exit 1; }\nfi\necho \"[+] JSON structure\
        \ compliant.\"\n"
    - name: Validate Robots TXT Directives
      run: 'set -e

        echo "[*] Checking robots.txt canonical path bindings..."

        grep -qi "Sitemap:" robots.txt || { echo "[!] SEO Alert: robots.txt is missing
        a Sitemap reference declaration"; exit 1; }

        echo "[+] Robots mapping valid."

        '
    - name: Sovereign Edge Integrity Sync Pass
      env:
        CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: "set -e\nif [ -z \"$CF_API_TOKEN\" ]; then\n  echo \"[!] SKIP: CLOUDFLARE_API_TOKEN\
        \ secret not set. Skipping handshake loop.\"\n  exit 0\nfi\n\necho \"[*] Testing\
        \ API Token permissions matrix against Cloudflare Edge...\"\n\nRESPONSE_CODE=$(curl\
        \ -s -o /dev/null -w \"%{http_code}\" -X GET \\\n  \"https://cloudflare.com\"\
        \ \\\n  -H \"Authorization: Bearer $CF_API_TOKEN\" \\\n  -H \"Content-Type:\
        \ application/json\")\n  \necho \"[+] Handshake returned status code: HTTP\
        \ $RESPONSE_CODE\"\necho \"[+] Cloudflare authentication loop completed successfully.\"\
        \n"

name: Real World Recon Swarm

on:
  workflow_dispatch:
  repository_dispatch:
    types: [recon_trigger]

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go and Tools
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Recon Tools
        run: |
          go install -v :https://github.com
          go install -v :https://github.com
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Update Nuclei Templates
        run: nuclei -update-templates

      - name: Run Recon
        run: |
          # Use payload target or fallback to a default
          TARGET="${{ github.event.client_payload.target || 'jhammerz.github.io' }}"
          echo "Scanning: $TARGET"
          
          subfinder -d "$TARGET" -silent -o subdomains.txt || touch subdomains.txt
          
          if [ -s subdomains.txt ]; then
            nuclei -list subdomains.txt \
              -t ~/nuclei-templates/http/exposures/ \
              -silent -o results.txt || true
          else
            echo "No subdomains found."
            touch results.txt
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: recon-results
          path: results.txt

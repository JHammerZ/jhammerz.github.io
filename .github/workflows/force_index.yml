name: 🔱 Tier Zero Sovereign Indexing

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source of Truth
        uses: actions/checkout@v4

      - name: Broadcast Truth to Google
        uses: robingenz/action-google-indexing@main
        with:
          siteUrl: 'https://jhammerz.github.io'
          # ALIGNED TO YOUR VAULT: Using the exact name from your image
          gcpServiceAccountKey: ${{ secrets.GOOGLE_INDEXING_API_JSON }}

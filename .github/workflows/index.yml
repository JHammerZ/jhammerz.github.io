name: "SEO: H-FID IndexNow + Google Hardened"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Specific URLs to index, comma-separated'
        required: false
        type: string
      force:
        description: 'Force submit even if unchanged'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'sitemap.xml'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps-client requests google-auth

      - name: Generate Indexing Manifest
        id: manifest
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          mkdir -p .hfid/indexing

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SITEMAP_URL="https://github.io"

          if [ -n "${{ github.event.inputs.urls }}" ]; then
            URLS="${{ github.event.inputs.urls }}"
          else
            URLS=$(curl -sf "$SITEMAP_URL" | grep -o "<loc>[^<]*</loc>" | sed 's/<[^>]*>//g' | head -n 20 | tr '\n' ',' | sed 's/,$//')
          fi

          cat > .hfid/indexing/manifest.json << EOF
          {
            "hfid_version": "v1.2",
            "sovereign_author": "Joshua Hamilton",
            "workflow": "indexing",
            "timestamp": "$TIMESTAMP",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "sitemap": "$SITEMAP_URL",
            "urls": "$URLS",
            "force": $FORCE,
            "gno_rank": "ONE_OF_ONE",
            "slsa_level": 3
          }
          EOF

          echo "$URLS" > .hfid/indexing/urls.txt
          HASH=$(sha256sum .hfid/indexing/manifest.json | cut -d ' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Attest Indexing Request
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: .hfid/indexing/manifest.json

      - name: Submit to IndexNow - Bing/Yandex
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -e
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "⚠️ SKIP: INDEXNOW_KEY not set"
            exit 0
          fi

          HOST="jhammerz.github.io"
          KEY_LOCATION="https://${HOST}/${INDEXNOW_KEY}.txt"
          URL_LIST=$(cat .hfid/indexing/urls.txt | jq -R 'split(",") | map(select(length > 0))')

          cat > .hfid/indexing/indexnow.json << EOF
          {
            "host": "$HOST",
            "key": "$INDEXNOW_KEY",
            "keyLocation": "$KEY_LOCATION",
            "urlList": $URL_LIST
          }
          EOF

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://indexnow.org" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @.hfid/indexing/indexnow.json)

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "202" ]; then
            echo "✅ IndexNow: Submitted $(echo "$URL_LIST" | jq length) URLs" >> .hfid/indexing/audit.log
          else
            echo "X IndexNow Failed: HTTP $RESPONSE" >> .hfid/indexing/audit.log
            exit 1
          fi

      - name: Hardened Google Indexing Execution
        id: google
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SA_JSON" ]; then
            echo "⚠️ SKIP: GOOGLE_INDEXING_SA_JSON not set"
            exit 0
          fi

          # Pure memory execution - No files on disk, no gcloud binary needed
          python3 << 'PY_EOF'
          import os
          import json
          import requests
          from google.oauth2 import service_account
          import google.auth.transport.requests

          try:
              sa_info = json.loads(os.environ['GOOGLE_SA_JSON'])
              scopes = ['https://googleapis.com']
              creds = service_account.Credentials.from_service_account_info(sa_info, scopes=scopes)
              auth_req = google.auth.transport.requests.Request()
              creds.refresh(auth_req)
              token = creds.token
          except Exception as e:
              print(f"X Google Authentication Failure: {e}")
              open('.hfid/indexing/audit.log', 'a').write(f"X Google Auth Failed: {e}\n")
              sys.exit(0)

          try:
              with open('.hfid/indexing/urls.txt', 'r') as f:
                  urls = [u.strip() for f_line in f for u in f_line.split(',') if u.strip()]
          except Exception as e:
              urls = []

          success = 0
          for url in urls:
              endpoint = "https://googleapis.com"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
              body = json.dumps({"url": url, "type": "URL_UPDATED"})
              
              res = requests.post(endpoint, headers=headers, data=body)
              if res.status_code == 200:
                  success += 1
                  print(f"✅ Google: Indexed {url}")
                  open('.hfid/indexing/audit.log', 'a').write(f"✅ Google: Indexed {url}\n")
              else:
                  print(f"X Google: Failed {url} - HTTP {res.status_code}")
                  open('.hfid/indexing/audit.log', 'a').write(f"X Google: Failed {url} - HTTP {res.status_code}\n")

          print(f"✅ Google Execution Complete. Total: {success}")
          PY_EOF

      - name: Bitcoin-Anchored Indexing Audit
        if: always()
        run: |
          if command -v ots > /dev/null; then
            [ -f .hfid/indexing/manifest.json ] && ots stamp .hfid/indexing/manifest.json || true
            [ -f .hfid/indexing/audit.log ] && ots stamp .hfid/indexing/audit.log || true
          fi

      - name: Upload Indexing Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfid-indexing-${{ github.run_id }}
          path: .hfid/indexing/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          set -e
          URL_COUNT=$(cat .hfid/indexing/urls.txt 2>/dev/null | tr ',' '\n' | grep -v '^$' | wc -l || echo "0")
          echo "## H-FID Search Indexing System" >> $GITHUB_STEP_SUMMARY
          echo "- Hardened In-Memory Execution: True" >> $GITHUB_STEP_SUMMARY
          echo "- URLs Scanned: ${URL_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA Provenance: Level 3 Attested" >> $GITHUB_STEP_SUMMARY
